"1.瘿瘤；2.疮疡肿毒，咽喉肿痛及毒蛇咬伤等；此外还有凉血止血作用，可用于吐血、衄血、咯血等，并兼有止咳平喘作用", "d": "煎服5~15g；研末服1~2g", "sp": "", "w": "有毒，不宜过量；多服、久服可引起吐泻腹痛等消化道反应，并对肝脏有一定损害，脾胃虚弱及肝功能损害者慎用", "ap": "", "m": "黄药子：消痰软坚，有毒", "k": "黄药消痰软坚散，清热解毒瘿瘤安。"}, {"id": 289, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "海蛤壳", "f": "清肺化痰，软坚散结", "a": "1.肺热、痰热咳喘；2.瘿瘤，痰核；此外有利尿、制酸作用", "d": "煎服10~15g", "sp": "蛤粉宜包煎", "w": "", "ap": "", "m": "海蛤壳：清肺化痰，软坚", "k": "蛤壳清肺化痰热，软坚散结瘿瘤消。"}, {"id": 290, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "海浮石", "f": "清肺化痰，软坚散结", "a": "1.痰热咳喘；2.瘰疬，瘿瘤；此外能利尿通淋，治血淋、石淋", "d": "煎服10~15g", "sp": "打碎先煎", "w": "", "ap": "", "m": "海浮石：清肺化痰，软坚散结", "k": "浮石清肺化痰强，软坚散结瘰疬尝。"}, {"id": 291, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "瓦楞子", "f": "消痰软坚，化瘀散结", "a": "1.瘰疬，瘿瘤；2.癥瘕痞块；此外煅用可制酸止痛，治胃痛泛酸", "d": "煎服10~15g；研末服，每次1~3g", "sp": "宜先煎；生用消痰散结，煅用制酸止痛", "w": "", "ap": "", "m": "瓦楞子：消痰软坚，化瘀，制酸", "k": "瓦楞消痰软坚强，化瘀散结制酸良。"}, {"id": 292, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "礞石", "f": "坠痰下气，平肝镇惊", "a": "1.顽痰、老痰胶结，气逆喘咳；2.癫狂，惊痫", "d": "煎服6~10g；入丸散1.5~3g", "sp": "宜打碎布包先煎", "w": "重坠性猛，非痰热内结不化之实证不宜使用；脾虚胃弱、小儿慢惊及孕妇忌用", "ap": "", "m": "礞石：坠痰下气，平肝镇惊，顽痰", "k": "礞石坠痰下气强，平肝镇惊顽痰尝。"}, {"id": 293, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "胖大海", "f": "清肺化痰，利咽开音，润肠通便", "a": "1.肺热声哑，咽喉疼痛，咳嗽；2.燥热便秘，头痛目赤", "d": "2~4枚", "sp": "沸水泡服或煎服", "w": "", "ap": "", "m": "胖大海：清肺利咽开音，润肠", "k": "胖大清肺利咽喉，开音润肠热咳收。"}, {"id": 294, "ch": "化痰止咳平喘药", "sec": "止咳平喘药", "n": "苦杏仁", "f": "止咳平喘，润肠通便", "a": "1.咳嗽气喘（治咳喘要药，随证配伍用于多种咳喘）；2.肠燥便秘", "d": "煎服3~10g", "sp": "宜打碎入煎", "w": "有小毒，用量不宜过大；婴儿慎用", "ap": "甜杏仁：性味甘平，功能润肺止咳，主要用于虚劳咳嗽，煎服5~10g", "m": "苦杏仁：止咳平喘，润肠，有小毒", "k": "杏仁止咳平喘强，润肠通便有小毒。"}, {"id": 295, "ch": "化痰止咳平喘药", "sec": "止咳平喘药", "n": "苏子", "f": "降气化痰，止咳平喘，润肠通便", "a": "1.痰壅气逆，咳嗽气喘；2.肠燥便秘", "d": "煎服5~10g", "sp": "", "w": "阴虚喘咳及脾虚便溏者慎用", "ap": "", "m": "苏子：降气化痰，止咳平喘，润肠", "k": "苏子降气化痰强，止咳平喘润肠良。"}, {"id": 296, "ch": "化痰止咳平喘药", "sec": "止咳平喘药", "n": "百部", "f": "润肺止咳，杀虫", "a": "1.新久咳嗽，百日咳，肺痨咳嗽；2.蛲虫、阴道滴虫、头虱及疥癣等（外用）", "d": "煎服5~15g；外用适量", "sp": "久咳虚嗽宜蜜炙用", "w": "", "ap": "", "m": "百部：润肺止咳，杀虫（灭虱）", "k": "百部润肺止咳强，杀虫灭虱疗虱良。"}, {"id": 297, "ch": "化痰止咳平喘药", "sec": "止咳平喘药", "n": "紫菀", "f": "润肺化痰止咳", "a": "用于咳嗽有痰（寒热虚实皆可）；此外还可用于肺痈、胸痹及小便不通等证", "d": "煎服5~10g", "sp": "外感暴咳生用，肺虚久咳蜜炙用", "w": "", "ap": "", "m": "紫菀：润肺化痰止咳，咳嗽之要药", "k": "紫菀润肺化痰咳，款冬相须效更多。"}, {"id": 298, "ch": "化痰止咳平喘药", "sec": "止咳平喘药", "n": "款冬花", "f": "润肺止咳化痰", "a": "用于多种咳嗽（常与紫菀相须为用）", "d": "煎服5~10g", "sp": "外感暴咳宜生用，内伤久咳宜炙用", "w": "", "ap": "", "m": "款冬花：润肺止咳，常与紫菀相须", "k": "款冬润肺止咳强，化痰之功紫菀帮。"}, {"id": 299, "ch": "化痰止咳平喘药", "sec": "止咳平喘药", "n": "马兜铃", "f": "清肺化痰，止咳平喘", "a": "主要用于肺热咳喘；此外煎汤熏洗治痔疮肿痛，并能清热平肝降压", "d": "煎服3~10g；外用适量", "sp": "外用煎汤熏洗；一般生用，肺虚久咳炙用", "w": "用量不宜过大，以免引起呕吐", "ap": "", "m": "马兜铃：清肺化痰平喘（含马兜铃酸）", "k": "兜铃清肺化痰喘，止咳平喘肾毒防。"}, {"id": 300, "ch": "化痰止咳平喘药", "sec": "止咳平喘药", "n": "枇杷叶", "f": "清肺化痰止咳，降逆止呕", "a": "1.肺热咳嗽，气逆喘急；2.胃热呕吐，哕逆", "d": "煎服5~10g", "sp": "止咳宜炙用，止呕宜生用", "w": "", "ap": "", "m": "枇杷叶：清肺止咳，降逆止呕", "k": "枇杷清肺止咳强，降逆止呕胃热尝。"}, {"id": 301, "ch": "化痰止咳平喘药", "sec": "止咳平喘药", "n": "桑白皮", "f": "泻肺平喘，利水消肿", "a": "1.肺热咳喘；2.水肿（风水、皮水）", "d": "煎服5~15g", "sp": "泻肺利水、平肝清火宜生用；肺虚咳嗽宜蜜炙用", "w": "", "ap": "", "m": "桑白皮：泻肺平喘，利水", "k": "桑皮泻肺平喘强，利水消肿水肿尝。"}, {"id": 302, "ch": "化痰止咳平喘药", "sec": "止咳平喘药", "n": "葶苈子", "f": "泻肺平喘，利水消肿", "a": "1.痰涎壅盛，喘咳不得平卧之证；2.水肿、悬饮、胸腹积水、小便不利等", "d": "煎服5~10g；研末服3~6g", "sp": "", "w": "", "ap": "", "m": "葶苈子：泻肺平喘，利水，包煎", "k": "葶苈泻肺平喘强，利水消肿包煎尝。"}, {"id": 303, "ch": "化痰止咳平喘药", "sec": "止咳平喘药", "n": "白果", "f": "敛肺化痰定喘，止带缩尿", "a": "1.哮喘痰嗽；2.带下，白浊，小便频数，遗尿等", "d": "煎服5~10g", "sp": "捣碎入煎", "w": "有毒，不可多用，小儿尤当注意", "ap": "银杏叶：敛肺平喘、活血止痛；用于肺虚咳喘，以及高血脂、高血压、冠心病心绞痛、脑血管痉挛等", "m": "白果：敛肺定喘，止带缩尿，有毒", "k": "白果敛肺定喘强，止带缩尿有毒尝。"}, {"id": 304, "ch": "化痰止咳平喘药", "sec": "止咳平喘药", "n": "矮地茶", "f": "止咳平喘，清利湿热，活血化瘀", "a": "1.咳喘痰多；2.湿热黄疸，水肿；3.跌打损伤，风湿痹痛，经闭", "d": "煎服10~30g", "sp": "", "w": "", "ap": "", "m": "矮地茶：止咳平喘，活血化瘀", "k": "矮地止咳平喘好，清利湿热血瘀消。"}, {"id": 305, "ch": "化痰止咳平喘药", "sec": "止咳平喘药", "n": "洋金花", "f": "平喘止咳，镇痛止痉", "a": "1.哮喘咳嗽；2.心腹疼痛，风湿痹痛，跌打损伤；3.癫痫，小儿慢惊风；4.麻醉", "d": "内服多作散剂吞服，0.3~0.6g；如作卷烟吸，每日不超过1.5g", "sp": "多作散剂吞服，或作卷烟分次燃吸", "w": "有毒，应控制剂量；表证未解、痰多粘稠者忌用；青光眼患者忌用；高血压、心脏病以及孕妇、体弱者均应慎用", "ap": "", "m": "洋金花：平喘止咳，镇痛，有毒", "k": "洋金平喘止咳强，镇痛止痉毒性狂。"}, {"id": 306, "ch": "安神药", "sec": "重镇安神药", "n": "朱砂", "f": "镇心安神，清热解毒", "a": "1.心神不宁，心悸，失眠；2.惊风，癫痫；3.疮疡肿毒，咽喉肿痛，口舌生疮", "d": "入丸散或研末冲服，每次0.3~1g；外用适量", "sp": "不入煎剂，只入丸散或研末冲服", "w": "有毒，内服不可过量或持续服用，以防汞中毒；忌火煅，火煅则析出水银，有剧毒", "ap": "", "m": "朱砂：镇心安神，清热解毒，有毒，不入煎剂，研末", "k": "朱砂镇心安神志，清热解毒毒性知。"}, {"id": 307, "ch": "安神药", "sec": "重镇安神药", "n": "磁石", "f": "镇惊安神，平肝潜阳，聪耳明目，纳气定喘", "a": "1.心神不宁，惊悸，失眠，癫痫；2.肝阳眩晕；3.耳鸣耳聋，视物昏花；4.肾虚气喘", "d": "煎服15~30g；入丸散每次1~3g", "sp": "宜打碎先煎；镇惊安神、平肝潜阳宜生用，聪耳明目、纳气平喘宜醋淬后用", "w": "因吞服后不易消化，如入丸散不可多服；脾胃虚弱者慎用", "ap": "", "m": "磁石：镇惊安神，平肝，聪耳明目，纳气，先煎", "k": "磁石镇惊安神魂，平肝聪耳纳气沉。"}, {"id": 308, "ch": "安神药", "sec": "重镇安神药", "n": "龙骨", "f": "镇惊安神，平肝潜阳，收敛固涩", "a": "1.心神不宁，心悸失眠，惊痫癫狂；2.肝阳眩晕；3.滑脱诸证（遗精、带下、虚汗、崩漏）；4.湿疮痒疹，疮疡久溃不敛（外用）", "d": "煎服15~30g；外用适量", "sp": "入煎剂宜先煎；收敛固涩宜煅用，余皆生用", "w": "", "ap": "龙齿：较龙骨更长于镇惊安神，主要用于惊痫癫狂、心悸、失眠等证，用法用量与龙骨相同", "m": "龙骨：镇惊安神，平肝潜阳，收敛固涩，先煎", "k": "龙骨镇惊平肝阳，收敛固涩先煎尝。"}, {"id": 309, "ch": "安神药", "sec": "重镇安神药", "n": "琥珀", "f": "镇惊安神，活血散瘀，利尿通淋", "a": "1.心神不宁，心悸失眠，惊风癫痫；2.瘀血阻滞证（经闭痛经、癥瘕、心腹刺痛）；3.淋证，癃闭；此外外用可生肌收敛，用于痈肿疮毒", "d": "研末冲服，每次1.5~3g", "sp": "不入煎剂，研末冲服", "w": "", "ap": "", "m": "琥珀：镇惊安神，活血利尿，研末", "k": "琥珀镇惊安神志，活血利尿研末宜。"}, {"id": 310, "ch": "安神药", "sec": "养心安神药", "n": "酸枣仁", "f": "养心益肝，安神，敛汗", "a": "1.心悸失眠（养心安神要药）；2.体虚多汗（自汗、盗汗）", "d": "煎服10~20g；研末吞服，每次1.5~3g", "sp": "可研末吞服", "w": "", "ap": "", "m": "酸枣仁：养心益肝安神，敛汗，宜捣碎", "k": "枣仁养心益肝血，安神敛汗失眠捷。"}, {"id": 311, "ch": "安神药", "sec": "养心安神药", "n": "柏子仁", "f": "养心安神，润肠通便", "a": "1.心悸失眠；2.肠燥便秘", "d": "煎服10~20g", "sp": "", "w": "便溏及多痰者慎用", "ap": "", "m": "柏子仁：养心安神，润肠", "k": "柏仁养心安神志，润肠通便宜便秘。"}, {"id": 312, "ch": "安神药", "sec": "养心安神药", "n": "远志", "f": "宁心安神，祛痰开窍，消散痈肿", "a": "1.惊悸，失眠健忘；2.痰阻心窍，癫痫发狂；3.咳嗽痰多；4.痈疽疮毒，乳房肿痛", "d": "煎服5~15g；外用适量", "sp": "", "w": "有胃炎及胃溃疡者慎用", "ap": "", "m": "远志：宁心安神，祛痰开窍，消痈", "k": "远志宁心安神志，祛痰开窍痈肿治。"}, {"id": 313, "ch": "安神药", "sec": "养心安神药", "n": "合欢皮", "f": "安神解郁，活血消肿", "a": "1.忿怒忧郁，烦躁失眠；2.跌打骨折，血瘀肿痛及痈肿疮毒", "d": "煎服10~15g", "sp": "", "w": "", "ap": "合欢花：性味功效与合欢皮相似，长于安神解郁，用于虚烦不眠、抑郁不舒、健忘多梦，煎服5~10g", "m": "合欢皮：安神解郁，活血消肿", "k": "合欢安神解郁结，活血消肿跌打捷。"}, {"id": 314, "ch": "安神药", "sec": "养心安神药", "n": "夜交藤", "f": "养心安神，祛风通络", "a": "1.虚烦不眠，多梦；2.血虚身痛，风湿痹痛；此外煎汤外洗治皮肤痒疹", "d": "煎服15~30g", "sp": "", "w": "", "ap": "", "m": "夜交藤：养心安神，祛风通络", "k": "夜交养心安神志，祛风通络痹痛治。"}, {"id": 315, "ch": "平肝息风药", "sec": "平抑肝阳药", "n": "石决明", "f": "平肝潜阳，清肝明目", "a": "1.肝阳上亢，头晕目眩；2.目赤，翳障，视物昏花", "d": "煎服15~30g", "sp": "应打碎先煎；平肝、清肝宜生用，外用点眼宜煅用、水飞", "w": "", "ap": "", "m": "石决明：平肝潜阳，清肝明目，先煎", "k": "决明平肝潜阳亢，清肝明目先煎尝。"}, {"id": 316, "ch": "平肝息风药", "sec": "平抑肝阳药", "n": "珍珠母", "f": "平肝潜阳，清肝明目，镇心安神", "a": "1.肝阳上亢，头晕目眩；2.目赤肿痛，视物昏花；3.惊悸失眠，心神不宁；此外研细末外用可燥湿敛疮，治湿疮瘙痒；珍珠层粉内服治胃、十二指肠溃疡", "d": "煎服15~30g；外用适量", "sp": "宜打碎先煎", "w": "", "ap": "", "m": "珍珠母：平肝潜阳，清肝明目，镇心安神", "k": "珠母平肝潜阳明，清肝安神镇心惊。"}, {"id": 317, "ch": "平肝息风药", "sec": "平抑肝阳药", "n": "牡蛎", "f": "平肝潜阳，软坚散结，收敛固涩", "a": "1.肝阳上亢，头晕目眩；2.痰核，瘰疬，癥瘕积聚等证；3.滑脱诸证（自汗盗汗、遗精、崩带）；此外煅牡蛎有收敛制酸作用，可治胃痛泛酸", "d": "煎服10~30g", "sp": "宜打碎先煎；除收敛固涩煅用外，余皆生用", "w": "", "ap": "", "m": "牡蛎：平肝潜阳，软坚散结，收敛固涩，先煎", "k": "牡蛎平肝潜阳软，散结收涩先煎善。"}, {"id": 318, "ch": "平肝息风药", "sec": "平抑肝阳药", "n": "紫贝齿", "f": "平肝潜阳，镇惊安神，清肝明目", "a": "1.肝阳上亢，头晕目眩；2.惊悸失眠；3.目赤翳障", "d": "煎服10~15g", "sp": "宜打碎先煎", "w": "", "ap": "", "m": "紫贝齿：平肝潜阳，镇惊安神", "k": "紫贝平肝潜阳明，镇惊安神目疾平。"}, {"id": 319, "ch": "平肝息风药", "sec": "平抑肝阳药", "n": "代赭石", "f": "平肝潜阳，重镇降逆，凉血止血", "a": "1.肝阳上亢，头晕目眩；2.呕吐，呃逆，噫气；3.气逆喘息；4.血热吐衄，崩漏", "d": "煎服10~30g；入丸散每次1~3g", "sp": "宜打碎先煎；降逆、平肝生用，止血煅用", "w": "孕妇慎用；因含微量砷，故不宜长期服用", "ap": "", "m": "代赭石：平肝潜阳，重镇降逆（呕吐、呃逆），先煎", "k": "赭石平肝重镇逆，凉血止血呃喘宜。"}, {"id": 320, "ch": "平肝息风药", "sec": "平抑肝阳药", "n": "刺蒺藜", "f": "平肝疏肝，祛风明目", "a": "1.肝阳上亢，头晕目眩；2.肝郁气滞，胸胁胀痛，乳闭胀痛；3.风热上攻，目赤翳障；4.风疹瘙痒，白癜风", "d": "煎服6~15g", "sp": "", "w": "", "ap": "", "m": "刺蒺藜：平肝疏肝，祛风明目", "k": "蒺藜平肝又疏肝，祛风明目痒可安。"}, {"id": 321, "ch": "平肝息风药", "sec": "平抑肝阳药", "n": "罗布麻", "f": "平抑肝阳，清热，利尿", "a": "1.肝阳上亢、肝火上炎之头晕目眩（高血压病）；2.水肿，小便不利", "d": "3~15g", "sp": "水煎服或开水泡服；肝阳眩晕宜用叶片，治疗水肿多用根", "w": "不宜过量和长期服用，以免中毒", "ap": "", "m": "罗布麻：平抑肝阳，清热，利尿", "k": "罗布平肝潜阳去，清热利尿功效聚。"}, {"id": 322, "ch": "平肝息风药", "sec": "息风止痉药", "n": "羚羊角", "f": "平肝息风，清肝明目，清热解毒", "a": "1.肝风内动，惊痫抽搐（热极生风尤宜）；2.肝阳上亢，头晕目眩；3.肝火上炎，目赤头痛；4.温热病壮热神昏，热毒发斑", "d": "煎服1~3g；磨汁或研粉服，每次0.3~0.6g", "sp": "单煎2小时以上，取汁服；或磨汁、研粉服", "w": "", "ap": "", "m": "羚羊角：肝风内动，惊痫抽搐第一要药", "k": "羚羊息风平肝阳，清肝明目热毒防。"}, {"id": 323, "ch": "平肝息风药", "sec": "息风止痉药", "n": "牛黄", "f": "息风止痉，化痰开窍，清热解毒", "a": "1.温热病及小儿惊风之壮热神昏、惊厥抽搐等症；2.温热病热入心包、中风、惊风、癫痫等痰热蒙蔽心窍所致之神昏、口噤、痰鸣等症；3.咽喉肿痛、溃烂及痈疽疔毒等热毒壅滞郁结之证", "d": "入丸散，每次0.2~0.5g；外用适量", "sp": "只入丸散，不入煎剂；外用研细末敷患处", "w": "孕妇慎用", "ap": "", "m": "牛黄：息风止痉，化痰开窍，清热解毒", "k": "牛黄息风止痉厥，化痰开窍清热解。"}, {"id": 324, "ch": "平肝息风药", "sec": "息风止痉药", "n": "钩藤", "f": "息风止痉，清热平肝", "a": "1.肝风内动，惊痫抽搐；2.头痛，眩晕（肝火上攻或肝阳上亢）；此外与蝉蜕、薄荷同用可治小儿夜啼", "d": "煎服10~15g", "sp": "有效成分钩藤碱加热后易破坏，故不宜久煎，一般不超过20分钟（宜后下）", "w": "", "ap": "", "m": "钩藤：息风止痉，清热平肝，后下", "k": "钩藤息风止痉强，清热平肝后下良。"}, {"id": 325, "ch": "平肝息风药", "sec": "息风止痉药", "n": "天麻", "f": "息风止痉，平抑肝阳，祛风通络", "a": "1.肝风内动，惊痫抽搐（寒热虚实皆可配伍）；2.眩晕，头痛（止眩晕良药）；3.肢体麻木，手足不遂，风湿痹痛", "d": "煎服3~10g；研末冲服，每次1~1.5g", "sp": "可研末冲服", "w": "", "ap": "", "m": "天麻：息风止痉要药，眩晕要药", "k": "天麻息风止痉先，平肝祛风眩晕痊。"}, {"id": 326, "ch": "平肝息风药", "sec": "息风止痉药", "n": "地龙", "f": "清热息风，通络，平喘，利尿", "a": "1.高热惊痫，癫狂；2.气虚血滞，半身不遂；3.痹证（热痹尤宜）；4.肺热哮喘；5.热结膀胱，小便不利或尿闭不通；此外近年用治原发性高血压、腮腺炎、丹毒及精神病等", "d": "煎服5~15g，鲜品10~20g；研末吞服，每次1~2g", "sp": "", "w": "", "ap": "", "m": "地龙：清热息风，通络，平喘，利尿", "k": "地龙清热息风惊，通络平喘利尿行。"}, {"id": 327, "ch": "平肝息风药", "sec": "息风止痉药", "n": "全蝎", "f": "息风止痉，攻毒散结，通络止痛", "a": "1.痉挛抽搐（急慢惊风、中风面瘫、破伤风）；2.疮疡肿毒，瘰疬结核；3.风湿顽痹；4.顽固性偏正头痛", "d": "煎服2~5g；研末吞服，每次0.6~1g；外用适量", "sp": "", "w": "有毒，用量不宜过大；孕妇慎用", "ap": "", "m": "全蝎：息风止痉，攻毒散结，通络止痛", "k": "全蝎息风止痉痛，攻毒散结通络用。"}, {"id": 328, "ch": "平肝息风药", "sec": "息风止痉药", "n": "蜈蚣", "f": "息风止痉，攻毒散结，通络止痛", "a": "1.痉挛抽搐；2.疮疡肿毒，瘰疬结核；3.风湿顽痹；4.顽固性头痛", "d": "煎服1~3g；研末吞服，每次0.6~1g；外用适量", "sp": "", "w": "有毒，用量不宜过大；孕妇忌服", "ap": "", "m": "蜈蚣：息风止痉，攻毒散结，通络止痛，力强", "k": "蜈蚣息风止痉强，攻毒通络力尤昂。"}, {"id": 329, "ch": "平肝息风药", "sec": "息风止痉药", "n": "僵蚕", "f": "息风止痉，祛风止痛，化痰散结", "a": "1.惊痫抽搐（挟痰热者尤宜）；2.风中经络，口眼㖞斜；3.风热头痛，目赤，咽肿或风疹瘙痒；4.痰核，瘰疬", "d": "煎服3~10g；研末吞服，每次1~1.5g", "sp": "散风热宜生用，其余多制用", "w": "", "ap": "僵蛹：以蚕蛹为底物经白僵菌发酵的制成品，功用与僵蚕相近，可代僵蚕药用", "m": "僵蚕：息风止痉，祛风止痛，化痰散结", "k": "僵蚕息风止痉先，祛风化痰散结痊。"}, {"id": 330, "ch": "开窍药", "sec": "开窍药", "n": "麝香", "f": "开窍醒神，活血通经，止痛，催产", "a": "1.闭证神昏（醒神回苏要药，寒闭、热闭皆可）；2.疮疡肿毒，咽喉肿痛；3.血瘀经闭，癥瘕，心腹暴痛，跌打损伤，风寒湿痹等证；4.难产，死胎，胞衣不下；此外用治冠心病心绞痛", "d": "入丸散，每次0.06~0.1g；外用适量", "sp": "不宜入煎剂", "w": "孕妇忌用", "ap": "", "m": "麝香：开窍醒神第一要药，活血，催产，孕妇禁用", "k": "麝香开窍醒神先，活血催产孕忌煎。"}, {"id": 331, "ch": "开窍药", "sec": "开窍药", "n": "冰片", "f": "开窍醒神，清热止痛", "a": "1.闭证神昏；2.目赤肿痛，喉痹口疮；3.疮疡肿痛，溃后不敛；此外用治冠心病心绞痛及齿痛", "d": "入丸散，每次0.03~0.1g；外用适量", "sp": "不宜入煎剂", "w": "孕妇慎用", "ap": "", "m": "冰片：开窍醒神，清热止痛，入丸散", "k": "冰片开窍醒神志，清热止痛入丸施。"}, {"id": 332, "ch": "开窍药", "sec": "开窍药", "n": "苏合香", "f": "开窍醒神，辟秽止痛", "a": "1.寒闭神昏；2.胸腹冷痛，满闷（冠心病心绞痛）", "d": "入丸散，每次0.3~1g", "sp": "不入煎剂", "w": "", "ap": "", "m": "苏合香：开窍醒神，辟秽，寒闭", "k": "苏合开窍醒神志，辟秽止痛寒闭治。"}, {"id": 333, "ch": "开窍药", "sec": "开窍药", "n": "石菖蒲", "f": "开窍宁神，化湿和胃", "a": "1.痰湿蒙蔽清窍之神志昏迷；2.湿阻中焦，脘腹胀闷，痞塞疼痛；3.健忘，失眠，耳鸣，耳聋；此外还可用于声音嘶哑、风湿痹痛、痈疽疥癣、跌打损伤等证", "d": "煎服5~10g，鲜品加倍；外用适量", "sp": "", "w": "", "ap": "", "m": "石菖蒲：开窍宁神，化湿和胃", "k": "菖蒲开窍宁神志，化湿和胃痰湿治。"}, {"id": 334, "ch": "开窍药", "sec": "开窍药", "n": "蟾酥", "f": "开窍醒神，止痛，解毒", "a": "1.痧胀腹痛，吐泻，神昏；2.恶疮，瘰疬，咽喉肿痛及各种牙痛", "d": "入丸散，每次0.015~0.03g；外用适量", "sp": "只入丸散，不入煎剂", "w": "有毒，内服切勿过量；外用不可入目；孕妇忌用", "ap": "蟾皮：清热解毒、利水消胀；用于痈疽疮毒、疳积腹胀、瘰疬肿瘤等", "m": "蟾酥：开窍醒神，止痛，解毒，有毒", "k": "蟾酥开窍醒神志，止痛解毒毒性炽。"}, {"id": 335, "ch": "开窍药", "sec": "开窍药", "n": "樟脑", "f": "内服：开窍辟秽；外用：除湿杀虫，温散止痛", "a": "1.痧胀腹痛，吐泻，神昏；2.疥癣湿疮，瘙痒溃烂；3.牙痛及跌打损伤疼痛", "d": "内服每次0.1~0.2g；外用适量", "sp": "内服入散剂或用酒溶化服；外用研末撒或调敷", "w": "有毒，内服宜慎，并控制剂量；孕妇忌用", "ap": "", "m": "樟脑：内服开窍辟秽，外用除湿杀虫", "k": "樟脑内服开窍辟，外用除湿杀虫益。"}, {"id": 336, "ch": "补虚药", "sec": "补气药", "n": "人参", "f": "大补元气，补脾益肺，生津，安神", "a": "1.气虚欲脱，脉微欲绝的重危证候；2.肺气虚弱的短气喘促，懒言声微，脉虚自汗等证；3.脾气不足的倦怠乏力，食少便溏等证；4.热病气津两伤，身热口渴及消渴等证；5.气血亏虚的心悸，失眠，健忘等证；此外用于血虚、阳痿及扶正祛邪", "d": "煎服5~10g；急重证可酌增为15~30g；研末吞服，每次1.5~2g", "sp": "宜文火另煎兑服；挽救虚脱宜大剂量煎汁分次灌服；可研末吞服", "w": "反藜芦；畏五灵脂；不宜同时吃萝卜或喝茶，以免影响补力", "ap": "", "m": "人参：大补元气，补脾益肺，生津，安神，反藜芦，畏五灵脂", "k": "人参大补元气先，补脾益肺安神全。"}, {"id": 337, "ch": "补虚药", "sec": "补气药", "n": "西洋参", "f": "补气养阴，清火生津", "a": "1.阴虚火旺的喘咳痰血证；2.热病气阴两伤，烦倦，口渴", "d": "3~6g", "sp": "另煎兑服", "w": "", "ap": "", "m": "西洋参：补气养阴，清火生津，不宜与藜芦同用", "k": "西洋补气养阴津，清火生津热病灵。"}, {"id": 338, "ch": "补虚药", "sec": "补气药", "n": "党参", "f": "益气，生津，养血", "a": "1.中气不足的体虚倦怠，食少便溏；2.肺气亏虚的咳嗽气促，语声低弱；3.气津两伤的气短口渴；4.气血双亏的面色萎黄，头晕心悸", "d": "煎服10~30g", "sp": "", "w": "", "ap": "", "m": "党参：益气，生津，养血，不宜与藜芦同用", "k": "党参益气又生津，养血功缓可代参。"}, {"id": 339, "ch": "补虚药", "sec": "补气药", "n": "太子参", "f": "补气生津", "a": "1.脾气虚弱、胃阴不足的食少倦怠；2.气虚津伤的肺虚燥咳及心悸不眠、虚热汗多", "d": "煎服10~30g", "sp": "", "w": "", "ap": "", "m": "太子参：补气生津，益气养阴", "k": "太子补气生津液，益气养阴力平和。"}, {"id": 340, "ch": "补虚药", "sec": "补气药", "n": "黄芪", "f": "补气升阳，益卫固表，利水消肿，托疮生肌", "a": "1.脾胃气虚及中气下陷诸证；2.肺气虚及表虚自汗，气虚外感诸证；3.气虚水湿失运的浮肿，小便不利；4.气血不足，疮疡内陷的脓成不溃或溃久不敛；此外用于气虚血亏的面色萎黄、气不摄血的便血崩漏、气虚血滞的痹痛麻木及半身不遂、气虚津亏的消渴", "d": "煎服10~15g；大剂量30~60g", "sp": "益气补中宜炙用，其他方面多生用", "w": "凡表实邪盛、内有积滞、阴虚阳亢、疮疡阳证实证等，均不宜用", "ap": "", "m": "黄芪：补气升阳，固表，利水，托疮", "k": "黄芪补气升阳势，固表利水托疮痍。"}, {"id": 341, "ch": "补虚药", "sec": "补气药", "n": "白术", "f": "补气健脾，燥湿利水，止汗，安胎", "a": "1.脾胃气虚，运化无力的食少便溏、脘腹胀满、肢软神疲等证；2.脾虚水停的痰饮、水肿、小便不利；3.脾虚气弱，肌表不固而自汗；4.脾虚气弱，胎动不安", "d": "煎服5~15g", "sp": "燥湿利水宜生用，补气健脾宜炒用，健脾止泻宜炒焦用", "w": "燥湿伤阴，阴虚内热或津液亏耗燥渴者不宜用", "ap": "", "m": "白术：补气健脾，燥湿利水，止汗，安胎，脾脏之要药", "k": "白术补气健脾先，燥湿利水止汗安。"}, {"id": 342, "ch": "补虚药", "sec": "补气药", "n": "山药", "f": "益气养阴，补脾肺肾，固精止带", "a": "1.脾胃虚弱证（食少便溏、泄泻）；2.肺虚咳喘；3.肾虚遗精、尿频、带下；4.阴虚内热、口渴多饮、小便频数的消渴证", "d": "煎服10~30g，大量60~250g；研末吞服，每次6~10g", "sp": "补阴生津宜生用，健脾止泻宜炒用", "w": "", "ap": "", "m": "山药：益气养阴，肺脾肾，固精止带", "k": "山药益气养阴津，补脾肺肾固精准。"}, {"id": 343, "ch": "补虚药", "sec": "补气药", "n": "白扁豆", "f": "健脾，化湿，消暑", "a": "1.脾虚有湿，体倦乏力，食少便溏或泄泻，以及妇女脾虚带下；2.暑湿吐泻；此外能解毒，用于食物中毒", "d": "煎服10~30g", "sp": "健脾止泻宜炒用，消暑解毒宜生用", "w": "", "ap": "扁豆衣：白扁豆的干燥种皮，性效似白扁豆而健脾之力略逊，但无壅滞之弊，偏于消暑化湿，主治暑湿吐泻及脚气浮肿，煎服5~10g。扁豆花：功能消暑化湿，多用于暑湿泄泻及带下，煎服5~10g", "m": "白扁豆：健脾化湿，消暑", "k": "扁豆健脾化湿浊，消暑清热夏常服。"}, {"id": 344, "ch": "补虚药", "sec": "补气药", "n": "甘草", "f": "益气补中，清热解毒，祛痰止咳，缓急止痛，调和药性", "a": "1.心气不足的心动悸、脉结代；2.脾气虚弱的倦怠乏力、食少便溏；3.痰多咳嗽；4.脘腹及四肢挛急作痛；5.热毒疮疡，咽喉肿痛及药物、食物中毒；6.调和药性", "d": "煎服3~10g", "sp": "清热解毒宜生用，补中缓急宜炙用", "w": "湿盛胀满、浮肿者不宜用；反大戟、芫花、甘遂、海藻；久服较大剂量的生甘草可引起浮肿等", "ap": "", "m": "甘草：国老，调和诸药，缓急止痛，反大戟芫花甘遂海藻", "k": "甘草益气补中和，祛痰止咳解毒多。"}, {"id": 345, "ch": "补虚药", "sec": "补气药", "n": "大枣", "f": "补中益气，养血安神，缓和药性", "a": "1.脾虚食少便溏，倦怠乏力；2.血虚萎黄及妇女脏躁，神志不安；3.缓和峻烈药物的药性（如配甘遂、大戟、芫花）", "d": "煎服10~30g", "sp": "劈破煎服；亦可去皮核捣烂为丸服", "w": "", "ap": "", "m": "大枣：补中益气，养血安神，缓药性", "k": "大枣补中益气好，养血安神缓药烈。"}, {"id": 346, "ch": "补虚药", "sec": "补气药", "n": "饴糖", "f": "补中缓急，润肺止咳", "a": "1.中虚里急，脘腹疼痛；2.肺虚咳嗽，干咳无痰", "d": "30~60g", "sp": "入汤剂须烊化，分二三次溶化服；亦可熬膏或为丸服", "w": "湿阻中满、湿热内蕴及痰湿甚者忌用", "ap": "", "m": "饴糖：补中缓急，润肺", "k": "饴糖补中缓急痛，润肺止咳脾胃用。"}, {"id": 347, "ch": "补虚药", "sec": "补气药", "n": "蜂蜜", "f": "补中缓急，润燥，解毒", "a": "1.中虚脘腹疼痛；2.肺虚燥咳及肠燥便秘；3.解乌头类药毒；此外外用治疮疡不敛、水火烫伤", "d": "15~30g；外用适量", "sp": "冲服，或入丸剂、膏剂", "w": "凡湿阻中满、湿热痰滞、便溏或泄泻者宜慎用", "ap": "", "m": "蜂蜜：补中缓急，润燥，解毒", "k": "蜂蜜补中缓急宜，润燥解毒润肠奇。"}, {"id": 348, "ch": "补虚药", "sec": "补阳药", "n": "鹿茸", "f": "壮肾阳，益精血，强筋骨，调冲任，托疮毒", "a": "1.肾阳不足，精血亏虚的阳痿早泄、宫寒不孕、尿频不禁、头晕耳鸣、腰膝酸痛、肢冷神疲等；2.肝肾精血不足的筋骨萎软、小儿发育不良、囟门过期不合、齿迟、行迟等；3.冲任虚寒，带脉不固的崩漏不止、带下过多；4.疮疡久溃不敛，阴疽内陷不起", "d": "研细末，一日三次分服，1~3g；如入丸散，随方配制", "sp": "研末吞服，不入煎剂", "w": "服用本品宜从小量开始，缓缓增加，不宜骤用大量，以免阳升风动、头晕目赤，或助火动血而致鼻衄；凡阴虚阳亢、血分有热、胃火盛或肺有痰热以及外感热病者均应忌服", "ap": "鹿角胶：补肝肾、益精血，并有良好止血作用，用于肾阳不足、精血亏虚的虚劳羸瘦及吐衄崩漏之偏于虚寒者、阴疽内陷等，烊化兑服。鹿角霜：补肾助阳之力较弱而兼收敛，用于崩漏、遗精等，外用止血敛疮", "m": "鹿茸：壮肾阳，益精血，强筋骨，调冲任，托疮毒，宜研末", "k": "鹿茸壮肾阳益血，强筋调冲托疮疡。"}, {"id": 349, "ch": "补虚药", "sec": "补阳药", "n": "巴戟天", "f": "补肾阳，强筋骨，祛风湿", "a": "1.肾阳虚弱的阳痿，不孕，月经不调，少腹冷痛等；2.肝肾不足的筋骨痿软、腰膝疼痛，或风湿久痹", "d": "煎服10~15g", "sp": "", "w": "", "ap": "", "m": "巴戟天：补肾阳，强筋骨，祛风湿", "k": "巴戟补肾阳强筋，祛风除湿骨节伸。"}, {"id": 350, "ch": "补虚药", "sec": "补阳药", "n": "淫羊藿", "f": "补肾壮阳，祛风除湿", "a": "1.肾阳虚的阳痿、不孕及尿频等证；2.肝肾不足的筋骨痹痛、风湿拘挛麻木等证；此外现代用于肾阳虚的喘咳及妇女更年期的高血压等", "d": "煎服5~10g", "sp": "亦可浸酒、熬膏或入丸、散", "w": "", "ap": "", "m": "淫羊藿：补肾壮阳，祛风除湿（仙灵脾）", "k": "淫羊补肾壮阳强，祛风除湿筋骨壮。"}, {"id": 351, "ch": "补虚药", "sec": "补阳药", "n": "仙茅", "f": "温肾壮阳，强筋骨，祛寒湿", "a": "1.肾阳不足、命门火衰的阳痿精冷、小便频数；2.腰膝冷痛，筋骨痿软无力", "d": "3~10g", "sp": "煎服或浸酒服", "w": "阴虚火旺者忌服", "ap": "", "m": "仙茅：温肾壮阳，强筋骨，祛寒湿，有毒", "k": "仙茅温肾壮阳足，强筋祛寒有毒服。"}, {"id": 352, "ch": "补虚药", "sec": "补阳药", "n": "补骨脂", "f": "补肾助阳，固精缩尿，暖脾止泻，纳气平喘", "a": "1.肾虚阳痿，腰膝冷痛；2.肾虚遗精，遗尿，尿频；3.脾肾阳虚的泄泻；4.肾不纳气的虚喘；此外外用治白癜风", "d": "煎服6~15g；外用适量", "sp": "", "w": "", "ap": "", "m": "补骨脂：补肾助阳，固精缩尿，止泻，纳气", "k": "骨脂补肾助阳虚，固精缩尿纳气宜。"}, {"id": 353, "ch": "补虚药", "sec": "补阳药", "n": "益智仁", "f": "暖肾固精缩尿，温脾止泻摄唾", "a": "1.下元虚寒的遗精，遗尿，小便频数；2.脾胃虚寒的腹痛吐泻及口涎自流", "d": "煎服3~10g", "sp": "", "w": "", "ap": "", "m": "益智仁：暖肾固精缩尿，温脾止泻摄唾", "k": "益智暖肾固精尿，温脾止泻摄唾妙。"}, {"id": 354, "ch": "补虚药", "sec": "补阳药", "n": "海狗肾", "f": "暖肾壮阳，益精补髓", "a": "肾阳衰惫的阳痿精冷，精少不育等", "d": "研末服，每次1~3g，日服2~3次", "sp": "研末服；入丸、散或浸酒服，则随方定量", "w": "", "ap": "狗肾（黄狗肾）：功用与海狗肾相似而力较弱，可代海狗肾用", "m": "海狗肾：暖肾壮阳，益精补髓", "k": "海狗暖肾壮阳气，益精补髓效相宜。"}, {"id": 355, "ch": "补虚药", "sec": "补阳药", "n": "海马", "f": "补肾壮阳，调气活血", "a": "1.肾阳虚衰的阳痿不举，遗尿尿频等；2.癥瘕积聚及跌打损伤；此外外用治疮疡肿毒、恶疮发背", "d": "研末服，每次1~1.5g；外用适量", "sp": "研末服；外用涂敷患处", "w": "", "ap": "", "m": "海马：补肾壮阳，调气活血", "k": "海马补肾壮阳气，调气活血疗跌仆。"}, {"id": 356, "ch": "补虚药", "sec": "补阳药", "n": "肉苁蓉", "f": "补肾阳，益精血，润肠通便", "a": "1.肾阳亏虚、精血不足的阳痿早泄、宫冷不孕、腰膝酸痛、痿软无力；2.肠燥津枯便秘", "d": "煎服10~15g", "sp": "", "w": "", "ap": "", "m": "肉苁蓉：补肾阳，益精血，润肠通便", "k": "苁蓉补肾益精血，润肠通便老人悦。"}, {"id": 357, "ch": "补虚药", "sec": "补阳药", "n": "锁阳", "f": "补肾阳，益精血，润肠通便", "a": "1.肾阳亏虚、精血不足的阳痿、不孕、下肢痿软、筋骨无力等；2.血虚津亏的肠燥便秘", "d": "煎服10~15g", "sp": "", "w": "", "ap": "", "m": "锁阳：补肾阳，益精血，润肠通便", "k": "锁阳补肾阳益精，润肠通便同苁蓉。"}, {"id": 358, "ch": "补虚药", "sec": "补阳药", "n": "菟丝子", "f": "补肾固精，养肝明目，止泻，安胎", "a": "1.肾虚腰痛，阳痿遗精，尿频及宫冷不孕；2.肝肾不足，目暗不明；3.脾肾阳虚，便溏泄泻；4.肾虚胎动不安；此外亦治肾虚消渴", "d": "煎服10~15g；外用适量", "sp": "", "w": "", "ap": "", "m": "菟丝子：补肾固精，养肝明目，止泻，安胎", "k": "菟丝补肾固精气，养肝明目安胎宜。"}, {"id": 359, "ch": "补虚药", "sec": "补阳药", "n": "沙苑子", "f": "补肾固精，养肝明目", "a": "1.肾虚阳痿，遗精早泄，小便遗沥，白带过多及腰痛等；2.肝肾不足的眩晕目昏", "d": "煎服10~15g", "sp": "", "w": "", "ap": "", "m": "沙苑子：补肾固精，养肝明目", "k": "沙苑补肾固精强，养肝明目目昏尝。"}, {"id": 360, "ch": "补虚药", "sec": "补阳药", "n": "杜仲", "f": "补肝肾，强筋骨，安胎", "a": "1.肝肾不足的腰膝酸痛、下肢痿软及阳痿、尿频等症；2.肝肾亏虚、下元虚冷的妊娠下血、胎动不安或习惯性流产等；此外近年用于高血压病", "d": "煎服10~15g", "sp": "炒用疗效较生用为佳", "w": "", "ap": "", "m": "杜仲：补肝肾，强筋骨，安胎", "k": "杜仲补肝肾强筋，安胎腰痛效如神。"}, {"id": 361, "ch": "补虚药", "sec": "补阳药", "n": "续断", "f": "补肝肾，强筋骨，止血安胎，疗伤续折", "a": "1.肝肾不足、腰痛脚弱、风湿痹痛及跌打损伤、骨折、肿痛等；2.肝肾虚弱、冲任失调的胎动欲坠或崩漏经多等", "d": "煎服10~15g；外用适量", "sp": "外用研末敷", "w": "", "ap": "", "m": "续断：补肝肾，强筋骨，止血安胎，疗伤续折", "k": "续断补肝肾骨筋，止血安胎伤折灵。"}, {"id": 362, "ch": "补虚药", "sec": "补阳药", "n": "韭子", "f": "温补肝肾，壮阳固精", "a": "1.肝肾不足的腰膝酸软、阳痿；2.肾气不固的遗精、尿频、白带过多", "d": "煎服5~10g", "sp": "亦可随方入丸、散", "w": "", "ap": "", "m": "韭子：温补肝肾，壮阳固精", "k": "韭子温补肝肾阳，壮阳固精遗尿尝。"}, {"id": 363, "ch": "补虚药", "sec": "补阳药", "n": "阳起石", "f": "温肾壮阳", "a": "肾阳虚衰的阳痿、宫冷、腰膝冷痹等", "d": "3~6g", "sp": "入丸、散服", "w": "", "ap": "", "m": "阳起石：温肾壮阳", "k": "阳起温肾壮阳专，功专壮阳阳痿痊。"}, {"id": 364, "ch": "补虚药", "sec": "补阳药", "n": "胡芦巴", "f": "温肾阳，逐寒湿", "a": "1.肾阳不足、寒凝气滞的疝痛、腹胁胀痛；2.寒湿脚气，足膝冷痛", "d": "煎服5~10g", "sp": "亦可入丸、散", "w": "", "ap": "", "m": "胡芦巴：温肾阳，逐寒湿", "k": "芦巴温肾阳逐寒，寒湿疝痛可相安。"}, {"id": 365, "ch": "补虚药", "sec": "补阳药", "n": "核桃仁", "f": "补肾，温肺，润肠", "a": "1.肾虚腰痛脚弱，小便频数；2.肺肾不足的虚寒喘咳及肺虚久咳；3.肠燥便秘；此外可排结石", "d": "煎服10~30g", "sp": "定喘嗽宜连皮用，润肠燥宜去皮用，排结石宜食油炸酥、捣如膏状服用", "w": "", "ap": "", "m": "核桃仁：补肾，温肺，润肠", "k": "核桃补肾温肺喘，润肠通便功用善。"}, {"id": 366, "ch": "补虚药", "sec": "补阳药", "n": "蛤蚧", "f": "助肾阳，益精血，补肺气，定喘嗽", "a": "1.肺肾两虚，肾不纳气的虚喘久嗽（治虚喘劳嗽要药）；2.肾阳不足，精血亏虚的阳痿", "d": "研末服，每次1~2g，日服3次", "sp": "研末服；亦可浸酒服，或入丸、散剂", "w": "", "ap": "", "m": "蛤蚧：助肾阳，益精血，补肺气，定喘嗽", "k": "蛤蚧助肾阳益精，补肺定喘嗽可平。"}, {"id": 367, "ch": "补虚药", "sec": "补阳药", "n": "冬虫夏草", "f": "益肾壮阳，补肺平喘，止血化痰", "a": "1.肾虚腰痛，阳痿遗精；2.肺虚或肺肾两虚之久咳虚喘、劳嗽痰血；此外用于病后体虚不复、自汗畏寒", "d": "5~10g", "sp": "煎汤或炖服（可与鸡、鸭、猪肉等炖服）", "w": "", "ap": "", "m": "冬虫夏草：益肾壮阳，补肺平喘，止血化痰", "k": "虫草益肾壮阳道，补肺平喘止血疗。"}, {"id": 368, "ch": "补虚药", "sec": "补阳药", "n": "紫河车", "f": "温肾补精，益气养血", "a": "1.肾气不足、精血亏虚的不孕、阳痿遗精、腰酸、头晕耳鸣等；2.肺肾两虚的喘嗽；3.气血不足，萎黄消瘦，产后乳少等", "d": "研末或装胶囊吞服，每次1.5~3g，每日2~3次", "sp": "研末或装胶囊吞服；也可用鲜品煨食，每次半个或一个，一周2~3次", "w": "", "ap": "脐带：补肾纳气、敛汗，用于肾虚喘咳、盗汗等", "m": "紫河车：温肾补精，益气养血", "k": "河车温肾补精血，益气养血虚劳切。"}, {"id": 369, "ch": "补虚药", "sec": "补血药", "n": "当归", "f": "补血，活血，调经，止痛，润肠", "a": "1.心肝血虚，面色萎黄，眩晕心悸等（补血要药）；2.血虚或血虚而兼有瘀滞的月经不调、痛经、经闭等症（妇科调经要药）；3.血虚、血滞而兼有寒凝，以及跌打损伤、风湿痹阻的疼痛证；4.痈疽疮疡；5.血虚肠燥便秘；此外还能治久咳气喘", "d": "煎服5~15g", "sp": "一般生用，为加强活血则酒炒用；补血用当归身，破血用当归尾，和血（补血活血）用全当归", "w": "湿盛中满、大便泄泻者忌服", "ap": "", "m": "当归：补血，活血，调经，止痛，润肠，补血圣药", "k": "当归补血活血强，调经止痛润肠通。"}, {"id": 370, "ch": "补虚药", "sec": "补血药", "n": "熟地黄", "f": "补血滋阴，益精填髓", "a": "1.血虚萎黄，眩晕，心悸失眠，月经不调，崩漏等症（补血要药）；2.肾阴不足的潮热骨蒸、盗汗、遗精、消渴等（滋阴主药）；3.肝肾精血亏虚的腰膝酸软、眩晕耳鸣、须发早白等", "d": "煎服10~30g", "sp": "", "w": "性质粘腻，有碍消化，凡气滞痰多、脘腹胀痛、食少便溏者忌服", "ap": "", "m": "熟地：补血滋阴，益精填髓", "k": "熟地补血滋阴髓，益精填髓肾精培。"}, {"id": 371, "ch": "补虚药", "sec": "补血药", "n": "白芍", "f": "养血调经，平肝止痛，敛阴止汗", "a": "1.血虚或阴虚有热的月经不调、崩漏等证；2.肝阴不足、肝气不舒或肝阳偏亢的头痛、眩晕、胁肋疼痛、脘腹四肢拘挛作痛等；3.阴虚盗汗，及营卫不和的表虚自汗证", "d": "煎服10~15g；大量15~30g", "sp": "欲其平肝、敛阴多生用；用以养血调经多炒用或酒炒用", "w": "反藜芦", "ap": "", "m": "白芍：养血调经，平肝止痛，敛阴止汗，反藜芦", "k": "白芍养血调经好，平肝止痛敛汗妙。"}, {"id": 372, "ch": "补虚药", "sec": "补血药", "n": "何首乌", "f": "制首乌：补益精血，固肾乌须；生首乌：截疟解毒，润肠通便", "a": "1.血虚而见头昏目眩、心悸失眠、萎黄乏力，肝肾精血亏虚的眩晕耳鸣、腰膝酸软、遗精崩带、须发早白等（制首乌）；2.体虚久疟，肠燥便秘及痈疽、瘰疬等证（生首乌）", "d": "煎服10~30g", "sp": "补益精血宜用制首乌；截疟、润肠、解毒宜用生首乌", "w": "", "ap": "", "m": "首乌：制则补，生则截疟解毒润肠", "k": "首乌制熟补精血，生用截疟润肠解。"}, {"id": 373, "ch": "补虚药", "sec": "补血药", "n": "阿胶", "f": "补血，止血，滋阴润燥", "a": "1.血虚萎黄，眩晕，心悸等（补血佳品）；2.多种出血证（出血而兼见阴虚、血虚证者尤为适宜）；3.阴虚证及燥证（燥咳、热病伤阴心烦不眠、虚风内动）", "d": "入汤剂5~15g", "sp": "烊化兑服；止血常用阿胶珠，可以同煎", "w": "性滋腻，有碍消化，胃弱便溏者慎用", "ap": "", "m": "阿胶：补血，止血，滋阴润燥，烊化", "k": "阿胶补血止血好，滋阴润燥烊化妙。"}, {"id": 374, "ch": "补虚药", "sec": "补血药", "n": "龙眼肉", "f": "补益心脾，养血安神", "a": "心脾虚损、气血不足的心悸、失眠、健忘等", "d": "煎汤10~15g；大量30~60g", "sp": "", "w": "", "ap": "", "m": "龙眼肉：补益心脾，养血安神", "k": "龙眼补益心脾血，养血安神心悸悦。"}, {"id": 375, "ch": "补虚药", "sec": "补阴药", "n": "北沙参", "f": "养阴清肺，益胃生津", "a": "1.肺阴虚的肺热燥咳、干咳少痰，或劳嗽久咳、咽干音哑等；2.胃阴虚或热伤胃阴、津液不足的口渴咽干、舌质红绛等", "d": "煎服10~15g", "sp": "", "w": "", "ap": "", "m": "北沙参：养阴清肺，益胃生津，反藜芦", "k": "北沙养阴清肺燥，益胃生津反藜要。"}, {"id": 376, "ch": "补虚药", "sec": "补阴药", "n": "南沙参", "f": "养阴清肺，化痰，益气", "a": "1.肺阴虚的燥热咳嗽（兼能化痰）；2.热病后气津不足或脾胃虚弱（口干舌燥、食少不饥）", "d": "煎服10~15g", "sp": "", "w": "反藜芦", "ap": "", "m": "南沙参：养阴清肺，化痰，益气", "k": "南沙养阴清肺燥，化痰益气功亦好。"}, {"id": 377, "ch": "补虚药", "sec": "补阴药", "n": "百合", "f": "养阴润肺止咳，清心安神", "a": "1.肺阴虚的燥热咳嗽及劳嗽久咳、痰中带血；2.热病余热未清的虚烦惊悸、失眠多梦等（百合病）", "d": "煎服10~30g", "sp": "清心宜生用，润肺蜜炙用", "w": "", "ap": "", "m": "百合：养阴润肺止咳，清心安神", "k": "百合养阴润肺咳，清心安神可相合。"}, {"id": 378, "ch": "补虚药", "sec": "补阴药", "n": "麦冬", "f": "养阴润肺，益胃生津，清心除烦", "a": "1.肺阴不足而有燥热的干咳痰粘、劳热咳嗽等；2.胃阴虚或热伤胃阴，口渴咽干，大便燥结等；3.心阴虚及温病热邪扰及心营，心烦不眠，舌绛而干等", "d": "煎服10~15g", "sp": "", "w": "", "ap": "", "m": "麦冬：养阴润肺，益胃生津，清心除烦", "k": "麦冬养阴润肺燥，益胃生津清心好。"}, {"id": 379, "ch": "补虚药", "sec": "补阴药", "n": "天冬", "f": "养阴润燥，清火，生津", "a": "1.阴虚肺热的燥咳或劳嗽咳血；2.肾阴不足、阴虚火旺的潮热盗汗、遗精、内热消渴、肠燥便秘等症", "d": "煎服10~15g", "sp": "", "w": "", "ap": "", "m": "天冬：养阴润燥，清火，生津", "k": "天冬养阴润燥津，清火生津肺肾亲。"}, {"id": 380, "ch": "补虚药", "sec": "补阴药", "n": "石斛", "f": "养阴清热，益胃生津", "a": "1.热病伤津，低热烦渴，舌红少苔；2.胃阴不足，口渴咽干，食少呕逆，胃脘嘈杂隐痛；此外能明目、强腰膝", "d": "煎服10~15g；鲜用15~30g", "sp": "鲜品清热生津之力较强", "w": "", "ap": "", "m": "石斛：养阴清热，益胃生津，鲜品清热生津强", "k": "石斛养阴清热津，益胃生津胃阴亲。"}, {"id": 381, "ch": "补虚药", "sec": "补阴药", "n": "玉竹", "f": "养阴润燥，生津止渴", "a": "1.阴虚肺燥的干咳少痰；2.热病伤津，烦热口渴及消渴；此外可用于阴虚外感", "d": "煎服10~15g", "sp": "", "w": "", "ap": "", "m": "玉竹：养阴润燥，生津止渴", "k": "玉竹养阴润燥津，生津止渴肺胃亲。"}, {"id": 382, "ch": "补虚药", "sec": "补阴药", "n": "黄精", "f": "滋肾润肺，补脾益气", "a": "1.阴虚肺燥，干咳少痰，及肺肾阴虚的劳嗽久咳；2.肾虚精亏的头晕、腰膝酸软、须发早白及消渴；3.脾胃虚弱（脾气虚或胃阴虚）", "d": "煎服10~30g", "sp": "", "w": "", "ap": "", "m": "黄精：滋肾润肺，补脾益气", "k": "黄精滋肾润肺燥，补脾益气功不少。"}, {"id": 383, "ch": "补虚药", "sec": "补阴药", "n": "枸杞子", "f": "补肝肾，明目", "a": "肝肾不足的腰酸遗精，头晕目眩，视力减退，内障目昏，消渴等；此外能润肺，治阴虚劳嗽", "d": "煎服10~15g", "sp": "", "w": "", "ap": "", "m": "枸杞子：补肝肾，明目", "k": "枸杞补肝肾明目，两效简单易记牢。"}, {"id": 384, "ch": "补虚药", "sec": "补阴药", "n": "墨旱莲", "f": "补肝肾阴，凉血止血", "a": "1.肝肾阴虚的头晕目眩、须发早白；2.阴虚血热的吐血、衄血、尿血、便血、崩漏；此外外用治外伤出血", "d": "内服10~15g；外用适量", "sp": "", "w": "", "ap": "", "m": "旱莲草：补肝肾阴，凉血止血", "k": "旱莲补肝肾阴好，凉血止血功不少。"}, {"id": 385, "ch": "补虚药", "sec": "补阴药", "n": "女贞子", "f": "补肝肾阴，乌须明目", "a": "肝肾阴虚的目暗不明、视力减退、须发早白、腰酸耳鸣及阴虚发热等", "d": "煎服10~15g", "sp": "", "w": "", "ap": "", "m": "女贞子：补肝肾阴，乌须明目；二至丸", "k": "女贞补肝肾阴强，乌须明目二至方。"}, {"id": 386, "ch": "补虚药", "sec": "补阴药", "n": "桑椹", "f": "滋阴补血，生津，润肠", "a": "1.阴血亏虚的眩晕、目暗、耳鸣、失眠、须发早白；2.津伤口渴，消渴；3.肠燥便秘", "d": "煎服10~15g", "sp": "", "w": "", "ap": "", "m": "桑椹：滋阴补血，生津，润肠", "k": "桑椹滋阴补血津，生津润肠功效纯。"}, {"id": 387, "ch": "补虚药", "sec": "补阴药", "n": "黑芝麻", "f": "补肝肾，益精血，润肠燥", "a": "1.肝肾不足、精血亏虚的头晕眼花、须发早白；2.肠燥便秘", "d": "煎服10~30g", "sp": "或炒熟入丸、膏剂", "w": "", "ap": "", "m": "黑芝麻：补肝肾，益精血，润肠燥", "k": "芝麻补肝肾益精，润肠燥兮血亦生。"}, {"id": 388, "ch": "补虚药", "sec": "补阴药", "n": "龟甲", "f": "滋阴潜阳，益肾健骨，固经止血，养血补心", "a": "1.阴虚阳亢，阴虚内热，虚风内动；2.肾虚骨痿，小儿囟门不合；3.阴虚血热、冲任不固的崩漏、月经过多；4.心虚惊悸，失眠，健忘", "d": "入汤剂15~30g", "sp": "宜先煎", "w": "", "ap": "", "m": "龟甲：滋阴潜阳，益肾健骨，固经止血，养血补心，先煎", "k": "龟甲滋阴潜阳先，益肾健骨固经安。"}, {"id": 389, "ch": "补虚药", "sec": "补阴药", "n": "鳖甲", "f": "滋阴潜阳，软坚散结", "a": "1.阴虚发热，阴虚阳亢，阴虚风动等证；2.久疟、疟母，癥瘕积聚，经闭", "d": "入汤剂15~30g", "sp": "宜先煎", "w": "", "ap": "", "m": "鳖甲：滋阴潜阳，软坚散结，先煎", "k": "鳖甲滋阴潜阳先，软坚散结癥瘕痊。"}, {"id": 390, "ch": "收涩药", "sec": "固表止汗药", "n": "麻黄根", "f": "止汗", "a": "自汗，盗汗（内服、外扑均可）", "d": "煎服3~9g；外用适量", "sp": "外用研粉扑身", "w": "有表邪者忌用", "ap": "", "m": "麻黄根：止汗，与麻黄相反", "k": "麻黄根专止汗出，与麻相反记清楚。"}, {"id": 391, "ch": "收涩药", "sec": "固表止汗药", "n": "浮小麦", "f": "敛汗，益气，除热", "a": "1.自汗，盗汗；2.骨蒸劳热", "d": "煎服15~30g；研末服3~5g", "sp": "", "w": "表邪汗出者忌用", "ap": "小麦：养心除烦，用于心神不宁、烦躁失眠及妇人脏躁证，煎服30~60g", "m": "浮小麦：敛汗，益气，除热", "k": "浮麦敛汗益气热，除热止汗功效切。"}, {"id": 392, "ch": "收涩药", "sec": "固表止汗药", "n": "糯稻根须", "f": "止虚汗，退虚热", "a": "1.自汗，盗汗；2.虚热不退，骨蒸潮热", "d": "内服煎汤15~30g", "sp": "", "w": "", "ap": "", "m": "糯稻根须：止虚汗，退虚热", "k": "糯稻根须止虚汗，退虚热功可相伴。"}, {"id": 393, "ch": "收涩药", "sec": "敛肺涩肠药", "n": "五味子", "f": "敛肺滋肾，生津敛汗，涩精止泻，宁心安神", "a": "1.久咳虚喘；2.津伤口渴，消渴；3.自汗，盗汗；4.遗精，滑精；5.久泻不止；6.心悸，失眠，多梦", "d": "煎服3~6g；研末服，每次1~3g", "sp": "", "w": "凡表邪未解、内有实热、咳嗽初起、麻疹初期，均不宜用", "ap": "", "m": "五味子：敛肺滋肾，生津敛汗，涩精止泻，宁心安神", "k": "五味敛肺滋肾津，涩精止泻宁心神。"}, {"id": 394, "ch": "收涩药", "sec": "敛肺涩肠药", "n": "乌梅", "f": "敛肺止咳，涩肠止泻，安蛔止痛，生津止渴", "a": "1.肺虚久咳；2.久泻，久痢；3.蛔厥腹痛，呕吐；4.虚热消渴；此外炒炭能止血，治崩漏下血、便血；外敷能消疮毒，治胬肉外突", "d": "煎服3~10g；大剂量可用至30g；外用适量", "sp": "止泻止血宜炒炭用；外用捣烂或炒炭研末外敷", "w": "外有表邪或内有实热积滞者均不宜服", "ap": "", "m": "乌梅：敛肺，涩肠，安蛔，生津", "k": "乌梅敛肺涩肠泻，安蛔止痛生津借。"}, {"id": 395, "ch": "收涩药", "sec": "敛肺涩肠药", "n": "五倍子", "f": "敛肺降火，涩肠止泻，固精止遗，敛汗止血", "a": "1.肺虚久咳，肺热痰嗽；2.久泻，久痢；3.遗精，滑精；4.自汗，盗汗；5.崩漏下血，便血，尿血；此外外用治湿疮、疮疖肿毒、脱肛、子宫脱垂等", "d": "煎服3~9g；入丸散服，每次1~1.5g；外用适量", "sp": "外用研末外敷或煎汤熏洗", "w": "湿热泻痢者忌用", "ap": "", "m": "五倍子：敛肺降火，涩肠，固精，敛汗止血", "k": "五倍敛肺降火清，涩肠固精敛汗灵。"}, {"id": 396, "ch": "收涩药", "sec": "敛肺涩肠药", "n": "罂粟壳", "f": "涩肠止泻，敛肺止咳，止痛", "a": "1.久泻，久痢；2.肺虚久咳；3.胃痛，腹痛，筋骨疼痛", "d": "煎服3~6g", "sp": "止咳蜜炙用，止泻止痛醋炒用", "w": "易成瘾，不宜常用；咳嗽、泻痢初起邪实者忌用", "ap": "", "m": "罂粟壳：涩肠止泻，敛肺止咳，止痛，易成瘾", "k": "罂粟涩肠止泻久，敛肺止痛成瘾忧。"}, {"id": 397, "ch": "收涩药", "sec": "敛肺涩肠药", "n": "诃子", "f": "涩肠止泻，敛肺止咳，利咽开音", "a": "1.久泻，久痢，脱肛；2.肺虚喘咳，久嗽失音", "d": "煎服3~10g", "sp": "涩肠止泻宜煨用，敛肺清热、利咽开音宜生用", "w": "凡外有表邪、内有湿热积滞者忌用", "ap": "", "m": "诃子：涩肠，敛肺，利咽开音", "k": "诃子涩肠敛肺咳，利咽开音失音和。"}, {"id": 398, "ch": "收涩药", "sec": "敛肺涩肠药", "n": "石榴皮", "f": "涩肠止泻，杀虫，止血", "a": "1.久泻，久痢，脱肛；2.虫积腹痛；3.崩漏，便血；此外可治遗精、带下", "d": "煎服3~10g", "sp": "入汤剂生用，入丸散多炒用，止血多炒炭用", "w": "", "ap": "", "m": "石榴皮：涩肠止泻，杀虫，止血", "k": "石榴涩肠止泻痢，杀虫止血虫积治。"}, {"id": 399, "ch": "收涩药", "sec": "敛肺涩肠药", "n": "肉豆蔻", "f": "涩肠止泻，温中行气", "a": "1.久泻不止（脾胃虚寒者宜）；2.胃寒胀痛，食少呕吐", "d": "煎服3~9g；入丸散服，每次0.5~1g", "sp": "内服须煨熟去油用", "w": "湿热泻痢者忌用", "ap": "", "m": "肉豆蔻：涩肠止泻，温中行气", "k": "豆蔻涩肠止泻久，温中行气暖脾胃。"}, {"id": 400, "ch": "收涩药", "sec": "敛肺涩肠药", "n": "赤石脂", "f": "涩肠止泻，收敛止血，敛疮生肌", "a": "1.久泻，久痢；2.崩漏，便血；3.疮疡久溃不敛，湿疮流水，外伤出血（外用）", "d": "煎服10~20g；外用适量", "sp": "外用研细末撒患处或调敷", "w": "湿热积滞泻痢者忌服；孕妇慎用；畏官桂", "ap": "", "m": "赤石脂：涩肠止泻，收敛止血，敛疮生肌，畏肉桂", "k": "赤脂涩肠止泻佳，止血敛疮畏肉桂。"}, {"id": 401, "ch": "收涩药", "sec": "敛肺涩肠药", "n": "禹余粮", "f": "涩肠止泻，收敛止血，止带", "a": "1.久泻，久痢；2.崩漏，便血；3.带下", "d": "煎汤10~20g", "sp": "", "w": "孕妇慎用", "ap": "", "m": "禹余粮：涩肠止泻，收敛止血，止带", "k": "余粮涩肠止泻血，收敛止血带下却。"}, {"id": 402, "ch": "收涩药", "sec": "固精缩尿止带药", "n": "山茱萸", "f": "补益肝肾，收敛固涩", "a": "1.肝肾亏虚的头晕目眩、腰膝酸软、阳痿等；2.遗精滑精，遗尿尿频；3.崩漏下血，月经过多；4.大汗不止，体虚欲脱；此外治消渴", "d": "煎服5~10g；急救固脱20~30g", "sp": "急救固脱须大剂量", "w": "素有湿热、小便淋涩者不宜应用", "ap": "", "m": "山茱萸：补益肝肾，收敛固涩，固精止汗", "k": "山萸补益肝肾阴，收敛固涩汗精尿。"}, {"id": 403, "ch": "收涩药", "sec": "固精缩尿止带药", "n": "覆盆子", "f": "益肾，固精，缩尿", "a": "1.遗精滑精，遗尿尿频；2.阳痿，不孕；此外治肝肾不足，目暗不明", "d": "煎服5~10g", "sp": "", "w": "", "ap": "", "m": "覆盆子：益肾，固精，缩尿", "k": "覆盆益肾固精尿，缩尿功效平和好。"}, {"id": 404, "ch": "收涩药", "sec": "固精缩尿止带药", "n": "桑螵蛸", "f": "固精缩尿，补肾助阳", "a": "1.遗精滑精，遗尿尿频，白浊；2.阳痿", "d": "煎服6~10g", "sp": "", "w": "助阳固涩，故阴虚多火、膀胱有热而小便频数者忌用", "ap": "", "m": "桑螵蛸：固精缩尿，补肾助阳", "k": "桑螵固精缩尿安，补肾助阳遗尿痊。"}, {"id": 405, "ch": "收涩药", "sec": "固精缩尿止带药", "n": "海螵蛸", "f": "固精止带，收敛止血，制酸止痛，收湿敛疮", "a": "1.遗精，带下；2.崩漏下血，肺胃出血，创伤出血；3.胃痛吐酸；4.湿疮，湿疹，溃疡不敛（外用）", "d": "煎服6~12g，散剂酌减；外用适量", "sp": "", "w": "", "ap": "", "m": "海螵蛸：固精止带，收敛止血，制酸止痛，收湿敛疮", "k": "海螵固精止带血，制酸止痛收湿贴。"}, {"id": 406, "ch": "收涩药", "sec": "固精缩尿止带药", "n": "金樱子", "f": "固精缩尿，涩肠止泻", "a": "1.遗精滑精，遗尿尿频，带下；2.久泻，久痢；此外治脱肛、子宫脱垂、崩漏", "d": "煎服6~12g", "sp": "", "w": "", "ap": "", "m": "金樱子：固精缩尿，涩肠止泻", "k": "金樱固精缩尿遗，涩肠止泻久泻宜。"}, {"id": 407, "ch": "收涩药", "sec": "固精缩尿止带药", "n": "莲子", "f": "益肾固精，补脾止泻，止带，养心", "a": "1.遗精，滑精；2.脾虚久泻，食欲不振；3.带下；4.虚烦，心悸，失眠", "d": "煎服10~15g", "sp": "去心打碎用", "w": "", "ap": "莲须：固肾涩精，主治遗精、滑精、带下、尿频，1.5~5g。莲房：止血化瘀，主治崩漏、尿血、痔疮出血、产后瘀阻、恶露不尽，炒炭用，5~10g。莲子心：清心安神、交通心肾、涩精止血，主治热入心包神昏谵语、心肾不交失眠遗精、血热吐血。荷叶：清暑利湿、升阳止血，主治暑热病证、脾虚泄泻及多种出血证。荷梗：通气宽胸、和胃安胎，主治外感暑湿胸闷不畅、妊娠呕吐、胎动不安", "m": "莲子：益肾固精，补脾止泻，止带，养心", "k": "莲子益肾固精气，补脾止泻养心悸。"}, {"id": 408, "ch": "收涩药", "sec": "固精缩尿止带药", "n": "芡实", "f": "益肾固精，健脾止泻，除湿止带", "a": "1.遗精，滑精；2.脾虚久泻；3.带下", "d": "煎服10~15g", "sp": "", "w": "", "ap": "", "m": "芡实：益肾固精，健脾止泻，除湿止带", "k": "芡实益肾固精止，健脾止泻带下治。"}, {"id": 409, "ch": "涌吐药", "sec": "涌吐药", "n": "常山", "f": "涌吐痰涎，截疟", "a": "1.胸中痰饮；2.疟疾（治疟要药）", "d": "煎服4.5~9g；入丸散酌减", "sp": "涌吐可生用，截疟宜酒制用；治疗疟疾宜在寒热发作前半天或2小时服用", "w": "因能催吐，用量不宜过大；体虚及孕妇不宜用", "ap": "", "m": "常山：涌吐痰涎，截疟，有毒", "k": "常山涌吐痰涎病，截疟有毒要慎用。"}, {"id": 410, "ch": "涌吐药", "sec": "涌吐药", "n": "瓜蒂", "f": "涌吐痰食，祛湿退黄", "a": "1.痰热郁于胸中及宿食停滞于胃所致的多种病证；2.湿热黄疸（研末吹鼻，令鼻中黄水流出）", "d": "煎服2.5~5g；入丸散服，每次0.3~1g；外用适量", "sp": "外用研末㗜鼻，待鼻中流出黄水即停药", "w": "体虚、吐血、咯血及上部无实邪者忌服；若剧烈呕吐不止，用麝香0.01~0.015g开水冲服以解之", "ap": "", "m": "瓜蒂：涌吐痰食，祛湿退黄", "k": "瓜蒂涌吐痰食积，祛湿退黄黄疸宜。"}, {"id": 411, "ch": "涌吐药", "sec": "涌吐药", "n": "胆矾", "f": "涌吐痰涎，解毒收湿，祛腐蚀疮", "a": "1.风痰壅塞，喉痹，癫痫，误食毒物；2.风眼赤烂，口疮，牙疳；3.胬肉，疮疡（外用）", "d": "温水化服0.3~0.6g；外用适量", "sp": "内服温水化服；外用研末撒或调敷，或以水溶化后外洗", "w": "体虚者忌服", "ap": "", "m": "胆矾：涌吐痰涎，解毒收湿", "k": "胆矾涌吐痰涎病，解毒收湿腐疮清。"}, {"id": 412, "ch": "解毒杀虫燥湿止痒药", "sec": "解毒杀虫燥湿止痒药", "n": "雄黄", "f": "解毒，杀虫", "a": "1.痈肿疔疮，湿疹疥癣，蛇虫咬伤；2.虫积腹痛；此外有燥湿祛痰、截疟作用，还可用于哮喘、疟疾、惊痫等证", "d": "外用适量；入丸散服，每次0.15~0.3g", "sp": "外用研末撒敷或香油调敷；内服只入丸散", "w": "毒性较强，内服宜慎，不可过量久服；孕妇忌用；能从皮肤吸收，外用时不宜大面积涂擦及长期持续使用；切忌火煅，烧煅后即分解为三氧化二砷（砒霜），有剧毒", "ap": "", "m": "雄黄：解毒，杀虫，有毒，不入煎剂", "k": "雄黄解毒杀虫毒，有毒不入煎剂服。"}, {"id": 413, "ch": "解毒杀虫燥湿止痒药", "sec": "解毒杀虫燥湿止痒药", "n": "硫黄", "f": "外用：解毒杀虫止痒；内服：补火助阳通便", "a": "1.疥癣，湿疹，阴疽疮疡（外用，治疥疮要药）；2.肾阳不足的寒喘、阳痿、虚寒便秘（内服）", "d": "外用适量；入丸散服1~3g", "sp": "外用研末撒敷或香油调涂；内服入丸散", "w": "孕妇忌用；畏朴硝", "ap": "", "m": "硫黄：外用解毒杀虫止痒，内服补火助阳通便", "k": "硫黄外用杀虫痒，内服补火助阳强。"}, {"id": 414, "ch": "解毒杀虫燥湿止痒药", "sec": "解毒杀虫燥湿止痒药", "n": "白矾", "f": "外用：解毒、杀虫、止痒；内服：化痰、止血、止泻", "a": "1.湿疹瘙痒，疮疡疥癣（外用）；2.吐衄下血，外伤出血；3.久泻久痢；4.风痰痫病，癫狂；此外治湿热黄疸", "d": "外用适量；入丸散服1~3g", "sp": "外用研末外敷或化水熏洗；内服入丸散", "w": "", "ap": "", "m": "白矾：外用解毒杀虫止痒，内服化痰止血止泻", "k": "白矾外用解毒痒，内服化痰止泻血。"}, {"id": 415, "ch": "解毒杀虫燥湿止痒药", "sec": "解毒杀虫燥湿止痒药", "n": "蛇床子", "f": "杀虫止痒，温肾壮阳", "a": "1.阴部湿痒，湿疹，疥癣；2.寒湿带下，湿痹腰痛；3.肾虚阳痿，宫冷不孕", "d": "外用15~30g；煎服3~10g", "sp": "外用煎汤外洗，或适量研末外掺，或制成油膏、软膏、栓剂外用", "w": "阴虚火旺或下焦有湿热者不宜内服", "ap": "", "m": "蛇床子：杀虫止痒，温肾壮阳", "k": "蛇床杀虫止痒强，温肾壮阳阴痒尝。"}, {"id": 416, "ch": "解毒杀虫燥湿止痒药", "sec": "解毒杀虫燥湿止痒药", "n": "大风子", "f": "攻毒杀虫，祛风燥湿", "a": "麻风、梅毒、疥癣等", "d": "外用适量；入丸散服，每次0.3~1g", "sp": "外用捣敷或烧煅存性研末调敷；内服只入丸散", "w": "有毒性烈，内服宜慎，不可过量或持续服用，以免中毒（头晕头痛、发热、腹痛呕吐，甚至蛋白尿及管型）；凡孕妇、体虚及肝肾功能不全者忌用", "ap": "", "m": "大风子：攻毒杀虫，祛风燥湿", "k": "风子攻毒杀虫癣，祛风燥湿麻风验。"}, {"id": 417, "ch": "解毒杀虫燥湿止痒药", "sec": "解毒杀虫燥湿止痒药", "n": "土荆皮", "f": "杀虫止痒", "a": "体癣、手足癣、头癣等各种癣病", "d": "外用适量", "sp": "只供外用，浸酒涂擦或研末醋调涂患处", "w": "有毒，只供外用，不可内服", "ap": "", "m": "土荆皮：杀虫止痒，外用", "k": "荆皮杀虫止痒癣，外用癣疾效相伴。"}, {"id": 418, "ch": "解毒杀虫燥湿止痒药", "sec": "解毒杀虫燥湿止痒药", "n": "蜂房", "f": "攻毒杀虫，祛风止痛", "a": "1.痈疽，瘰疬，癣疮；2.风湿痹痛，瘾疹瘙痒及牙痛；此外亦常用于恶性肿瘤", "d": "外用适量；煎服6~12g", "sp": "外用研末油调敷，或煎水漱、洗患处", "w": "", "ap": "", "m": "蜂房：攻毒杀虫，祛风止痛", "k": "蜂房攻毒杀虫痛，祛风止痛痈肿用。"}, {"id": 419, "ch": "解毒杀虫燥湿止痒药", "sec": "解毒杀虫燥湿止痒药", "n": "大蒜", "f": "解毒杀虫，消肿，止痢", "a": "1.痈肿疔毒，疥癣；2.痢疾，泄泻，肺痨，顿咳；3.钩虫病，蛲虫病；此外醋浸常食能健脾温胃，治脘胃冷痛、饮食不消", "d": "外用适量；内服5~10g", "sp": "外用捣烂外敷或切片外擦；内服可煎服、生食或制成糖浆服", "w": "外用易引起皮肤发红、灼热、起泡，不可敷之过久；灌肠法孕妇忌用；阴虚火旺及目疾、舌、喉、口齿诸疾均不宜服用", "ap": "", "m": "大蒜：解毒杀虫，消肿，止痢", "k": "大蒜解毒杀虫积，消肿止痢功用奇。"}, {"id": 420, "ch": "拔毒化腐生肌药", "sec": "拔毒化腐生肌药", "n": "升药", "f": "拔毒化腐", "a": "痈疽溃后，脓出不畅，或腐肉不去，新肉难生", "d": "外用适量", "sp": "不用纯品，多与煅石膏配伍研末外用", "w": "有毒，只可外用，不可内服；外用亦不可大量持续使用；拔毒化腐作用强烈，外疡腐肉已去或脓水已尽者不宜用", "ap": "", "m": "升药：拔毒化腐，外用，有毒", "k": "升药拔毒化腐剧，外用有毒要记取。"}, {"id": 421, "ch": "拔毒化腐生肌药", "sec": "拔毒化腐生肌药", "n": "轻粉", "f": "攻毒，杀虫，敛疮", "a": "疥癣，梅毒，疮疡溃烂（外用）；此外内服能逐水通便，治水肿鼓胀、二便不利", "d": "外用适量；入丸散服，每次0.1~0.2g", "sp": "外用研末调涂，或制膏外贴；内服只入丸散", "w": "有毒，以外用为主，外用亦不可过量和久用；内服宜慎用，以防中毒；服后要及时漱口，以免口腔糜烂及损伤牙齿；孕妇忌服", "ap": "", "m": "轻粉：攻毒，杀虫，敛疮", "k": "轻粉攻毒杀虫疗，敛疮外用毒性高。"}, {"id": 422, "ch": "拔毒化腐生肌药", "sec": "拔毒化腐生肌药", "n": "砒石", "f": "外用：蚀疮去腐；内服：劫痰平喘", "a": "1.癣疮，瘰疬，牙疳，痔疮，溃疡腐肉不脱；2.寒痰哮喘；此外还有截疟作用，现临床少用", "d": "外用适量；入丸散服，每次0.002~0.004g", "sp": "外用研末撒敷或入膏药中贴之；内服只入丸散", "w": "剧毒，内服宜慎用，须掌握好用法用量，不可持续服用，不能做酒剂服；孕妇忌服；外用也不宜过量，以防局部吸收中毒", "ap": "", "m": "砒石：外用蚀疮去腐，内服劫痰平喘", "k": "砒石外用蚀疮烂，内服劫痰平喘叹。"}, {"id": 423, "ch": "拔毒化腐生肌药", "sec": "拔毒化腐生肌药", "n": "铅丹", "f": "拔毒生肌，杀虫止痒", "a": "疮疡溃烂， function b64u(a){let s='';for(let i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64u(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t),a=new Uint8Array(s.length);for(let i=0;i<s.length;i++)a[i]=s.charCodeAt(i);return a}
function chk(a,n){let x=0;for(let i=0;i<n;i++)x=(x+a[i]*(i%251+1))%65536;return x}
function packBackup(S,today){
  const bits=[];const put=(v,n)=>{for(let i=n-1;i>=0;i--)bits.push(Math.floor(v/Math.pow(2,i))%2)};
  put(1,4);put(today,22);put(Math.min(S.gems||0,0xFFFFF),20);put(Math.min(S.streak.n||0,255),8);
  put(Math.min(255,Math.max(0,today-(S.streak.last||today))),8);
  let bm=0;CH.forEach((c,i)=>{if(S.badges[c])bm+=Math.pow(2,i)});put(bm,21);
  put(Math.max(0,Math.min(1023,parseDay(S.set.exam)-today+512)),10);put(Math.min(S.set.per||0,127),7);put(S.set.snd?1:0,1);put(S.set.say?1:0,1);
  H.forEach(h=>{const c=S.cards[h.id];if(c&&c.seen){put(1,1);put(Math.min(c.s,15),4);put(Math.min(c.lap||0,3),2);put(Math.max(0,Math.min(63,c.due-today)),6)}else put(0,1)});
  H.forEach(h=>put(S.wrong[h.id]?1:0,1));
  while(bits.length%8)bits.push(0);
  const n=bits.length/8,a=new Uint8Array(n+2);
  for(let i=0;i<n;i++){let v=0;for(let j=0;j<8;j++)v=v*2+bits[i*8+j];a[i]=v}
  const c=chk(a,n);a[n]=c>>8;a[n+1]=c&255;
  return 'Z1'+b64u(a);
}
function unpackBackup(code,defState){
  code=code.trim().replace(/\s+/g,'');
  if(code.slice(0,2)!=='Z1')throw new Error('fmt');
  const a=unb64u(code.slice(2)),n=a.length-2;
  if(n<10||chk(a,n)!==(a[n]<<8|a[n+1]))throw new Error('chk');
  let pos=0;const get=k=>{let v=0;for(let i=0;i<k;i++){const byte=a[pos>>3];v=v*2+((byte>>(7-(pos&7)))&1);pos++}return v};
  if(get(4)!==1)throw new Error('ver');
  const S=defState(),base=get(22);
  S.gems=get(20);S.streak.n=get(8);S.streak.last=base-get(8);
  const bm=get(21);CH.forEach((c,i)=>{if(Math.floor(bm/Math.pow(2,i))%2)S.badges[c]=1});
  S.set.exam=new Date((base+get(10)-512)*DAY).toISOString().slice(0,10);S.set.per=get(7);S.set.snd=get(1);S.set.say=get(1);
  H.forEach(h=>{if(get(1)){const s=get(4),lap=get(2),off=get(6);S.cards[h.id]={s,lap,seen:1,due:base+off,last:base}}});
  H.forEach(h=>{if(get(1))S.wrong[h.id]=1});
  return S;
}

  const g=CMP[gi],q=g.h.filter(n=>g.d[n]).map(n=>({id:HN[n].id,type:'cx',gi}));shuffle(q);
  if(g.h.length>=3)q.push({type:'mx',gi});
  startEngine({mode:'free',title:g.t,ids:g.h.map(n=>HN[n].id),q});
}
function startCmpMix(){
  const gs=shuffle(CMP.map((g,i)=>i)).slice(0,8),q=[];
  gs.forEach(gi=>{const g=CMP[gi],ns=g.h.filter(n=>g.d[n]);q.push({id:HN[ns[Math.floor(Math.random()*ns.length)]].id,type:'cx',gi})});
  gs.slice(0,2).forEach(gi=>{if(CMP[gi].h.length>=3)q.push({type:'mx',gi})});
  startEngine({mode:'free',title:'对比综合练习',ids:[],q});
}
function startFx(ri){
  const q=[];
  const rs=ri==null?shuffle(FX.map((r,i)=>i).filter(i=>FX[i].h.length>=4)).slice(0,6):[ri];
  rs.forEach(r=>{q.push({type:'fx',ri:r});q.push({type:'fx',ri:r})});
  const hs=shuffle(H.filter(h=>fxOf(h).length)).slice(0,ri==null?5:3);
  if(ri!=null){FX[ri].h.slice(0,3).forEach(n=>q.push({id:HN[n].id,type:'fx2'}))}else hs.forEach(h=>q.push({id:h.id,type:'fx2'}));
  shuffle(q);
  startEngine({mode:'free',title:ri==null?'法象综合练习':FX[ri].t,ids:[],q});
}
function startEngine(o){
  E=Object.assign({q:[],total:0,correct:0,wrong:0,combo:0,maxCombo:0,gems:0,mist:{},cur:null,picked:null,phase:'quiz',idx:0,exit:false,newBadges:[],answered:0,hist:[],look:null},o);
  E.total=E.q.length;if(E.phase==='quiz')nextQ();render();window.scrollTo(0,0);
}
function buildItem(it){
  if(it.type==='mf'||it.type==='mc')return makeMatch(it.type,it.ids);
  if(it.type==='mx')return makeMatch('mx',null,CMP[it.gi]);
  if(it.type==='cx')return makeCx(it.gi,H[it.id].n);
  if(it.type==='fx')return makeFx(it.ri);
  if(it.type==='fx2')return makeFx2(it.id);
  return makeQuestion(H[it.id],it.type);
}
function nextQ(){
  while(E.q.length){
    const c=buildItem(E.q[0]);
    if(c){E.cur=c;E.picked=null;E.look=null;return}
    E.q.shift();E.total--;
  }
  E.cur=null;E.phase='end';finishEngine();
}
function gainGems(n){E.gems+=n;S.gems+=n;bumpGem=true;setTimeout(()=>{bumpGem=false},500)}
function pick(i){
  if(E.picked!=null||E.cur.kind!=='mcq')return;
  const q=E.cur,ok=i===q.ans,it=E.q.shift();E.picked=i;E.answered++;lg().qn++;beep(ok);
  E.hist.push({kind:'q',q,picked:i});
  if(ok){E.correct++;E.combo++;E.maxCombo=Math.max(E.maxCombo,E.combo);lg().qc++;gainGems(1+(E.combo%5===0?1:0));E.fresh=E.combo%5===0;autoSay(H[q.id])}
  else{
    E.combo=0;E.wrong++;E.mist[q.id]=1;S.wrong[q.id]=(S.wrong[q.id]||0)+1;
    const again=(it.type==='cx'||it.type==='fx'||it.type==='fx2')?it:{id:it.id,type:randType(H[it.id],it.type)};
    E.q.push(again);E.total++;
    if(E.mode==='free'&&seen(q.id)){const c=S.cards[q.id];c.s=0;c.lap=(c.lap||0)+1;c.due=today()}
    autoSay(H[q.id]);
  }
  save();render();
}
function mClick(side,pi){
  const m=E.cur;if(!m||m.kind!=='match'||m.finished)return;
  if(m.done[pi]){if(side==='l'){dex=m.pairs[pi].id;render()}return}
  if(!m.sel||m.sel.s===side){m.sel={s:side,p:pi};render();return}
  const left=side==='l'?pi:m.sel.p,right=side==='r'?pi:m.sel.p;
  if(left===right){m.done[left]=1;m.sel=null;beep(true);E.combo++;E.maxCombo=Math.max(E.maxCombo,E.combo);gainGems(1);autoSay(H[m.pairs[left].id])}
  else{
    m.wrongN++;const pid=m.pairs[left].id;m.wrongIds[pid]=1;E.mist[pid]=1;S.wrong[pid]=(S.wrong[pid]||0)+1;E.wrong++;E.combo=0;beep(false);
    m.flash={l:left,r:right};m.sel=null;setTimeout(()=>{m.flash=null;render()},500);
  }
  if(m.pairs.every((p,i)=>m.done[i])){
    m.finished=true;E.q.shift();E.correct++;E.answered++;lg().qn++;if(!m.wrongN)lg().qc++;gainGems(m.wrongN?0:2);E.hist.push({kind:'m',m});
  }
  save();render();
}
function finishEngine(){
  const t=today(),ex=examDay();
  if(E.mode==='learn'){
    E.ids.forEach(id=>{const mist=E.mist[id];S.cards[id]={s:mist?0:1,lap:mist?1:0,seen:1,first:t,last:t,due:mist?Math.min(t+1,Math.max(t+1,ex-1)):nextDue(1,t,ex)};lg().new++});
    gainGems(5+(E.wrong===0?5:0));
    CH.forEach(ch=>{if(!S.badges[ch]&&H.filter(h=>h.ch===ch).every(h=>seen(h.id))){S.badges[ch]=1;E.newBadges.push(ch);gainGems(20)}});
  }else if(E.mode==='rev'){
    E.ids.forEach(id=>{const c=S.cards[id];if(!c)return;S.cards[id]=E.mist[id]?applyGrade(c,0,t,ex):applyGrade(c,2,t,ex);lg().rev++});
    gainGems(3+(E.wrong===0?3:0));
  }else gainGems(E.wrong===0?2:0);
  if(E.correct>0){if(S.streak.last!==t){S.streak.n=S.streak.last===t-1?S.streak.n+1:1;S.streak.last=t}}
  save();
}

  if(scope==='wrong')return H.filter(h=>S.wrong[h.id]);

      h+=`<button class="sm" data-act="fxclose">← 返回列表</button><div class="card"><b style="font-size:19px">${esc(r.t)}</b><div class="sec"><div>${esc(r.e)}</div></div><div class="sec"><b>例药（点开看卡片）</b><div>${r.h.map(n=>`<span class="chip btn" data-act="dex" data-v="${HN[n].id}">${esc(n)}</span>`).join('')}</div></div>${r.n?`<div class="mn">${esc(r.n)}</div>`:''}</div>${r.h.length>=4?`<button class="p big" data-act="fxq" data-v="${fxOpen}">🎯 练习这一条</button>`:''}`;
    }else{
      h+=`<div class="card mute">法象药理：用药物的形、色、味、质地、生长部位来联想它的功效。这是传统的取象比类记忆法，用来帮助记忆，<b>考试仍以课本功效为准</b>，也有不少例外。</div><button class="p big" data-act="fxmix">🎲 法象综合练习</button>`;
      h+=FX.map((r,i)=>`<div class="li" data-act="fxopen" data-v="${i}"><b>${esc(r.t)}</b><span class="mute">${r.h.length}味 ›</span></div>`).join('');
    }
  }
  return h;
}

// ================= 图鉴 =================
function tile(id,pop){
  const h=H[id],on=seen(id),st=stageOf(id);
  return `<div class="tile ${on?'':'lock'} ${pop?'pop':''}" data-act="dex" data-v="${id}" style="background:hsl(${hue(h.ch)} 55% ${on?'90%':'80%'});color:#27312b;${st===3?'border-color:#f0c04d;border-width:3px':''}"><small>${on?emo(h.ch):'❔'}</small>${esc(h.n.length>4?h.n.slice(0,4)+'…':h.n)}</div>`;
}
function vDex(){
  const t=today(),n=seenN(),cnt=[0,0,0,0];H.forEach(x=>cnt[stageOf(x.id)]++);
  let h=`<div class="card" style="text-align:center"><div class="mute">称号</div><b style="font-size:24px">${title(n)}</b><div class="mute">已收集 ${n} / ${H.length} 味</div><div class="bar" style="margin-top:8px">${cnt.map((k,i)=>`<i class="b${i}" style="width:${k/H.length*100}%"></i>`).join('')}</div><div class="leg"><span><i class="b0"></i>未学 ${cnt[0]}</span><span><i class="b1"></i>学习中 ${cnt[1]}</span><span><i class="b2"></i>较熟 ${cnt[2]}</span><span><i class="b3"></i>已掌握 ${cnt[3]}</span></div></div>`;
  const days=new Array(14).fill(0);for(const id in S.cards){const c=S.cards[id];if(!c.seen)continue;const d=Math.max(0,c.due-t);if(d<14)days[d]++}
  const mx=Math.max(1,...days);
  h+=`<div class="card"><b>未来 14 天复习量</b><div class="cal">${days.map((k,i)=>`<div><span>${k||''}</span><i style="height:${k/mx*58}px"></i>${i===0?'今':fmtDay(t+i).slice(3)}</div>`).join('')}</div></div>`;
  h+=`<div class="card"><b>章节徽章</b><div style="font-size:26px;margin-top:6px;line-height:1.6">${CH.map(c=>`<span title="${esc(c)}" style="${S.badges[c]?'':'filter:grayscale(1);opacity:.35'}">${emo(c)}</span>`).join(' ')}</div><div class="mute">学完一整章可获得徽章 +20💎</div></div>`;
  const q=search.trim();
  const hs=H.filter(x=>(!fch||x.ch===fch)&&(!q||x.n.indexOf(q)>=0||x.f.indexOf(q)>=0));
  h+=`<h2>药典图鉴</h2><div class="row"><input id="sch" placeholder="搜药名 / 功效…" value="${esc(search)}" style="flex:1;min-width:140px"><select data-act="fch"><option value="">全部章节</option>${CH.map(c=>`<option ${fch===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="mute" style="margin:8px 0">点任意一味药可查看详情；灰色是还没学的。</div><div class="tiles">${hs.slice(0,120).map(x=>tile(x.id)).join('')}</div>${hs.length>120?'<div class="mute">仅显示前 120 个，请缩小范围。</div>':''}`;
  return h;
}

// ================= 设置 =================
function vSet(){
  const wn=Object.keys(S.wrong).length;
  return `<div class="card"><b>考试日期</b><br><input type="date" id="exam" value="${esc(S.set.exam)}"><div class="mute" style="margin-top:6px">改日期后，每天新学数量和复习间隔会自动重算。</div></div>
  <div class="card"><b>每天新学数量</b><br><input type="number" id="per" min="0" max="100" value="${S.set.per||''}" placeholder="自动：${perDay()}" style="width:120px"><div class="mute" style="margin-top:6px">留空 = 按剩余天数自动分配。</div></div>
  <div class="card"><b>声音</b><div class="row" style="margin-top:6px"><div>答题音效<br><select data-act="snd"><option value="1" ${S.set.snd?'selected':''}>开</option><option value="0" ${S.set.snd?'':'selected'}>关</option></select></div><div>自动朗读<br><select data-act="autosay"><option value="0" ${S.set.say?'':'selected'}>关</option><option value="1" ${S.set.say?'selected':''}>开（答题后读药名+功效+口诀）</option></select></div><div>语速<br><select data-act="rate">${[[0.7,'慢'],[0.9,'正常'],[1.1,'快']].map(r=>`<option value="${r[0]}" ${S.set.rate===r[0]?'selected':''}>${r[1]}</option>`).join('')}</select></div></div><div class="mute" style="margin-top:6px">朗读用的是手机/电脑自带的中文语音，没有声音时请检查系统是否安装中文语音。每张药卡上也有 🔊 按钮。</div></div>
  <div class="card"><b>备份 / 恢复进度</b><div class="mute">进度只保存在这个浏览器里。换设备或清理浏览器前，请先备份。备份码已经压缩，通常只有几百个字符。</div><textarea id="bk" placeholder="备份码显示在这里；恢复时把备份码粘贴到这里"></textarea><div class="row" style="margin-top:8px"><button class="sm" data-act="bexp">生成备份码</button><button class="sm" data-act="bimp">导入备份码</button></div><div class="row" style="margin-top:8px"><button class="sm" data-act="bfile">⬇ 下载备份文件</button><label class="sm" style="border:2px solid var(--line);border-bottom-width:3px;border-radius:10px;padding:5px 12px;cursor:pointer;font-size:14px">⬆ 导入备份文件<input type="file" id="bfi" accept=".json,.txt" style="display:none"></label></div>${backupMsg?`<div class="mute" style="margin-top:6px">${esc(backupMsg)}</div>`:''}</div>
  <div class="card"><b>错题本</b><div class="mute">目前 ${wn} 味。</div>${wn?'<button class="sm" data-act="wclear" style="margin-top:6px">清空错题本</button>':''}</div>
  <div class="card"><b>重置全部进度</b><br>${confirmReset?'<span class="mute">确定要清空吗？无法恢复。</span><br><button class="sm bad" data-act="reset2">确定清空</button> <button class="sm" data-act="reset0">取消</button>':'<button class="sm bad" data-act="reset1" style="margin-top:6px">重置</button>'}</div>
  <div class="mute" style="margin-top:10px">口诀、助记、对比、法象由 AI 辅助编写，用于联想记忆，请以课本为准。</div>`;
}

function render(){
  const root=document.getElementById('root');
  let v;
  if(LM&&tab==='prac'&&!E)v=vListen();
  else if(E)v=vEngine();
  else v=statsBar()+(tab==='learn'?vLearn():tab==='prac'?vPrac():tab==='cmp'?vCmp():tab==='dex'?vDex():vSet())+tabsBar();
  if(dex!=null)v+=`<div class="mask" data-act="dexc"><div class="box"><button class="sm" data-act="dexc" style="float:right">关闭</button>${detail(H[dex])}</div></div>`;
  if(toast)v+=`<div class="toast">${esc(toast)}</div>`;
  root.innerHTML=v;
  const s=document.getElementById('sch');
  if(s)s.addEventListener('input',e=>{search=e.target.value;const p=e.target.selectionStart;render();const n=document.getElementById('sch');n.focus();n.setSelectionRange(p,p)});
  const ex=document.getElementById('exam');if(ex)ex.addEventListener('change',e=>{if(e.target.value){S.set.exam=e.target.value;save();render()}});
  const pr=document.getElementById('per');if(pr)pr.addEventListener('change',e=>{S.set.per=Math.max(0,Math.min(100,parseInt(e.target.value)||0));save();render()});
  const bf=document.getElementById('bfi');if(bf)bf.addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importCode(String(r.result));r.readAsText(f)});
  drawLines();
}
function importCode(t){
  t=t.trim();
  try{
    if(t.slice(0,2)==='Z1'||/^\s*Z1/.test(t)){const o=unpackBackup(t,defState);mergeState(o);}
    else{const o=JSON.parse(decodeURIComponent(escape(atob(t.replace(/\s+/g,'')))));if(!o||!o.cards)throw 0;mergeState(o)}
    save();backupMsg='导入成功！';
  }catch(e){
    try{const o=JSON.parse(t);if(!o||!o.cards)throw 0;mergeState(o);save();backupMsg='导入成功！'}catch(e2){backupMsg='备份码无效，请检查是否完整粘贴。'}
  }
  render();
}

// ================= 交互 =================
function act(a,v,el){
  if(a==='tab'){tab=v;E=null;render();window.scrollTo(0,0)}
  else if(a==='ch'){openCh=openCh===v?'':v;render()}
  else if(a==='lesson')startLesson(v);
  else if(a==='rev')startReview();
  else if(a==='inext'||a==='iprev'){if(a==='iprev')E.idx=Math.max(0,E.idx-1);else if(E.idx+1<E.ids.length)E.idx++;else{E.phase='quiz';nextQ();render();window.scrollTo(0,0);return}autoSay(H[E.ids[E.idx]]);render();window.scrollTo(0,0)}
  else if(a==='pick')pick(+v);
  else if(a==='viewopt'){const q=E.look!=null&&E.hist[E.look]&&E.hist[E.look].q?E.hist[E.look].q:E.cur;const id=q&&q.optIds?q.optIds[+v]:null;if(id!=null){dex=id;render()}}
  else if(a==='ml'){mClick('l',+v)}
  else if(a==='mr'){mClick('r',+v)}
  else if(a==='next'){stopSpeak();nextQ();render();window.scrollTo(0,0)}
  else if(a==='exit'){E.exit=true;render()}
  else if(a==='cont'){E.exit=false;render()}
  else if(a==='quit'){stopSpeak();E=null;render();window.scrollTo(0,0)}
  else if(a==='back'){const i=prevIdx();if(i>=0){E.look=i;render()}}
  else if(a==='lookstart'){E.look=E.hist.length-1;render()}
  else if(a==='lookback'){E.look=null;render()}
  else if(a==='lookprev'){E.look=Math.max(0,E.look-1);render()}
  else if(a==='looknext'){E.look=Math.min(E.hist.length-1,E.look+1);render()}
  else if(a==='scope'){qsetup.scope=el.value;render()}
  else if(a==='qn'){qsetup.n=+el.value;render()}
  else if(a==='lscope'){lscope=el.value;render()}
  else if(a==='qstart')startPractice();
  else if(a==='lstart'){const ids=poolFor(lscope).map(h=>h.id);if(!ids.length)return;LM={ids,i:0,on:false,tok:0};lPlay()}
  else if(a==='lstop'){stopSpeak();if(LM)LM.tok++;LM=null;render()}
  else if(a==='lplay'){if(LM.on){LM.on=false;LM.tok++;stopSpeak();render()}else lPlay()}
  else if(a==='lnext'){stopSpeak();LM.tok++;LM.i=Math.min(LM.ids.length-1,LM.i+1);LM.on?lPlay():render()}
  else if(a==='lprev'){stopSpeak();LM.tok++;LM.i=Math.max(0,LM.i-1);LM.on?lPlay():render()}
  else if(a==='say'){const h=H[+v];if(!speak(herbText(h)))say('这个设备/浏览器不支持朗读')}
  else if(a==='ctab'){cmpTab=v;render()}
  else if(a==='cmpopen'){cmpOpen=+v;render();window.scrollTo(0,0)}
  else if(a==='cmpclose'){cmpOpen=null;render()}
  else if(a==='cmpgo'){if(E&&E.phase!=='end'){say('先完成或退出当前关卡，再到「对比法象」页查看');return}dex=null;E=null;tab='cmp';cmpTab='cmp';cmpOpen=+v;render();window.scrollTo(0,0)}
  else if(a==='cmpq')startCmp(+v);
  else if(a==='cmpmix')startCmpMix();
  else if(a==='fxopen'){fxOpen=+v;render();window.scrollTo(0,0)}
  else if(a==='fxclose'){fxOpen=null;render()}
  else if(a==='fxq')startFx(+v);
  else if(a==='fxmix')startFx(null);
  else if(a==='fch'){fch=el.value;render()}
  else if(a==='dex'){dex=+v;render()}
  else if(a==='dexc'){dex=null;render()}
  else if(a==='snd'){S.set.snd=+el.value;save();render()}
  else if(a==='autosay'){S.set.say=+el.value;save();render()}
  else if(a==='rate'){S.set.rate=+el.value;save();render()}
  else if(a==='bexp'){
    const code=packBackup(S,today());
    backupMsg='备份码已生成（'+code.length+' 个字符），请复制保存。';render();
    const t=document.getElementById('bk');t.value=code;t.select();try{navigator.clipboard.writeText(code).catch(()=>{})}catch(e){}
  }
  else if(a==='bimp'){importCode(document.getElementById('bk').value)}
  else if(a==='bfile'){
    try{const blob=new Blob([packBackup(S,today())],{type:'text/plain'}),u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download='中药闯关备份-'+new Date().toISOString().slice(0,10)+'.txt';document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),1000);backupMsg='已开始下载备份文件。'}catch(e){backupMsg='这个环境无法下载，请用备份码。'}
    render();
  }
  else if(a==='wclear'){S.wrong={};save();render()}
  else if(a==='reset1'){confirmReset=true;render()}
  else if(a==='reset0'){confirmReset=false;render()}
  else if(a==='reset2'){const ex=S.set;mergeState(null);S.set=Object.assign(S.set,ex);confirmReset=false;E=null;save();render()}
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t||t.tagName==='SELECT')return;
  if(t.dataset.act==='dexc'&&t.classList.contains('mask')&&e.target.closest('.box'))return;
  act(t.dataset.act,t.dataset.v,t);
});
document.addEventListener('change',e=>{const t=e.target.closest('select[data-act]');if(t)act(t.dataset.act,t.value,t)});
document.addEventListener('keydown',e=>{
  if(!E||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||E.look!=null)return;
  if(E.phase==='intro'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();act('inext')}
  else if(E.phase==='quiz'&&E.cur&&E.cur.kind==='mcq'){
    if(E.picked==null&&'1234'.indexOf(e.key)>=0&&e.key&&+e.key<=E.cur.opts.length)pick(+e.key-1);
    else if(E.picked!=null&&(e.key==='Enter'||e.key===' ')){e.preventDefault();act('next')}
  }
});
window.addEventListener('resize',drawLines);
load();render();
</script>
</body>
</html>
