": "化湿药", "n": "藿香", "f": "化湿，解暑，止呕", "a": "1.湿滞中焦证；2.暑湿证及湿温初起；3.呕吐（湿浊中阻者最宜）", "d": "煎服5~10g", "sp": "鲜品加倍", "w": "", "ap": "", "m": "藿香：夏天湿热，止呕，解暑"}, {"id": 134, "ch": "化湿药", "sec": "化湿药", "n": "佩兰", "f": "化湿，解暑", "a": "1.湿滞中焦证（脾经湿热、口中甜腻多涎）；2.外感暑湿或湿温初起", "d": "煎服5~10g", "sp": "鲜品加倍", "w": "", "ap": "", "m": "佩兰：化湿解暑，口中甜腻"}, {"id": 135, "ch": "化湿药", "sec": "化湿药", "n": "苍术", "f": "燥湿健脾，祛风湿", "a": "1.湿滞中焦证；2.风湿痹证；3.外感风寒挟湿之表证；此外能明目，用于夜盲症及眼目昏涩", "d": "煎服5~10g", "sp": "", "w": "", "ap": "", "m": "苍术：燥湿健脾，祛风湿，明目"}, {"id": 136, "ch": "化湿药", "sec": "化湿药", "n": "厚朴", "f": "行气，燥湿，消积，平喘", "a": "1.湿阻中焦、气滞不利所致脘闷腹胀、腹痛或呕逆；2.肠胃积滞，腹胀便秘；3.痰饮喘咳", "d": "煎服3~10g", "sp": "", "w": "", "ap": "厚朴花：芳香化湿、行气宽胸；用于湿阻气滞之胸腹胀满疼痛、纳少，3~6g", "m": "厚朴：行气、燥湿、消积、平喘，下气除满要药"}, {"id": 137, "ch": "化湿药", "sec": "化湿药", "n": "砂仁", "f": "化湿行气，温中止呕止泻，安胎", "a": "1.湿困脾土及脾胃气滞证；2.脾胃虚寒吐泻；3.气滞妊娠恶阻及胎动不安", "d": "煎服5~10g", "sp": "宜后下", "w": "", "ap": "砂仁壳：性味功效与砂仁相似而温性略减、药力薄弱，适用于脾胃气滞、脘腹胀痛、呕恶食少，用量同砂仁", "m": "砂仁：化湿行气，安胎，后下"}, {"id": 138, "ch": "化湿药", "sec": "化湿药", "n": "白豆蔻", "f": "化湿行气，温中止呕", "a": "1.湿滞中焦及脾胃气滞的脘腹胀满、不思饮食；2.呕吐（胃寒湿阻气滞者最宜）", "d": "煎服3~6g", "sp": "入散剂为好；入汤剂宜后下", "w": "", "ap": "豆蔻壳：性味功效与白豆蔻相似，但温性不强、力亦较弱，适用于湿阻气滞所致脘腹痞闷、食欲不振、呕吐，煎服3~5g", "m": "白豆蔻：化湿行气，温中止呕，后下"}, {"id": 139, "ch": "化湿药", "sec": "化湿药", "n": "草豆蔻", "f": "燥湿行气，温中止呕", "a": "1.寒湿中阻、脾胃气滞之脘腹胀满疼痛、呕吐；2.寒凝湿郁，脾虚久泻", "d": "煎服5~10g", "sp": "", "w": "", "ap": "", "m": "草豆蔻：燥湿行气温中"}, {"id": 140, "ch": "化湿药", "sec": "化湿药", "n": "草果", "f": "燥湿散寒，除痰截疟", "a": "1.寒湿中阻之脘腹胀痛、呕吐泄泻、舌苔浊腻；2.疟疾", "d": "煎服3~6g", "sp": "去壳取仁捣碎用", "w": "", "ap": "", "m": "草果：燥湿散寒除痰截疟"}, {"id": 141, "ch": "利水渗湿药", "sec": "利水消肿药", "n": "茯苓", "f": "利水渗湿，健脾安神", "a": "1.水肿，小便不利（寒热虚实各种水肿均可）；2.脾虚诸证（食少便溏、痰饮）；3.心悸，失眠", "d": "煎服10~15g", "sp": "", "w": "", "ap": "茯苓皮：功专行皮肤水湿，多用于皮肤水肿，15~30g。茯神：有宁心安神之功，专用于心神不安、惊悸、健忘，用量同茯苓", "m": "茯苓：利水渗湿+健脾+安神，水肿要药"}, {"id": 142, "ch": "利水渗湿药", "sec": "利水消肿药", "n": "薏苡仁", "f": "利水渗湿，健脾，除痹，清热排脓", "a": "1.小便不利，水肿，脚气及脾虚泄泻；2.湿痹拘挛；3.肺痈，肠痈", "d": "煎服10~30g", "sp": "清利湿热宜生用，健脾止泻宜炒用；本品力缓，用量宜大；除入汤剂、丸散外，亦可作粥食用，为食疗佳品", "w": "", "ap": "", "m": "薏苡仁：利水、健脾、除痹、排脓（肺痈肠痈）"}, {"id": 143, "ch": "利水渗湿药", "sec": "利水消肿药", "n": "猪苓", "f": "利水渗湿", "a": "小便不利，水肿，泄泻，淋浊等（利水作用较茯苓强）", "d": "煎服5~10g", "sp": "", "w": "无水湿者忌用", "ap": "", "m": "猪苓：只利水渗湿，利水作用强于茯苓"}, {"id": 144, "ch": "利水渗湿药", "sec": "利水消肿药", "n": "泽泻", "f": "利水渗湿，泄热", "a": "水肿，小便不利，泄泻，淋浊带下及痰饮等（下焦湿热者尤宜）", "d": "煎服5~10g", "sp": "", "w": "", "ap": "", "m": "泽泻：利水+泄热（下焦湿热）"}, {"id": 145, "ch": "利水渗湿药", "sec": "利水消肿药", "n": "冬瓜皮", "f": "利水消肿", "a": "水肿，小便不利（水肿偏有热者为宜）", "d": "煎服15~30g", "sp": "", "w": "", "ap": "冬瓜仁：清肺化痰、利湿排脓；用于肺热咳嗽、肺痈、肠痈、带下、白浊，10~15g", "m": "冬瓜皮：利水消肿，皮肤水肿"}, {"id": 146, "ch": "利水渗湿药", "sec": "利水消肿药", "n": "玉米须", "f": "利水消肿，利湿退黄", "a": "1.水肿，小便不利；2.黄疸", "d": "煎服30~60g", "sp": "", "w": "", "ap": "", "m": "玉米须：利水消肿+退黄"}, {"id": 147, "ch": "利水渗湿药", "sec": "利水消肿药", "n": "葫芦", "f": "利水消肿", "a": "面目浮肿，大腹水肿，脚气肿胀等", "d": "煎服15~30g", "sp": "", "w": "", "ap": "", "m": "葫芦：利水消肿"}, {"id": 148, "ch": "利水渗湿药", "sec": "利水消肿药", "n": "香加皮", "f": "利尿消肿，祛风湿，强筋骨", "a": "1.水肿，小便不利；2.风湿痹证", "d": "煎服3~6g", "sp": "浸酒或入丸散，酌量", "w": "有强心利尿作用，有毒，不宜多用；与南五加皮科属不同、功效不一，应区别使用", "ap": "", "m": "香加皮：有毒，利尿+强心，祛风湿"}, {"id": 149, "ch": "利水渗湿药", "sec": "利水消肿药", "n": "泽漆", "f": "利水消肿，化痰止咳，散结", "a": "1.大腹水肿，四肢面目浮肿；2.痰饮喘咳，肺热咳嗽；3.瘰疬，癣疮", "d": "煎服5~10g；外用适量", "sp": "", "w": "有毒，不宜过量或长期使用；脾胃虚寒者慎用", "ap": "", "m": "泽漆：利水化痰散结"}, {"id": 150, "ch": "利水渗湿药", "sec": "利水消肿药", "n": "蝼蛄", "f": "利水消肿", "a": "水肿，小便不利，石淋", "d": "煎服5~9g；研末服，每次3~5g；外用适量", "sp": "", "w": "气虚体弱者及孕妇均忌服", "ap": "", "m": "蝼蛄：利水消肿"}, {"id": 151, "ch": "利水渗湿药", "sec": "利水消肿药", "n": "荠菜", "f": "清热利水，凉血止血", "a": "1.水肿，泄泻，痢疾；2.血热出血（吐血、便血、崩漏、月经过多）；此外用于目赤肿痛", "d": "煎服15~30g，鲜品加倍；外用适量", "sp": "", "w": "", "ap": "", "m": "荠菜：凉血止血，利水"}, {"id": 152, "ch": "利水渗湿药", "sec": "利尿通淋药", "n": "车前子", "f": "利尿通淋，渗湿止泻，清肝明目，清肺化痰", "a": "1.小便不利，水肿，淋证；2.暑湿泄泻；3.目赤，目暗昏花；4.痰热咳嗽", "d": "煎服10~15g", "sp": "宜布包煎", "w": "", "ap": "车前草：性味功用同车前子，且能清热解毒；用治热毒痈肿，内服或鲜草捣烂外敷，10~20g，鲜品加倍", "m": "车前子：通淋、止泻（利小便实大便）、明目，包煎"}, {"id": 153, "ch": "利水渗湿药", "sec": "利尿通淋药", "n": "滑石", "f": "利水通淋，清解暑热，祛湿敛疮", "a": "1.小便不利，淋沥涩痛；2.暑湿，湿温；3.湿疮，湿疹，痱子（外用）", "d": "煎服10~15g；外用适量", "sp": "宜布包煎", "w": "脾虚、热病伤津及孕妇忌用", "ap": "", "m": "滑石：通淋+解暑+外用祛湿，包煎"}, {"id": 154, "ch": "利水渗湿药", "sec": "利尿通淋药", "n": "关木通", "f": "利尿通淋，通经下乳", "a": "1.热淋涩痛，水肿，心烦尿赤，口舌生疮；2.经闭，乳少；3.湿热痹痛", "d": "煎服3~9g", "sp": "", "w": "据报道关木通60g水煎服有致急性肾功能衰竭者，故用量不宜大", "ap": "", "m": "木通：利尿通淋+通经下乳（关木通含马兜铃酸）"}, {"id": 155, "ch": "利水渗湿药", "sec": "利尿通淋药", "n": "通草", "f": "清热利湿，通气下乳", "a": "1.湿热淋证，湿温尿赤；2.产后乳汁不通或乳少", "d": "煎服5~10g", "sp": "", "w": "", "ap": "", "m": "通草：清热利湿，下乳"}, {"id": 156, "ch": "利水渗湿药", "sec": "利尿通淋药", "n": "瞿麦", "f": "利尿通淋，活血通经", "a": "1.小便不利，淋沥涩痛（热淋、血淋）；2.经闭，月经不调", "d": "煎服10~15g", "sp": "", "w": "孕妇忌服", "ap": "", "m": "瞿麦：通淋+活血通经"}, {"id": 157, "ch": "利水渗湿药", "sec": "利尿通淋药", "n": "萹蓄", "f": "利尿通淋，杀虫止痒", "a": "1.小便不利，淋沥涩痛；2.湿疹，阴痒，虫积腹痛", "d": "煎服10~30g，鲜品加倍；外用适量", "sp": "", "w": "多服泄精气", "ap": "", "m": "萹蓄：通淋+杀虫止痒"}, {"id": 158, "ch": "利水渗湿药", "sec": "利尿通淋药", "n": "地肤子", "f": "清热利湿，止痒", "a": "1.小便不利，淋沥涩痛；2.皮肤风疹，湿疹瘙痒", "d": "煎服10~15g；外用适量", "sp": "", "w": "", "ap": "", "m": "地肤子：湿热止痒，皮肤病"}, {"id": 159, "ch": "利水渗湿药", "sec": "利尿通淋药", "n": "海金沙", "f": "利尿通淋", "a": "各种淋证（热淋、砂淋、血淋、膏淋，尤善止尿道疼痛）；亦治水肿", "d": "煎服6~12g", "sp": "宜布包煎", "w": "", "ap": "海金沙藤：性味功效与海金沙同，而更长于清热解毒；多用治热淋、石淋，亦可用于痈肿疮毒、痄腮和黄疸；煎服15~30g，外用煎汤外洗或捣敷", "m": "海金沙：通淋，石淋，包煎"}, {"id": 160, "ch": "利水渗湿药", "sec": "利尿通淋药", "n": "石韦", "f": "利水通淋，清肺止咳，凉血止血", "a": "1.热淋，石淋，血淋；2.肺热咳喘；3.血热出血（崩漏、吐衄）", "d": "煎服5~10g；大剂30~60g", "sp": "", "w": "", "ap": "", "m": "石韦：通淋+止咳+止血"}, {"id": 161, "ch": "利水渗湿药", "sec": "利尿通淋药", "n": "冬葵子", "f": "利水通淋，下乳润肠", "a": "1.淋证，水肿；2.乳汁不行，乳房胀痛；3.肠燥便秘", "d": "煎服10~15g", "sp": "", "w": "孕妇慎用", "ap": "", "m": "冬葵子：通淋，下乳，润肠"}, {"id": 162, "ch": "利水渗湿药", "sec": "利尿通淋药", "n": "灯心草", "f": "利尿通淋，清心除烦", "a": "1.热淋；2.心烦失眠，小儿夜啼", "d": "煎服1.5~2.5g，或入丸散", "sp": "", "w": "", "ap": "", "m": "灯心草：通淋，清心除烦"}, {"id": 163, "ch": "利水渗湿药", "sec": "利尿通淋药", "n": "萆薢", "f": "利湿浊，祛风湿", "a": "1.膏淋，白浊；2.风湿痹证", "d": "煎服10~15g", "sp": "", "w": "肾阴亏虚、遗精滑泄者慎用", "ap": "", "m": "萆薢：膏淋白浊要药"}, {"id": 164, "ch": "利水渗湿药", "sec": "利湿退黄药", "n": "茵陈蒿", "f": "清利湿热，利胆退黄", "a": "1.黄疸（阳黄、阴黄均可，为治黄疸要药）；2.湿温，湿疹，湿疮", "d": "煎服10~30g；外用适量", "sp": "", "w": "蓄血发黄及血虚萎黄者慎用", "ap": "", "m": "茵陈：黄疸要药，利胆退黄"}, {"id": 165, "ch": "利水渗湿药", "sec": "利湿退黄药", "n": "金钱草", "f": "除湿退黄，利尿通淋，解毒消肿", "a": "1.湿热黄疸；2.石淋，热淋（治石淋尤为多用）；3.恶疮肿毒，毒蛇咬伤", "d": "煎服30~60g，鲜品加倍；外用适量", "sp": "治石淋可单用大剂量煎汤代茶饮；解毒可用鲜品捣汁饮并以渣外敷", "w": "", "ap": "", "m": "金钱草：石淋、胆结石要药"}, {"id": 166, "ch": "利水渗湿药", "sec": "利湿退黄药", "n": "虎杖", "f": "利胆退黄，清热解毒，活血祛瘀，祛痰止咳", "a": "1.湿热黄疸，淋浊带下；2.烧烫伤，痈肿疮毒，毒蛇咬伤；3.血瘀经闭，跌打损伤；4.肺热咳嗽；此外有泻下通便作用", "d": "煎服10~30g；外用适量", "sp": "", "w": "孕妇忌服", "ap": "", "m": "虎杖：退黄解毒活血祛痰，一药多用"}, {"id": 167, "ch": "利水渗湿药", "sec": "利湿退黄药", "n": "地耳草", "f": "利湿退黄，清热解毒，活血消肿", "a": "1.黄疸；2.肺痈，肠痈，痈肿疮毒；3.跌打损伤", "d": "煎服15~30g，鲜品加倍；外用适量", "sp": "", "w": "", "ap": "", "m": "地耳草：利湿退黄，解毒"}, {"id": 168, "ch": "利水渗湿药", "sec": "利湿退黄药", "n": "垂盆草", "f": "利湿退黄，清热解毒", "a": "1.黄疸；2.痈肿疮疡，咽喉肿痛，毒蛇咬伤，烫伤", "d": "煎服15~30g，鲜品加倍；外用适量", "sp": "", "w": "", "ap": "", "m": "垂盆草：退黄，降转氨酶"}, {"id": 169, "ch": "温里药", "sec": "温里药", "n": "附子", "f": "回阳救逆，助阳补火，散寒止痛", "a": "1.亡阳证（\"回阳救逆第一品药\"）；2.虚寒性的阳痿宫冷、脘腹冷痛、泄泻、水肿等证；3.寒痹证", "d": "煎服3~15g", "sp": "宜先煎0.5~1小时，至口尝无麻辣感为度", "w": "辛热燥烈，凡阴虚阳亢及孕妇忌用；反半夏、瓜蒌、贝母、白蔹、白及；因有毒，内服须经炮制，若内服过量或炮制、煎煮方法不当可引起中毒", "ap": "", "m": "附子：回阳救逆第一品药，先煎久煎"}, {"id": 170, "ch": "温里药", "sec": "温里药", "n": "干姜", "f": "温中散寒，回阳通脉，温肺化饮", "a": "1.脾胃寒证，脘腹冷痛，呕吐泄泻；2.亡阳证；3.寒饮咳喘", "d": "煎服3~10g", "sp": "", "w": "", "ap": "", "m": "干姜：温中、回阳、化饮，“脾胃中焦第一药”"}, {"id": 171, "ch": "温里药", "sec": "温里药", "n": "肉桂", "f": "补火助阳，散寒止痛，温经通脉", "a": "1.肾阳衰弱的阳痿宫冷、虚喘心悸等；2.心腹冷痛，寒疝作痛；3.寒痹腰痛，胸痹，阴疽；4.闭经，痛经；此外久病体虚气血不足者，在补气益血方中适加肉桂能鼓舞气血生长", "d": "煎服2~5g；研末冲服，每次1~2g", "sp": "宜后下或焗服；可研末冲服", "w": "畏赤石脂", "ap": "", "m": "肉桂：补火助阳+引火归元，后下，畏赤石脂"}, {"id": 172, "ch": "温里药", "sec": "温里药", "n": "吴茱萸", "f": "散寒止痛，温中止呕，助阳止泻", "a": "1.寒滞肝脉诸痛证（厥阴头痛、寒疝、痛经、脚气）；2.胃寒呕吐证；3.虚寒泄泻证；此外研末米醋调敷足心（涌泉穴）可治口疮，并用治高血压病", "d": "煎服1.5~6g；外用适量", "sp": "", "w": "辛热燥烈，易耗气动火，不宜多用、久服", "ap": "", "m": "吴茱萸：肝经寒痛要药，止呕止泻"}, {"id": 173, "ch": "温里药", "sec": "温里药", "n": "小茴香", "f": "散寒止痛，理气和中", "a": "1.寒疝腹痛，睾丸偏坠胀痛，少腹冷痛，痛经；2.中焦虚寒气滞证", "d": "煎服3~6g；外用适量", "sp": "", "w": "", "ap": "八角茴香：又名大茴香，性味功效与小茴香相似但功力较弱，主要用作食物调味品，用法用量与小茴香同", "m": "小茴香：散寒止痛，理气，疝气"}, {"id": 174, "ch": "温里药", "sec": "温里药", "n": "高良姜", "f": "散寒止痛，温中止呕", "a": "1.胃寒冷痛；2.胃寒呕吐", "d": "煎服3~10g；研末服，每次3g", "sp": "", "w": "", "ap": "", "m": "高良姜：胃寒脘痛"}, {"id": 175, "ch": "温里药", "sec": "温里药", "n": "花椒", "f": "温中止痛，杀虫，止痒", "a": "1.中寒腹痛，寒湿吐泻；2.虫积腹痛；3.湿疹瘙痒，妇人阴痒（外用）", "d": "煎服3~10g；外用适量", "sp": "", "w": "", "ap": "椒目：花椒的种子，利水消肿、降气平喘；用于水肿胀满、痰饮咳喘，煎服3~10g", "m": "花椒：温中、杀虫（蛔虫）、止痒"}, {"id": 176, "ch": "温里药", "sec": "温里药", "n": "丁香", "f": "温中降逆，散寒止痛，温肾助阳", "a": "1.胃寒呕吐，呃逆；2.脘腹冷痛；3.阳痿，宫冷", "d": "煎服1.5~6g", "sp": "", "w": "畏郁金", "ap": "母丁香：丁香的成熟果实，又名鸡舌香，性味功效与公丁香相似但气味较淡、功力较逊，用法用量与公丁香同", "m": "丁香：降逆止呃，畏郁金"}, {"id": 177, "ch": "温里药", "sec": "温里药", "n": "荜茇", "f": "温中散寒", "a": "1.胃寒腹痛，呕吐，呃逆，泄泻；2.龋齿疼痛（外用）", "d": "煎服3~6g；外用适量", "sp": "", "w": "", "ap": "", "m": "荜茇：温中散寒"}, {"id": 178, "ch": "温里药", "sec": "温里药", "n": "荜澄茄", "f": "温中散寒，行气止痛", "a": "1.胃寒腹痛，呕吐，呃逆；2.寒疝腹痛；此外治下焦虚寒之小便不利或寒湿郁滞之小便浑浊", "d": "煎服2~5g", "sp": "", "w": "", "ap": "", "m": "荜澄茄：温中行气"}, {"id": 179, "ch": "温里药", "sec": "温里药", "n": "胡椒", "f": "温中止痛，下气消痰", "a": "1.胃寒腹痛，呕吐泄泻；2.癫痫证", "d": "煎服2~4g；研末服，每次0.5~1g；外用适量", "sp": "", "w": "", "ap": "", "m": "胡椒：温中止痛，下气消痰"}, {"id": 180, "ch": "理气药", "sec": "理气药", "n": "橘皮", "f": "理气健脾，燥湿化痰", "a": "1.脾胃气滞证（脘腹胀满、恶心呕吐、不思饮食）；2.湿痰、寒痰咳嗽", "d": "煎服3~10g", "sp": "", "w": "", "ap": "橘核：理气散结止痛，用于疝气痛、睾丸肿痛及乳房结块，3~10g。橘络：行气通络、化痰止咳，用于痰滞经络之胸痛咳嗽，3~5g。橘叶：疏肝行气、散结消肿，用于胁肋作痛、乳痈、乳房结块，6~10g。化橘红：理气宽中、燥湿化痰，用于湿痰或寒痰咳嗽及食积呕恶胸闷，3~10g", "m": "橘皮：理气健脾，燥湿化痰（陈皮）"}, {"id": 181, "ch": "理气药", "sec": "理气药", "n": "青皮", "f": "疏肝理气，消积化滞", "a": "1.肝气郁滞诸证（胸胁胀痛、乳房胀痛、疝气痛）；2.食积腹痛；此外可用于癥瘕积聚、久疟痞块", "d": "煎服3~10g", "sp": "醋炙疏肝止痛力强", "w": "", "ap": "", "m": "青皮：疏肝破气，消积"}, {"id": 182, "ch": "理气药", "sec": "理气药", "n": "枳实", "f": "破气除痞，化痰消积", "a": "1.食积证，胃肠热结气滞证；2.痰滞胸脘痞满，胸痹结胸；此外可用治胃扩张、胃下垂、子宫脱垂、脱肛等脏器下垂（配补气、升阳药）", "d": "煎服3~10g；大量可用至30g", "sp": "炒后性较平和", "w": "孕妇慎用", "ap": "枳壳：性味归经功用与枳实同，但作用较缓和，长于行气宽中除胀，用法用量同枳实", "m": "枳实：破气除痞，化痰，积滞"}, {"id": 183, "ch": "理气药", "sec": "理气药", "n": "木香", "f": "行气止痛", "a": "1.脾胃气滞证（行气止痛要药）；2.泻痢里急后重；3.腹痛胁痛，黄疸", "d": "煎服3~10g", "sp": "生用行气力强；煨用行气力缓而多用于止泻", "w": "", "ap": "", "m": "木香：行气止痛，健脾，宜煨用止泻"}, {"id": 184, "ch": "理气药", "sec": "理气药", "n": "沉香", "f": "行气止痛，温中止呕，纳气平喘", "a": "1.胸腹胀痛（寒凝气滞）；2.胃寒呕吐；3.虚喘证（下元虚冷、肾不纳气）", "d": "煎服1~3g；入丸散剂每次0.5~1g", "sp": "宜后下；或磨汁冲服；或入丸散", "w": "", "ap": "", "m": "沉香：降气，温中，纳气，后下"}, {"id": 185, "ch": "理气药", "sec": "理气药", "n": "檀香", "f": "行气止痛，散寒调中", "a": "胸腹冷痛，胃脘寒痛，呕吐食少", "d": "煎服1~3g", "sp": "宜后下", "w": "", "ap": "", "m": "檀香：行气止痛，散寒，后下"}, {"id": 186, "ch": "理气药", "sec": "理气药", "n": "香附", "f": "疏肝理气，调经止痛", "a": "1.气滞胁痛，腹痛；2.肝郁月经不调，痛经，乳房胀痛（妇科调经要药）", "d": "煎服6~12g", "sp": "醋炙止痛力增强", "w": "", "ap": "", "m": "香附：气病之总司，女科主帅"}, {"id": 187, "ch": "理气药", "sec": "理气药", "n": "川楝子", "f": "行气止痛，杀虫疗癣", "a": "1.肝郁化火所致诸痛证；2.虫积腹痛；此外外用治头癣", "d": "煎服3~10g；外用适量", "sp": "炒用寒性减低", "w": "有毒，不宜过量或持续服用", "ap": "", "m": "川楝子：行气止痛，杀虫，有小毒"}, {"id": 188, "ch": "理气药", "sec": "理气药", "n": "乌药", "f": "行气止痛，温肾散寒", "a": "1.寒凝气滞所致胸腹诸痛证；2.尿频，遗尿（膀胱虚冷）", "d": "煎服3~10g", "sp": "", "w": "", "ap": "", "m": "乌药：行气止痛，温肾缩尿"}, {"id": 189, "ch": "理气药", "sec": "理气药", "n": "荔枝核", "f": "行气散结，散寒止痛", "a": "1.疝气痛，睾丸肿痛；2.胃脘久痛，痛经，产后腹痛", "d": "煎服10~15g，或入丸散剂", "sp": "", "w": "", "ap": "", "m": "荔枝核：疝气，睾丸肿痛"}, {"id": 190, "ch": "理气药", "sec": "理气药", "n": "佛手", "f": "疏肝解郁，理气和中，燥湿化痰", "a": "1.肝郁胸胁胀痛；2.气滞脘腹疼痛；3.久咳痰多，胸闷作痛", "d": "煎服3~10g", "sp": "", "w": "", "ap": "", "m": "佛手：疏肝理气和胃，化痰"}, {"id": 191, "ch": "理气药", "sec": "理气药", "n": "香橼", "f": "疏肝解郁，理气宽中，化痰止咳", "a": "1.肝郁胸胁胀痛；2.气滞脘腹疼痛；3.痰饮咳嗽，胸膈不利", "d": "煎服3~10g", "sp": "", "w": "", "ap": "", "m": "香橼：理气宽中，化痰"}, {"id": 192, "ch": "理气药", "sec": "理气药", "n": "玫瑰花", "f": "行气解郁，活血止痛", "a": "1.肝胃气痛；2.月经不调，经前乳房胀痛；3.跌打伤痛", "d": "煎服3~6g", "sp": "", "w": "", "ap": "", "m": "玫瑰花：行气解郁，活血"}, {"id": 193, "ch": "理气药", "sec": "理气药", "n": "绿萼梅", "f": "疏肝和胃，理气化痰", "a": "1.肝胃气滞之胁肋胀痛、脘腹痞痛、嗳气纳呆；2.梅核气证", "d": "煎服3~6g", "sp": "", "w": "", "ap": "", "m": "绿萼梅：疏肝和胃，梅核气"}, {"id": 194, "ch": "理气药", "sec": "理气药", "n": "薤白", "f": "通阳散结，行气导滞", "a": "1.胸痹证（治胸痹要药）；2.脘腹痞满胀痛，泻痢里急后重", "d": "煎服5~10g", "sp": "", "w": "", "ap": "", "m": "薤白：胸痹要药，通阳散结"}, {"id": 195, "ch": "理气药", "sec": "理气药", "n": "青木香", "f": "行气止痛，解毒，辟秽，消肿", "a": "1.肝胃气滞之胸胁胀痛、脘腹疼痛；2.泻痢腹痛；3.疔疮肿毒，皮肤湿疮，毒蛇咬伤", "d": "煎服3~10g；散剂每次1.5~2g；外用适量", "sp": "散剂用开水送服", "w": "不宜多服，过量可引起恶心、呕吐等胃肠道反应", "ap": "", "m": "青木香：行气止痛，解毒（含马兜铃酸）"}, {"id": 196, "ch": "理气药", "sec": "理气药", "n": "大腹皮", "f": "行气导滞，利水消肿", "a": "1.胃肠气滞，脘腹胀闷，大便不爽；2.水肿，脚气肿痛", "d": "煎服5~10g", "sp": "", "w": "", "ap": "", "m": "大腹皮：行气+利水（水肿）"}, {"id": 197, "ch": "理气药", "sec": "理气药", "n": "柿蒂", "f": "降气止呃", "a": "呃逆证（止呃要药，寒热均可配伍应用）", "d": "煎服6~10g", "sp": "", "w": "", "ap": "", "m": "柿蒂：降气止呃要药"}, {"id": 198, "ch": "理气药", "sec": "理气药", "n": "刀豆", "f": "降气止呃，温肾助阳", "a": "1.呃逆，呕吐；2.肾虚腰痛", "d": "煎服10~15g", "sp": "", "w": "", "ap": "", "m": "刀豆：降气止呃，温肾"}, {"id": 199, "ch": "理气药", "sec": "理气药", "n": "甘松", "f": "行气止痛，开郁醒脾", "a": "1.寒凝气滞之脘腹胀痛、不思饮食；2.湿脚气（煎汤外洗）", "d": "煎服3~6g；外用适量", "sp": "", "w": "", "ap": "", "m": "甘松：行气止痛，开郁醒脾"}, {"id": 200, "ch": "理气药", "sec": "理气药", "n": "九香虫", "f": "理气止痛，温肾助阳", "a": "1.肝胃气痛，胸胁脘腹胀痛；2.肾阳不足之阳痿、腰膝冷痛", "d": "煎服3~10g", "sp": "", "w": "", "ap": "", "m": "九香虫：理气止痛，温肾助阳"}, {"id": 201, "ch": "消食药", "sec": "消食药", "n": "山楂", "f": "消食化积，行气散瘀", "a": "1.饮食积滞证（消油腻肉食积滞要药）；2.泻痢腹痛，疝气痛；3.瘀阻胸腹痛，痛经；现代用于冠心病、高血压病、高脂血症", "d": "煎服10~15g；大剂量30g", "sp": "生山楂用于消食散瘀，焦山楂用于止泻止痢", "w": "", "ap": "", "m": "山楂：消肉食积，行气散瘀，高脂血症"}, {"id": 202, "ch": "消食药", "sec": "消食药", "n": "神曲", "f": "消食和胃", "a": "饮食积滞证；此外丸剂中有金石、贝壳类药物者，可用本品糊丸以助消化", "d": "煎服6~15g", "sp": "", "w": "", "ap": "", "m": "神曲：消食和胃，米面食滞"}, {"id": 203, "ch": "消食药", "sec": "消食药", "n": "麦芽", "f": "消食健胃，回乳消胀", "a": "1.米面薯芋食滞证；2.断乳，乳房胀痛；此外兼能疏肝解郁", "d": "煎服10~15g；大剂量30~120g", "sp": "生麦芽功偏消食健胃，炒用多用于回乳消胀", "w": "授乳期妇女不宜使用", "ap": "", "m": "麦芽：消米面食积，回乳（生麦芽通乳）"}, {"id": 204, "ch": "消食药", "sec": "消食药", "n": "谷芽", "f": "消食健胃", "a": "米面薯芋食滞证及脾虚食少（功似麦芽而力较缓，每相须为用）", "d": "煎服10~15g；大剂量30g", "sp": "生用长于和中，炒用偏于消食", "w": "", "ap": "", "m": "谷芽：消米面食积，功似麦芽但力缓"}, {"id": 205, "ch": "消食药", "sec": "消食药", "n": "莱菔子", "f": "消食除胀，降气化痰", "a": "1.食积气滞证；2.咳喘痰多，胸闷食少", "d": "煎服6~10g", "sp": "生用吐风痰，炒用消食下气化痰", "w": "辛散耗气，气虚及无食积、痰滞者慎用；不宜与人参同用", "ap": "", "m": "莱菔子：消食除胀，降气化痰，不宜与人参同用"}, {"id": 206, "ch": "消食药", "sec": "消食药", "n": "鸡内金", "f": "消食健胃，涩精止遗", "a": "1.饮食积滞，小儿疳积；2.肾虚遗精，遗尿；3.砂石淋证，胆结石", "d": "煎服3~10g；研末服，每次1.5~3g", "sp": "研末用效果比煎剂好", "w": "", "ap": "", "m": "鸡内金：消食，涩精止遗，消结石"}, {"id": 207, "ch": "消食药", "sec": "消食药", "n": "鸡矢藤", "f": "消食健胃，化痰止咳，清热解毒，止痛", "a": "1.饮食积滞，小儿疳积；2.热痰咳嗽；3.热毒泻痢，咽喉肿痛，痈疮疖肿，烫火伤；4.多种痛证", "d": "煎服15~60g；外用适量", "sp": "外用捣敷或煎水洗", "w": "", "ap": "", "m": "鸡矢藤：消食，止痛"}, {"id": 208, "ch": "驱虫药", "sec": "驱虫药", "n": "使君子", "f": "驱虫消积", "a": "1.蛔虫证，蛲虫证；2.小儿疳疾", "d": "煎服10~15g；炒香嚼服6~9g；小儿每岁每日1~1.5粒，总量不超过20粒", "sp": "空腹服用，每日1次，连用3天；可炒香嚼服", "w": "大量服用可致呃逆、眩晕、呕吐、腹泻等反应；与热茶同服亦能引起呃逆、腹泻，故服用时当忌饮茶", "ap": "", "m": "使君子：蛔虫，小儿疳积，忌热茶"}, {"id": 209, "ch": "驱虫药", "sec": "驱虫药", "n": "苦楝皮", "f": "杀虫，疗癣", "a": "1.蛔虫、钩虫、蛲虫病；2.疥癣，湿疮（外用）", "d": "煎服6~9g，鲜品15~30g；外用适量", "sp": "有效成分难溶于水，需文火久煎", "w": "有毒，不宜过量或持续服用", "ap": "", "m": "苦楝皮：杀蛔虫，疗癣，有毒"}, {"id": 210, "ch": "驱虫药", "sec": "驱虫药", "n": "槟榔", "f": "驱虫消积，行气利水", "a": "1.多种肠道寄生虫病（绦虫、钩虫、蛔虫、蛲虫、姜片虫，以治绦虫最佳）；2.食积气滞，泻痢后重；3.水肿，脚气肿痛；此外有截疟作用，治疟疾寒热久发不止", "d": "煎服6~15g；单用驱杀绦虫、姜片虫时可用60~120g", "sp": "驱绦虫、姜片虫须用大量（60~120g）", "w": "脾虚便溏或气虚下陷者忌用", "ap": "", "m": "槟榔：驱虫+行气+利水，绦虫首选"}, {"id": 211, "ch": "驱虫药", "sec": "驱虫药", "n": "南瓜子", "f": "杀虫", "a": "绦虫病（常与槟榔同用）；此外亦可治血吸虫病，但须较大剂量、长期服用", "d": "研粉60~120g", "sp": "研粉，冷开水调服", "w": "", "ap": "", "m": "南瓜子：杀绦虫"}, {"id": 212, "ch": "驱虫药", "sec": "驱虫药", "n": "鹤草芽", "f": "杀虫", "a": "绦虫病", "d": "研粉吞服，每次30~45g；小儿0.7~0.8g/kg", "sp": "每日一次，早起空腹服用", "w": "不宜入煎剂，有效成分几乎不溶于水", "ap": "", "m": "鹤草芽：杀绦虫，研粉吞服"}, {"id": 213, "ch": "驱虫药", "sec": "驱虫药", "n": "雷丸", "f": "杀虫", "a": "绦虫病、钩虫病、蛔虫病（驱绦虫为主）", "d": "入丸散，每次6~15g；驱绦虫每次12~18g", "sp": "日服3次，冷开水调服，连用3天", "w": "不宜入煎剂；因含蛋白酶，加热60℃左右即易于破坏而失效", "ap": "", "m": "雷丸：杀绦虫，不宜入煎剂"}, {"id": 214, "ch": "驱虫药", "sec": "驱虫药", "n": "鹤虱", "f": "杀虫消积", "a": "蛔虫、蛲虫、绦虫等虫积腹痛，小儿疳积", "d": "煎服5~15g", "sp": "", "w": "", "ap": "", "m": "鹤虱：杀虫，蛔虫蛲虫"}, {"id": 215, "ch": "驱虫药", "sec": "驱虫药", "n": "榧子", "f": "杀虫消积，通便，润肺", "a": "1.虫积腹痛；2.肠燥便秘；3.肺燥咳嗽", "d": "煎服15~30g；炒熟嚼服，一次用15g", "sp": "入煎剂宜生用；可炒熟嚼服", "w": "大便溏薄者不宜用", "ap": "", "m": "榧子：杀虫+润肺通便"}, {"id": 216, "ch": "驱虫药", "sec": "驱虫药", "n": "芜荑", "f": "杀虫消积", "a": "虫积腹痛，小儿疳积", "d": "煎服3~10g；入丸散，每次2~3g", "sp": "", "w": "脾胃虚弱者慎用", "ap": "", "m": "芜荑：杀虫消积"}, {"id": 217, "ch": "止血药", "sec": "凉血止血药", "n": "大蓟", "f": "凉血止血，散瘀解毒消痈", "a": "1.血热妄行所致的吐血、咯血、衄血、崩漏、尿血等；2.热毒痈肿", "d": "煎服10~15g，鲜品可用30~60g；外用适量", "sp": "外用捣敷患处", "w": "", "ap": "", "m": "大蓟：凉血止血，散瘀消痈，大蓟更善消痈"}, {"id": 218, "ch": "止血药", "sec": "凉血止血药", "n": "小蓟", "f": "凉血止血，散瘀解毒消痈", "a": "与大蓟主治相同，常配伍同用；但小蓟兼有利尿作用，以治尿血、血淋尤宜", "d": "同大蓟", "sp": "", "w": "", "ap": "", "m": "小蓟：凉血止血，尿血要药"}, {"id": 219, "ch": "止血药", "sec": "凉血止血药", "n": "地榆", "f": "凉血止血，解毒敛疮", "a": "1.各种热性出血证，如吐血、咯血、衄血、便血、崩漏及血痢等（下焦出血尤宜）；2.烫伤、湿疹及疮疡痈肿等（治烫伤要药）", "d": "煎服10~15g；外用适量", "sp": "治烫伤可研末麻油调敷", "w": "", "ap": "", "m": "地榆：下焦血热，烧烫伤要药"}, {"id": 220, "ch": "止血药", "sec": "凉血止血药", "n": "槐花", "f": "凉血止血，清肝火", "a": "1.血热出血证（便血、痔血尤宜）；2.肝火上炎之目赤、头胀头痛", "d": "煎服10~15g", "sp": "止血炒炭用，清热泻火生用", "w": "", "ap": "槐角：槐的果实，性味功效与槐花相似，止血作用较槐花弱而有润肠之功，主要用于痔血、便血、便秘目赤，煎服10~15g，孕妇慎用", "m": "槐花：便血、痔血，清肝"}, {"id": 221, "ch": "止血药", "sec": "凉血止血药", "n": "侧柏叶", "f": "凉血止血，化痰止咳", "a": "1.各种出血证（血热者尤宜）；2.肺热咳嗽，痰稠难咯；此外外用治脱发、烫伤", "d": "煎服10~15g；外用适量", "sp": "止血多炒炭用，化痰止咳生用", "w": "", "ap": "", "m": "侧柏叶：凉血止血，化痰"}, {"id": 222, "ch": "止血药", "sec": "凉血止血药", "n": "白茅根", "f": "凉血止血，清热利尿", "a": "1.血热妄行的出血证（尿血尤宜）；2.热淋，水肿，黄疸；此外治胃热呕吐、肺热咳嗽", "d": "煎服15~30g，鲜品加倍", "sp": "以鲜品为佳，可捣汁服；多生用，止血亦可炒炭用", "w": "", "ap": "", "m": "白茅根：凉血、止血、利尿"}, {"id": 223, "ch": "止血药", "sec": "凉血止血药", "n": "苎麻根", "f": "凉血止血，安胎，解毒", "a": "1.血热出血证；2.胎动不安，胎漏下血；3.热毒痈肿", "d": "煎服10~30g；外用适量", "sp": "外用捣敷", "w": "", "ap": "", "m": "苎麻根：止血+安胎"}, {"id": 224, "ch": "止血药", "sec": "凉血止血药", "n": "羊蹄", "f": "凉血止血，解毒杀虫，泻下", "a": "1.血热出血证；2.疥癣，疮疡，烫伤；3.大便秘结", "d": "煎服10~15g，鲜品30~45g；外用适量", "sp": "", "w": "", "ap": "", "m": "羊蹄：凉血止血，解毒杀虫"}, {"id": 225, "ch": "止血药", "sec": "化瘀止血药", "n": "三七", "f": "化瘀止血，活血定痛", "a": "1.各种内外出血证，尤以有瘀者为宜（止血不留瘀）；2.跌打损伤，瘀滞疼痛（伤科要药）；此外近年用治冠心病心绞痛、缺血性脑血管病、脑出血后遗症及血瘀型慢性肝炎", "d": "多研末服，每次1~1.5g；亦可入煎剂3~10g；外用适量", "sp": "多研末吞服；外用研末外掺或调敷", "w": "", "ap": "", "m": "三七：止血神药，化瘀不留瘀，散瘀定痛"}, {"id": 226, "ch": "止血药", "sec": "化瘀止血药", "n": "茜草", "f": "凉血化瘀止血，通经", "a": "1.血热夹瘀的出血证，如吐血、衄血、崩漏、尿血、便血等；2.血瘀经闭及跌打损伤、风湿痹痛等", "d": "煎服10~15g", "sp": "止血炒炭用，活血通经生用或酒炒用", "w": "", "ap": "", "m": "茜草：凉血化瘀止血，通经"}, {"id": 227, "ch": "止血药", "sec": "化瘀止血药", "n": "蒲黄", "f": "化瘀止血，利尿", "a": "1.各种内外出血证（寒热均可）；2.瘀滞心腹疼痛、痛经、产后瘀痛；3.血淋尿血", "d": "煎服3~10g；外用适量", "sp": "布包煎；止血多炒用，散瘀多生用", "w": "孕妇忌服", "ap": "", "m": "蒲黄：化瘀止血利尿，包煎"}, {"id": 228, "ch": "止血药", "sec": "化瘀止血药", "n": "花蕊石", "f": "化瘀止血", "a": "吐血、咯血等出血兼瘀滞者及外伤出血等", "d": "煎服10~15g；研末服，每次1~1.5g；外用适量", "sp": "打碎先煎", "w": "内无瘀滞者慎用；孕妇忌服", "ap": "", "m": "花蕊石：化瘀止血"}, {"id": 229, "ch": "止血药", "sec": "化瘀止血药", "n": "降香", "f": "化瘀止血，理气止痛", "a": "1.瘀滞性出血证，跌打损伤及内外伤出血；2.血瘀气滞之胸胁心腹疼痛及跌损瘀痛；此外能辟秽化浊、和中止呕", "d": "煎服3~6g；研末服，每次1~2g；外用适量", "sp": "宜后下", "w": "", "ap": "", "m": "降香：化瘀止血+理气止痛"}, {"id": 230, "ch": "止血药", "sec": "收敛止血药", "n": "白及", "f": "收敛止血，消肿生肌", "a": "1.内外诸出血证，如咯血、衄血、吐血、便血及外伤出血（肺胃出血尤宜）；2.痈肿，烫伤，手足皲裂，肛裂", "d": "煎服3~10g；散剂每次2~5g；外用适量", "sp": "", "w": "反乌头", "ap": "", "m": "白及：收敛止血，肺胃出血，消肿生肌，反乌头"}, {"id": 231, "ch": "止血药", "sec": "收敛止血药", "n": "仙鹤草", "f": "收敛止血，补虚，消积，止痢，杀虫", "a": "1.多种出血证（寒热虚实均可）；2.脱力劳伤，神疲乏力；3.小儿疳积；4.泻痢；5.滴虫性阴道炎，疟疾", "d": "煎服10~15g；大剂可用30~60g；外用适量", "sp": "", "w": "", "ap": "", "m": "仙鹤草：止血+补虚+止痢+杀虫"}, {"id": 232, "ch": "止血药", "sec": "收敛止血药", "n": "紫珠", "f": "收敛止血，清热解毒", "a": "1.各种内外伤出血（肺胃出血尤宜）；2.烧烫伤，疮疡肿毒", "d": "煎服10~15g；研末服1.5~3g；外用适量", "sp": "", "w": "", "ap": "", "m": "紫珠：收敛止血，清热解毒"}, {"id": 233, "ch": "止血药", "sec": "收敛止血药", "n": "棕榈炭", "f": "收敛止血", "a": "多种出血证，如吐血、衄血、崩漏、便血、尿血等，尤多用于崩漏，以无瘀滞者为宜", "d": "煎服3~10g；研末服1~1.5g", "sp": "", "w": "瘀滞之出血忌用", "ap": "", "m": "棕榈炭：收敛止血"}, {"id": 234, "ch": "止血药", "sec": "收敛止血药", "n": "血余炭", "f": "收敛止血，化瘀利尿", "a": "1.衄血、咯血、吐血、崩漏、便血、尿血、淋血等；2.小便不利", "d": "煎服6~10g；研末服1.5~3g", "sp": "", "w": "", "ap": "", "m": "血余炭：收敛止血，化瘀利尿"}, {"id": 235, "ch": "止血药", "sec": "收敛止血药", "n": "藕节", "f": "收敛止血", "a": "各种出血，如吐血、咳血、衄血、便血、崩漏等（兼能化瘀，止血而不留瘀）", "d": "煎服10~15g", "sp": "", "w": "", "ap": "", "m": "藕节：收敛止血"}, {"id": 236, "ch": "止血药", "sec": "收敛止血药", "n": "刺猬皮", "f": "收敛止血，固精缩尿，化瘀止痛", "a": "1.便血，痔血；2.遗精，遗尿；3.胃痛，呕吐", "d": "煎服3~10g；研末服1.5~3g", "sp": "", "w": "", "ap": "", "m": "刺猬皮：收敛止血，固精缩尿"}, {"id": 237, "ch": "止血药", "sec": "温经止血药", "n": "炮姜", "f": "温经止血，温中止痛", "a": "1.虚寒性出血证（吐血、便血、崩漏）；2.虚寒腹痛、腹泻", "d": "煎服3~6g", "sp": "炮姜未成炭者偏于温中散寒，主要用于虚寒腹痛腹泻；炮姜炭则专于温经止血，宜于血证", "w": "", "ap": "", "m": "炮姜：温经止血，虚寒出血"}, {"id": 238, "ch": "止血药", "sec": "温经止血药", "n": "艾叶", "f": "温经止血，散寒调经，安胎", "a": "1.虚寒性出血证（崩漏尤宜）；2.月经不调，痛经，宫冷不孕；3.胎动不安；此外煎汤外洗治湿疹瘙痒，制艾条、艾炷用于温灸，并可治寒性咳喘", "d": "煎服3~10g；外用适量", "sp": "温经止血宜炒炭用，余则生用；治咳喘入煎宜后下", "w": "", "ap": "", "m": "艾叶：温经止血，调经安胎，虚寒妇科要药"}, {"id": 239, "ch": "止血药", "sec": "温经止血药", "n": "灶心土", "f": "温中止血，止呕，止泻", "a": "1.脾气虚寒不能统血之吐血、便血；2.胃寒呕吐，妊娠恶阻；3.脾虚久泻", "d": "煎服15~30g；或用60~120g", "sp": "布包先煎；或大量煎汤代水", "w": "", "ap": "", "m": "灶心土：温中止血，止呕止泻，先煎代水"}, {"id": 240, "ch": "活血化瘀药", "sec": "活血止痛药", "n": "川芎", "f": "活血行气，祛风止痛", "a": "1.血瘀气滞的痛证（\"血中气药\"，月经不调、经闭痛经、产后瘀痛、胸痹心痛、胁痛、跌打损伤）；2.头痛（治头痛要药），风湿痹痛", "d": "煎服3~10g", "sp": "", "w": "凡阴虚火旺、多汗及月经过多者应慎用", "ap": "", "m": "川芎：血中气药，头痛要药，行气活血"}, {"id": 241, "ch": "活血化瘀药", "sec": "活血止痛药", "n": "延胡索", "f": "活血，行气，止痛", "a": "主要用于气血瘀滞诸痛证（\"专治一身上下诸痛\"）", "d": "煎服3~10g；研末服1.5~3g", "sp": "多醋制后用，醋制后可使有效成分溶解度大大提高而加强止痛药效", "w": "", "ap": "", "m": "延胡索：止痛，行气活血，诸痛皆宜"}, {"id": 242, "ch": "活血化瘀药", "sec": "活血止痛药", "n": "郁金", "f": "活血行气止痛，解郁清心，利胆退黄，凉血", "a": "1.气滞血瘀的胸、胁、腹痛；2.热病神昏，癫痫痰闭；3.肝胆湿热黄疸、胆石症；4.吐血、衄血、倒经、尿血、血淋", "d": "煎服5~12g；研末服2~5g", "sp": "", "w": "畏丁香", "ap": "", "m": "郁金：活血行气，利胆，凉血，畏丁香"}, {"id": 243, "ch": "活血化瘀药", "sec": "活血止痛药", "n": "姜黄", "f": "活血行气，通经止痛", "a": "1.血瘀气滞的心、腹、胸、胁痛，经闭，产后腹痛及跌打损伤；2.风湿痹痛（尤长于行肢臂）", "d": "煎服3~10g；外用适量", "sp": "", "w": "", "ap": "", "m": "姜黄：偏于上肢肩臂痛，破血行气"}, {"id": 244, "ch": "活血化瘀药", "sec": "活血止痛药", "n": "乳香", "f": "活血行气止痛，消肿生肌", "a": "1.外伤科跌打损伤，疮疡痈肿；2.瘀血阻滞诸痛证，如心腹瘀痛、癥瘕积聚及风湿痹痛等", "d": "煎服3~10g；外用适量", "sp": "宜炒去油用；外用生用或炒用，研末外敷", "w": "孕妇及无瘀滞者忌用；气浊味苦，易致恶心呕吐，内服不宜多用，胃弱者慎用", "ap": "", "m": "乳香：消肿生肌，内服外用，没药常配"}, {"id": 245, "ch": "活血化瘀药", "sec": "活血止痛药", "n": "没药", "f": "活血止痛，消肿生肌", "a": "功效主治与乳香相似：跌打损伤瘀滞肿痛，外科痈疽肿痛，疮疡溃后久不收口以及一切瘀滞痛证，常与乳香相须为用", "d": "用法用量同乳香", "sp": "", "w": "与乳香同；如与乳香同用，两药用量皆须相应减少", "ap": "", "m": "没药：活血止痛，消肿生肌，与乳香同用"}, {"id": 246, "ch": "活血化瘀药", "sec": "活血止痛药", "n": "五灵脂", "f": "活血止痛，化瘀止血", "a": "1.瘀血阻滞诸痛证（胸胁脘腹刺痛、痛经、经闭、产后瘀痛）；2.瘀滞出血证（崩漏、月经过多）", "d": "煎服3~10g；外用适量", "sp": "包煎，或入丸、散用", "w": "血虚无瘀及孕妇慎用；\"十九畏\"认为人参畏五灵脂，一般不宜同用", "ap": "", "m": "五灵脂：活血止痛，化瘀止血，包煎，人参畏五灵脂"}, {"id": 247, "ch": "活血化瘀药", "sec": "活血调经药", "n": "丹参", "f": "活血调经，凉血消痈，安神", "a": "1.妇女月经不调，痛经，经闭，产后瘀滞腹痛；2.血瘀之心胸、脘腹疼痛及癥瘕积聚、风湿痹痛等；3.疮疡痈肿；4.热病烦躁昏迷及杂病心悸失眠等", "d": "煎服5~15g", "sp": "活血化瘀宜酒炙用", "w": "反藜芦", "ap": "", "m": "丹参：一味丹参，功同四物；活血，凉血消痈，安神，反藜芦"}, {"id": 248, "ch": "活血化瘀药", "sec": "活血调经药", "n": "红花", "f": "活血通经，祛瘀止痛", "a": "1.血滞经闭、痛经、产后瘀滞腹痛等证；2.癥瘕积聚，心腹瘀痛及跌打损伤、血脉闭塞紫肿疼痛等；3.斑疹色暗、热郁血瘀者", "d": "煎服3~9g；外用适量", "sp": "", "w": "孕妇忌服；有出血倾向者不宜多用", "ap": "番红花：功效与红花相似而力较强，性凉兼能凉血解毒，尤宜于斑疹大热、温病热入营血，用量宜小（1.5~3g）", "m": "红花：活血通经，祛瘀止痛，孕妇忌"}, {"id": 249, "ch": "活血化瘀药", "sec": "活血调经药", "n": "桃仁", "f": "活血祛瘀，润肠通便", "a": "1.多种瘀血证，如经闭、痛经、产后瘀滞腹痛、癥积及跌打损伤等；2.肺痈、肠痈；3.肠燥便秘；此外能止咳平喘", "d": "煎服5~10g", "sp": "宜捣碎入煎", "w": "孕妇忌服；便溏者慎用；有毒，不可过量，过量可出现头痛、目眩、心悸，甚至呼吸衰竭而死亡", "ap": "", "m": "桃仁：活血祛瘀，润肠通便，苦杏仁止咳平喘"}, {"id": 250, "ch": "活血化瘀药", "sec": "活血调经药", "n": "益母草", "f": "活血调经，利水消肿", "a": "1.血滞经闭、痛经、经行不畅、产后瘀滞腹痛、恶露不尽等（妇科经产要药）；2.水肿，小便不利；此外用于跌打损伤、疮痈肿毒、皮肤痒疹", "d": "煎服10~30g，或熬膏、入丸剂；外用适量", "sp": "外用捣敷或煎水外洗", "w": "孕妇忌服；血虚无瘀者慎用", "ap": "", "m": "益母草：妇科经产要药，活血+利水"}, {"id": 251, "ch": "活血化瘀药", "sec": "活血调经药", "n": "泽兰", "f": "活血祛瘀，调经，利水消肿", "a": "1.妇科血瘀经闭、痛经、产后瘀滞腹痛等；2.跌打损伤瘀肿疼痛及痈肿等；3.产后水肿、浮肿、腹水等", "d": "煎服10~15g；外用适量", "sp": "", "w": "无瘀滞者慎服", "ap": "", "m": "泽兰：活血，调经，利水"}, {"id": 252, "ch": "活血化瘀药", "sec": "活血调经药", "n": "牛膝", "f": "活血通经，补肝肾，强筋骨，利水通淋，引火（血）下行", "a": "1.瘀血阻滞的经闭、痛经、月经不调、产后腹痛及跌打伤痛；2.肾虚腰痛及久痹腰膝酸痛乏力；3.淋证、水肿、小便不利；4.头痛、眩晕、齿痛、口舌生疮及吐血、衄血（火热上炎、阴虚火旺）", "d": "煎服6~15g", "sp": "活血通经、利水通淋、引火下行宜生用；补肝肾强筋骨宜酒炙用", "w": "孕妇及月经过多者忌用；肾虚滑精、脾虚溏泄者亦不宜用", "ap": "", "m": "牛膝：活血通经，补肝肾，引血下行，川牛膝偏活血"}, {"id": 253, "ch": "活血化瘀药", "sec": "活血调经药", "n": "鸡血藤", "f": "行血补血，调经，舒筋活络", "a": "1.月经不调、经行不畅、痛经、血虚经闭等证；2.风湿痹痛及手足麻木、肢体瘫痪、血虚萎黄等", "d": "煎服10~15g；大剂量可用30g", "sp": "或浸酒服，或熬成膏服", "w": "", "ap": "", "m": "鸡血藤：补血+活血"}, {"id": 254, "ch": "活血化瘀药", "sec": "活血调经药", "n": "王不留行", "f": "活血通经，下乳，消痈，利尿通淋", "a": "1.血瘀经闭、痛经等证；2.产后乳汁不下，乳痈；3.热淋、血淋、石淋等证", "d": "煎服5~10g", "sp": "", "w": "孕妇慎用", "ap": "", "m": "王不留行：下乳要药，通经"}, {"id": 255, "ch": "活血化瘀药", "sec": "活血调经药", "n": "月季花", "f": "活血调经，疏肝解郁，消肿解毒", "a": "1.肝郁血滞之月经不调、痛经、闭经及胸胁胀痛；2.跌打损伤，痈疽肿毒，瘰疬", "d": "煎服2~5g；外用适量", "sp": "不宜久煎，亦可泡服，或研末服", "w": "用量不宜过大，过量可引起腹痛，多服久服可引起便溏腹泻；孕妇亦当慎用", "ap": "", "m": "月季花：活血调经"}, {"id": 256, "ch": "活血化瘀药", "sec": "活血调经药", "n": "凌霄花", "f": "破瘀通经，凉血祛风", "a": "1.血瘀经闭、癥瘕积聚及跌打损伤；2.风疹、皮癣、皮肤瘙痒、痤疮", "d": "煎服3~10g；外用适量", "sp": "", "w": "孕妇忌服", "ap": "", "m": "凌霄花：破瘀通经"}, {"id": 257, "ch": "活血化瘀药", "sec": "活血疗伤药", "n": "䗪虫（土鳖虫）", "f": "破血逐瘀，续筋接骨", "a": "1.跌打损伤，筋伤骨折，瘀肿疼痛（伤科常用）；2.血瘀经闭，产后瘀滞腹痛，积聚痞块", "d": "煎服3~10g；研末服1~1.5g；外用适量", "sp": "研末服以黄酒送服为佳", "w": "孕妇忌服", "ap": "", "m": "土鳖虫：破血逐瘀，续筋接骨"}, {"id": 258, "ch": "活血化瘀药", "sec": "活血疗伤药", "n": "自然铜", "f": "散瘀止痛，接骨疗伤", "a": "跌打损伤，骨折筋断，瘀肿疼痛（伤科接骨续筋要药）", "d": "煎服10~15g；醋淬研末服，每次0.3g", "sp": "多入丸散，醋淬研末服", "w": "不宜久服；凡阴虚火旺、血虚无瘀者应慎用", "ap": "", "m": "自然铜：接骨疗伤要药，先煎"}, {"id": 259, "ch": "活血化瘀药", "sec": "活血疗伤药", "n": "苏木", "f": "活血疗伤，祛瘀通经", "a": "1.跌打损伤，骨折筋伤，瘀滞肿痛；2.血滞经闭，产后瘀阻腹痛，痛经，心腹疼痛，痈肿疮毒等", "d": "煎服3~10g；外用适量", "sp": "外用研末撒", "w": "", "ap": "", "m": "苏木：活血疗伤，祛瘀通经"}, {"id": 260, "ch": "活血化瘀药", "sec": "活血疗伤药", "n": "骨碎补", "f": "活血续伤，补肾强骨", "a": "1.跌打损伤或创伤，筋骨损伤，瘀滞肿痛；2.肾虚腰痛脚弱，耳鸣耳聋，牙痛，久泄；此外外用治斑秃、白癜风", "d": "煎服10~15g；外用适量", "sp": "", "w": "阴虚内热或无瘀血者慎服", "ap": "", "m": "骨碎补：活血续伤，补肾强骨"}, {"id": 261, "ch": "活血化瘀药", "sec": "活血疗伤药", "n": "马钱子", "f": "散结消肿，通络止痛", "a": "1.跌打损伤，骨折肿痛；2.痈疽疮毒，咽喉肿痛；3.风湿顽痹，麻木瘫痪", "d": "日服0.3~0.6g；外用适量", "sp": "内服宜制，多入丸散；外用研末调涂", "w": "内服不可多服久服，且需砂烫至鼓起并呈棕褐色或深棕色方可入药；孕妇禁用；过量中毒可引起肢体颤动、惊厥、呼吸困难，甚至昏迷", "ap": "", "m": "马钱子：通络止痛，有大毒，炮制后入丸散"}, {"id": 262, "ch": "活血化瘀药", "sec": "活血疗伤药", "n": "血竭", "f": "活血疗伤，止血生肌", "a": "1.跌打损伤，瘀滞心腹疼痛；2.外伤出血；3.疮疡不敛", "d": "内服研末，每次1~2g，或入丸剂；外用适量", "sp": "不入煎剂，研末服或入丸散；外用研末撒或入膏药", "w": "无瘀血者不宜用；孕妇及月经期忌用", "ap": "", "m": "血竭：伤科要药，止血生肌，研末"}, {"id": 263, "ch": "活血化瘀药", "sec": "活血疗伤药", "n": "儿茶", "f": "活血疗伤，止血生肌敛疮", "a": "主要用于外伤瘀肿、出血，以及疮痈、湿疮、牙疳等；此外治肺热咳嗽", "d": "内服入煎1~3g；外用适量", "sp": "外用研末撒或调敷；入煎宜布包；多入丸散服", "w": "", "ap": "", "m": "儿茶：活血疗伤，止血，敛疮，包煎"}, {"id": 264, "ch": "活血化瘀药", "sec": "活血疗伤药", "n": "刘寄奴", "f": "破血疗伤，通经，止痛，止血", "a": "1.跌打损伤，瘀滞肿痛，外伤出血；2.血瘀经闭、产后瘀滞腹痛等；此外尚能消食化积止泻痢，治食积腹痛、赤白痢", "d": "煎服3~10g；外用适量", "sp": "外用研末撒或调敷", "w": "孕妇慎服", "ap": "", "m": "刘寄奴：破血疗伤"}, {"id": 265, "ch": "活血化瘀药", "sec": "破血消癥药", "n": "莪术", "f": "破血行气，消积止痛", "a": "1.气滞血瘀所致的癥瘕积聚、经闭以及心腹瘀痛等；2.食积脘腹胀痛；此外用于跌打损伤瘀肿疼痛", "d": "煎服3~15g；外用适量", "sp": "醋制后可加强祛瘀止痛作用", "w": "孕妇及月经过多者忌用", "ap": "", "m": "莪术：破血行气，消积（偏气）"}, {"id": 266, "ch": "活血化瘀药", "sec": "破血消癥药", "n": "三棱", "f": "破血行气，消积止痛", "a": "所治病证与莪术基本相同，常相须而用；然三棱偏于破血，莪术偏于破气", "d": "煎服3~10g", "sp": "醋炙可加强止痛作用", "w": "同莪术", "ap": "", "m": "三棱：破血行气，消积（偏血）"}, {"id": 267, "ch": "活血化瘀药", "sec": "破血消癥药", "n": "水蛭", "f": "破血逐瘀消癥", "a": "癥瘕积聚，血瘀经闭及跌打损伤等", "d": "入煎剂1.5~3g；研末服0.3~0.5g", "sp": "以入丸散或研末服为宜；或以鲜活者放置瘀肿局部吸血消瘀", "w": "孕妇忌服", "ap": "", "m": "水蛭：破血逐瘀，研末"}, {"id": 268, "ch": "活血化瘀药", "sec": "破血消癥药", "n": "虻虫", "f": "破血逐瘀消癥", "a": "癥瘕积聚，血瘀经闭及跌打损伤", "d": "煎服1~1.5g；研末服0.3g", "sp": "", "w": "孕妇及体虚无瘀、腹泻者忌用", "ap": "", "m": "虻虫：破血逐瘀"}, {"id": 269, "ch": "活血化瘀药", "sec": "破血消癥药", "n": "斑蝥", "f": "破血逐瘀消癥，攻毒散结", "a": "1.癥瘕，经闭；2.痈疽恶疮，顽癣，瘰疬等；此外外敷发泡可治面瘫、风湿痹痛等", "d": "内服多入丸散，0.03~0.06g；外用适量", "sp": "内服需以糯米同炒，或配青黛、丹参以缓其毒；外用研末敷贴，或酒、醋浸涂，或作发泡用", "w": "有大毒，内服宜慎，应严格掌握剂量，体弱及孕妇忌服；外用可刺激皮肤发红发泡甚至腐烂，不宜大面积使用；内服过量可引起恶心、呕吐、腹泻、尿血及肾功能损害", "ap": "", "m": "斑蝥：破血逐瘀，外用发疱，大毒"}, {"id": 270, "ch": "活血化瘀药", "sec": "破血消癥药", "n": "穿山甲", "f": "活血消癥，通经，下乳，消肿排脓", "a": "1.癥瘕，经闭，以及风湿痹痛等；2.产后乳汁不下；3.痈肿疮毒，瘰疬等", "d": "煎服3~10g；研末服1~1.5g", "sp": "", "w": "孕妇及痈肿已溃者忌用", "ap": "", "m": "穿山甲：通经下乳，消肿排脓"}, {"id": 271, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "半夏", "f": "燥湿化痰，降逆止呕，消痞散结；外用消肿止痛", "a": "1.湿痰，寒痰证（燥湿化痰、温化寒痰要药）；2.胃气上逆呕吐（止呕要药）；3.心下痞，结胸，梅核气等；4.瘿瘤痰核，痈疽肿毒及毒蛇咬伤等（外用）", "d": "煎服3~10g；外用适量", "sp": "一般宜制过用：姜半夏长于降逆止呕；法半夏长于燥湿且温性较弱；半夏曲有化痰消食之功；竹沥半夏药性由温变凉，能清化热痰，主治热痰、风痰之证", "w": "反乌头；性温燥，阴虚燥咳、血证、热痰、燥痰应慎用", "ap": "", "m": "半夏：燥湿化痰，止呕圣药，消痞，外用消肿，反乌头"}, {"id": 272, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "天南星", "f": "燥湿化痰，祛风解痉；外用消肿止痛", "a": "1.湿痰，寒痰证（顽痰）；2.风痰证，如眩晕、中风、癫痫、口眼㖞斜及破伤风等；3.痈疽肿痛，毒蛇咬伤等（外用）", "d": "煎服3~10g；外用适量", "sp": "多制用", "w": "阴虚燥痰及孕妇忌用", "ap": "胆南星：天南星用牛胆汁拌制而成，性凉，清热化痰、息风定惊；用于中风、癫痫、惊风、头风眩晕、痰火喘咳，煎服2~5g", "m": "南星：燥湿化痰+祛风解痉，风痰要药，外用消肿"}, {"id": 273, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "禹白附", "f": "祛风痰，燥湿痰，止痉，止痛，解毒散结", "a": "1.中风口眼㖞斜、惊风癫痫、破伤风、偏头痛等风痰、头面诸疾；2.瘰疬痰核及毒蛇咬伤", "d": "煎服3~5g；研末服0.5~1g；外用适量", "sp": "", "w": "辛温燥烈，阴虚血虚动风或热动肝风以及孕妇均不宜用；生品一般不内服", "ap": "", "m": "禹白附：祛风痰，止痉，头面部风痰"}, {"id": 274, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "白芥子", "f": "温肺化痰，利气散结", "a": "1.寒痰喘咳，悬饮等（善治\"皮里膜外\"之痰）；2.阴疽流注及痰阻经络关节之肢体麻木、关节肿痛等", "d": "煎服3~6g；外用适量", "sp": "外用研末调敷，或作发泡用", "w": "辛温走散，耗气伤阴，久咳肺虚及阴虚火旺者忌用；对皮肤粘膜有刺激，易发泡，有消化道溃疡、出血者及皮肤过敏者忌用；用量不宜过大，过量易致胃肠炎，产生腹痛、腹泻", "ap": "", "m": "白芥子：温肺化痰，皮里膜外之痰，利气散结"}, {"id": 275, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "皂荚", "f": "祛顽痰，通窍开闭，祛风杀虫", "a": "1.顽痰阻肺，咳喘痰多；2.中风、痰厥、癫痫、喉痹痰盛（研末吹鼻取嚏）；3.疮肿未溃，皮癣（外用）；此外可通便", "d": "多研末服，1~1.5g；亦可入汤剂1.5~5g；外用适量", "sp": "多研末服或入丸散", "w": "内服剂量不宜过大，大则引起呕吐、腹泻；辛散走窜之性极强，非顽痰证实体壮者不宜轻投；孕妇、气虚阴亏及有出血倾向者忌用", "ap": "皂角刺：消肿排脓、祛风杀虫；用于痈疽疮毒初起或脓成不溃之证以及皮癣、麻风等；煎服3~10g，外用适量醋煎涂患处；痈疽已溃者忌用", "m": "皂荚：祛顽痰，开窍"}, {"id": 276, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "旋覆花", "f": "降气化痰，降逆止呕", "a": "1.咳喘痰多，痰饮蓄结，胸膈痞满；2.噫气，呕吐", "d": "煎服3~10g", "sp": "宜布包煎（有绒毛，易刺激咽喉作痒而致呛咳呕吐）", "w": "阴虚劳嗽、津伤燥咳者忌用", "ap": "金沸草：旋覆花的地上部分，性味功效与旋覆花相似，性善疏散，主要用于外感咳嗽痰多，煎服5~10g", "m": "旋覆花：降气化痰，止呕，包煎"}, {"id": 277, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "白前", "f": "降气化痰", "a": "咳嗽痰多，胸满喘急（寒热均可配伍）", "d": "煎服3~10g", "sp": "", "w": "", "ap": "", "m": "白前：降气化痰，肺气壅实咳嗽"}, {"id": 278, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "前胡", "f": "降气化痰，宣散风热", "a": "1.咳喘痰多色黄者；2.外感风热咳嗽有痰者", "d": "煎服6~10g", "sp": "", "w": "", "ap": "", "m": "前胡：降气化痰+宣散风热"}, {"id": 279, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "桔梗", "f": "宣肺化痰，利咽，排脓", "a": "1.肺气不宣的咳嗽痰多，胸闷不畅；2.咽喉肿痛，失音；3.肺痈咳吐脓痰；此外可宣开肺气而通二便，用治癃闭、便秘", "d": "煎服3~6g；用于排脓可用10g", "sp": "排脓时加大用量", "w": "性升散，凡气机上逆、呕吐、呛咳、眩晕，阴虚火旺咳血等不宜用；用量过大易致恶心呕吐；桔梗皂甙有溶血作用，不宜作注射给药", "ap": "", "m": "桔梗：宣肺、利咽、排脓，载药上行（舟楫）"}, {"id": 280, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "川贝母", "f": "清热化痰，润肺止咳，散结消肿", "a": "1.虚劳咳嗽，肺热燥咳；2.瘰疬，乳痈，肺痈，疮痈", "d": "煎服3~10g；研末服1~2g", "sp": "可研末吞服", "w": "反乌头", "ap": "", "m": "川贝：清热化痰+润肺，虚劳燥咳；不宜与乌头同用"}, {"id": 281, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "浙贝母", "f": "清热化痰，开郁散结", "a": "1.风热、燥热、痰热咳嗽；2.瘰疬，瘿瘤，痈疡疮毒，肺痈", "d": "煎服3~10g", "sp": "", "w": "同川贝母（反乌头）", "ap": "", "m": "浙贝：清热化痰+开郁散结，外感风热咳嗽，反乌头"}, {"id": 282, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "瓜蒌", "f": "清热化痰，宽胸散结，润肠通便", "a": "1.痰热咳喘；2.胸痹，结胸；3.肺痈，肠痈，乳痈；4.肠燥便秘", "d": "煎服，全瓜蒌10~20g，瓜蒌皮6~12g，瓜蒌仁10~15g", "sp": "瓜蒌仁打碎入煎；瓜蒌皮重在清热化痰、宽胸理气，瓜蒌仁重在润燥化痰、润肠通便", "w": "甘寒而滑，脾虚便溏及湿痰、寒痰者忌用；反乌头", "ap": "", "m": "瓜蒌：清热化痰，宽胸散结，润肠，反乌头"}, {"id": 283, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "竹茹", "f": "清热化痰，除烦止呕", "a": "1.痰热所致的咳嗽或心烦不眠等；2.胃热呕吐；此外有凉血止血作用，可用于吐血、衄血、崩漏等", "d": "煎服6~10g", "sp": "生用清化痰热，姜汁炙用止呕", "w": "", "ap": "", "m": "竹茹：清热化痰，除烦止呕"}, {"id": 284, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "竹沥", "f": "清热豁痰，定惊利窍", "a": "1.痰热咳喘；2.中风痰迷，惊痫癫狂", "d": "内服30~50g", "sp": "冲服；本品不能久藏，但可熬膏瓶贮，称竹沥膏；安瓿瓶密封装置可以久藏", "w": "性寒滑，对寒痰及便溏者忌用", "ap": "", "m": "竹沥：清热豁痰，定惊，中风痰迷"}, {"id": 285, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "天竹黄", "f": "清热化痰，清心定惊", "a": "小儿惊风，中风癫痫，热病神昏等心肝经痰热证", "d": "煎服3~6g；研粉冲服，每次0.6~1g", "sp": "可研粉冲服", "w": "", "ap": "", "m": "天竺黄：清热化痰，清心定惊，小儿惊风"}, {"id": 286, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "海藻", "f": "消痰软坚，利水消肿", "a": "1.瘿瘤，瘰疬，睾丸肿痛等；2.脚气浮肿及水肿等", "d": "煎服10~15g", "sp": "", "w": "传统认为反甘草，但临床也每有配伍同用者", "ap": "", "m": "海藻：消痰软坚，瘿瘤瘰疬，反甘草"}, {"id": 287, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "昆布", "f": "消痰软坚，利水消肿", "a": "同海藻，常与海藻相须而用", "d": "煎服6~12g", "sp": "", "w": "", "ap": "", "m": "昆布：消痰软坚，利水，含碘"}, {"id": 288, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "黄药子", "f": "消痰软坚散结，清热解毒", "a": "1.瘿瘤；2.疮疡肿毒，咽喉肿痛及毒蛇咬伤等；此外还有凉血止血作用，可用于吐血、衄血、咯血等，并兼有止咳平喘作用", "d": "煎服5~15g；研末服1~2g", "sp": "", "w": "有毒，不宜过量；多服、久服可引起吐泻腹痛等消化道反应，并对肝脏有一定损害，脾胃虚弱及肝功能损害者慎用", "ap": "", "m": "黄药子：消痰软坚，有毒"}, {"id": 289, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "海蛤壳", "f": "清肺化痰，软坚散结", "a": "1.肺热、痰热咳喘；2.瘿瘤，痰核；此外有利尿、制酸作用", "d": "煎服10~15g", "sp": "蛤粉宜包煎", "w": "", "ap": "", "m": "海蛤壳：清肺化痰，软坚"}, {"id": 290, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "海浮石", "f": "清肺化痰，软坚散结", "a": "1.痰热咳喘；2.瘰疬，瘿瘤；此外能利尿通淋，治血淋、石淋", "d": "煎服10~15g", "sp": "打碎先煎", "w": "", "ap": "", "m": "海浮石：清肺化痰，软坚散结"}, {"id": 291, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "瓦楞子", "f": "消痰软坚，化瘀散结", "a": "1.瘰疬，瘿瘤；2.癥瘕痞块；此外煅用可制酸止痛，治胃痛泛酸", "d": "煎服10~15g；研末服，每次1~3g", "sp": "宜先煎；生用消痰散结，煅用制酸止痛", "w": "", "ap": "", "m": "瓦楞子：消痰软坚，化瘀，制酸"}, {"id": 292, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "礞石", "f": "坠痰下气，平肝镇惊", "a": "1.顽痰、老痰胶结，气逆喘咳；2.癫狂，惊痫", "d": "煎服6~10g；入丸散1.5~3g", "sp": "宜打碎布包先煎", "w": "重坠性猛，非痰热内结不化之实证不宜使用；脾虚胃弱、小儿慢惊及孕妇忌用", "ap": "", "m": "礞石：坠痰下气，平肝镇惊，顽痰"}, {"id": 293, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "胖大海", "f": "清肺化痰，利咽开音，润肠通便", "a": "1.肺热声哑，咽喉疼痛，咳嗽；2.燥热便秘，头痛目赤", "d": "2~4枚", "sp": "沸水泡服或煎服", "w": "", "ap": "", "m": "胖大海：清肺利咽开音，润肠"}, {"id": 294, "ch": "化痰止咳平喘药", "sec": "止咳平喘药", "n": "苦杏仁", "f": "止咳平喘，润肠通便", "a": "1.咳嗽气喘（治咳喘要药，随证配伍用于多种咳喘）；2.肠燥便秘", "d": "煎服3~10g", "sp": "宜打碎入煎", "w": "有小毒，用量不宜过大；婴儿慎用", "ap": "甜杏仁：性味甘平，功能润肺止咳，主要用于虚劳咳嗽，煎服5~10g", "m": "苦杏仁：止咳平喘，润肠，有小毒"}, {"id": 295, "ch": "化痰止咳平喘药", "sec": "止咳平喘药", "n": "苏子", "f": "降气化痰，止咳平喘，润肠通便", "a": "1.痰壅气逆，咳嗽气喘；2.肠燥便秘", "d": "煎服5~10g", "sp": "", "w": "阴虚喘咳及脾虚便溏者慎用", "ap": "", "m": "苏子：降气化痰，止咳平喘，润肠"}, {"id": 296, "ch": "化痰止咳平喘药", "sec": "止咳平喘药", "n": "百部", "f": "润肺止咳，杀虫", "a": "1.新久咳嗽，百日咳，肺痨咳嗽；2.蛲虫、阴道滴虫、头虱及疥癣等（外用）", "d": "煎服5~15g；外用适量", "sp": "久咳虚嗽宜蜜炙用", "w": "", "ap": "", "m": "百部：润肺止咳，杀虫（灭虱）"}, {"id": 297, "ch": "化痰止咳平喘药", "sec": "止咳平喘药", "n": "紫菀", "f": "润肺化痰止咳", "a": "用于咳嗽有痰（寒热虚实皆可）；此外还可用于肺痈、胸痹及小便不通等证", "d": "煎服5~10g", "sp": "外感暴咳生用，肺虚久咳蜜炙用", "w": "", "ap": "", "m": "紫菀：润肺化痰止咳，咳嗽之要药"}, {"id": 298, "ch": "化痰止咳平喘药", "sec": "止咳平喘药", "n": "款冬花", "f": "润肺止咳化痰", "a": "用于多种咳嗽（常与紫菀相须为用）", "d": "煎服5~10g", "sp": "外感暴咳宜生用，内伤久咳宜炙用", "w": "", "ap": "", "m": "款冬花：润肺止咳，常与紫菀相须"}, {"id": 299, "ch": "化痰止咳平喘药", "sec": "止咳平喘药", "n": "马兜铃", "f": "清肺化痰，止咳平喘", "a": "主要用于肺热咳喘；此外煎汤熏洗治痔疮肿痛，并能清热平肝降压", "d": "煎服3~10g；外用适量", "sp": "外用煎汤熏洗；一般生用，肺虚久咳炙用", "w": "用量不宜过大，以免引起呕吐", "ap": "", "m": "马兜铃：清肺化痰平喘（含马兜铃酸）"}, {"id": 300, "ch": "化痰止咳平喘药", "sec": "止咳平喘药", "n": "枇杷叶", "f": "清肺化痰止咳，降逆止呕", "a": "1.肺热咳嗽，气逆喘急；2.胃热呕吐，哕逆", "d": "煎服5~10g", "sp": "止咳宜炙用，止呕宜生用", "w": "", "ap": "", "m": "枇杷叶：清肺止咳，降逆止呕"}, {"id": 301, "ch": "化痰止咳平喘药", "sec": "止咳平喘药", "n": "桑白皮", "f": "泻肺平喘，利水消肿", "a": "1.肺热咳喘；2.水肿（风水、皮水）", "d": "煎服5~15g", "sp": "泻肺利水、平肝清火宜生用；肺虚咳嗽宜蜜炙用", "w": "", "ap": "", "m": "桑白皮：泻肺平喘，利水"}, {"id": 302, "ch": "化痰止咳平喘药", "sec": "止咳平喘药", "n": "葶苈子", "f": "泻肺平喘，利水消肿", "a": "1.痰涎壅盛，喘咳不得平卧之证；2.水肿、悬饮、胸腹积水、小便不利等", "d": "煎服5~10g；研末服3~6g", "sp": "", "w": "", "ap": "", "m": "葶苈子：泻肺平喘，利水，包煎"}, {"id": 303, "ch": "化痰止咳平喘药", "sec": "止咳平喘药", "n": "白果", "f": "敛肺化痰定喘，止带缩尿", "a": "1.哮喘痰嗽；2.带下，白浊，小便频数，遗尿等", "d": "煎服5~10g", "sp": "捣碎入煎", "w": "有毒，不可多用，小儿尤当注意", "ap": "银杏叶：敛肺平喘、活血止痛；用于肺虚咳喘，以及高血脂、高血压、冠心病心绞痛、脑血管痉挛等", "m": "白果：敛肺定喘，止带缩尿，有毒"}, {"id": 304, "ch": "化痰止咳平喘药", "sec": "止咳平喘药", "n": "矮地茶", "f": "止咳平喘，清利湿热，活血化瘀", "a": "1.咳喘痰多；2.湿热黄疸，水肿；3.跌打损伤，风湿痹痛，经闭", "d": "煎服10~30g", "sp": "", "w": "", "ap": "", "m": "矮地茶：止咳平喘，活血化瘀"}, {"id": 305, "ch": "化痰止咳平喘药", "sec": "止咳平喘药", "n": "洋金花", "f": "平喘止咳，镇痛止痉", "a": "1.哮喘咳嗽；2.心腹疼痛，风湿痹痛，跌打损伤；3.癫痫，小儿慢惊风；4.麻醉", "d": "内服多作散剂吞服，0.3~0.6g；如作卷烟吸，每日不超过1.5g", "sp": "多作散剂吞服，或作卷烟分次燃吸", "w": "有毒，应控制剂量；表证未解、痰多粘稠者忌用；青光眼患者忌用；高血压、心脏病以及孕妇、体弱者均应慎用", "ap": "", "m": "洋金花：平喘止咳，镇痛，有毒"}, {"id": 306, "ch": "安神药", "sec": "重镇安神药", "n": "朱砂", "f": "镇心安神，清热解毒", "a": "1.心神不宁，心悸，失眠；2.惊风，癫痫；3.疮疡肿毒，咽喉肿痛，口舌生疮", "d": "入丸散或研末冲服，每次0.3~1g；外用适量", "sp": "不入煎剂，只入丸散或研末冲服", "w": "有毒，内服不可过量或持续服用，以防汞中毒；忌火煅，火煅则析出水银，有剧毒", "ap": "", "m": "朱砂：镇心安神，清热解毒，有毒，不入煎剂，研末"}, {"id": 307, "ch": "安神药", "sec": "重镇安神药", "n": "磁石", "f": "镇惊安神，平肝潜阳，聪耳明目，纳气定喘", "a": "1.心神不宁，惊悸，失眠，癫痫；2.肝阳眩晕；3.耳鸣耳聋，视物昏花；4.肾虚气喘", "d": "煎服15~30g；入丸散每次1~3g", "sp": "宜打碎先煎；镇惊安神、平肝潜阳宜生用，聪耳明目、纳气平喘宜醋淬后用", "w": "因吞服后不易消化，如入丸散不可多服；脾胃虚弱者慎用", "ap": "", "m": "磁石：镇惊安神，平肝，聪耳明目，纳气，先煎"}, {"id": 308, "ch": "安神药", "sec": "重镇安神药", "n": "龙骨", "f": "镇惊安神，平肝潜阳，收敛固涩", "a": "1.心神不宁，心悸失眠，惊痫癫狂；2.肝阳眩晕；3.滑脱诸证（遗精、带下、虚汗、崩漏）；4.湿疮痒疹，疮疡久溃不敛（外用）", "d": "煎服15~30g；外用适量", "sp": "入煎剂宜先煎；收敛固涩宜煅用，余皆生用", "w": "", "ap": "龙齿：较龙骨更长于镇惊安神，主要用于惊痫癫狂、心悸、失眠等证，用法用量与龙骨相同", "m": "龙骨：镇惊安神，平肝潜阳，收敛固涩，先煎"}, {"id": 309, "ch": "安神药", "sec": "重镇安神药", "n": "琥珀", "f": "镇惊安神，活血散瘀，利尿通淋", "a": "1.心神不宁，心悸失眠，惊风癫痫；2.瘀血阻滞证（经闭痛经、癥瘕、心腹刺痛）；3.淋证，癃闭；此外外用可生肌收敛，用于痈肿疮毒", "d": "研末冲服，每次1.5~3g", "sp": "不入煎剂，研末冲服", "w": "", "ap": "", "m": "琥珀：镇惊安神，活血利尿，研末"}, {"id": 310, "ch": "安神药", "sec": "养心安神药", "n": "酸枣仁", "f": "养心益肝，安神，敛汗", "a": "1.心悸失眠（养心安神要药）；2.体虚多汗（自汗、盗汗）", "d": "煎服10~20g；研末吞服，每次1.5~3g", "sp": "可研末吞服", "w": "", "ap": "", "m": "酸枣仁：养心益肝安神，敛汗，宜捣碎"}, {"id": 311, "ch": "安神药", "sec": "养心安神药", "n": "柏子仁", "f": "养心安神，润肠通便", "a": "1.心悸失眠；2.肠燥便秘", "d": "煎服10~20g", "sp": "", "w": "便溏及多痰者慎用", "ap": "", "m": "柏子仁：养心安神，润肠"}, {"id": 312, "ch": "安神药", "sec": "养心安神药", "n": "远志", "f": "宁心安神，祛痰开窍，消散痈肿", "a": "1.惊悸，失眠健忘；2.痰阻心窍，癫痫发狂；3.咳嗽痰多；4.痈疽疮毒，乳房肿痛", "d": "煎服5~15g；外用适量", "sp": "", "w": "有胃炎及胃溃疡者慎用", "ap": "", "m": "远志：宁心安神，祛痰开窍，消痈"}, {"id": 313, "ch": "安神药", "sec": "养心安神药", "n": "合欢皮", "f": "安神解郁，活血消肿", "a": "1.忿怒忧郁，烦躁失眠；2.跌打骨折，血瘀肿痛及痈肿疮毒", "d": "煎服10~15g", "sp": "", "w": "", "ap": "合欢花：性味功效与合欢皮相似，长于安神解郁，用于虚烦不眠、抑郁不舒、健忘多梦，煎服5~10g", "m": "合欢皮：安神解郁，活血消肿"}, {"id": 314, "ch": "安神药", "sec": "养心安神药", "n": "夜交藤", "f": "养心安神，祛风通络", "a": "1.虚烦不眠，多梦；2.血虚身痛，风湿痹痛；此外煎汤外洗治皮肤痒疹", "d": "煎服15~30g", "sp": "", "w": "", "ap": "", "m": "夜交藤：养心安神，祛风通络"}, {"id": 315, "ch": "平肝息风药", "sec": "平抑肝阳药", "n": "石决明", "f": "平肝潜阳，清肝明目", "a": "1.肝阳上亢，头晕目眩；2.目赤，翳障，视物昏花", "d": "煎服15~30g", "sp": "应打碎先煎；平肝、清肝宜生用，外用点眼宜煅用、水飞", "w": "", "ap": "", "m": "石决明：平肝潜阳，清肝明目，先煎"}, {"id": 316, "ch": "平肝息风药", "sec": "平抑肝阳药", "n": "珍珠母", "f": "平肝潜阳，清肝明目，镇心安神", "a": "1.肝阳上亢，头晕目眩；2.目赤肿痛，视物昏花；3.惊悸失眠，心神不宁；此外研细末外用可燥湿敛疮，治湿疮瘙痒；珍珠层粉内服治胃、十二指肠溃疡", "d": "煎服15~30g；外用适量", "sp": "宜打碎先煎", "w": "", "ap": "", "m": "珍珠母：平肝潜阳，清肝明目，镇心安神"}, {"id": 317, "ch": "平肝息风药", "sec": "平抑肝阳药", "n": "牡蛎", "f": "平肝潜阳，软坚散结，收敛固涩", "a": "1.肝阳上亢，头晕目眩；2.痰核，瘰疬，癥瘕积聚等证；3.滑脱诸证（自汗盗汗、遗精、崩带）；此外煅牡蛎有收敛制酸作用，可治胃痛泛酸", "d": "煎服10~30g", "sp": "宜打碎先煎；除收敛固涩煅用外，余皆生用", "w": "", "ap": "", "m": "牡蛎：平肝潜阳，软坚散结，收敛固涩，先煎"}, {"id": 318, "ch": "平肝息风药", "sec": "平抑肝阳药", "n": "紫贝齿", "f": "平肝潜阳，镇惊安神，清肝明目", "a": "1.肝阳上亢，头晕目眩；2.惊悸失眠；3.目赤翳障", "d": "煎服10~15g", "sp": "宜打碎先煎", "w": "", "ap": "", "m": "紫贝齿：平肝潜阳，镇惊安神"}, {"id": 319, "ch": "平肝息风药", "sec": "平抑肝阳药", "n": "代赭石", "f": "平肝潜阳，重镇降逆，凉血止血", "a": "1.肝阳上亢，头晕目眩；2.呕吐，呃逆，噫气；3.气逆喘息；4.血热吐衄，崩漏", "d": "煎服10~30g；入丸散每次1~3g", "sp": "宜打碎先煎；降逆、平肝生用，止血煅用", "w": "孕妇慎用；因含微量砷，故不宜长期服用", "ap": "", "m": "代赭石：平肝潜阳，重镇降逆（呕吐、呃逆），先煎"}, {"id": 320, "ch": "平肝息风药", "sec": "平抑肝阳药", "n": "刺蒺藜", "f": "平肝疏肝，祛风明目", "a": "1.肝阳上亢，头晕目眩；2.肝郁气滞，胸胁胀痛，乳闭胀痛；3.风热上攻，目赤翳障；4.风疹瘙痒，白癜风", "d": "煎服6~15g", "sp": "", "w": "", "ap": "", "m": "刺蒺藜：平肝疏肝，祛风明目"}, {"id": 321, "ch": "平肝息风药", "sec": "平抑肝阳药", "n": "罗布麻", "f": "平抑肝阳，清热，利尿", "a": "1.肝阳上亢、肝火上炎之头晕目眩（高血压病）；2.水肿，小便不利", "d": "3~15g", "sp": "水煎服或开水泡服；肝阳眩晕宜用叶片，治疗水肿多用根", "w": "不宜过量和长期服用，以免中毒", "ap": "", "m": "罗布麻：平抑肝阳，清热，利尿"}, {"id": 322, "ch": "平肝息风药", "sec": "息风止痉药", "n": "羚羊角", "f": "平肝息风，清肝明目，清热解毒", "a": "1.肝风内动，惊痫抽搐（热极生风尤宜）；2.肝阳上亢，头晕目眩；3.肝火上炎，目赤头痛；4.温热病壮热神昏，热毒发斑", "d": "煎服1~3g；磨汁或研粉服，每次0.3~0.6g", "sp": "单煎2小时以上，取汁服；或磨汁、研粉服", "w": "", "ap": "", "m": "羚羊角：肝风内动，惊痫抽搐第一要药"}, {"id": 323, "ch": "平肝息风药", "sec": "息风止痉药", "n": "牛黄", "f": "息风止痉，化痰开窍，清热解毒", "a": "1.温热病及小儿惊风之壮热神昏、惊厥抽搐等症；2.温热病热入心包、中风、惊风、癫痫等痰热蒙蔽心窍所致之神昏、口噤、痰鸣等症；3.咽喉肿痛、溃烂及痈疽疔毒等热毒壅滞郁结之证", "d": "入丸散，每次0.2~0.5g；外用适量", "sp": "只入丸散，不入煎剂；外用研细末敷患处", "w": "孕妇慎用", "ap": "", "m": "牛黄：息风止痉，化痰开窍，清热解毒"}, {"id": 324, "ch": "平肝息风药", "sec": "息风止痉药", "n": "钩藤", "f": "息风止痉，清热平肝", "a": "1.肝风内动，惊痫抽搐；2.头痛，眩晕（肝火上攻或肝阳上亢）；此外与蝉蜕、薄荷同用可治小儿夜啼", "d": "煎服10~15g", "sp": "有效成分钩藤碱加热后易破坏，故不宜久煎，一般不超过20分钟（宜后下）", "w": "", "ap": "", "m": "钩藤：息风止痉，清热平肝，后下"}, {"id": 325, "ch": "平肝息风药", "sec": "息风止痉药", "n": "天麻", "f": "息风止痉，平抑肝阳，祛风通络", "a": "1.肝风内动，惊痫抽搐（寒热虚实皆可配伍）；2.眩晕，头痛（止眩晕良药）；3.肢体麻木，手足不遂，风湿痹痛", "d": "煎服3~10g；研末冲服，每次1~1.5g", "sp": "可研末冲服", "w": "", "ap": "", "m": "天麻：息风止痉要药，眩晕要药"}, {"id": 326, "ch": "平肝息风药", "sec": "息风止痉药", "n": "地龙", "f": "清热息风，通络，平喘，利尿", "a": "1.高热惊痫，癫狂；2.气虚血滞，半身不遂；3.痹证（热痹尤宜）；4.肺热哮喘；5.热结膀胱，小便不利或尿闭不通；此外近年用治原发性高血压、腮腺炎、丹毒及精神病等", "d": "煎服5~15g，鲜品10~20g；研末吞服，每次1~2g", "sp": "", "w": "", "ap": "", "m": "地龙：清热息风，通络，平喘，利尿"}, {"id": 327, "ch": "平肝息风药", "sec": "息风止痉药", "n": "全蝎", "f": "息风止痉，攻毒散结，通络止痛", "a": "1.痉挛抽搐（急慢惊风、中风面瘫、破伤风）；2.疮疡肿毒，瘰疬结核；3.风湿顽痹；4.顽固性偏正头痛", "d": "煎服2~5g；研末吞服，每次0.6~1g；外用适量", "sp": "", "w": "有毒，用量不宜过大；孕妇慎用", "ap": "", "m": "全蝎：息风止痉，攻毒散结，通络止痛"}, {"id": 328, "ch": "平肝息风药", "sec": "息风止痉药", "n": "蜈蚣", "f": "息风止痉，攻毒散结，通络止痛", "a": "1.痉挛抽搐；2.疮疡肿毒，瘰疬结核；3.风湿顽痹；4.顽固性头痛", "d": "煎服1~3g；研末吞服，每次0.6~1g；外用适量", "sp": "", "w": "有毒，用量不宜过大；孕妇忌服", "ap": "", "m": "蜈蚣：息风止痉，攻毒散结，通络止痛，力强"}, {"id": 329, "ch": "平肝息风药", "sec": "息风止痉药", "n": "僵蚕", "f": "息风止痉，祛风止痛，化痰散结", "a": "1.惊痫抽搐（挟痰热者尤宜）；2.风中经络，口眼㖞斜；3.风热头痛，目赤，咽肿或风疹瘙痒；4.痰核，瘰疬", "d": "煎服3~10g；研末吞服，每次1~1.5g", "sp": "散风热宜生用，其余多制用", "w": "", "ap": "僵蛹：以蚕蛹为底物经白僵菌发酵的制成品，功用与僵蚕相近，可代僵蚕药用", "m": "僵蚕：息风止痉，祛风止痛，化痰散结"}, {"id": 330, "ch": "开窍药", "sec": "开窍药", "n": "麝香", "f": "开窍醒神，活血通经，止痛，催产", "a": "1.闭证神昏（醒神回苏要药，寒闭、热闭皆可）；2.疮疡肿毒，咽喉肿痛；3.血瘀经闭，癥瘕，心腹暴痛，跌打损伤，风寒湿痹等证；4.难产，死胎，胞衣不下；此外用治冠心病心绞痛", "d": "入丸散，每次0.06~0.1g；外用适量", "sp": "不宜入煎剂", "w": "孕妇忌用", "ap": "", "m": "麝香：开窍醒神第一要药，活血，催产，孕妇禁用"}, {"id": 331, "ch": "开窍药", "sec": "开窍药", "n": "冰片", "f": "开窍醒神，清热止痛", "a": "1.闭证神昏；2.目赤肿痛，喉痹口疮；3.疮疡肿痛，溃后不敛；此外用治冠心病心绞痛及齿痛", "d": "入丸散，每次0.03~0.1g；外用适量", "sp": "不宜入煎剂", "w": "孕妇慎用", "ap": "", "m": "冰片：开窍醒神，清热止痛，入丸散"}, {"id": 332, "ch": "开窍药", "sec": "开窍药", "n": "苏合香", "f": "开窍醒神，辟秽止痛", "a": "1.寒闭神昏；2.胸腹冷痛，满闷（冠心病心绞痛）", "d": "入丸散，每次0.3~1g", "sp": "不入煎剂", "w": "", "ap": "", "m": "苏合香：开窍醒神，辟秽，寒闭"}, {"id": 333, "ch": "开窍药", "sec": "开窍药", "n": "石菖蒲", "f": "开窍宁神，化湿和胃", "a": "1.痰湿蒙蔽清窍之神志昏迷；2.湿阻中焦，脘腹胀闷，痞塞疼痛；3.健忘，失眠，耳鸣，耳聋；此外还可用于声音嘶哑、风湿痹痛、痈疽疥癣、跌打损伤等证", "d": "煎服5~10g，鲜品加倍；外用适量", "sp": "", "w": "", "ap": "", "m": "石菖蒲：开窍宁神，化湿和胃"}, {"id": 334, "ch": "开窍药", "sec": "开窍药", "n": "蟾酥", "f": "开窍醒神，止痛，解毒", "a": "1.痧胀腹痛，吐泻，神昏；2.恶疮，瘰疬，咽喉肿痛及各种牙痛", "d": "入丸散，每次0.015~0.03g；外用适量", "sp": "只入丸散，不入煎剂", "w": "有毒，内服切勿过量；外用不可入目；孕妇忌用", "ap": "蟾皮：清热解毒、利水消胀；用于痈疽疮毒、疳积腹胀、瘰疬肿瘤等", "m": "蟾酥：开窍醒神，止痛，解毒，有毒"}, {"id": 335, "ch": "开窍药", "sec": "开窍药", "n": "樟脑", "f": "内服：开窍辟秽；外用：除湿杀虫，温散止痛", "a": "1.痧胀腹痛，吐泻，神昏；2.疥癣湿疮，瘙痒溃烂；3.牙痛及跌打损伤疼痛", "d": "内服每次0.1~0.2g；外用适量", "sp": "内服入散剂或用酒溶化服；外用研末撒或调敷", "w": "有毒，内服宜慎，并控制剂量；孕妇忌用", "ap": "", "m": "樟脑：内服开窍辟秽，外用除湿杀虫"}, {"id": 336, "ch": "补虚药", "sec": "补气药", "n": "人参", "f": "大补元气，补脾益肺，生津，安神", "a": "1.气虚欲脱，脉微欲绝的重危证候；2.肺气虚弱的短气喘促，懒言声微，脉虚自汗等证；3.脾气不足的倦怠乏力，食少便溏等证；4.热病气津两伤，身热口渴及消渴等证；5.气血亏虚的心悸，失眠，健忘等证；此外用于血虚、阳痿及扶正祛邪", "d": "煎服5~10g；急重证可酌增为15~30g；研末吞服，每次1.5~2g", "sp": "宜文火另煎兑服；挽救虚脱宜大剂量煎汁分次灌服；可研末吞服", "w": "反藜芦；畏五灵脂；不宜同时吃萝卜或喝茶，以免影响补力", "ap": "", "m": "人参：大补元气，补脾益肺，生津，安神，反藜芦，畏五灵脂"}, {"id": 337, "ch": "补虚药", "sec": "补气药", "n": "西洋参", "f": "补气养阴，清火生津", "a": "1.阴虚火旺的喘咳痰血证；2.热病气阴两伤，烦倦，口渴", "d": "3~6g", "sp": "另煎兑服", "w": "", "ap": "", "m": "西洋参：补气养阴，清火生津，不宜与藜芦同用"}, {"id": 338, "ch": "补虚药", "sec": "补气药", "n": "党参", "f": "益气，生津，养血", "a": "1.中气不足的体虚倦怠，食少便溏；2.肺气亏虚的咳嗽气促，语声低弱；3.气津两伤的气短口渴；4.气血双亏的面色萎黄，头晕心悸", "d": "煎服10~30g", "sp": "", "w": "", "ap": "", "m": "党参：益气，生津，养血，不宜与藜芦同用"}, {"id": 339, "ch": "补虚药", "sec": "补气药", "n": "太子参", "f": "补气生津", "a": "1.脾气虚弱、胃阴不足的食少倦怠；2.气虚津伤的肺虚燥咳及心悸不眠、虚热汗多", "d": "煎服10~30g", "sp": "", "w": "", "ap": "", "m": "太子参：补气生津，益气养阴"}, {"id": 340, "ch": "补虚药", "sec": "补气药", "n": "黄芪", "f": "补气升阳，益卫固表，利水消肿，托疮生肌", "a": "1.脾胃气虚及中气下陷诸证；2.肺气虚及表虚自汗，气虚外感诸证；3.气虚水湿失运的浮肿，小便不利；4.气血不足，疮疡内陷的脓成不溃或溃久不敛；此外用于气虚血亏的面色萎黄、气不摄血的便血崩漏、气虚血滞的痹痛麻木及半身不遂、气虚津亏的消渴", "d": "煎服10~15g；大剂量30~60g", "sp": "益气补中宜炙用，其他方面多生用", "w": "凡表实邪盛、内有积滞、阴虚阳亢、疮疡阳证实证等，均不宜用", "ap": "", "m": "黄芪：补气升阳，固表，利水，托疮"}, {"id": 341, "ch": "补虚药", "sec": "补气药", "n": "白术", "f": "补气健脾，燥湿利水，止汗，安胎", "a": "1.脾胃气虚，运化无力的食少便溏、脘腹胀满、肢软神疲等证；2.脾虚水停的痰饮、水肿、小便不利；3.脾虚气弱，肌表不固而自汗；4.脾虚气弱，胎动不安", "d": "煎服5~15g", "sp": "燥湿利水宜生用，补气健脾宜炒用，健脾止泻宜炒焦用", "w": "燥湿伤阴，阴虚内热或津液亏耗燥渴者不宜用", "ap": "", "m": "白术：补气健脾，燥湿利水，止汗，安胎，脾脏之要药"}, {"id": 342, "ch": "补虚药", "sec": "补气药", "n": "山药", "f": "益气养阴，补脾肺肾，固精止带", "a": "1.脾胃虚弱证（食少便溏、泄泻）；2.肺虚咳喘；3.肾虚遗精、尿频、带下；4.阴虚内热、口渴多饮、小便频数的消渴证", "d": "煎服10~30g，大量60~250g；研末吞服，每次6~10g", "sp": "补阴生津宜生用，健脾止泻宜炒用", "w": "", "ap": "", "m": "山药：益气养阴，肺脾肾，固精止带"}, {"id": 343, "ch": "补虚药", "sec": "补气药", "n": "白扁豆", "f": "健脾，化湿，消暑", "a": "1.脾虚有湿，体倦乏力，食少便溏或泄泻，以及妇女脾虚带下；2.暑湿吐泻；此外能解毒，用于食物中毒", "d": "煎服10~30g", "sp": "健脾止泻宜炒用，消暑解毒宜生用", "w": "", "ap": "扁豆衣：白扁豆的干燥种皮，性效似白扁豆而健脾之力略逊，但无壅滞之弊，偏于消暑化湿，主治暑湿吐泻及脚气浮肿，煎服5~10g。扁豆花：功能消暑化湿，多用于暑湿泄泻及带下，煎服5~10g", "m": "白扁豆：健脾化湿，消暑"}, {"id": 344, "ch": "补虚药", "sec": "补气药", "n": "甘草", "f": "益气补中，清热解毒，祛痰止咳，缓急止痛，调和药性", "a": "1.心气不足的心动悸、脉结代；2.脾气虚弱的倦怠乏力、食少便溏；3.痰多咳嗽；4.脘腹及四肢挛急作痛；5.热毒疮疡，咽喉肿痛及药物、食物中毒；6.调和药性", "d": "煎服3~10g", "sp": "清热解毒宜生用，补中缓急宜炙用", "w": "湿盛胀满、浮肿者不宜用；反大戟、芫花、甘遂、海藻；久服较大剂量的生甘草可引起浮肿等", "ap": "", "m": "甘草：国老，调和诸药，缓急止痛，反大戟芫花甘遂海藻"}, {"id": 345, "ch": "补虚药", "sec": "补气药", "n": "大枣", "f": "补中益气，养血安神，缓和药性", "a": "1.脾虚食少便溏，倦怠乏力；2.血虚萎黄及妇女脏躁，神志不安；3.缓和峻烈药物的药性（如配甘遂、大戟、芫花）", "d": "煎服10~30g", "sp": "劈破煎服；亦可去皮核捣烂为丸服", "w": "", "ap": "", "m": "大枣：补中益气，养血安神，缓药性"}, {"id": 346, "ch": "补虚药", "sec": "补气药", "n": "饴糖", "f": "补中缓急，润肺止咳", "a": "1.中虚里急，脘腹疼痛；2.肺虚咳嗽，干咳无痰", "d": "30~60g", "sp": "入汤剂须烊化，分二三次溶化服；亦可熬膏或为丸服", "w": "湿阻中满、湿热内蕴及痰湿甚者忌用", "ap": "", "m": "饴糖：补中缓急，润肺"}, {"id": 347, "ch": "补虚药", "sec": "补气药", "n": "蜂蜜", "f": "补中缓急，润燥，解毒", "a": "1.中虚脘腹疼痛；2.肺虚燥咳及肠燥便秘；3.解乌头类药毒；此外外用治疮疡不敛、水火烫伤", "d": "15~30g；外用适量", "sp": "冲服，或入丸剂、膏剂", "w": "凡湿阻中满、湿热痰滞、便溏或泄泻者宜慎用", "ap": "", "m": "蜂蜜：补中缓急，润燥，解毒"}, {"id": 348, "ch": "补虚药", "sec": "补阳药", "n": "鹿茸", "f": "壮肾阳，益精血，强筋骨，调冲任，托疮毒", "a": "1.肾阳不足，精血亏虚的阳痿早泄、宫寒不孕、尿频不禁、头晕耳鸣、腰膝酸痛、肢冷神疲等；2.肝肾精血不足的筋骨萎软、小儿发育不良、囟门过期不合、齿迟、行迟等；3.冲任虚寒，带脉不固的崩漏不止、带下过多；4.疮疡久溃不敛，阴疽内陷不起", "d": "研细末，一日三次分服，1~3g；如入丸散，随方配制", "sp": "研末吞服，不入煎剂", "w": "服用本品宜从小量开始，缓缓增加，不宜骤用大量，以免阳升风动、头晕目赤，或助火动血而致鼻衄；凡阴虚阳亢、血分有热、胃火盛或肺有痰热以及外感热病者均应忌服", "ap": "鹿角胶：补肝肾、益精血，并有良好止血作用，用于肾阳不足、精血亏虚的虚劳羸瘦及吐衄崩漏之偏于虚寒者、阴疽内陷等，烊化兑服。鹿角霜：补肾助阳之力较弱而兼收敛，用于崩漏、遗精等，外用止血敛疮", "m": "鹿茸：壮肾阳，益精血，强筋骨，调冲任，托疮毒，宜研末"}, {"id": 349, "ch": "补虚药", "sec": "补阳药", "n": "巴戟天", "f": "补肾阳，强筋骨，祛风湿", "a": "1.肾阳虚弱的阳痿，不孕，月经不调，少腹冷痛等；2.肝肾不足的筋骨痿软、腰膝疼痛，或风湿久痹", "d": "煎服10~15g", "sp": "", "w": "", "ap": "", "m": "巴戟天：补肾阳，强筋骨，祛风湿"}, {"id": 350, "ch": "补虚药", "sec": "补阳药", "n": "淫羊藿", "f": "补肾壮阳，祛风除湿", "a": "1.肾阳虚的阳痿、不孕及尿频等证；2.肝肾不足的筋骨痹痛、风湿拘挛麻木等证；此外现代用于肾阳虚的喘咳及妇女更年期的高血压等", "d": "煎服5~10g", "sp": "亦可浸酒、熬膏或入丸、散", "w": "", "ap": "", "m": "淫羊藿：补肾壮阳，祛风除湿（仙灵脾）"}, {"id": 351, "ch": "补虚药", "sec": "补阳药", "n": "仙茅", "f": "温肾壮阳，强筋骨，祛寒湿", "a": "1.肾阳不足、命门火衰的阳痿精冷、小便频数；2.腰膝冷痛，筋骨痿软无力", "d": "3~10g", "sp": "煎服或浸酒服", "w": "阴虚火旺者忌服", "ap": "", "m": "仙茅：温肾壮阳，强筋骨，祛寒湿，有毒"}, {"id": 352, "ch": "补虚药", "sec": "补阳药", "n": "补骨脂", "f": "补肾助阳，固精缩尿，暖脾止泻，纳气平喘", "a": "1.肾虚阳痿，腰膝冷痛；2.肾虚遗精，遗尿，尿频；3.脾肾阳虚的泄泻；4.肾不纳气的虚喘；此外外用治白癜风", "d": "煎服6~15g；外用适量", "sp": "", "w": "", "ap": "", "m": "补骨脂：补肾助阳，固精缩尿，止泻，纳气"}, {"id": 353, "ch": "补虚药", "sec": "补阳药", "n": "益智仁", "f": "暖肾固精缩尿，温脾止泻摄唾", "a": "1.下元虚寒的遗精，遗尿，小便频数；2.脾胃虚寒的腹痛吐泻及口涎自流", "d": "煎服3~10g", "sp": "", "w": "", "ap": "", "m": "益智仁：暖肾固精缩尿，温脾止泻摄唾"}, {"id": 354, "ch": "补虚药", "sec": "补阳药", "n": "海狗肾", "f": "暖肾壮阳，益精补髓", "a": "肾阳衰惫的阳痿精冷，精少不育等", "d": "研末服，每次1~3g，日服2~3次", "sp": "研末服；入丸、散或浸酒服，则随方定量", "w": "", "ap": "狗肾（黄狗肾）：功用与海狗肾相似而力较弱，可代海狗肾用", "m": "海狗肾：暖肾壮阳，益精补髓"}, {"id": 355, "ch": "补虚药", "sec": "补阳药", "n": "海马", "f": "补肾壮阳，调气活血", "a": "1.肾阳虚衰的阳痿不举，遗尿尿频等；2.癥瘕积聚及跌打损伤；此外外用治疮疡肿毒、恶疮发背", "d": "研末服，每次1~1.5g；外用适量", "sp": "研末服；外用涂敷患处", "w": "", "ap": "", "m": "海马：补肾壮阳，调气活血"}, {"id": 356, "ch": "补虚药", "sec": "补阳药", "n": "肉苁蓉", "f": "补肾阳，益精血，润肠通便", "a": "1.肾阳亏虚、精血不足的阳痿早泄、宫冷不孕、腰膝酸痛、痿软无力；2.肠燥津枯便秘", "d": "煎服10~15g", "sp": "", "w": "", "ap": "", "m": "肉苁蓉：补肾阳，益精血，润肠通便"}, {"id": 357, "ch": "补虚药", "sec": "补阳药", "n": "锁阳", "f": "补肾阳，益精血，润肠通便", "a": "1.肾阳亏虚、精血不足的阳痿、不孕、下肢痿软、筋骨无力等；2.血虚津亏的肠燥便秘", "d": "煎服10~15g", "sp": "", "w": "", "ap": "", "m": "锁阳：补肾阳，益精血，润肠通便"}, {"id": 358, "ch": "补虚药", "sec": "补阳药", "n": "菟丝子", "f": "补肾固精，养肝明目，止泻，安胎", "a": "1.肾虚腰痛，阳痿遗精，尿频及宫冷不孕；2.肝肾不足，目暗不明；3.脾肾阳虚，便溏泄泻；4.肾虚胎动不安；此外亦治肾虚消渴", "d": "煎服10~15g；外用适量", "sp": "", "w": "", "ap": "", "m": "菟丝子：补肾固精，养肝明目，止泻，安胎"}, {"id": 359, "ch": "补虚药", "sec": "补阳药", "n": "沙苑子", "f": "补肾固精，养肝明目", "a": "1.肾虚阳痿，遗精早泄，小便遗沥，白带过多及腰痛等；2.肝肾不足的眩晕目昏", "d": "煎服10~15g", "sp": "", "w": "", "ap": "", "m": "沙苑子：补肾固精，养肝明目"}, {"id": 360, "ch": "补虚药", "sec": "补阳药", "n": "杜仲", "f": "补肝肾，强筋骨，安胎", "a": "1.肝肾不足的腰膝酸痛、下肢痿软及阳痿、尿频等症；2.肝肾亏虚、下元虚冷的妊娠下血、胎动不安或习惯性流产等；此外近年用于高血压病", "d": "煎服10~15g", "sp": "炒用疗效较生用为佳", "w": "", "ap": "", "m": "杜仲：补肝肾，强筋骨，安胎"}, {"id": 361, "ch": "补虚药", "sec": "补阳药", "n": "续断", "f": "补肝肾，强筋骨，止血安胎，疗伤续折", "a": "1.肝肾不足、腰痛脚弱、风湿痹痛及跌打损伤、骨折、肿痛等；2.肝肾虚弱、冲任失调的胎动欲坠或崩漏经多等", "d": "煎服10~15g；外用适量", "sp": "外用研末敷", "w": "", "ap": "", "m": "续断：补肝肾，强筋骨，止血安胎，疗伤续折"}, {"id": 362, "ch": "补虚药", "sec": "补阳药", "n": "韭子", "f": "温补肝肾，壮阳固精", "a": "1.肝肾不足的腰膝酸软、阳痿；2.肾气不固的遗精、尿频、白带过多", "d": "煎服5~10g", "sp": "亦可随方入丸、散", "w": "", "ap": "", "m": "韭子：温补肝肾，壮阳固精"}, {"id": 363, "ch": "补虚药", "sec": "补阳药", "n": "阳起石", "f": "温肾壮阳", "a": "肾阳虚衰的阳痿、宫冷、腰膝冷痹等", "d": "3~6g", "sp": "入丸、散服", "w": "", "ap": "", "m": "阳起石：温肾壮阳"}, {"id": 364, "ch": "补虚药", "sec": "补阳药", "n": "胡芦巴", "f": "温肾阳，逐寒湿", "a": "1.肾阳不足、寒凝气滞的疝痛、腹胁胀痛；2.寒湿脚气，足膝冷痛", "d": "煎服5~10g", "sp": "亦可入丸、散", "w": "", "ap": "", "m": "胡芦巴：温肾阳，逐寒湿"}, {"id": 365, "ch": "补虚药", "sec": "补阳药", "n": "核桃仁", "f": "补肾，温肺，润肠", "a": "1.肾虚腰痛脚弱，小便频数；2.肺肾不足的虚寒喘咳及肺虚久咳；3.肠燥便秘；此外可排结石", "d": "煎服10~30g", "sp": "定喘嗽宜连皮用，润肠燥宜去皮用，排结石宜食油炸酥、捣如膏状服用", "w": "", "ap": "", "m": "核桃仁：补肾，温肺，润肠"}, {"id": 366, "ch": "补虚药", "sec": "补阳药", "n": "蛤蚧", "f": "助肾阳，益精血，补肺气，定喘嗽", "a": "1.肺肾两虚，肾不纳气的虚喘久嗽（治虚喘劳嗽要药）；2.肾阳不足，精血亏虚的阳痿", "d": "研末服，每次1~2g，日服3次", "sp": "研末服；亦可浸酒服，或入丸、散剂", "w": "", "ap": "", "m": "蛤蚧：助肾阳，益精血，补肺气，定喘嗽"}, {"id": 367, "ch": "补虚药", "sec": "补阳药", "n": "冬虫夏草", "f": "益肾壮阳，补肺平喘，止血化痰", "a": "1.肾虚腰痛，阳痿遗精；2.肺虚或肺肾两虚之久咳虚喘、劳嗽痰血；此外用于病后体虚不复、自汗畏寒", "d": "5~10g", "sp": "煎汤或炖服（可与鸡、鸭、猪肉等炖服）", "w": "", "ap": "", "m": "冬虫夏草：益肾壮阳，补肺平喘，止血化痰"}, {"id": 368, "ch": "补虚药", "sec": "补阳药", "n": "紫河车", "f": "温肾补精，益气养血", "a": "1.肾气不足、精血亏虚的不孕、阳痿遗精、腰酸、头晕耳鸣等；2.肺肾两虚的喘嗽；3.气血不足，萎黄消瘦，产后乳少等", "d": "研末或装胶囊吞服，每次1.5~3g，每日2~3次", "sp": "研末或装胶囊吞服；也可用鲜品煨食，每次半个或一个，一周2~3次", "w": "", "ap": "脐带：补肾纳气、敛汗，用于肾虚喘咳、盗汗等", "m": "紫河车：温肾补精，益气养血"}, {"id": 369, "ch": "补虚药", "sec": "补血药", "n": "当归", "f": "补血，活血，调经，止痛，润肠", "a": "1.心肝血虚，面色萎黄，眩晕心悸等（补血要药）；2.血虚或血虚而兼有瘀滞的月经不调、痛经、经闭等症（妇科调经要药）；3.血虚、血滞而兼有寒凝，以及跌打损伤、风湿痹阻的疼痛证；4.痈疽疮疡；5.血虚肠燥便秘；此外还能治久咳气喘", "d": "煎服5~15g", "sp": "一般生用，为加强活血则酒炒用；补血用当归身，破血用当归尾，和血（补血活血）用全当归", "w": "湿盛中满、大便泄泻者忌服", "ap": "", "m": "当归：补血，活血，调经，止痛，润肠，补血圣药"}, {"id": 370, "ch": "补虚药", "sec": "补血药", "n": "熟地黄", "f": "补血滋阴，益精填髓", "a": "1.血虚萎黄，眩晕，心悸失眠，月经不调，崩漏等症（补血要药）；2.肾阴不足的潮热骨蒸、盗汗、遗精、消渴等（滋阴主药）；3.肝肾精血亏虚的腰膝酸软、眩晕耳鸣、须发早白等", "d": "煎服10~30g", "sp": "", "w": "性质粘腻，有碍消化，凡气滞痰多、脘腹胀痛、食少便溏者忌服", "ap": "", "m": "熟地：补血滋阴，益精填髓"}, {"id": 371, "ch": "补虚药", "sec": "补血药", "n": "白芍", "f": "养血调经，平肝止痛，敛阴止汗", "a": "1.血虚或阴虚有热的月经不调、崩漏等证；2.肝阴不足、肝气不舒或肝阳偏亢的头痛、眩晕、胁肋疼痛、脘腹四肢拘挛作痛等；3.阴虚盗汗，及营卫不和的表虚自汗证", "d": "煎服10~15g；大量15~30g", "sp": "欲其平肝、敛阴多生用；用以养血调经多炒用或酒炒用", "w": "反藜芦", "ap": "", "m": "白芍：养血调经，平肝止痛，敛阴止汗，反藜芦"}, {"id": 372, "ch": "补虚药", "sec": "补血药", "n": "何首乌", "f": "制首乌：补益精血，固肾乌须；生首乌：截疟解毒，润肠通便", "a": "1.血虚而见头昏目眩、心悸失眠、萎黄乏力，肝肾精血亏虚的眩晕耳鸣、腰膝酸软、遗精崩带、须发早白等（制首乌）；2.体虚久疟，肠燥便秘及痈疽、瘰疬等证（生首乌）", "d": "煎服10~30g", "sp": "补益精血宜用制首乌；截疟、润肠、解毒宜用生首乌", "w": "", "ap": "", "m": "首乌：制则补，生则截疟解毒润肠"}, {"id": 373, "ch": "补虚药", "sec": "补血药", "n": "阿胶", "f": "补血，止血，滋阴润燥", "a": "1.血虚萎黄，眩晕，心悸等（补血佳品）；2.多种出血证（出血而兼见阴虚、血虚证者尤为适宜）；3.阴虚证及燥证（燥咳、热病伤阴心烦不眠、虚风内动）", "d": "入汤剂5~15g", "sp": "烊化兑服；止血常用阿胶珠，可以同煎", "w": "性滋腻，有碍消化，胃弱便溏者慎用", "ap": "", "m": "阿胶：补血，止血，滋阴润燥，烊化"}, {"id": 374, "ch": "补虚药", "sec": "补血药", "n": "龙眼肉", "f": "补益心脾，养血安神", "a": "心脾虚损、气血不足的心悸、失眠、健忘等", "d": "煎汤10~15g；大量30~60g", "sp": "", "w": "", "ap": "", "m": "龙眼肉：补益心脾，养血安神"}, {"id": 375, "ch": "补虚药", "sec": "补阴药", "n": "北沙参", "f": "养阴清肺，益胃生津", "a": "1.肺阴虚的肺热燥咳、干咳少痰，或劳嗽久咳、咽干音哑等；2.胃阴虚或热伤胃阴、津液不足的口渴咽干、舌质红绛等", "d": "煎服10~15g", "sp": "", "w": "", "ap": "", "m": "北沙参：养阴清肺，益胃生津，反藜芦"}, {"id": 376, "ch": "补虚药", "sec": "补阴药", "n": "南沙参", "f": "养阴清肺，化痰，益气", "a": "1.肺阴虚的燥热咳嗽（兼能化痰）；2.热病后气津不足或脾胃虚弱（口干舌燥、食少不饥）", "d": "煎服10~15g", "sp": "", "w": "反藜芦", "ap": "", "m": "南沙参：养阴清肺，化痰，益气"}, {"id": 377, "ch": "补虚药", "sec": "补阴药", "n": "百合", "f": "养阴润肺止咳，清心安神", "a": "1.肺阴虚的燥热咳嗽及劳嗽久咳、痰中带血；2.热病余热未清的虚烦惊悸、失眠多梦等（百合病）", "d": "煎服10~30g", "sp": "清心宜生用，润肺蜜炙用", "w": "", "ap": "", "m": "百合：养阴润肺止咳，清心安神"}, {"id": 378, "ch": "补虚药", "sec": "补阴药", "n": "麦冬", "f": "养阴润肺，益胃生津，清心除烦", "a": "1.肺阴不足而有燥热的干咳痰粘、劳热咳嗽等；2.胃阴虚或热伤胃阴，口渴咽干，大便燥结等；3.心阴虚及温病热邪扰及心营，心烦不眠，舌绛而干等", "d": "煎服10~15g", "sp": "", "w": "", "ap": "", "m": "麦冬：养阴润肺，益胃生津，清心除烦"}, {"id": 379, "ch": "补虚药", "sec": "补阴药", "n": "天冬", "f": "养阴润燥，清火，生津", "a": "1.阴虚肺热的燥咳或劳嗽咳血；2.肾阴不足、阴虚火旺的潮热盗汗、遗精、内热消渴、肠燥便秘等症", "d": "煎服10~15g", "sp": "", "w": "", "ap": "", "m": "天冬：养阴润燥，清火，生津"}, {"id": 380, "ch": "补虚药", "sec": "补阴药", "n": "石斛", "f": "养阴清热，益胃生津", "a": "1.热病伤津，低热烦渴，舌红少苔；2.胃阴不足，口渴咽干，食少呕逆，胃脘嘈杂隐痛；此外能明目、强腰膝", "d": "煎服10~15g；鲜用15~30g", "sp": "鲜品清热生津之力较强", "w": "", "ap": "", "m": "石斛：养阴清热，益胃生津，鲜品清热生津强"}, {"id": 381, "ch": "补虚药", "sec": "补阴药", "n": "玉竹", "f": "养阴润燥，生津止渴", "a": "1.阴虚肺燥的干咳少痰；2.热病伤津，烦热口渴及消渴；此外可用于阴虚外感", "d": "煎服10~15g", "sp": "", "w": "", "ap": "", "m": "玉竹：养阴润燥，生津止渴"}, {"id": 382, "ch": "补虚药", "sec": "补阴药", "n": "黄精", "f": "滋肾润肺，补脾益气", "a": "1.阴虚肺燥，干咳少痰，及肺肾阴虚的劳嗽久咳；2.肾虚精亏的头晕、腰膝酸软、须发早白及消渴；3.脾胃虚弱（脾气虚或胃阴虚）", "d": "煎服10~30g", "sp": "", "w": "", "ap": "", "m": "黄精：滋肾润肺，补脾益气"}, {"id": 383, "ch": "补虚药", "sec": "补阴药", "n": "枸杞子", "f": "补肝肾，明目", "a": "肝肾不足的腰酸遗精，头晕目眩，视力减退，内障目昏，消渴等；此外能润肺，治阴虚劳嗽", "d": "煎服10~15g", "sp": "", "w": "", "ap": "", "m": "枸杞子：补肝肾，明目"}, {"id": 384, "ch": "补虚药", "sec": "补阴药", "n": "墨旱莲", "f": "补肝肾阴，凉血止血", "a": "1.肝肾阴虚的头晕目眩、须发早白；2.阴虚血热的吐血、衄血、尿血、便血、崩漏；此外外用治外伤出血", "d": "内服10~15g；外用适量", "sp": "", "w": "", "ap": "", "m": "旱莲草：补肝肾阴，凉血止血"}, {"id": 385, "ch": "补虚药", "sec": "补阴药", "n": "女贞子", "f": "补肝肾阴，乌须明目", "a": "肝肾阴虚的目暗不明、视力减退、须发早白、腰酸耳鸣及阴虚发热等", "d": "煎服10~15g", "sp": "", "w": "", "ap": "", "m": "女贞子：补肝肾阴，乌须明目；二至丸"}, {"id": 386, "ch": "补虚药", "sec": "补阴药", "n": "桑椹", "f": "滋阴补血，生津，润肠", "a": "1.阴血亏虚的眩晕、目暗、耳鸣、失眠、须发早白；2.津伤口渴，消渴；3.肠燥便秘", "d": "煎服10~15g", "sp": "", "w": "", "ap": "", "m": "桑椹：滋阴补血，生津，润肠"}, {"id": 387, "ch": "补虚药", "sec": "补阴药", "n": "黑芝麻", "f": "补肝肾，益精血，润肠燥", "a": "1.肝肾不足、精血亏虚的头晕眼花、须发早白；2.肠燥便秘", "d": "煎服10~30g", "sp": "或炒熟入丸、膏剂", "w": "", "ap": "", "m": "黑芝麻：补肝肾，益精血，润肠燥"}, {"id": 388, "ch": "补虚药", "sec": "补阴药", "n": "龟甲", "f": "滋阴潜阳，益肾健骨，固经止血，养血补心", "a": "1.阴虚阳亢，阴虚内热，虚风内动；2.肾虚骨痿，小儿囟门不合；3.阴虚血热、冲任不固的崩漏、月经过多；4.心虚惊悸，失眠，健忘", "d": "入汤剂15~30g", "sp": "宜先煎", "w": "", "ap": "", "m": "龟甲：滋阴潜阳，益肾健骨，固经止血，养血补心，先煎"}, {"id": 389, "ch": "补虚药", "sec": "补阴药", "n": "鳖甲", "f": "滋阴潜阳，软坚散结", "a": "1.阴虚发热，阴虚阳亢，阴虚风动等证；2.久疟、疟母，癥瘕积聚，经闭", "d": "入汤剂15~30g", "sp": "宜先煎", "w": "", "ap": "", "m": "鳖甲：滋阴潜阳，软坚散结，先煎"}, {"id": 390, "ch": "收涩药", "sec": "固表止汗药", "n": "麻黄根", "f": "止汗", "a": "自汗，盗汗（内服、外扑均可）", "d": "煎服3~9g；外用适量", "sp": "外用研粉扑身", "w": "有表邪者忌用", "ap": "", "m": "麻黄根：止汗，与麻黄相反"}, {"id": 391, "ch": "收涩药", "sec": "固表止汗药", "n": "浮小麦", "f": "敛汗，益气，除热", "a": "1.自汗，盗汗；2.骨蒸劳热", "d": "煎服15~30g；研末服3~5g", "sp": "", "w": "表邪汗出者忌用", "ap": "小麦：养心除烦，用于心神不宁、烦躁失眠及妇人脏躁证，煎服30~60g", "m": "浮小麦：敛汗，益气，除热"}, {"id": 392, "ch": "收涩药", "sec": "固表止汗药", "n": "糯稻根须", "f": "止虚汗，退虚热", "a": "1.自汗，盗汗；2.虚热不退，骨蒸潮热", "d": "内服煎汤15~30g", "sp": "", "w": "", "ap": "", "m": "糯稻根须：止虚汗，退虚热"}, {"id": 393, "ch": "收涩药", "sec": "敛肺涩肠药", "n": "五味子", "f": "敛肺滋肾，生津敛汗，涩精止泻，宁心安神", "a": "1.久咳虚喘；2.津伤口渴，消渴；3.自汗，盗汗；4.遗精，滑精；5.久泻不止；6.心悸，失眠，多梦", "d": "煎服3~6g；研末服，每次1~3g", "sp": "", "w": "凡表邪未解、内有实热、咳嗽初起、麻疹初期，均不宜用", "ap": "", "m": "五味子：敛肺滋肾，生津敛汗，涩精止泻，宁心安神"}, {"id": 394, "ch": "收涩药", "sec": "敛肺涩肠药", "n": "乌梅", "f": "敛肺止咳，涩肠止泻，安蛔止痛，生津止渴", "a": "1.肺虚久咳；2.久泻，久痢；3.蛔厥腹痛，呕吐；4.虚热消渴；此外炒炭能止血，治崩漏下血、便血；外敷能消疮毒，治胬肉外突", "d": "煎服3~10g；大剂量可用至30g；外用适量", "sp": "止泻止血宜炒炭用；外用捣烂或炒炭研末外敷", "w": "外有表邪或内有实热积滞者均不宜服", "ap": "", "m": "乌梅：敛肺，涩肠，安蛔，生津"}, {"id": 395, "ch": "收涩药", "sec": "敛肺涩肠药", "n": "五倍子", "f": "敛肺降火，涩肠止泻，固精止遗，敛汗止血", "a": "1.肺虚久咳，肺热痰嗽；2.久泻，久痢；3.遗精，滑精；4.自汗，盗汗；5.崩漏下血，便血，尿血；此外外用治湿疮、疮疖肿毒、脱肛、子宫脱垂等", "d": "煎服3~9g；入丸散服，每次1~1.5g；外用适量", "sp": "外用研末外敷或煎汤熏洗", "w": "湿热泻痢者忌用", "ap": "", "m": "五倍子：敛肺降火，涩肠，固精，敛汗止血"}, {"id": 396, "ch": "收涩药", "sec": "敛肺涩肠药", "n": "罂粟壳", "f": "涩肠止泻，敛肺止咳，止痛", "a": "1.久泻，久痢；2.肺虚久咳；3.胃痛，腹痛，筋骨疼痛", "d": "煎服3~6g", "sp": "止咳蜜炙用，止泻止痛醋炒用", "w": "易成瘾，不宜常用；咳嗽、泻痢初起邪实者忌用", "ap": "", "m": "罂粟壳：涩肠止泻，敛肺止咳，止痛，易成瘾"}, {"id": 397, "ch": "收涩药", "sec": "敛肺涩肠药", "n": "诃子", "f": "涩肠止泻，敛肺止咳，利咽开音", "a": "1.久泻，久痢，脱肛；2.肺虚喘咳，久嗽失音", "d": "煎服3~10g", "sp": "涩肠止泻宜煨用，敛肺清热、利咽开音宜生用", "w": "凡外有表邪、内有湿热积滞者忌用", "ap": "", "m": "诃子：涩肠，敛肺，利咽开音"}, {"id": 398, "ch": "收涩药", "sec": "敛肺涩肠药", "n": "石榴皮", "f": "涩肠止泻，杀虫，止血", "a": "1.久泻，久痢，脱肛；2.虫积腹痛；3.崩漏，便血；此外可治遗精、带下", "d": "煎服3~10g", "sp": "入汤剂生用，入丸散多炒用，止血多炒炭用", "w": "", "ap": "", "m": "石榴皮：涩肠止泻，杀虫，止血"}, {"id": 399, "ch": "收涩药", "sec": "敛肺涩肠药", "n": "肉豆蔻", "f": "涩肠止泻，温中行气", "a": "1.久泻不止（脾胃虚寒者宜）；2.胃寒胀痛，食少呕吐", "d": "煎服3~9g；入丸散服，每次0.5~1g", "sp": "内服须煨熟去油用", "w": "湿热泻痢者忌用", "ap": "", "m": "肉豆蔻：涩肠止泻，温中行气"}, {"id": 400, "ch": "收涩药", "sec": "敛肺涩肠药", "n": "赤石脂", "f": "涩肠止泻，收敛止血，敛疮生肌", "a": "1.久泻，久痢；2.崩漏，便血；3.疮疡久溃不敛，湿疮流水，外伤出血（外用）", "d": "煎服10~20g；外用适量", "sp": "外用研细末撒患处或调敷", "w": "湿热积滞泻痢者忌服；孕妇慎用；畏官桂", "ap": "", "m": "赤石脂：涩肠止泻，收敛止血，敛疮生肌，畏肉桂"}, {"id": 401, "ch": "收涩药", "sec": "敛肺涩肠药", "n": "禹余粮", "f": "涩肠止泻，收敛止血，止带", "a": "1.久泻，久痢；2.崩漏，便血；3.带下", "d": "煎汤10~20g", "sp": "", "w": "孕妇慎用", "ap": "", "m": "禹余粮：涩肠止泻，收敛止血，止带"}, {"id": 402, "ch": "收涩药", "sec": "固精缩尿止带药", "n": "山茱萸", "f": "补益肝肾，收敛固涩", "a": "1.肝肾亏虚的头晕目眩、腰膝酸软、阳痿等；2.遗精滑精，遗尿尿频；3.崩漏下血，月经过多；4.大汗不止，体虚欲脱；此外治消渴", "d": "煎服5~10g；急救固脱20~30g", "sp": "急救固脱须大剂量", "w": "素有湿热、小便淋涩者不宜应用", "ap": "", "m": "山茱萸：补益肝肾，收敛固涩，固精止汗"}, {"id": 403, "ch": "收涩药", "sec": "固精缩尿止带药", "n": "覆盆子", "f": "益肾，固精，缩尿", "a": "1.遗精滑精，遗尿尿频；2.阳痿，不孕；此外治肝肾不足，目暗不明", "d": "煎服5~10g", "sp": "", "w": "", "ap": "", "m": "覆盆子：益肾，固精，缩尿"}, {"id": 404, "ch": "收涩药", "sec": "固精缩尿止带药", "n": "桑螵蛸", "f": "固精缩尿，补肾助阳", "a": "1.遗精滑精，遗尿尿频，白浊；2.阳痿", "d": "煎服6~10g", "sp": "", "w": "助阳固涩，故阴虚多火、膀胱有热而小便频数者忌用", "ap": "", "m": "桑螵蛸：固精缩尿，补肾助阳"}, {"id": 405, "ch": "收涩药", "sec": "固精缩尿止带药", "n": "海螵蛸", "f": "固精止带，收敛止血，制酸止痛，收湿敛疮", "a": "1.遗精，带下；2.崩漏下血，肺胃出血，创伤出血；3.胃痛吐酸；4.湿疮，湿疹，溃疡不敛（外用）", "d": "煎服6~12g，散剂酌减；外用适量", "sp": "", "w": "", "ap": "", "m": "海螵蛸：固精止带，收敛止血，制酸止痛，收湿敛疮"}, {"id": 406, "ch": "收涩药", "sec": "固精缩尿止带药", "n": "金樱子", "f": "固精缩尿，涩肠止泻", "a": "1.遗精滑精，遗尿尿频，带下；2.久泻，久痢；此外治脱肛、子宫脱垂、崩漏", "d": "煎服6~12g", "sp": "", "w": "", "ap": "", "m": "金樱子：固精缩尿，涩肠止泻"}, {"id": 407, "ch": "收涩药", "sec": "固精缩尿止带药", "n": "莲子", "f": "益肾固精，补脾止泻，止带，养心", "a": "1.遗精，滑精；2.脾虚久泻，食欲不振；3.带下；4.虚烦，心悸，失眠", "d": "煎服10~15g", "sp": "去心打碎用", "w": "", "ap": "莲须：固肾涩精，主治遗精、滑精、带下、尿频，1.5~5g。莲房：止血化瘀，主治崩漏、尿血、痔疮出血、产后瘀阻、恶露不尽，炒炭用，5~10g。莲子心：清心安神、交通心肾、涩精止血，主治热入心包神昏谵语、心肾不交失眠遗精、血热吐血。荷叶：清暑利湿、升阳止血，主治暑热病证、脾虚泄泻及多种出血证。荷梗：通气宽胸、和胃安胎，主治外感暑湿胸闷不畅、妊娠呕吐、胎动不安", "m": "莲子：益肾固精，补脾止泻，止带，养心"}, {"id": 408, "ch": "收涩药", "sec": "固精缩尿止带药", "n": "芡实", "f": "益肾固精，健脾止泻，除湿止带", "a": "1.遗精，滑精；2.脾虚久泻；3.带下", "d": "煎服10~15g", "sp": "", "w": "", "ap": "", "m": "芡实：益肾固精，健脾止泻，除湿止带"}, {"id": 409, "ch": "涌吐药", "sec": "涌吐药", "n": "常山", "f": "涌吐痰涎，截疟", "a": "1.胸中痰饮；2.疟疾（治疟要药）", "d": "煎服4.5~9g；入丸散酌减", "sp": "涌吐可生用，截疟宜酒制用；治疗疟疾宜在寒热发作前半天或2小时服用", "w": "因能催吐，用量不宜过大；体虚及孕妇不宜用", "ap": "", "m": function dayNum(d){d=d||new Date();return Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/DAY)}

function nextDue(stage,today,exam){
  let iv=STEPS[Math.min(stage-1,STEPS.length-1)];

  if(left>=0)iv=Math.max(1,Math.min(iv,Math.floor(left/2)||1));
  let due=today+iv;
  if(due>exam-1&&exam-1>today)due=exam-1;
  return due;
}
function applyGrade(c,g,today,exam){

  if(g===0){c.s=0;c.lap=(c.lap||0)+1;c.due=Math.min(today+1,Math.max(today+1,exam-1))}

function pickHerbs(h,key,n,needNonEmpty){

  const cands=shuffle(H.filter(x=>x!==h&&(!needNonEmpty||x[key])));

}

  let h=`<div class="card" style="text-align:center"><div class="mute">称号</div><b style="font-size:24px">${title(n)}</b><div class="mute">已收集 ${n} / ${H.length} 味</div><div class="bar" style="margin-top:8px">${cnt.map((k,i)=>`<i class="b${i}" style="width:${k/H.length*100}%"></i>`).join('')}</div><div class="leg"><span><i class="b0"></i>未学 ${cnt[0]}</span><span><i class="b1"></i>学习中 ${cnt[1]}</span><span><i class="b2"></i>较熟 ${cnt[2]}</span><span><i class="b3"></i>已掌握 ${cnt[3]}</span></div></div>`;
  const days=new Array(14).fill(0);for(const id in S.cards){const c=S.cards[id];if(!c.seen)continue;const d=Math.max(0,c.due-t);if(d<14)days[d]++}
  const mx=Math.max(1,...days);
  h+=`<div class="card"><b>未来 14 天复习量</b><div class="cal">${days.map((k,i)=>`<div><span>${k||''}</span><i style="height:${k/mx*58}px"></i>${i===0?'今':fmtDay(t+i).slice(3)}</div>`).join('')}</div></div>`;
  h+=`<div class="card"><b>章节徽章</b><div style="font-size:26px;margin-top:6px;line-height:1.6">${CH.map(c=>`<span title="${esc(c)}" style="${S.badges[c]?'':'filter:grayscale(1);opacity:.35'}">${emo(c)}</span>`).join(' ')}</div><div class="mute">学完一整章可获得徽章 +20💎</div></div>`;
  const q=search.trim();
  const hs=H.filter(x=>(!fch||x.ch===fch)&&(!q||x.n.indexOf(q)>=0||x.f.indexOf(q)>=0));
  h+=`<h2>药典图鉴</h2><div class="row"><input id="sch" placeholder="搜药名 / 功效…" value="${esc(search)}" style="flex:1;min-width:140px"><select data-act="fch"><option value="">全部章节</option>${CH.map(c=>`<option ${fch===c?'selected':''}>${esc(c)}</option>`).join('')}</select></div><div class="mute" style="margin:8px 0">点任意一味药可查看详情；灰色是还没学的。</div><div class="tiles">${hs.slice(0,120).map(x=>tile(x.id)).join('')}</div>${hs.length>120?'<div class="mute">仅显示前 120 个，请缩小范围。</div>':''}`;
  return h;
}

// ================= 设置页 =================
function vSet(){
  const wn=Object.keys(S.wrong).length;
  return `<div class="card"><b>考试日期</b><br><input type="date" id="exam" value="${esc(S.set.exam)}"><div class="mute" style="margin-top:6px">改日期后，每天新学数量和复习间隔会自动重算。</div></div>
  <div class="card"><b>每天新学数量</b><br><input type="number" id="per" min="0" max="100" value="${S.set.per||''}" placeholder="自动：${perDay()}" style="width:120px"><div class="mute" style="margin-top:6px">留空 = 按剩余天数自动分配。</div></div>
  <div class="card"><b>音效</b><br><select data-act="snd"><option value="1" ${S.set.snd?'selected':''}>开</option><option value="0" ${S.set.snd?'':'selected'}>关</option></select></div>
  <div class="card"><b>备份 / 恢复进度</b><div class="mute">进度只保存在这个浏览器里。换设备或清理浏览器前，请先复制备份码；到新设备粘贴后点「导入」。</div><textarea id="bk" placeholder="备份码显示在这里；恢复时把备份码粘贴到这里"></textarea><div class="row" style="margin-top:8px"><button class="sm" data-act="bexp">生成备份码</button><button class="sm" data-act="bimp">导入</button></div>${backupMsg?`<div class="mute" style="margin-top:6px">${esc(backupMsg)}</div>`:''}</div>
  <div class="card"><b>错题本</b><div class="mute">目前 ${wn} 味。</div>${wn?'<button class="sm" data-act="wclear" style="margin-top:6px">清空错题本</button>':''}</div>
  <div class="card"><b>重置全部进度</b><br>${confirmReset?'<span class="mute">确定要清空吗？无法恢复。</span><br><button class="sm bad" data-act="reset2">确定清空</button> <button class="sm" data-act="reset0">取消</button>':'<button class="sm bad" data-act="reset1" style="margin-top:6px">重置</button>'}</div>
  <div class="mute" style="margin-top:10px">口诀/助记由 AI 辅助编写，用于联想记忆，请以课本为准。</div>`;
}

function render(){
  const root=document.getElementById('root');
  let v;
  if(E)v=vEngine();
  else v=statsBar()+(tab==='learn'?vLearn():tab==='prac'?vPrac():tab==='dex'?vDex():vSet())+tabsBar();
  if(dex!=null)v+=`<div class="mask" data-act="dexc"><div class="box" data-keep="1"><button class="sm" data-act="dexc" style="float:right">关闭</button>${detail(H[dex])}</div></div>`;
  if(toast)v+=`<div class="toast">${esc(toast)}</div>`;
  root.innerHTML=v;
  const s=document.getElementById('sch');
  if(s)s.addEventListener('input',e=>{search=e.target.value;const p=e.target.selectionStart;render();const n=document.getElementById('sch');n.focus();n.setSelectionRange(p,p)});
  const ex=document.getElementById('exam');if(ex)ex.addEventListener('change',e=>{if(e.target.value){S.set.exam=e.target.value;save();render()}});
  const pr=document.getElementById('per');if(pr)pr.addEventListener('change',e=>{S.set.per=Math.max(0,Math.min(100,parseInt(e.target.value)||0));save();render()});
}

// ================= 交互 =================
function act(a,v,el){
  if(a==='tab'){tab=v;render();window.scrollTo(0,0)}
  else if(a==='ch'){openCh=openCh===v?'':v;render()}
  else if(a==='lesson')startLesson(v);
  else if(a==='rev')startReview();
  else if(a==='inext'||a==='iprev'){if(a==='iprev')E.idx=Math.max(0,E.idx-1);else if(E.idx+1<E.ids.length)E.idx++;else{E.phase='quiz';nextQ()}render();window.scrollTo(0,0)}
  else if(a==='pick')pick(+v);
  else if(a==='next'){nextQ();render();window.scrollTo(0,0)}
  else if(a==='exit'){E.exit=true;render()}
  else if(a==='cont'){E.exit=false;render()}
  else if(a==='quit'){E=null;render();window.scrollTo(0,0)}
  else if(a==='scope'){qsetup.scope=el.value;render()}
  else if(a==='qn'){qsetup.n=+el.value;render()}
  else if(a==='qstart'){const hs=shuffle(poolFor(qsetup.scope)).slice(0,qsetup.n);if(hs.length<4)return;startEngine({mode:'free',title:'自由练习',ids:hs.map(h=>h.id),q:hs.map(h=>({id:h.id,type:randType(h)}))})}
  else if(a==='fch'){fch=el.value;render()}
  else if(a==='dex'){dex=+v;render()}
  else if(a==='dexc'){dex=null;render()}
  else if(a==='snd'){S.set.snd=+el.value;save();render()}
  else if(a==='bexp'){
    const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    backupMsg='备份码已生成，请全选复制后保存到备忘录。';render();
    const t=document.getElementById('bk');t.value=code;t.select();try{navigator.clipboard.writeText(code).catch(()=>{})}catch(e){}
  }
  else if(a==='bimp'){
    const t=document.getElementById('bk').value.trim();
    try{const o=JSON.parse(decodeURIComponent(escape(atob(t))));if(!o||!o.cards)throw 0;mergeState(o);save();backupMsg='导入成功！'}catch(e){backupMsg='备份码无效，请检查是否完整粘贴。'}
    render();
  }
  else if(a==='wclear'){S.wrong={};save();render()}
  else if(a==='reset1'){confirmReset=true;render()}
  else if(a==='reset0'){confirmReset=false;render()}
  else if(a==='reset2'){const ex=S.set;mergeState(null);S.set=Object.assign(S.set,ex);confirmReset=false;E=null;save();render()}
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t||t.tagName==='SELECT')return;
  if(t.dataset.act==='dexc'&&t.classList.contains('mask')&&e.target.closest('.box'))return;
  act(t.dataset.act,t.dataset.v,t);
});
document.addEventListener('change',e=>{const t=e.target.closest('select[data-act]');if(t)act(t.dataset.act,t.value,t)});
document.addEventListener('keydown',e=>{
  if(!E||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
  if(E.phase==='intro'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();act('inext')}
  else if(E.phase==='quiz'&&E.cur){
    if(E.picked==null&&'1234'.indexOf(e.key)>=0&&e.key&&+e.key<=E.cur.opts.length)pick(+e.key-1);
    else if(E.picked!=null&&(e.key==='Enter'||e.key===' ')){e.preventDefault();act('next')}
  }
});
load();render();
</script>
