<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中药闯关 · 艾宾浩斯速记</title>
<style>
:root{--bg:#f4f6f1;--card:#fff;--ink:#27312b;--mute:#76827b;--line:#e1e5dd;--acc:#3a9a6a;--accd:#2c7a53;--acc2:#e3f4ea;--bad:#d9533f;--bad2:#fde8e4;--ok:#2f8f58;--ok2:#dff4e6;--warn:#b27d12;--warn2:#fff4d9;--sp:#7a4bb0;--sp2:#f0e8f9;--gem:#1fa0e0;--fire:#f08a24}
@media(prefers-color-scheme:dark){:root{--bg:#141a16;--card:#202823;--ink:#e8ede9;--mute:#98a39c;--line:#333e37;--acc:#58c78c;--accd:#3a9a6a;--acc2:#213a2b;--bad:#ef8372;--bad2:#3d2420;--ok:#6fd08f;--ok2:#1f3527;--warn:#e3b95e;--warn2:#3a3019;--sp:#c7a0ec;--sp2:#2f2439;--gem:#5cc3f2;--fire:#f5a04d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
#root{max-width:640px;margin:0 auto;padding:12px 14px 100px;min-height:100vh}
h2{font-size:17px;margin:18px 0 8px}
button{font:inherit;cursor:pointer;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);color:var(--ink);border-radius:14px;padding:10px 16px;transition:transform .08s}
button:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
button:disabled{cursor:default}
button.p{background:var(--acc);border-color:var(--accd);color:#fff;font-weight:700;letter-spacing:1px}
button.big{width:100%;padding:13px;font-size:17px}
button.sm{padding:5px 12px;font-size:14px;border-radius:10px;border-bottom-width:3px}
button.bad{border-color:var(--bad);color:var(--bad)}
.mute{color:var(--mute);font-size:14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0}
.stats{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
.pill{display:flex;align-items:center;gap:5px;font-weight:700;font-size:16px;padding:4px 12px;border-radius:999px;background:var(--card);border:2px solid var(--line)}
.pill.g{color:var(--gem)}.pill.f{color:var(--fire)}.pill.d{color:var(--accd)}
.bump{animation:bump .4s}
@keyframes bump{30%{transform:scale(1.35)}100%{transform:scale(1)}}
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;transition:width .3s}
.b0{background:var(--line)}.b1{background:#f0c04d}.b2{background:#6fb7e0}.b3{background:var(--acc)}
.leg{font-size:12px;color:var(--mute);display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 0}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.chap{background:var(--card);border:2px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden}
.chap>.hd{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.chap>.hd b{flex:1}
.chap .em{font-size:26px}
.path{padding:6px 0 16px;display:flex;flex-direction:column;align-items:center;background:var(--bg)}
.sech{font-size:13px;color:var(--mute);margin:10px 0 2px;background:var(--card);padding:2px 12px;border-radius:999px;border:1px solid var(--line)}
.node{margin:8px 0;text-align:center;width:150px}
.node button{width:68px;height:62px;border-radius:50%;font-size:28px;padding:0;border-bottom-width:6px;background:var(--card)}
.node.done button{background:#f6c84c;border-color:#d9a526}
.node.next button{background:var(--acc);border-color:var(--accd);color:#fff;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(58,154,106,.5)}100%{box-shadow:0 0 0 16px rgba(58,154,106,0)}}
.node small{display:block;font-size:11px;color:var(--mute);line-height:1.3;margin-top:3px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs div{max-width:640px;width:100%;display:flex}
.tabs button{flex:1;border:0;border-radius:0;background:none;padding:8px 0 7px;font-size:12px;color:var(--mute)}
.tabs button.on{color:var(--accd);font-weight:700}
.tabs button span{display:block;font-size:22px;line-height:1.1}
.chip{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;background:var(--acc2);color:var(--accd);margin:0 6px 4px 0}
.name{font-size:36px;font-weight:800;letter-spacing:3px;margin:4px 0}
.sec{margin-top:12px}.sec>b{display:block;font-size:13px;color:var(--mute);margin-bottom:2px}.sec>div{white-space:pre-wrap}
.mn{background:var(--warn2);border-radius:12px;padding:8px 12px;margin-top:12px;color:var(--ink)}
.mn b{color:var(--warn)}
.sp-box{background:var(--sp2);border-left:4px solid var(--sp);border-radius:8px;padding:8px 12px}
.wn-box{background:var(--warn2);border-left:4px solid var(--warn);border-radius:8px;padding:8px 12px}
.eng-top{display:flex;align-items:center;gap:12px;margin:2px 0 14px}
.eng-top .bar{flex:1;height:16px}.eng-top .bar i{background:var(--acc);border-radius:8px}
.x{border:0;background:none;font-size:22px;color:var(--mute);padding:0 4px}
.opt{display:block;width:100%;text-align:left;margin:10px 0;padding:14px 16px;line-height:1.5;font-size:17px}
.opt.ok{background:var(--ok2);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.no{background:var(--bad2);border-color:var(--bad);color:var(--bad)}
.opt:disabled{opacity:1}
.qbox{margin:14px 0 6px}
.qbox .pr{color:var(--mute);font-size:15px}
.qbox .st{margin-top:6px;font-size:21px;font-weight:700;white-space:pre-wrap;line-height:1.5}
.qbox .st.nm{font-size:40px;letter-spacing:3px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;padding:14px 14px calc(14px + env(safe-area-inset-bottom));animation:up .2s}
.sheet.ok{background:var(--ok2);border-top:3px solid var(--ok)}
.sheet.no{background:var(--bad2);border-top:3px solid var(--bad)}
.sheet .in{max-width:640px;margin:0 auto;max-height:55vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:19px}
.sheet.ok h3{color:var(--ok)}.sheet.no h3{color:var(--bad)}
.sheet button{margin-top:10px}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.mask .box{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px;animation:up .2s}
.mask.mid{align-items:center}.mask.mid .box{border-radius:20px;width:calc(100% - 40px)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.tile{aspect-ratio:1;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;cursor:pointer;border:2px solid var(--line);font-size:15px;text-align:center;line-height:1.2;padding:2px}
.tile small{font-size:20px;font-weight:400}
.tile.lock{filter:grayscale(1);opacity:.45}
.tile.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.hero{text-align:center;padding:22px 10px}
.hero .big{font-size:56px}
.cal{display:flex;gap:4px;align-items:flex-end;height:84px;margin-top:6px}
.cal div{flex:1;text-align:center;font-size:10px;color:var(--mute)}
.cal i{display:block;background:var(--acc);border-radius:3px 3px 0 0;min-height:2px;margin-bottom:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 10px;max-width:100%}
textarea{width:100%;height:100px;font-size:12px}
.warn{background:var(--warn2);border:2px solid var(--warn);color:var(--warn);border-radius:12px;padding:8px 12px;font-size:14px;margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.today b.n{font-size:28px;color:var(--accd)}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#27312b;color:#fff;padding:10px 18px;border-radius:999px;z-index:50;animation:up .25s;font-weight:700}
</style>
</head>

const DATA={"herbs": [{"id": 0, "ch": "解表药", "sec": "发散风寒药", "n": "麻黄", "f": "发汗解表，宣肺平喘，利水消肿", "a": "1.风寒感冒（表实无汗）；2.咳嗽气喘；3.风水水肿；此外取其散寒通滞，可治风寒痹证、阴疽、痰核", "d": "煎服3~10g", "sp": "发汗解表宜生用，止咳平喘多炙用", "w": "发散力强，表虚自汗、阴虚盗汗及虚喘均当慎用", "ap": "", "m": "汗喘水：发汗、平喘、利水，风寒表实第一药"}, {"id": 1, "ch": "解表药", "sec": "发散风寒药", "n": "桂枝", "f": "发汗解肌，温通经脉，助阳化气", "a": "1.风寒感冒（表实无汗、表虚有汗均可）；2.寒凝血滞诸痛证（胸痹、经闭痛经、风寒湿痹）；3.痰饮、蓄水证；4.心悸", "d": "煎服3~10g", "sp": "", "w": "辛温助热，易伤阴动血，外感热病、阴虚火旺、血热妄行等证均当忌用；孕妇及月经过多者慎用", "ap": "", "m": "桂枝走“枝”：温通经脉，表虚表实都能用"}, {"id": 2, "ch": "解表药", "sec": "发散风寒药", "n": "紫苏", "f": "发汗解表，行气宽中", "a": "1.风寒感冒，咳嗽痰多；2.脾胃气滞，胸闷呕吐（兼能安胎）；此外可用于鱼蟹中毒，腹痛吐泻", "d": "煎服3~10g", "sp": "不宜久煎", "w": "", "ap": "紫苏梗：宽胸利膈，顺气安胎；用于胸腹气滞、痞闷作胀及胎动不安", "m": "苏=舒：解表+行气，兼治鱼蟹中毒"}, {"id": 3, "ch": "解表药", "sec": "发散风寒药", "n": "生姜", "f": "发汗解表，温中止呕，温肺止咳", "a": "1.风寒感冒；2.胃寒呕吐（\"呕家圣药\"）；3.风寒咳嗽；此外能解半夏、天南星及鱼蟹毒", "d": "煎服3~10g，或捣汁服", "sp": "", "w": "伤阴助火，阴虚内热者忌服", "ap": "生姜皮：和脾行水消肿，用于水肿、小便不利，3~10g。生姜汁：偏于开痰止呕，便于临床应急服用，3~10滴冲服", "m": "呕家圣药，姜能暖胃止呕"}, {"id": 4, "ch": "解表药", "sec": "发散风寒药", "n": "香薷", "f": "发汗解表，和中化湿，利水消肿", "a": "1.阴暑证；2.水肿、脚气", "d": "煎服3~10g", "sp": "利水退肿须浓煎", "w": "辛温发汗之力较强，表虚有汗及阳暑证当忌用", "ap": "", "m": "“夏月麻黄”：阴暑、水肿"}, {"id": 5, "ch": "解表药", "sec": "发散风寒药", "n": "荆芥", "f": "发表散风，透疹消疮，炒炭止血", "a": "1.外感表证（风寒、风热均可）；2.麻疹不透、风疹瘙痒；3.疮疡初起兼有表证；4.吐衄下血（炒炭）", "d": "煎服3~10g", "sp": "不宜久煎；发表透疹消疮宜生用，止血宜炒炭用；荆芥穗更长于祛风", "w": "", "ap": "", "m": "荆防不分家；荆芥炒炭可止血"}, {"id": 6, "ch": "解表药", "sec": "发散风寒药", "n": "防风", "f": "发表散风，胜湿止痛，止痉，止泻", "a": "1.感冒头痛，风疹瘙痒；2.风湿痹痛；3.破伤风证；4.腹泻（炒用）", "d": "煎服3~10g", "sp": "", "w": "阴虚火旺、血虚发痉者慎用", "ap": "", "m": "“风药中之润剂”，风字当头：祛风胜湿止痉"}, {"id": 7, "ch": "解表药", "sec": "发散风寒药", "n": "羌活", "f": "散寒祛风，胜湿止痛", "a": "1.风寒感冒，头痛身疼；2.风寒湿痹，肩臂疼痛（上半身痹痛尤宜）", "d": "煎服3~10g", "sp": "", "w": "气味浓烈，用量过多易致呕吐，脾胃虚弱者不宜服；血虚痹痛、阴虚头痛者慎用", "ap": "", "m": "羌=上半身（头项肩背）风湿痛"}, {"id": 8, "ch": "解表药", "sec": "发散风寒药", "n": "白芷", "f": "解表散风，通窍，止痛，燥湿止带，消肿排脓", "a": "1.外感风寒，头痛、鼻塞；2.阳明头痛、牙痛、鼻渊；3.带下过多；4.疮疡肿痛", "d": "煎服3~10g；外用适量", "sp": "", "w": "阴虚血热者忌服", "ap": "", "m": "白芷通鼻窍，还管带下和排脓，前额痛首选"}, {"id": 9, "ch": "解表药", "sec": "发散风寒药", "n": "细辛", "f": "祛风散寒，通窍，止痛，温肺化饮", "a": "1.风寒感冒，阳虚外感；2.头痛、牙痛、鼻渊、痹痛；3.寒痰停饮，气逆喘咳；此外研末吹鼻取嚏，有通关开窍醒神之功", "d": "煎服2~5g；入丸散剂0.5~1g；外用适量", "sp": "入丸散用量须小（0.5~1g）", "w": "阴虚阳亢头痛、肺燥伤阴干咳忌用；反藜芦", "ap": "", "m": "细辛不过钱：祛风散寒、通窍止痛、化饮"}, {"id": 10, "ch": "解表药", "sec": "发散风寒药", "n": "藁本", "f": "祛风散寒，胜湿止痛", "a": "1.风寒感冒，巅顶头痛；2.风寒湿痹", "d": "煎服3~10g", "sp": "", "w": "血虚头痛忌服", "ap": "", "m": "巅顶头痛找藁本（高本→高处）"}, {"id": 11, "ch": "解表药", "sec": "发散风寒药", "n": "苍耳子", "f": "祛风除湿，通窍止痛", "a": "1.鼻渊头痛，风寒头痛；2.风湿痹痛；3.风疹瘙痒、疥癣", "d": "煎服3~10g，或入丸散", "sp": "", "w": "血虚头痛不宜服用；过量服用易致中毒", "ap": "苍耳草：祛风、清热、解毒；治风湿痹痛、四肢拘急，又用于麻风、疔毒、皮肤瘙痒；有小毒，6~15g，不宜过量或持续服用", "m": "苍耳通鼻窍，鼻渊头痛常用"}, {"id": 12, "ch": "解表药", "sec": "发散风寒药", "n": "辛夷", "f": "发散风寒，宣通鼻窍", "a": "1.风寒头痛、鼻塞；2.鼻渊头痛（治鼻渊要药）", "d": "煎服3~9g；外用适量", "sp": "有毛，刺激咽喉，内服宜用纱布包煎", "w": "阴虚火旺者忌服", "ap": "", "m": "辛夷花苞像鼻子：专通鼻窍"}, {"id": 13, "ch": "解表药", "sec": "发散风寒药", "n": "葱白", "f": "发汗解表，散寒通阳", "a": "1.风寒感冒（轻证）；2.阴盛格阳证；此外外敷可散结通络下乳，治乳汁郁滞、疮痈肿毒", "d": "煎服3~10g；外用适量", "sp": "", "w": "", "ap": "", "m": "葱白通阳，大葱发汗"}, {"id": 14, "ch": "解表药", "sec": "发散风寒药", "n": "胡荽", "f": "发表透疹，开胃消食", "a": "1.麻疹不透；2.饮食不消，纳食不佳", "d": "煎服3~6g；外用适量", "sp": "", "w": "因热毒壅盛而疹出不透者忌服", "ap": "", "m": "香菜（胡荽）：透麻疹，开胃"}, {"id": 15, "ch": "解表药", "sec": "发散风寒药", "n": "柽柳", "f": "发表透疹，祛风除湿", "a": "1.麻疹不透，风疹瘙痒；2.风湿痹痛", "d": "煎服3~10g；外用适量", "sp": "", "w": "麻疹已透者不宜用；用量过大令人心烦", "ap": "", "m": "柽柳＝西河柳，透疹祛风湿"}, {"id": 16, "ch": "解表药", "sec": "发散风热药", "n": "薄荷", "f": "疏散风热，清利头目，利咽，透疹，疏肝解郁", "a": "1.风热感冒，温病初起；2.头痛目赤，咽喉肿痛；3.麻疹不透，风疹瘙痒；4.肝郁气滞，胸闷胁痛；此外芳香辟秽，可治夏令感受暑湿秽浊之气所致痧胀腹痛吐泻", "d": "煎服3~6g", "sp": "宜后下；薄荷叶长于发汗，薄荷梗偏于理气", "w": "芳香辛散，发汗耗气，体虚多汗者不宜使用", "ap": "", "m": "薄荷清凉：头目、咽喉、疹子，还能疏肝"}, {"id": 17, "ch": "解表药", "sec": "发散风热药", "n": "牛蒡子", "f": "疏散风热，透疹利咽，解毒散肿", "a": "1.风热感冒，咽喉肿痛；2.麻疹不透；3.痈肿疮毒，痄腮喉痹", "d": "煎服3~10g", "sp": "炒用寒性略减", "w": "性寒滑肠通便，气虚便溏者慎用", "ap": "", "m": "牛蒡：利咽、透疹、解毒散肿，滑肠"}, {"id": 18, "ch": "解表药", "sec": "发散风热药", "n": "蝉蜕", "f": "疏散风热，透疹止痒，明目退翳，止痉", "a": "1.风热感冒，咽痛音哑；2.麻疹不透，风疹瘙痒；3.目赤翳障；4.惊痫夜啼，破伤风证", "d": "煎服3~10g，或单味研末冲服", "sp": "一般病证用量宜小，止痉则需大量", "w": "《别录》有\"主妇人生子不下\"的记载，孕妇当慎用", "ap": "", "m": "蝉蜕：风热、止痒、退翳、止痉，小儿夜啼"}, {"id": 19, "ch": "解表药", "sec": "发散风热药", "n": "桑叶", "f": "疏散风热，清肺润燥，平肝明目", "a": "1.风热感冒，头痛咳嗽；2.肺热燥咳；3.肝阳眩晕，目赤昏花；此外尚能凉血止血，治血热吐衄", "d": "煎服5~10g，或入丸散；外用煎水洗眼", "sp": "蜜制能增强润肺止咳作用，肺燥咳嗽多用蜜制桑叶", "w": "", "ap": "", "m": "桑叶：风热咳嗽燥咳，平肝明目"}, {"id": 20, "ch": "解表药", "sec": "发散风热药", "n": "菊花", "f": "疏散风热，平肝明目，清热解毒", "a": "1.风热感冒，发热头痛；2.目赤昏花；3.眩晕惊风；4.疔疮肿毒", "d": "煎服10~15g", "sp": "疏散风热多用黄菊花（杭菊花），平肝明目多用白菊花（滁菊花）", "w": "", "ap": "", "m": "菊花：平肝明目，疏风清热，野菊清毒"}, {"id": 21, "ch": "解表药", "sec": "发散风热药", "n": "蔓荆子", "f": "疏散风热，清利头目", "a": "1.风热感冒，头昏头痛；2.目赤肿痛，目昏多泪；此外可治风湿痹痛", "d": "煎服5~10g", "sp": "", "w": "", "ap": "", "m": "蔓荆子：头面部风热，头痛目赤"}, {"id": 22, "ch": "解表药", "sec": "发散风热药", "n": "柴胡", "f": "疏散退热，疏肝解郁，升举阳气", "a": "1.寒热往来（少阳证），感冒发热；2.肝郁气滞，月经不调，胸胁疼痛；3.气虚下陷，久泻脱肛；此外还可退热截疟", "d": "煎服3~10g", "sp": "和解退热宜生用，疏散肝郁宜醋炙，骨蒸劳热当用鳖血拌炒", "w": "性升散，古有\"柴胡劫肝阴\"之说，肝阳上亢、肝风内动、阴虚火旺及气机上逆者忌用或慎用", "ap": "", "m": "少阳要药：退热、疏肝、升阳"}, {"id": 23, "ch": "解表药", "sec": "发散风热药", "n": "升麻", "f": "发表透疹，清热解毒，升举阳气", "a": "1.风热头痛，麻疹不透；2.齿痛口疮，咽喉肿痛；3.气虚下陷，久泻脱肛，崩漏下血", "d": "煎服3~10g", "sp": "发表透疹解毒宜生用，升阳举陷固脱宜制用", "w": "麻疹已透，以及阴虚火旺、肝阳上亢、上盛下虚者均当忌用", "ap": "", "m": "升麻：透疹、解毒、升阳（升字当先）"}, {"id": 24, "ch": "解表药", "sec": "发散风热药", "n": "葛根", "f": "解肌退热，透发麻疹，生津止渴，升阳止泻", "a": "1.外感表证（项背强痛）；2.麻疹不透；3.热病口渴，阴虚消渴；4.热泄热痢，脾虚泄泻", "d": "煎服10~15g", "sp": "退热生津宜生用，升阳止泻宜煨用", "w": "", "ap": "葛花：解酒毒，醒脾和胃；用于饮酒过度、头痛头昏、烦渴呕吐，3~15g", "m": "葛根：项背强痛，生津止渴，升阳止泻"}, {"id": 25, "ch": "解表药", "sec": "发散风热药", "n": "淡豆豉", "f": "解表，除烦", "a": "1.感冒头痛（风寒、风热均可）；2.胸中烦闷，虚烦不眠", "d": "煎服10~15g", "sp": "", "w": "", "ap": "大豆黄卷：清解表邪、分利湿热；用于暑湿、湿温初起及湿热内蕴所致发热汗少、胸闷不舒、小便不利，10~15g", "m": "豆豉：解表+除烦（栀子豉汤）"}, {"id": 26, "ch": "解表药", "sec": "发散风热药", "n": "浮萍", "f": "发汗解表，透疹止痒，利水消肿", "a": "1.风热感冒；2.麻疹不透，风疹瘙痒；3.水肿尿少", "d": "煎服3~10g", "sp": "", "w": "表虚自汗者不宜使用", "ap": "", "m": "浮萍：发汗、透疹、利水（浮在水上）"}, {"id": 27, "ch": "解表药", "sec": "发散风热药", "n": "木贼", "f": "疏散风热，明目退翳，止血", "a": "1.风热目赤，迎风流泪，目生翳障；2.便血痔血", "d": "煎服3~10g", "sp": "", "w": "", "ap": "", "m": "木贼：明目退翳，兼止血"}, {"id": 28, "ch": "清热药", "sec": "清热泻火药", "n": "石膏", "f": "生用：清热泻火，除烦止渴；煅用：收敛生肌", "a": "1.温热病气分实热，壮热烦渴；2.肺热喘咳；3.胃火牙痛；4.疮疡不敛、湿疹、烫伤（煅用外敷）", "d": "煎服15~60g", "sp": "生石膏宜打碎先煎；内服宜生用，外用宜火煅研末", "w": "脾胃虚寒及阴虚内热者忌用", "ap": "", "m": "石膏生清熟煅敛：气分实热第一药"}, {"id": 29, "ch": "清热药", "sec": "清热泻火药", "n": "寒水石", "f": "清热泻火", "a": "1.热病烦渴；2.丹毒烫伤（外用）；此外能利窍消肿，治湿热水肿", "d": "煎服10~15g；外用适量", "sp": "", "w": "脾胃虚寒者忌服", "ap": "", "m": "寒水石：只记清热泻火"}, {"id": 30, "ch": "清热药", "sec": "清热泻火药", "n": "知母", "f": "清热泻火，滋阴润燥", "a": "1.热病烦渴；2.肺热咳嗽，阴虚燥咳；3.骨蒸潮热；4.阴虚消渴，肠燥便秘", "d": "煎服6~12g", "sp": "清热泻火宜生用，滋阴降火宜盐水炙用", "w": "性寒质润，有滑肠之弊，脾虚便溏者不宜用", "ap": "", "m": "知母：泻火+滋阴润燥，肺胃肾三经"}, {"id": 31, "ch": "清热药", "sec": "清热泻火药", "n": "芦根", "f": "清热生津，除烦止呕", "a": "1.热病烦渴；2.胃热呕逆；3.肺热咳嗽，肺痈吐脓；4.热淋涩痛", "d": "煎服，干品15~30g，鲜品用量加大", "sp": "鲜芦根清热生津、利尿之效佳，干芦根则次之", "w": "脾胃虚寒者忌服", "ap": "", "m": "芦根：清热生津，除烦止呕（空心的茎）"}, {"id": 32, "ch": "清热药", "sec": "清热泻火药", "n": "天花粉", "f": "清热生津，清肺润燥，解毒消痈", "a": "1.热病口渴，消渴多饮；2.肺热燥咳；3.痈肿疮疡", "d": "煎服10~15g", "sp": "", "w": "孕妇忌服；反乌头", "ap": "", "m": "花粉：生津、润肺、消痈"}, {"id": 33, "ch": "清热药", "sec": "清热泻火药", "n": "竹叶", "f": "清热除烦，生津利尿", "a": "1.热病烦渴；2.口疮尿赤；此外竹叶卷心长于清心火，多用于温热病邪陷心包、神昏谵语", "d": "煎服6~15g，鲜品15~30g", "sp": "", "w": "阴虚火旺、骨蒸潮热者忌用", "ap": "", "m": "竹叶：清心除烦生津利尿"}, {"id": 34, "ch": "清热药", "sec": "清热泻火药", "n": "淡竹叶", "f": "清热除烦，通利小便", "a": "1.热病烦渴；2.口疮尿赤，水肿尿少，黄疸尿赤", "d": "煎服10~15g", "sp": "", "w": "", "ap": "", "m": "淡竹叶：除烦+通利小便（比竹叶更利尿）"}, {"id": 35, "ch": "清热药", "sec": "清热泻火药", "n": "鸭跖草", "f": "清热解毒，利水消肿", "a": "1.风热感冒，高热烦渴；2.咽喉肿痛，痈疮疔毒；3.水肿尿少，热淋涩痛", "d": "煎服15~30g，鲜品30~60g；外用适量", "sp": "", "w": "脾胃虚弱者用量宜少", "ap": "", "m": "鸭跖草：解毒+利水"}, {"id": 36, "ch": "清热药", "sec": "清热泻火药", "n": "栀子", "f": "泻火除烦，清热利湿，凉血解毒，消肿止痛", "a": "1.热病烦闷；2.湿热黄疸；3.血热吐衄；4.疮疡肿毒，跌打损伤（外用）", "d": "煎服3~10g；外用适量", "sp": "栀子皮（果皮）偏于达表而去肌肤之热，栀子仁（种子）偏于走里而清内热；生用走气分而泻火，炒黑则入血分而止血", "w": "苦寒伤胃，脾虚便溏者不宜用", "ap": "", "m": "栀子：三焦火，利湿凉血，焦栀止血"}, {"id": 37, "ch": "清热药", "sec": "清热泻火药", "n": "夏枯草", "f": "清肝火，散郁结", "a": "1.目赤肿痛，头痛眩晕，目珠夜痛；2.瘰疬瘿瘤", "d": "煎服10~15g，或熬膏服", "sp": "", "w": "脾胃虚弱者慎用", "ap": "", "m": "夏枯草：清肝火、散郁结（瘰疬瘿瘤）"}, {"id": 38, "ch": "清热药", "sec": "清热泻火药", "n": "决明子", "f": "清肝明目，润肠通便", "a": "1.目赤目暗；2.肠燥便秘；此外现代用治高血压病", "d": "煎服10~15g", "sp": "用于通便不宜久煎", "w": "气虚便溏者不宜应用", "ap": "", "m": "决明：明目，润肠通便"}, {"id": 39, "ch": "清热药", "sec": "清热泻火药", "n": "谷精草", "f": "疏散风热，明目退翳", "a": "目赤翳障，头痛齿痛", "d": "煎服6~15g", "sp": "", "w": "阴虚血亏目疾不宜用", "ap": "", "m": "谷精草：风热目疾，退翳"}, {"id": 40, "ch": "清热药", "sec": "清热泻火药", "n": "密蒙花", "f": "清热养肝，明目退翳", "a": "目赤翳障（肝热、肝虚均可）", "d": "煎服6~10g", "sp": "", "w": "肝经风热目疾不宜用", "ap": "", "m": "密蒙花：养肝明目退翳"}, {"id": 41, "ch": "清热药", "sec": "清热泻火药", "n": "青葙子", "f": "清泄肝火，明目退翳", "a": "目赤翳障；此外现代用于肝火亢盛之高血压病", "d": "煎服3~15g", "sp": "", "w": "有扩散瞳孔的作用，青光眼患者忌用", "ap": "", "m": "青葙子：清肝火，明目（散瞳忌用）"}, {"id": 42, "ch": "清热药", "sec": "清热燥湿药", "n": "黄芩", "f": "清热燥湿，泻火解毒，止血，安胎", "a": "1.湿温暑湿，湿热痞满，黄疸泻痢；2.肺热咳嗽，热病烦渴；3.痈肿疮毒，咽喉肿痛；4.血热吐衄；5.胎动不安", "d": "煎服3~10g", "sp": "清热多生用，安胎多炒用，止血多炒炭用，清上焦热可酒炙用；枯芩（宿根）善清肺火，条芩（子根）善清大肠之火、泻下焦湿热", "w": "苦寒伤胃，脾胃虚寒者不宜使用", "ap": "", "m": "黄芩：上焦湿热，止血安胎"}, {"id": 43, "ch": "清热药", "sec": "清热燥湿药", "n": "黄连", "f": "清热燥湿，泻火解毒", "a": "1.胃肠湿热，泻痢呕吐（治湿热泻痢要药）；2.热盛火炽，高热烦躁；3.痈疽疔毒，皮肤湿疮，耳目肿痛", "d": "煎服2~10g；研末吞服1~1.5g，日三次；外用适量", "sp": "炒用能降低寒性；姜汁炙用清胃止呕，酒炙清上焦火，猪胆汁炒泻肝胆实火", "w": "大苦大寒，过服久服易伤脾胃，脾胃虚寒者忌用；苦燥伤津，阴虚津伤者慎用", "ap": "", "m": "黄连：中焦湿热，泻心火，善解毒"}, {"id": 44, "ch": "清热药", "sec": "清热燥湿药", "n": "黄柏", "f": "清热燥湿，泻火解毒，退热除蒸", "a": "1.湿热带下，热淋脚气，泻痢黄疸；2.疮疡肿痛，湿疹湿疮；3.阴虚发热，盗汗遗精", "d": "煎服5~10g，或入丸散；外用适量", "sp": "清热燥湿解毒多生用，泻火除蒸退热多盐水炙用，止血多炒炭用", "w": "苦寒易损伤胃气，脾胃虚寒者忌用", "ap": "", "m": "黄柏：下焦湿热，退虚热"}, {"id": 45, "ch": "清热药", "sec": "清热燥湿药", "n": "龙胆草", "f": "清热燥湿，泻肝胆火", "a": "1.阴肿阴痒，带下湿疹，黄疸尿赤；2.肝火头痛，目赤耳聋，胁痛口苦；3.肝经热盛、热极生风所致高热惊厥、手足抽搐", "d": "煎服3~6g；外用适量", "sp": "", "w": "脾胃虚寒者不宜用；阴虚津伤者慎用", "ap": "", "m": "龙胆：肝胆湿热、肝火"}, {"id": 46, "ch": "清热药", "sec": "清热燥湿药", "n": "秦皮", "f": "清热燥湿，解毒，止痢，止带，明目", "a": "1.热毒泻痢，湿热带下；2.目赤肿痛，目生翳膜", "d": "煎服3~12g；外用适量", "sp": "", "w": "脾胃虚寒者忌用", "ap": "", "m": "秦皮：止痢、止带、明目"}, {"id": 47, "ch": "清热药", "sec": "清热燥湿药", "n": "苦参", "f": "清热燥湿，杀虫利尿", "a": "1.湿热泻痢，便血，黄疸；2.带下阴痒，湿疹疥癣，小便不利", "d": "煎服3~10g；外用适量", "sp": "", "w": "苦寒伤胃、伤阴，脾胃虚寒及阴虚津伤者忌用或慎用；反藜芦", "ap": "", "m": "苦参：苦燥，杀虫利尿，不宜与藜芦同用"}, {"id": 48, "ch": "清热药", "sec": "清热燥湿药", "n": "白鲜皮", "f": "清热燥湿，祛风解毒", "a": "1.湿热疮毒，湿疹疥癣；2.黄疸尿赤，湿热痹痛", "d": "煎服6~10g；外用适量", "sp": "", "w": "虚寒患者慎用", "ap": "", "m": "白鲜皮：皮肤病（湿热疮毒痒）"}, {"id": 49, "ch": "清热药", "sec": "清热燥湿药", "n": "椿皮", "f": "清热燥湿，止带止泻，收敛止血", "a": "1.湿热泻痢，久泻久痢；2.赤白带下；3.崩漏经多，便血痔血", "d": "煎服3~10g；外用适量", "sp": "", "w": "脾胃虚寒者慎用", "ap": "", "m": "椿皮：燥湿止带止泻"}, {"id": 50, "ch": "清热药", "sec": "清热解毒药", "n": "金银花", "f": "清热解毒，疏散风热", "a": "1.痈肿疔疮（治一切内痈外痈要药）；2.外感风热，温病初起；3.热毒血痢", "d": "煎服10~15g", "sp": "疏散风热以生品为佳；炒炭宜用于热毒血痢；露剂多用于暑热烦渴", "w": "脾胃虚寒及气虚疮疡脓清者忌用", "ap": "忍冬藤：功同金银花而解毒之力不及，但能通经络，用于风湿热痹、关节红肿热痛，煎服15~30g", "m": "银花：疏散风热+解毒，疮痈要药"}, {"id": 51, "ch": "清热药", "sec": "清热解毒药", "n": "连翘", "f": "清热解毒，消痈散结，疏散风热", "a": "1.痈肿疮毒，瘰疬痰核（\"疮家圣药\"）；2.外感风热，温病初起；3.热淋涩痛", "d": "煎服6~15g", "sp": "", "w": "脾胃虚寒及气虚脓清者不宜用", "ap": "", "m": "疮家圣药：连翘消痈散结"}, {"id": 52, "ch": "清热药", "sec": "清热解毒药", "n": "蒲公英", "f": "清热解毒，消痈散结，利湿通淋", "a": "1.痈肿疔毒，乳痈内痈（治乳痈要药）；2.热淋涩痛，湿热黄疸；此外可清肝明目，治目赤肿痛", "d": "煎服10~30g；外用适量", "sp": "", "w": "用量过大，可致缓泻", "ap": "", "m": "蒲公英：乳痈要药，兼利湿通淋"}, {"id": 53, "ch": "清热药", "sec": "清热解毒药", "n": "紫花地丁", "f": "清热解毒，消痈散结", "a": "1.疔疮肿毒，乳痈肠痈；2.毒蛇咬伤；此外可用于肝热目赤肿痛", "d": "煎服15~30g；外用适量", "sp": "", "w": "体质虚寒者忌服", "ap": "", "m": "地丁：疔疮要药"}, {"id": 54, "ch": "清热药", "sec": "清热解毒药", "n": "野菊花", "f": "清热解毒", "a": "1.痈疽疔疖，丹毒；2.热毒上攻之咽喉肿痛、风火赤眼；此外内服并煎汤外洗治湿疹等皮肤瘙痒", "d": "煎服10~18g；外用适量", "sp": "", "w": "", "ap": "", "m": "野菊花：疔疮痈肿，只清热解毒"}, {"id": 55, "ch": "清热药", "sec": "清热解毒药", "n": "穿心莲", "f": "清热解毒，燥湿消肿", "a": "1.外感风热，温病初起，肺热咳喘，肺痈吐脓，咽喉肿痛；2.湿热泻痢，热淋涩痛，湿疹瘙痒；3.痈肿疮毒，蛇虫咬伤", "d": "煎服6~15g；外用适量", "sp": "味极苦，多作丸、散、片剂服", "w": "不宜多服久服；脾胃虚寒者不宜用", "ap": "", "m": "穿心莲：解毒+燥湿消肿"}, {"id": 56, "ch": "清热药", "sec": "清热解毒药", "n": "大青叶", "f": "清热解毒，凉血消斑", "a": "1.热入营血，温毒发斑；2.喉痹口疮，痄腮丹毒", "d": "煎服10~15g，鲜品30~60g；外用适量", "sp": "", "w": "脾胃虚寒者忌用", "ap": "", "m": "大青叶：解毒凉血消斑"}, {"id": 57, "ch": "清热药", "sec": "清热解毒药", "n": "板蓝根", "f": "清热解毒，凉血利咽", "a": "温热病发热、头痛、喉痛，或温毒发斑、痄腮、痈肿疮毒、丹毒、大头瘟疫等多种热毒炽盛之证", "d": "煎服10~15g", "sp": "", "w": "脾胃虚寒者忌用", "ap": "", "m": "板蓝根：偏利咽"}, {"id": 58, "ch": "清热药", "sec": "清热解毒药", "n": "青黛", "f": "清热解毒，凉血消斑，清肝泻火，定惊", "a": "1.温毒发斑，血热吐衄；2.咽痛口疮，火毒疮疡；3.咳嗽胸痛，痰中带血（肝火犯肺）；4.暑热惊痫，惊风抽搐", "d": "内服1.5~3g；外用适量", "sp": "难溶于水，一般作散剂冲服，或入丸剂服用，不宜入汤剂", "w": "胃寒者慎用", "ap": "", "m": "青黛：清肝泻火定惊，外敷口疮"}, {"id": 59, "ch": "清热药", "sec": "清热解毒药", "n": "贯众", "f": "清热解毒，凉血止血，杀虫", "a": "1.风热感冒，温毒发斑；2.血热出血（崩漏下血尤宜）；3.虫疾（绦虫、钩虫、蛲虫、蛔虫）", "d": "煎服10~15g", "sp": "杀虫及清热解毒宜生用，止血宜炒炭用", "w": "有小毒，用量不宜过大；脾胃虚寒者慎用", "ap": "", "m": "贯众：解毒凉血止血杀虫"}, {"id": 60, "ch": "清热药", "sec": "清热解毒药", "n": "鱼腥草", "f": "清热解毒，消痈排脓，利尿通淋", "a": "1.肺痈吐脓，肺热咳嗽（治肺痈要药）；2.热毒疮疡；3.湿热淋证", "d": "煎服15~30g；外用适量", "sp": "含挥发油，不宜久煎", "w": "", "ap": "", "m": "肺痈要药：鱼腥草，后下"}, {"id": 61, "ch": "清热药", "sec": "清热解毒药", "n": "金荞麦", "f": "清热解毒，清肺化痰", "a": "1.肺痈咯痰浓稠腥臭，瘰疬疮疖；2.肺热咳嗽，咽喉肿痛", "d": "煎服15~45g", "sp": "亦可用水或黄酒隔水密闭炖服", "w": "", "ap": "", "m": "金荞麦：肺痈、肺热咳嗽"}, {"id": 62, "ch": "清热药", "sec": "清热解毒药", "n": "红藤", "f": "清热解毒，活血止痛", "a": "1.肠痈腹痛（治肠痈要药），热毒疮疡；2.跌打损伤，风湿痹痛，经闭痛经", "d": "煎服15~30g", "sp": "", "w": "孕妇不宜多服", "ap": "", "m": "红藤（大血藤）：肠痈要药"}, {"id": 63, "ch": "清热药", "sec": "清热解毒药", "n": "败酱草", "f": "清热解毒，消痈排脓，祛瘀止痛", "a": "1.肠痈肺痈，痈肿疮毒；2.产后瘀阻腹痛", "d": "煎服6~15g；外用适量", "sp": "", "w": "脾胃虚弱、食少泄泻者忌服", "ap": "墓头回：性能功用与败酱草相似，多用于崩漏下血、赤白带下，用法用量同败酱草", "m": "败酱草：肠痈，祛瘀止痛"}, {"id": 64, "ch": "清热药", "sec": "清热解毒药", "n": "射干", "f": "清热解毒，祛痰利咽", "a": "1.咽喉肿痛；2.痰盛咳喘", "d": "煎服6~10g", "sp": "", "w": "孕妇忌用或慎用", "ap": "", "m": "射干：咽喉肿痛、痰壅咳喘"}, {"id": 65, "ch": "清热药", "sec": "清热解毒药", "n": "山豆根", "f": "清热解毒，利咽消肿", "a": "1.热毒蕴结，咽喉肿痛；2.牙龈肿痛；此外可用于湿热黄疸、肺热咳嗽、痈肿疮毒", "d": "煎服3~10g；外用适量", "sp": "", "w": "大苦大寒，过量服用易引起呕吐、腹泻、胸闷、心悸等副作用，用量不宜过大；脾胃虚寒者慎用", "ap": "北豆根：与广豆根功效相近，解毒利咽治咽喉肿痛，兼有降压、镇咳、祛痰及抗癌作用", "m": "山豆根：咽喉肿痛要药，苦寒伤胃"}, {"id": 66, "ch": "清热药", "sec": "清热解毒药", "n": "马勃", "f": "清热解毒，利咽，止血", "a": "1.风热及肺火咽喉肿痛，咳嗽失音；2.吐血衄血，外伤出血", "d": "煎服3~6g；外用适量", "sp": "", "w": "", "ap": "", "m": "马勃：利咽止血，外用止血"}, {"id": 67, "ch": "清热药", "sec": "清热解毒药", "n": "白头翁", "f": "清热解毒，凉血止痢", "a": "热毒血痢（治痢要药）；此外配秦皮煎汤外洗治阴痒，亦可用于疟疾", "d": "煎服6~15g；外用适量", "sp": "", "w": "虚寒泻痢忌服", "ap": "", "m": "白头翁：热毒血痢"}, {"id": 68, "ch": "清热药", "sec": "清热解毒药", "n": "马齿苋", "f": "清热解毒，凉血止血，止痢", "a": "1.热毒血痢；2.热毒疮疡；3.崩漏便血", "d": "煎服30~60g，鲜品加倍；外用适量", "sp": "", "w": "脾胃虚寒、肠滑作泄者忌服", "ap": "", "m": "马齿苋：痢疾，凉血止血"}, {"id": 69, "ch": "清热药", "sec": "清热解毒药", "n": "鸦胆子", "f": "清热解毒，止痢截疟，腐蚀赘疣", "a": "1.热毒血痢，冷积久痢；2.各型疟疾；3.鸡眼赘疣（外用）", "d": "内服10~15粒（治疟疾）或10~30粒（治痢疾）；外用适量", "sp": "不宜入煎剂；以干龙眼肉或胶囊包裹吞服，亦可压去油制成丸剂、片剂服", "w": "对胃肠道及肝肾均有损害，不宜多用久服；胃肠出血及肝肾病患者忌用或慎用", "ap": "", "m": "鸦胆子：休息痢，疟疾，外用腐蚀赘疣"}, {"id": 70, "ch": "清热药", "sec": "清热解毒药", "n": "地锦草", "f": "清热解毒，凉血止血", "a": "1.热毒泻痢，热毒疮肿，毒蛇咬伤；2.便血尿血、崩漏及外伤出血等多种出血证；3.湿热黄疸", "d": "煎服15~30g；外用适量", "sp": "", "w": "", "ap": "", "m": "地锦草：解毒+凉血止血"}, {"id": 71, "ch": "清热药", "sec": "清热解毒药", "n": "蚤休", "f": "清热解毒，消肿止痛，凉肝定惊", "a": "1.痈肿疔疮，毒蛇咬伤；2.惊风抽搐；此外用于跌打损伤、外伤出血", "d": "煎服5~10g；外用适量", "sp": "", "w": "体虚、无实火热毒、阴证外疡及孕妇均忌服", "ap": "", "m": "蚤休（重楼）：毒蛇咬伤，定惊"}, {"id": 72, "ch": "清热药", "sec": "清热解毒药", "n": "拳参", "f": "清热解毒，镇肝息风，凉血止痢", "a": "1.痈肿瘰疬，毒蛇咬伤；2.热病惊痫；3.赤痢脓血，湿热泄泻；此外能利湿，可用于水肿、小便不利", "d": "煎服3~12g；外用适量", "sp": "", "w": "无实火热毒者不宜用", "ap": "", "m": "拳参：解毒、止痢、息风"}, {"id": 73, "ch": "清热药", "sec": "清热解毒药", "n": "半边莲", "f": "清热解毒，利水消肿", "a": "1.疔疮肿毒，乳痈肿痛，蛇虫咬伤；2.腹胀水肿，黄疸尿少", "d": "煎服，干品10~15g，鲜品30~60g；外用适量", "sp": "", "w": "虚证水肿忌用", "ap": "", "m": "半边莲：毒蛇咬伤，水肿"}, {"id": 74, "ch": "清热药", "sec": "清热解毒药", "n": "白花蛇舌草", "f": "清热解毒，利湿通淋", "a": "1.痈肿疮毒，咽喉肿痛，毒蛇咬伤；2.热淋涩痛；现代广泛用于各种癌症", "d": "煎服15~60g；外用适量", "sp": "", "w": "阴疽及脾胃虚寒者忌用", "ap": "", "m": "白花蛇舌草：解毒利湿，肠痈"}, {"id": 75, "ch": "清热药", "sec": "清热解毒药", "n": "山慈菇", "f": "清热解毒，消痈散结", "a": "1.痈疽疔毒，瘰疬痰核；2.癥瘕痞块", "d": "煎服3~6g；外用适量", "sp": "", "w": "正虚体弱者慎用", "ap": "", "m": "山慈菇：痈肿疔毒，瘰疬"}, {"id": 76, "ch": "清热药", "sec": "清热解毒药", "n": "土茯苓", "f": "解毒，除湿，通利关节", "a": "1.梅毒，或因梅毒服汞剂中毒而致肢体拘挛者；2.淋浊带下，湿疹瘙痒；3.痈肿疮毒", "d": "煎服15~60g；外用适量", "sp": "", "w": "肝肾阴虚者慎服；服药时忌茶", "ap": "", "m": "土茯苓：梅毒，汞中毒解毒要药"}, {"id": 77, "ch": "清热药", "sec": "清热解毒药", "n": "熊胆", "f": "清热解毒，息风止痉，清肝明目", "a": "1.热极生风，惊痫抽搐；2.疮痈肿痛及痔疮肿痛；3.肝热目赤肿痛，目生翳障；此外亦用于热毒壅滞之咽喉肿痛", "d": "内服1~2.5g；外用适量", "sp": "多作丸、散，不入汤剂", "w": "脾胃虚寒者忌服", "ap": "引流熊胆粉：活熊引流胆汁的干燥品，功用与熊胆相同，可代熊胆使用", "m": "熊胆：息风止痉，清肝明目"}, {"id": 78, "ch": "清热药", "sec": "清热解毒药", "n": "漏芦", "f": "清热解毒，消痈散结，通经下乳", "a": "1.乳痈肿痛，瘰疬疮毒；2.乳汁不下；此外可用于湿痹拘挛", "d": "煎服3~12g", "sp": "", "w": "气虚、疮疡平塌及孕妇忌服", "ap": "", "m": "漏芦：乳痈，通经下乳"}, {"id": 79, "ch": "清热药", "sec": "清热解毒药", "n": "白蔹", "f": "清热解毒，消痈散结，敛疮生肌", "a": "1.疮痈肿毒，瘰疬痰核；2.水火烫伤，手足皲裂", "d": "煎服3~10g；外用适量", "sp": "", "w": "反乌头", "ap": "", "m": "白蔹：疮痈，生肌敛疮"}, {"id": 80, "ch": "清热药", "sec": "清热解毒药", "n": "四季青", "f": "清热解毒，凉血止血，敛疮", "a": "1.水火烫伤，湿疹，疮疡；2.肺热咳嗽，咽喉肿痛，热淋，泻痢；3.外伤出血", "d": "煎服15~30g；外用适量", "sp": "", "w": "脾胃虚寒、肠滑泄泻者慎用", "ap": "", "m": "四季青：烧烫伤"}, {"id": 81, "ch": "清热药", "sec": "清热解毒药", "n": "绿豆", "f": "清热解毒，消暑，利水", "a": "1.痈肿疮毒；2.暑热烦渴；3.药食中毒；4.水肿，小便不利", "d": "煎服15~30g；外用适量", "sp": "", "w": "脾胃虚寒、肠滑泄泻者忌用", "ap": "绿豆衣：功同绿豆，解暑之力不及，但清热解毒之功胜之，并能退目翳，煎服6~12g", "m": "绿豆：解毒消暑，解多种药毒"}, {"id": 82, "ch": "清热药", "sec": "清热凉血药", "n": "生地黄", "f": "清热凉血，养阴生津", "a": "1.热入营血，口干舌绛；2.血热妄行，斑疹吐衄；3.津伤口渴，内热消渴；此外治肠燥便秘", "d": "煎服10~30g，鲜品用量加倍，或以鲜品捣汁入药", "sp": "鲜地黄味甘苦性大寒，作用与干地黄相似，滋阴之力稍逊，但清热生津、凉血止血之力较强", "w": "性寒而滞，脾虚湿滞、腹满便溏者不宜使用", "ap": "", "m": "生地：清热凉血+养阴生津，热入营血"}, {"id": 83, "ch": "清热药", "sec": "清热凉血药", "n": "玄参", "f": "清热凉血，滋阴解毒", "a": "1.温邪入营，内陷心包，温毒发斑；2.热病伤阴，津伤便秘，骨蒸劳嗽；3.目赤咽痛，瘰疬，白喉，痈肿疮毒", "d": "煎服10~15g", "sp": "", "w": "性寒而滞，脾胃虚寒、食少便溏者不宜服用；反藜芦", "ap": "", "m": "玄参：清热凉血，滋阴解毒（咽喉）"}, {"id": 84, "ch": "清热药", "sec": "清热凉血药", "n": "牡丹皮", "f": "清热凉血，活血散瘀", "a": "1. , "sp": "生大黄泻下力较强，欲攻下者宜生用；入汤剂应后下，或用开水泡服，久煎则泻下力减弱；酒制大黄泻下力较弱，活血作用较好，宜用于瘀血证；大黄炭多用于出血证", "w": "苦寒易伤胃气，脾胃虚弱者慎用；性沉降且善活血祛瘀，妇女怀孕、月经期、哺乳期应忌用", "ap": "", "m": "大黄：将军，攻积泻火止血解毒活血，后下"}, {"id": 94, "ch": "泻下药", "sec": "攻下药", "n": "芒硝", "f": "泻下，软坚，清热", "a": "1.实热积滞，大便燥结；2.咽痛、口疮、目赤及疮疡肿痛（外用）", "d": "内服10~15g；外用适量", "sp": "不入煎，冲入药汁内或开水溶化后服", "w": "孕妇及哺乳期妇女忌用或慎用", "ap": "", "m": "芒硝：软坚泻下，外用消肿，冲服"}, {"id": 95, "ch": "泻下药", "sec": "攻下药", "n": "番泻叶", "f": "泻下导滞", "a": "用于便秘（热结便秘、习惯性便秘）；此外能泻下行水消胀，可用于腹水肿胀", "d": "温开水泡服1.5~3g；煎服5~9g", "sp": "宜温开水泡服；入煎剂宜后下", "w": "妇女哺乳期、月经期及孕妇忌用；剂量过大有恶心、呕吐、腹痛等副作用", "ap": "", "m": "番泻叶：泻下导滞，后下"}, {"id": 96, "ch": "泻下药", "sec": "攻下药", "n": "芦荟", "f": "泻下，清肝，杀虫", "a": "1.热结便秘；2.肝经实火证；3.小儿疳积；此外外用治癣疮", "d": "入丸散服，每次1~2g；外用适量", "sp": "只入丸散，不入汤剂", "w": "脾胃虚弱、食少便溏及孕妇忌用", "ap": "", "m": "芦荟：泻下清肝杀虫"}, {"id": 97, "ch": "泻下药", "sec": "润下药", "n": "火麻仁", "f": "润肠通便", "a": "肠燥便秘（老人、产妇及体弱津血不足者）", "d": "煎服10~15g", "sp": "打碎入煎", "w": "", "ap": "", "m": "火麻仁：润肠通便"}, {"id": 98, "ch": "泻下药", "sec": "润下药", "n": "郁李仁", "f": "润肠通便，利水消肿", "a": "1.肠燥便秘；2.水肿腹满，脚气浮肿", "d": "煎服6~12g", "sp": "", "w": "孕妇慎用", "ap": "", "m": "郁李仁：润肠+利水"}, {"id": 99, "ch": "泻下药", "sec": "峻下逐水药", "n": "甘遂", "f": "泻水逐饮，消肿散结", "a": "1.水肿，鼓胀，胸胁停饮；2.风痰癫痫；3.疮痈肿毒（外用）", "d": "入丸散服，每次0.5~1g；外用适量，生用", "sp": "只入丸散，不入煎剂；内服醋制用，以减低毒性", "w": "虚弱者及孕妇忌用；反甘草", "ap": "", "m": "逐水三药：遂戟芫，十枣汤"}, {"id": 100, "ch": "泻下药", "sec": "峻下逐水药", "n": "京大戟", "f": "泻水逐饮，消肿散结", "a": "1.水肿，鼓胀，胸胁停饮；2.痈肿疮毒，瘰疬痰核", "d": "煎服1.5~3g；入丸散服，每次1g；外用适量，生用", "sp": "内服醋制用，以减低毒性", "w": "虚弱者及孕妇忌用；反甘草", "ap": "红大戟：茜草科红大戟的块根，功用与京大戟略同；京大戟泻下逐水力强，红大戟消肿散结力胜", "m": "京大戟：与甘遂同属，逐水，反甘草"}, {"id": 101, "ch": "泻下药", "sec": "峻下逐水药", "n": "芫花", "f": "泻水逐饮，祛痰止咳，杀虫疗疮", "a": "1.胸胁停饮，水肿，鼓胀；2.咳嗽痰喘；3.头疮、白秃、顽癣（外用）", "d": "煎服1.5~3g；入丸散服，每次0.6g；外用适量", "sp": "内服醋制用，以降低毒性", "w": "虚弱者及孕妇忌用；反甘草", "ap": "", "m": "芫花：逐水+祛痰止咳，反甘草"}, {"id": 102, "ch": "泻下药", "sec": "峻下逐水药", "n": "商陆", "f": "泻下利水，消肿散结", "a": "1.水肿，鼓胀；2.疮痈肿毒（外用）", "d": "煎服5~10g；外用适量", "sp": "", "w": "孕妇忌用", "ap": "", "m": "
