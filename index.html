<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>中药闯关 · 艾宾浩斯速记</title>
<style>
:root{--bg:#f4f6f1;--card:#fff;--ink:#27312b;--mute:#76827b;--line:#e1e5dd;--acc:#3a9a6a;--accd:#2c7a53;--acc2:#e3f4ea;--bad:#d9533f;--bad2:#fde8e4;--ok:#2f8f58;--ok2:#dff4e6;--warn:#b27d12;--warn2:#fff4d9;--sp:#7a4bb0;--sp2:#f0e8f9;--gem:#1fa0e0;--fire:#f08a24;--c0:#e8604c;--c1:#2f8fd9;--c2:#e0a020;--c3:#8a55c8;--c4:#2a9a6a}
@media(prefers-color-scheme:dark){:root{--bg:#141a16;--card:#202823;--ink:#e8ede9;--mute:#98a39c;--line:#333e37;--acc:#58c78c;--accd:#3a9a6a;--acc2:#213a2b;--bad:#ef8372;--bad2:#3d2420;--ok:#6fd08f;--ok2:#1f3527;--warn:#e3b95e;--warn2:#3a3019;--sp:#c7a0ec;--sp2:#2f2439;--gem:#5cc3f2;--fire:#f5a04d}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
#root{max-width:640px;margin:0 auto;padding:12px 14px 100px;min-height:100vh}
h2{font-size:17px;margin:18px 0 8px}
button{font:inherit;cursor:pointer;border:2px solid var(--line);border-bottom-width:4px;background:var(--card);color:var(--ink);border-radius:14px;padding:10px 16px;transition:transform .08s}
button:active{transform:translateY(2px);border-bottom-width:2px;margin-bottom:2px}
button:disabled{cursor:default;opacity:.5}
button.p{background:var(--acc);border-color:var(--accd);color:#fff;font-weight:700;letter-spacing:1px}
button.big{width:100%;padding:13px;font-size:17px}
button.sm{padding:5px 12px;font-size:14px;border-radius:10px;border-bottom-width:3px}
button.bad{border-color:var(--bad);color:var(--bad)}
.mute{color:var(--mute);font-size:14px}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin:10px 0}
.stats{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
.pill{display:flex;align-items:center;gap:5px;font-weight:700;font-size:16px;padding:4px 12px;border-radius:999px;background:var(--card);border:2px solid var(--line)}
.pill.g{color:var(--gem)}.pill.f{color:var(--fire)}.pill.d{color:var(--accd)}
.bump{animation:bump .4s}
@keyframes bump{30%{transform:scale(1.35)}100%{transform:scale(1)}}
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden;display:flex}
.bar i{display:block;height:100%;transition:width .3s}
.b0{background:var(--line)}.b1{background:#f0c04d}.b2{background:#6fb7e0}.b3{background:var(--acc)}
.leg{font-size:12px;color:var(--mute);display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 0}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.chap{background:var(--card);border:2px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden}
.chap>.hd{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer}
.chap>.hd b{flex:1}
.chap .em{font-size:26px}
.path{padding:6px 0 16px;display:flex;flex-direction:column;align-items:center;background:var(--bg)}
.sech{font-size:13px;color:var(--mute);margin:10px 0 2px;background:var(--card);padding:2px 12px;border-radius:999px;border:1px solid var(--line)}
.node{margin:8px 0;text-align:center;width:150px}
.node button{width:68px;height:62px;border-radius:50%;font-size:28px;padding:0;border-bottom-width:6px;background:var(--card)}
.node.done button{background:#f6c84c;border-color:#d9a526}
.node.next button{background:var(--acc);border-color:var(--accd);color:#fff;animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(58,154,106,.5)}100%{box-shadow:0 0 0 16px rgba(58,154,106,0)}}
.node small{display:block;font-size:11px;color:var(--mute);line-height:1.3;margin-top:3px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabs div{max-width:640px;width:100%;display:flex}
.tabs button{flex:1;border:0;border-radius:0;background:none;padding:8px 0 7px;font-size:12px;color:var(--mute)}
.tabs button.on{color:var(--accd);font-weight:700}
.tabs button span{display:block;font-size:22px;line-height:1.1}
.chip{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;background:var(--acc2);color:var(--accd);margin:0 6px 4px 0}
.chip.btn{cursor:pointer;font-size:14px;padding:3px 11px}
.name{font-size:36px;font-weight:800;letter-spacing:3px;margin:4px 0;display:inline-block}
.spk{border:0;background:var(--acc2);color:var(--accd);border-radius:999px;width:36px;height:36px;padding:0;font-size:18px;vertical-align:middle;margin-left:8px;border-bottom-width:0}
.sec{margin-top:12px}.sec>b{display:block;font-size:13px;color:var(--mute);margin-bottom:2px}.sec>div{white-space:pre-wrap}
.kj{background:linear-gradient(135deg,#fff4d9,#ffe9c2);border-radius:14px;padding:10px 14px;margin-top:12px;color:#5b3d05;font-size:18px;line-height:1.75;letter-spacing:1px;font-family:"Kaiti SC","STKaiti","KaiTi","Songti SC",serif}
@media(prefers-color-scheme:dark){.kj{background:#3a3019;color:#f2dca8}}
.kj b{font:600 12px -apple-system,sans-serif;letter-spacing:0;color:var(--warn);display:block}
.mn{background:var(--warn2);border-radius:12px;padding:8px 12px;margin-top:10px;font-size:14px}
.mn b{color:var(--warn)}
.fxb{background:var(--sp2);border-radius:12px;padding:8px 12px;margin-top:10px;font-size:14px}
.fxb b{color:var(--sp)}
.sp-box{background:var(--sp2);border-left:4px solid var(--sp);border-radius:8px;padding:8px 12px}
.wn-box{background:var(--warn2);border-left:4px solid var(--warn);border-radius:8px;padding:8px 12px}
.eng-top{display:flex;align-items:center;gap:10px;margin:2px 0 14px}
.eng-top .bar{flex:1;height:16px}.eng-top .bar i{background:var(--acc);border-radius:8px}
.x{border:0;background:none;font-size:22px;color:var(--mute);padding:0 4px;border-bottom-width:0}
.opt{display:block;width:100%;text-align:left;margin:10px 0;padding:14px 16px;line-height:1.5;font-size:17px}
.opt.ok{background:var(--ok2);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.no{background:var(--bad2);border-color:var(--bad);color:var(--bad)}
.opt.view::after{content:" 🔍";font-size:13px;opacity:.6}
.qbox{margin:14px 0 6px}
.qbox .pr{color:var(--mute);font-size:15px}
.qbox .st{margin-top:6px;font-size:21px;font-weight:700;white-space:pre-wrap;line-height:1.5}
.qbox .st.nm{font-size:40px;letter-spacing:3px}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;padding:14px 14px calc(14px + env(safe-area-inset-bottom));animation:up .2s}
.sheet.ok{background:var(--ok2);border-top:3px solid var(--ok)}
.sheet.no{background:var(--bad2);border-top:3px solid var(--bad)}
.sheet .in{max-width:640px;margin:0 auto;max-height:50vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:19px}
.sheet.ok h3{color:var(--ok)}.sheet.no h3{color:var(--bad)}
.sheet button{margin-top:10px}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.mask .box{background:var(--bg);width:100%;max-width:640px;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px;animation:up .2s}
.mask.mid{align-items:center}.mask.mid .box{border-radius:20px;width:calc(100% - 40px)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.tile{aspect-ratio:1;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;cursor:pointer;border:2px solid var(--line);font-size:15px;text-align:center;line-height:1.2;padding:2px}
.tile small{font-size:20px;font-weight:400}
.tile.lock{filter:grayscale(1);opacity:.45}
.tile.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.hero{text-align:center;padding:22px 10px}
.hero .big{font-size:56px}
.cal{display:flex;gap:4px;align-items:flex-end;height:84px;margin-top:6px}
.cal div{flex:1;text-align:center;font-size:10px;color:var(--mute)}
.cal i{display:block;background:var(--acc);border-radius:3px 3px 0 0;min-height:2px;margin-bottom:2px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 10px;max-width:100%}
textarea{width:100%;height:90px;font-size:12px}
.warn{background:var(--warn2);border:2px solid var(--warn);color:var(--warn);border-radius:12px;padding:8px 12px;font-size:14px;margin:8px 0}
.row{display:flex;gap:8px;flex-wrap:wrap}
.today b.n{font-size:28px;color:var(--accd)}
.toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#27312b;color:#fff;padding:10px 18px;border-radius:999px;z-index:50;animation:up .25s;font-weight:700}
.seg{display:flex;gap:6px;margin-bottom:10px}.seg button{flex:1;border-bottom-width:3px}.seg button.on{background:var(--acc);color:#fff;border-color:var(--accd)}
.li{padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:8px;align-items:center}.li b{flex:1}
.mt{position:relative;display:flex;gap:44px;margin:10px 0;align-items:flex-start}
.mt .col{flex:1;display:flex;flex-direction:column;gap:10px;position:relative;z-index:1}
.mt button{width:100%;text-align:center;padding:10px 6px;font-size:15px;line-height:1.4;min-height:52px}
.mt .col.l button{font-weight:700;font-size:18px}
.mt button.sel{border-color:var(--acc);background:var(--acc2)}
.mt button.flash{border-color:var(--bad);background:var(--bad2);animation:shake .3s}
.mt button.d0{border-color:var(--c0);background:color-mix(in srgb,var(--c0) 14%,var(--card))}
.mt button.d1{border-color:var(--c1);background:color-mix(in srgb,var(--c1) 14%,var(--card))}
.mt button.d2{border-color:var(--c2);background:color-mix(in srgb,var(--c2) 14%,var(--card))}
.mt button.d3{border-color:var(--c3);background:color-mix(in srgb,var(--c3) 14%,var(--card))}
.mt button.d4{border-color:var(--c4);background:color-mix(in srgb,var(--c4) 14%,var(--card))}
.mtl{position:absolute;left:0;top:0;width:100%;height:100%;z-index:0;pointer-events:none;overflow:visible}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.cmpt{width:100%;border-collapse:collapse;font-size:15px}.cmpt td{border-top:1px solid var(--line);padding:8px 6px;vertical-align:top}.cmpt td:first-child{white-space:nowrap;font-weight:700;color:var(--accd);cursor:pointer}
.big-play{font-size:52px;text-align:center;margin:8px 0}
</style>
</head>

<div id="root"></div>
<script>
const DATA={"herbs": [{"id": 0, "ch": "解表药", "sec": "发散风寒药", "n": "麻黄", "f": "发汗解表，宣肺平喘，利水消肿", "a": "1.风寒感冒（表实无汗）；2.咳嗽气喘；3.风水水肿；此外取其散寒通滞，可治风寒痹证、阴疽、痰核", "d": "煎服3~10g", "sp": "发汗解表宜生用，止咳平喘多炙用", "w": "发散力强，表虚自汗、阴虚盗汗及虚喘均当慎用", "ap": "", "m": "汗喘水：发汗、平喘、利水，风寒表实第一药", "k": "麻黄发汗宣肺喘，利水消肿表实先。"}, {"id": 1, "ch": "解表药", "sec": "发散风寒药", "n": "桂枝", "f": "发汗解肌，温通经脉，助阳化气", "a": "1.风寒感冒（表实无汗、表虚有汗均可）；2.寒凝血滞诸痛证（胸痹、经闭痛经、风寒湿痹）；3.痰饮、蓄水证；4.心悸", "d": "煎服3~10g", "sp": "", "w": "辛温助热，易伤阴动血，外感热病、阴虚火旺、血热妄行等证均当忌用；孕妇及月经过多者慎用", "ap": "", "m": "桂枝走“枝”：温通经脉，表虚表实都能用", "k": "桂枝解肌通经脉，助阳化气表虚宜。"}, {"id": 2, "ch": "解表药", "sec": "发散风寒药", "n": "紫苏", "f": "发汗解表，行气宽中", "a": "1.风寒感冒，咳嗽痰多；2.脾胃气滞，胸闷呕吐（兼能安胎）；此外可用于鱼蟹中毒，腹痛吐泻", "d": "煎服3~10g", "sp": "不宜久煎", "w": "", "ap": "紫苏梗：宽胸利膈，顺气安胎；用于胸腹气滞、痞闷作胀及胎动不安", "m": "苏=舒：解表+行气，兼治鱼蟹中毒", "k": "紫苏解表行气宽，鱼蟹中毒也可安。"}, {"id": 3, "ch": "解表药", "sec": "发散风寒药", "n": "生姜", "f": "发汗解表，温中止呕，温肺止咳", "a": "1.风寒感冒；2.胃寒呕吐（\"呕家圣药\"）；3.风寒咳嗽；此外能解半夏、天南星及鱼蟹毒", "d": "煎服3~10g，或捣汁服", "sp": "", "w": "伤阴助火，阴虚内热者忌服", "ap": "生姜皮：和脾行水消肿，用于水肿、小便不利，3~10g。生姜汁：偏于开痰止呕，便于临床应急服用，3~10滴冲服", "m": "呕家圣药，姜能暖胃止呕", "k": "生姜解表温中寒，止呕圣药咳亦安。"}, {"id": 4, "ch": "解表药", "sec": "发散风寒药", "n": "香薷", "f": "发汗解表，和中化湿，利水消肿", "a": "1.阴暑证；2.水肿、脚气", "d": "煎服3~10g", "sp": "利水退肿须浓煎", "w": "辛温发汗之力较强，表虚有汗及阳暑证当忌用", "ap": "", "m": "“夏月麻黄”：阴暑、水肿", "k": "香薷夏月发汗良，化湿利水消肿强。"}, {"id": 5, "ch": "解表药", "sec": "发散风寒药", "n": "荆芥", "f": "发表散风，透疹消疮，炒炭止血", "a": "1.外感表证（风寒、风热均可）；2.麻疹不透、风疹瘙痒；3.疮疡初起兼有表证；4.吐衄下血（炒炭）", "d": "煎服3~10g", "sp": "不宜久煎；发表透疹消疮宜生用，止血宜炒炭用；荆芥穗更长于祛风", "w": "", "ap": "", "m": "荆防不分家；荆芥炒炭可止血", "k": "荆芥祛风透疹疮，炒炭止血效力强。"}, {"id": 6, "ch": "解表药", "sec": "发散风寒药", "n": "防风", "f": "发表散风，胜湿止痛，止痉，止泻", "a": "1.感冒头痛，风疹瘙痒；2.风湿痹痛；3.破伤风证；4.腹泻（炒用）", "d": "煎服3~10g", "sp": "", "w": "阴虚火旺、血虚发痉者慎用", "ap": "", "m": "“风药中之润剂”，风字当头：祛风胜湿止痉", "k": "防风祛风胜湿痛，止痉止泻也相从。"}, {"id": 7, "ch": "解表药", "sec": "发散风寒药", "n": "羌活", "f": "散寒祛风，胜湿止痛", "a": "1.风寒感冒，头痛身疼；2.风寒湿痹，肩臂疼痛（上半身痹痛尤宜）", "d": "煎服3~10g", "sp": "", "w": "气味浓烈，用量过多易致呕吐，脾胃虚弱者不宜服；血虚痹痛、阴虚头痛者慎用", "ap": "", "m": "羌=上半身（头项肩背）风湿痛", "k": "羌活散寒祛风湿，上半身痛最相宜。"}, {"id": 8, "ch": "解表药", "sec": "发散风寒药", "n": "白芷", "f": "解表散风，通窍，止痛，燥湿止带，消肿排脓", "a": "1.外感风寒，头痛、鼻塞；2.阳明头痛、牙痛、鼻渊；3.带下过多；4.疮疡肿痛", "d": "煎服3~10g；外用适量", "sp": "", "w": "阴虚血热者忌服", "ap": "", "m": "白芷通鼻窍，还管带下和排脓，前额痛首选", "k": "白芷通窍止痛强，燥湿带下排脓疮。"}, {"id": 9, "ch": "解表药", "sec": "发散风寒药", "n": "细辛", "f": "祛风散寒，通窍，止痛，温肺化饮", "a": "1.风寒感冒，阳虚外感；2.头痛、牙痛、鼻渊、痹痛；3.寒痰停饮，气逆喘咳；此外研末吹鼻取嚏，有通关开窍醒神之功", "d": "煎服2~5g；入丸散剂0.5~1g；外用适量", "sp": "入丸散用量须小（0.5~1g）", "w": "阴虚阳亢头痛、肺燥伤阴干咳忌用；反藜芦", "ap": "", "m": "细辛不过钱：祛风散寒、通窍止痛、化饮", "k": "细辛散寒通窍痛，化饮温肺不过钱。"}, {"id": 10, "ch": "解表药", "sec": "发散风寒药", "n": "藁本", "f": "祛风散寒，胜湿止痛", "a": "1.风寒感冒，巅顶头痛；2.风寒湿痹", "d": "煎服3~10g", "sp": "", "w": "血虚头痛忌服", "ap": "", "m": "巅顶头痛找藁本（高本→高处）", "k": "藁本祛风散寒湿，巅顶头痛可相宜。"}, {"id": 11, "ch": "解表药", "sec": "发散风寒药", "n": "苍耳子", "f": "祛风除湿，通窍止痛", "a": "1.鼻渊头痛，风寒头痛；2.风湿痹痛；3.风疹瘙痒、疥癣", "d": "煎服3~10g，或入丸散", "sp": "", "w": "血虚头痛不宜服用；过量服用易致中毒", "ap": "苍耳草：祛风、清热、解毒；治风湿痹痛、四肢拘急，又用于麻风、疔毒、皮肤瘙痒；有小毒，6~15g，不宜过量或持续服用", "m": "苍耳通鼻窍，鼻渊头痛常用", "k": "苍耳祛湿通鼻窍，鼻渊头痛用之效。"}, {"id": 12, "ch": "解表药", "sec": "发散风寒药", "n": "辛夷", "f": "发散风寒，宣通鼻窍", "a": "1.风寒头痛、鼻塞；2.鼻渊头痛（治鼻渊要药）", "d": "煎服3~9g；外用适量", "sp": "有毛，刺激咽喉，内服宜用纱布包煎", "w": "阴虚火旺者忌服", "ap": "", "m": "辛夷花苞像鼻子：专通鼻窍", "k": "辛夷散寒通鼻窍，鼻塞鼻渊常选它。"}, {"id": 13, "ch": "解表药", "sec": "发散风寒药", "n": "葱白", "f": "发汗解表，散寒通阳", "a": "1.风寒感冒（轻证）；2.阴盛格阳证；此外外敷可散结通络下乳，治乳汁郁滞、疮痈肿毒", "d": "煎服3~10g；外用适量", "sp": "", "w": "", "ap": "", "m": "葱白通阳，大葱发汗", "k": "葱白发汗又通阳，散寒解表效亦长。"}, {"id": 14, "ch": "解表药", "sec": "发散风寒药", "n": "胡荽", "f": "发表透疹，开胃消食", "a": "1.麻疹不透；2.饮食不消，纳食不佳", "d": "煎服3~6g；外用适量", "sp": "", "w": "因热毒壅盛而疹出不透者忌服", "ap": "", "m": "香菜（胡荽）：透麻疹，开胃", "k": "胡荽发表透疹宜，开胃消食也相依。"}, {"id": 15, "ch": "解表药", "sec": "发散风寒药", "n": "柽柳", "f": "发表透疹，祛风除湿", "a": "1.麻疹不透，风疹瘙痒；2.风湿痹痛", "d": "煎服3~10g；外用适量", "sp": "", "w": "麻疹已透者不宜用；用量过大令人心烦", "ap": "", "m": "柽柳＝西河柳，透疹祛风湿", "k": "柽柳发表透麻疹，祛风除湿也可寻。"}, {"id": 16, "ch": "解表药", "sec": "发散风热药", "n": "薄荷", "f": "疏散风热，清利头目，利咽，透疹，疏肝解郁", "a": "1.风热感冒，温病初起；2.头痛目赤，咽喉肿痛；3.麻疹不透，风疹瘙痒；4.肝郁气滞，胸闷胁痛；此外芳香辟秽，可治夏令感受暑湿秽浊之气所致痧胀腹痛吐泻", "d": "煎服3~6g", "sp": "宜后下；薄荷叶长于发汗，薄荷梗偏于理气", "w": "芳香辛散，发汗耗气，体虚多汗者不宜使用", "ap": "", "m": "薄荷清凉：头目、咽喉、疹子，还能疏肝", "k": "薄荷疏风清头目，利咽透疹疏肝郁。"}, {"id": 17, "ch": "解表药", "sec": "发散风热药", "n": "牛蒡子", "f": "疏散风热，透疹利咽，解毒散肿", "a": "1.风热感冒，咽喉肿痛；2.麻疹不透；3.痈肿疮毒，痄腮喉痹", "d": "煎服3~10g", "sp": "炒用寒性略减", "w": "性寒滑肠通便，气虚便溏者慎用", "ap": "", "m": "牛蒡：利咽、透疹、解毒散肿，滑肠", "k": "牛蒡疏风透疹咽，解毒散肿便滑慎。"}, {"id": 18, "ch": "解表药", "sec": "发散风热药", "n": "蝉蜕", "f": "疏散风热，透疹止痒，明目退翳，止痉", "a": "1.风热感冒，咽痛音哑；2.麻疹不透，风疹瘙痒；3.目赤翳障；4.惊痫夜啼，破伤风证", "d": "煎服3~10g，或单味研末冲服", "sp": "一般病证用量宜小，止痉则需大量", "w": "《别录》有\"主妇人生子不下\"的记载，孕妇当慎用", "ap": "", "m": "蝉蜕：风热、止痒、退翳、止痉，小儿夜啼", "k": "蝉蜕疏风透疹痒，明目退翳止痉强。"}, {"id": 19, "ch": "解表药", "sec": "发散风热药", "n": "桑叶", "f": "疏散风热，清肺润燥，平肝明目", "a": "1.风热感冒，头痛咳嗽；2.肺热燥咳；3.肝阳眩晕，目赤昏花；此外尚能凉血止血，治血热吐衄", "d": "煎服5~10g，或入丸散；外用煎水洗眼", "sp": "蜜制能增强润肺止咳作用，肺燥咳嗽多用蜜制桑叶", "w": "", "ap": "", "m": "桑叶：风热咳嗽燥咳，平肝明目", "k": "桑叶疏风清肺燥，平肝明目也有效。"}, {"id": 20, "ch": "解表药", "sec": "发散风热药", "n": "菊花", "f": "疏散风热，平肝明目，清热解毒", "a": "1.风热感冒，发热头痛；2.目赤昏花；3.眩晕惊风；4.疔疮肿毒", "d": "煎服10~15g", "sp": "疏散风热多用黄菊花（杭菊花），平肝明目多用白菊花（滁菊花）", "w": "", "ap": "", "m": "菊花：平肝明目，疏风清热，野菊清毒", "k": "菊花疏风平肝目，清热解毒亦可服。"}, {"id": 21, "ch": "解表药", "sec": "发散风热药", "n": "蔓荆子", "f": "疏散风热，清利头目", "a": "1.风热感冒，头昏头痛；2.目赤肿痛，目昏多泪；此外可治风湿痹痛", "d": "煎服5~10g", "sp": "", "w": "", "ap": "", "m": "蔓荆子：头面部风热，头痛目赤", "k": "蔓荆疏风清头目，头痛目赤用之速。"}, {"id": 22, "ch": "解表药", "sec": "发散风热药", "n": "柴胡", "f": "疏散退热，疏肝解郁，升举阳气", "a": "1.寒热往来（少阳证），感冒发热；2.肝郁气滞，月经不调，胸胁疼痛；3.气虚下陷，久泻脱肛；此外还可退热截疟", "d": "煎服3~10g", "sp": "和解退热宜生用，疏散肝郁宜醋炙，骨蒸劳热当用鳖血拌炒", "w": "性升散，古有\"柴胡劫肝阴\"之说，肝阳上亢、肝风内动、阴虚火旺及气机上逆者忌用或慎用", "ap": "", "m": "少阳要药：退热、疏肝、升阳", "k": "柴胡退热疏肝郁，升举阳气少阳医。"}, {"id": 23, "ch": "解表药", "sec": "发散风热药", "n": "升麻", "f": "发表透疹，清热解毒，升举阳气", "a": "1.风热头痛，麻疹不透；2.齿痛口疮，咽喉肿痛；3.气虚下陷，久泻脱肛，崩漏下血", "d": "煎服3~10g", "sp": "发表透疹解毒宜生用，升阳举陷固脱宜制用", "w": "麻疹已透，以及阴虚火旺、肝阳上亢、上盛下虚者均当忌用", "ap": "", "m": "升麻：透疹、解毒、升阳（升字当先）", "k": "升麻透疹解毒强，升举阳气功效长。"}, {"id": 24, "ch": "解表药", "sec": "发散风热药", "n": "葛根", "f": "解肌退热，透发麻疹，生津止渴，升阳止泻", "a": "1.外感表证（项背强痛）；2.麻疹不透；3.热病口渴，阴虚消渴；4.热泄热痢，脾虚泄泻", "d": "煎服10~15g", "sp": "退热生津宜生用，升阳止泻宜煨用", "w": "", "ap": "葛花：解酒毒，醒脾和胃；用于饮酒过度、头痛头昏、烦渴呕吐，3~15g", "m": "葛根：项背强痛，生津止渴，升阳止泻", "k": "葛根解肌退热强，透疹生津升阳良。"}, {"id": 25, "ch": "解表药", "sec": "发散风热药", "n": "淡豆豉", "f": "解表，除烦", "a": "1.感冒头痛（风寒、风热均可）；2.胸中烦闷，虚烦不眠", "d": "煎服10~15g", "sp": "", "w": "", "ap": "大豆黄卷：清解表邪、分利湿热；用于暑湿、湿温初起及湿热内蕴所致发热汗少、胸闷不舒、小便不利，10~15g", "m": "豆豉：解表+除烦（栀子豉汤）", "k": "豆豉解表又除烦，栀子豉汤治虚烦。"}, {"id": 26, "ch": "解表药", "sec": "发散风热药", "n": "浮萍", "f": "发汗解表，透疹止痒，利水消肿", "a": "1.风热感冒；2.麻疹不透，风疹瘙痒；3.水肿尿少", "d": "煎服3~10g", "sp": "", "w": "表虚自汗者不宜使用", "ap": "", "m": "浮萍：发汗、透疹、利水（浮在水上）", "k": "浮萍发汗透疹痒，利水消肿也相当。"}, {"id": 27, "ch": "解表药", "sec": "发散风热药", "n": "木贼", "f": "疏散风热，明目退翳，止血", "a": "1.风热目赤，迎风流泪，目生翳障；2.便血痔血", "d": "煎服3~10g", "sp": "", "w": "", "ap": "", "m": "木贼：明目退翳，兼止血", "k": "木贼疏风明目翳，兼能止血亦相宜。"}, {"id": 28, "ch": "清热药", "sec": "清热泻火药", "n": "石膏", "f": "生用：清热泻火，除烦止渴；煅用：收敛生肌", "a": "1.温热病气分实热，壮热烦渴；2.肺热喘咳；3.胃火牙痛；4.疮疡不敛、湿疹、烫伤（煅用外敷）", "d": "煎服15~60g", "sp": "生石膏宜打碎先煎；内服宜生用，外用宜火煅研末", "w": "脾胃虚寒及阴虚内热者忌用", "ap": "", "m": "石膏生清熟煅敛：气分实热第一药", "k": "石膏生用清热渴，煅用敛疮能生肌。"}, {"id": 29, "ch": "清热药", "sec": "清热泻火药", "n": "寒水石", "f": "清热泻火", "a": "1.热病烦渴；2.丹毒烫伤（外用）；此外能利窍消肿，治湿热水肿", "d": "煎服10~15g；外用适量", "sp": "", "w": "脾胃虚寒者忌服", "ap": "", "m": "寒水石：只记清热泻火", "k": "寒水石性大寒凉，清热泻火功相当。"}, {"id": 30, "ch": "清热药", "sec": "清热泻火药", "n": "知母", "f": "清热泻火，滋阴润燥", "a": "1.热病烦渴；2.肺热咳嗽，阴虚燥咳；3.骨蒸潮热；4.阴虚消渴，肠燥便秘", "d": "煎服6~12g", "sp": "清热泻火宜生用，滋阴降火宜盐水炙用", "w": "性寒质润，有滑肠之弊，脾虚便溏者不宜用", "ap": "", "m": "知母：泻火+滋阴润燥，肺胃肾三经", "k": "知母泻火滋阴润，肺胃肾经皆可行。"}, {"id": 31, "ch": "清热药", "sec": "清热泻火药", "n": "芦根", "f": "清热生津，除烦止呕", "a": "1.热病烦渴；2.胃热呕逆；3.肺热咳嗽，肺痈吐脓；4.热淋涩痛", "d": "煎服，干品15~30g，鲜品用量加大", "sp": "鲜芦根清热生津、利尿之效佳，干芦根则次之", "w": "脾胃虚寒者忌服", "ap": "", "m": "芦根：清热生津，除烦止呕（空心的茎）", "k": "芦根清热又生津，除烦止呕效如神。"}, {"id": 32, "ch": "清热药", "sec": "清热泻火药", "n": "天花粉", "f": "清热生津，清肺润燥，解毒消痈", "a": "1.热病口渴，消渴多饮；2.肺热燥咳；3.痈肿疮疡", "d": "煎服10~15g", "sp": "", "w": "孕妇忌服；反乌头", "ap": "", "m": "花粉：生津、润肺、消痈", "k": "花粉生津清肺燥，解毒消痈亦可靠。"}, {"id": 33, "ch": "清热药", "sec": "清热泻火药", "n": "竹叶", "f": "清热除烦，生津利尿", "a": "1.热病烦渴；2.口疮尿赤；此外竹叶卷心长于清心火，多用于温热病邪陷心包、神昏谵语", "d": "煎服6~15g，鲜品15~30g", "sp": "", "w": "阴虚火旺、骨蒸潮热者忌用", "ap": "", "m": "竹叶：清心除烦生津利尿", "k": "竹叶清热除烦闷，生津利尿心火平。"}, {"id": 34, "ch": "清热药", "sec": "清热泻火药", "n": "淡竹叶", "f": "清热除烦，通利小便", "a": "1.热病烦渴；2.口疮尿赤，水肿尿少，黄疸尿赤", "d": "煎服10~15g", "sp": "", "w": "", "ap": "", "m": "淡竹叶：除烦+通利小便（比竹叶更利尿）", "k": "淡竹除烦通小便，清热利尿功更专。"}, {"id": 35, "ch": "清热药", "sec": "清热泻火药", "n": "鸭跖草", "f": "清热解毒，利水消肿", "a": "1.风热感冒，高热烦渴；2.咽喉肿痛，痈疮疔毒；3.水肿尿少，热淋涩痛", "d": "煎服15~30g，鲜品30~60g；外用适量", "sp": "", "w": "脾胃虚弱者用量宜少", "ap": "", "m": "鸭跖草：解毒+利水", "k": "鸭跖解毒清热邪，利水消肿尿自泄。"}, {"id": 36, "ch": "清热药", "sec": "清热泻火药", "n": "栀子", "f": "泻火除烦，清热利湿，凉血解毒，消肿止痛", "a": "1.热病烦闷；2.湿热黄疸；3.血热吐衄；4.疮疡肿毒，跌打损伤（外用）", "d": "煎服3~10g；外用适量", "sp": "栀子皮（果皮）偏于达表而去肌肤之热，栀子仁（种子）偏于走里而清内热；生用走气分而泻火，炒黑则入血分而止血", "w": "苦寒伤胃，脾虚便溏者不宜用", "ap": "", "m": "栀子：三焦火，利湿凉血，焦栀止血", "k": "栀子泻火除烦闷，利湿凉血肿痛平。"}, {"id": 37, "ch": "清热药", "sec": "清热泻火药", "n": "夏枯草", "f": "清肝火，散郁结", "a": "1.目赤肿痛，头痛眩晕，目珠夜痛；2.瘰疬瘿瘤", "d": "煎服10~15g，或熬膏服", "sp": "", "w": "脾胃虚弱者慎用", "ap": "", "m": "夏枯草：清肝火、散郁结（瘰疬瘿瘤）", "k": "夏枯清肝散郁结，瘰疬瘿瘤皆可解。"}, {"id": 38, "ch": "清热药", "sec": "清热泻火药", "n": "决明子", "f": "清肝明目，润肠通便", "a": "1.目赤目暗；2.肠燥便秘；此外现代用治高血压病", "d": "煎服10~15g", "sp": "用于通便不宜久煎", "w": "气虚便溏者不宜应用", "ap": "", "m": "决明：明目，润肠通便", "k": "决明清肝明目亮，润肠通便效亦良。"}, {"id": 39, "ch": "清热药", "sec": "清热泻火药", "n": "谷精草", "f": "疏散风热，明目退翳", "a": "目赤翳障，头痛齿痛", "d": "煎服6~15g", "sp": "", "w": "阴虚血亏目疾不宜用", "ap": "", "m": "谷精草：风热目疾，退翳", "k": "谷精疏风明目翳，风热目疾最相宜。"}, {"id": 40, "ch": "清热药", "sec": "清热泻火药", "n": "密蒙花", "f": "清热养肝，明目退翳", "a": "目赤翳障（肝热、肝虚均可）", "d": "煎服6~10g", "sp": "", "w": "肝经风热目疾不宜用", "ap": "", "m": "密蒙花：养肝明目退翳", "k": "密蒙养肝明目翳，清热退翳目疾宜。"}, {"id": 41, "ch": "清热药", "sec": "清热泻火药", "n": "青葙子", "f": "清泄肝火，明目退翳", "a": "目赤翳障；此外现代用于肝火亢盛之高血压病", "d": "煎服3~15g", "sp": "", "w": "有扩散瞳孔的作用，青光眼患者忌用", "ap": "", "m": "青葙子：清肝火，明目（散瞳忌用）", "k": "青葙清肝明目翳，青光眼者不可施。"}, {"id": 42, "ch": "清热药", "sec": "清热燥湿药", "n": "黄芩", "f": "清热燥湿，泻火解毒，止血，安胎", "a": "1.湿温暑湿，湿热痞满，黄疸泻痢；2.肺热咳嗽，热病烦渴；3.痈肿疮毒，咽喉肿痛；4.血热吐衄；5.胎动不安", "d": "煎服3~10g", "sp": "清热多生用，安胎多炒用，止血多炒炭用，清上焦热可酒炙用；枯芩（宿根）善清肺火，条芩（子根）善清大肠之火、泻下焦湿热", "w": "苦寒伤胃，脾胃虚寒者不宜使用", "ap": "", "m": "黄芩：上焦湿热，止血安胎", "k": "黄芩燥湿泻火毒，止血安胎上焦主。"}, {"id": 43, "ch": "清热药", "sec": "清热燥湿药", "n": "黄连", "f": "清热燥湿，泻火解毒", "a": "1.胃肠湿热，泻痢呕吐（治湿热泻痢要药）；2.热盛火炽，高热烦躁；3.痈疽疔毒，皮肤湿疮，耳目肿痛", "d": "煎服2~10g；研末吞服1~1.5g，日三次；外用适量", "sp": "炒用能降低寒性；姜汁炙用清胃止呕，酒炙清上焦火，猪胆汁炒泻肝胆实火", "w": "大苦大寒，过服久服易伤脾胃，脾胃虚寒者忌用；苦燥伤津，阴虚津伤者慎用", "ap": "", "m": "黄连：中焦湿热，泻心火，善解毒", "k": "黄连燥湿泻火毒，中焦湿热心火除。"}, {"id": 44, "ch": "清热药", "sec": "清热燥湿药", "n": "黄柏", "f": "清热燥湿，泻火解毒，退热除蒸", "a": "1.湿热带下，热淋脚气，泻痢黄疸；2.疮疡肿痛，湿疹湿疮；3.阴虚发热，盗汗遗精", "d": "煎服5~10g，或入丸散；外用适量", "sp": "清热燥湿解毒多生用，泻火除蒸退热多盐水炙用，止血多炒炭用", "w": "苦寒易损伤胃气，脾胃虚寒者忌用", "ap": "", "m": "黄柏：下焦湿热，退虚热", "k": "黄柏燥湿解毒强，下焦湿热退蒸良。"}, {"id": 45, "ch": "清热药", "sec": "清热燥湿药", "n": "龙胆草", "f": "清热燥湿，泻肝胆火", "a": "1.阴肿阴痒，带下湿疹，黄疸尿赤；2.肝火头痛，目赤耳聋，胁痛口苦；3.肝经热盛、热极生风所致高热惊厥、手足抽搐", "d": "煎服3~6g；外用适量", "sp": "", "w": "脾胃虚寒者不宜用；阴虚津伤者慎用", "ap": "", "m": "龙胆：肝胆湿热、肝火", "k": "龙胆燥湿泻肝胆，湿热黄疸阴痒痊。"}, {"id": 46, "ch": "清热药", "sec": "清热燥湿药", "n": "秦皮", "f": "清热燥湿，解毒，止痢，止带，明目", "a": "1.热毒泻痢，湿热带下；2.目赤肿痛，目生翳膜", "d": "煎服3~12g；外用适量", "sp": "", "w": "脾胃虚寒者忌用", "ap": "", "m": "秦皮：止痢、止带、明目", "k": "秦皮燥湿解毒痢，止带明目也相宜。"}, {"id": 47, "ch": "清热药", "sec": "清热燥湿药", "n": "苦参", "f": "清热燥湿，杀虫利尿", "a": "1.湿热泻痢，便血，黄疸；2.带下阴痒，湿疹疥癣，小便不利", "d": "煎服3~10g；外用适量", "sp": "", "w": "苦寒伤胃、伤阴，脾胃虚寒及阴虚津伤者忌用或慎用；反藜芦", "ap": "", "m": "苦参：苦燥，杀虫利尿，不宜与藜芦同用", "k": "苦参燥湿杀虫痒，利尿反藜要提防。"}, {"id": 48, "ch": "清热药", "sec": "清热燥湿药", "n": "白鲜皮", "f": "清热燥湿，祛风解毒", "a": "1.湿热疮毒，湿疹疥癣；2.黄疸尿赤，湿热痹痛", "d": "煎服6~10g；外用适量", "sp": "", "w": "虚寒患者慎用", "ap": "", "m": "白鲜皮：皮肤病（湿热疮毒痒）", "k": "白鲜燥湿祛风毒，皮肤瘙痒疮疹除。"}, {"id": 49, "ch": "清热药", "sec": "清热燥湿药", "n": "椿皮", "f": "清热燥湿，止带止泻，收敛止血", "a": "1.湿热泻痢，久泻久痢；2.赤白带下；3.崩漏经多，便血痔血", "d": "煎服3~10g；外用适量", "sp": "", "w": "脾胃虚寒者慎用", "ap": "", "m": "椿皮：燥湿止带止泻", "k": "椿皮燥湿止带泻，收敛止血也可借。"}, {"id": 50, "ch": "清热药", "sec": "清热解毒药", "n": "金银花", "f": "清热解毒，疏散风热", "a": "1.痈肿疔疮（治一切内痈外痈要药）；2.外感风热，温病初起；3.热毒血痢", "d": "煎服10~15g", "sp": "疏散风热以生品为佳；炒炭宜用于热毒血痢；露剂多用于暑热烦渴", "w": "脾胃虚寒及气虚疮疡脓清者忌用", "ap": "忍冬藤：功同金银花而解毒之力不及，但能通经络，用于风湿热痹、关节红肿热痛，煎服15~30g", "m": "银花：疏散风热+解毒，疮痈要药", "k": "银花清热解毒强，疏散风热疮痈良。"}, {"id": 51, "ch": "清热药", "sec": "清热解毒药", "n": "连翘", "f": "清热解毒，消痈散结，疏散风热", "a": "1.痈肿疮毒，瘰疬痰核（\"疮家圣药\"）；2.外感风热，温病初起；3.热淋涩痛", "d": "煎服6~15g", "sp": "", "w": "脾胃虚寒及气虚脓清者不宜用", "ap": "", "m": "疮家圣药：连翘消痈散结", "k": "连翘消痈散结效，疮家圣药热毒消。"}, {"id": 52, "ch": "清热药", "sec": "清热解毒药", "n": "蒲公英", "f": "清热解毒，消痈散结，利湿通淋", "a": "1.痈肿疔毒，乳痈内痈（治乳痈要药）；2.热淋涩痛，湿热黄疸；此外可清肝明目，治目赤肿痛", "d": "煎服10~30g；外用适量", "sp": "", "w": "用量过大，可致缓泻", "ap": "", "m": "蒲公英：乳痈要药，兼利湿通淋", "k": "公英解毒消痈肿，乳痈要药利通淋。"}, {"id": 53, "ch": "清热药", "sec": "清热解毒药", "n": "紫花地丁", "f": "清热解毒，消痈散结", "a": "1.疔疮肿毒，乳痈肠痈；2.毒蛇咬伤；此外可用于肝热目赤肿痛", "d": "煎服15~30g；外用适量", "sp": "", "w": "体质虚寒者忌服", "ap": "", "m": "地丁：疔疮要药", "k": "地丁解毒消痈肿，疔疮要药功最宏。"}, {"id": 54, "ch": "清热药", "sec": "清热解毒药", "n": "野菊花", "f": "清热解毒", "a": "1.痈疽疔疖，丹毒；2.热毒上攻之咽喉肿痛、风火赤眼；此外内服并煎汤外洗治湿疹等皮肤瘙痒", "d": "煎服10~18g；外用适量", "sp": "", "w": "", "ap": "", "m": "野菊花：疔疮痈肿，只清热解毒", "k": "野菊清热解毒强，疔疮痈肿可相帮。"}, {"id": 55, "ch": "清热药", "sec": "清热解毒药", "n": "穿心莲", "f": "清热解毒，燥湿消肿", "a": "1.外感风热，温病初起，肺热咳喘，肺痈吐脓，咽喉肿痛；2.湿热泻痢，热淋涩痛，湿疹瘙痒；3.痈肿疮毒，蛇虫咬伤", "d": "煎服6~15g；外用适量", "sp": "味极苦，多作丸、散、片剂服", "w": "不宜多服久服；脾胃虚寒者不宜用", "ap": "", "m": "穿心莲：解毒+燥湿消肿", "k": "穿心解毒燥湿肿，苦寒伤胃不宜重。"}, {"id": 56, "ch": "清热药", "sec": "清热解毒药", "n": "大青叶", "f": "清热解毒，凉血消斑", "a": "1.热入营血，温毒发斑；2.喉痹口疮，痄腮丹毒", "d": "煎服10~15g，鲜品30~60g；外用适量", "sp": "", "w": "脾胃虚寒者忌用", "ap": "", "m": "大青叶：解毒凉血消斑", "k": "大青解毒凉血斑，热入营血发斑先。"}, {"id": 57, "ch": "清热药", "sec": "清热解毒药", "n": "板蓝根", "f": "清热解毒，凉血利咽", "a": "温热病发热、头痛、喉痛，或温毒发斑、痄腮、痈肿疮毒、丹毒、大头瘟疫等多种热毒炽盛之证", "d": "煎服10~15g", "sp": "", "w": "脾胃虚寒者忌用", "ap": "", "m": "板蓝根：偏利咽", "k": "板蓝解毒凉血咽，利咽散肿功偏专。"}, {"id": 58, "ch": "清热药", "sec": "清热解毒药", "n": "青黛", "f": "清热解毒，凉血消斑，清肝泻火，定惊", "a": "1.温毒发斑，血热吐衄；2.咽痛口疮，火毒疮疡；3.咳嗽胸痛，痰中带血（肝火犯肺）；4.暑热惊痫，惊风抽搐", "d": "内服1.5~3g；外用适量", "sp": "难溶于水，一般作散剂冲服，或入丸剂服用，不宜入汤剂", "w": "胃寒者慎用", "ap": "", "m": "青黛：清肝泻火定惊，外敷口疮", "k": "青黛凉血消斑毒，清肝定惊口疮敷。"}, {"id": 59, "ch": "清热药", "sec": "清热解毒药", "n": "贯众", "f": "清热解毒，凉血止血，杀虫", "a": "1.风热感冒，温毒发斑；2.血热出血（崩漏下血尤宜）；3.虫疾（绦虫、钩虫、蛲虫、蛔虫）", "d": "煎服10~15g", "sp": "杀虫及清热解毒宜生用，止血宜炒炭用", "w": "有小毒，用量不宜过大；脾胃虚寒者慎用", "ap": "", "m": "贯众：解毒凉血止血杀虫", "k": "贯众解毒凉血强，止血杀虫功效长。"}, {"id": 60, "ch": "清热药", "sec": "清热解毒药", "n": "鱼腥草", "f": "清热解毒，消痈排脓，利尿通淋", "a": "1.肺痈吐脓，肺热咳嗽（治肺痈要药）；2.热毒疮疡；3.湿热淋证", "d": "煎服15~30g；外用适量", "sp": "含挥发油，不宜久煎", "w": "", "ap": "", "m": "肺痈要药：鱼腥草，后下", "k": "鱼腥解毒排脓痈，肺痈要药后下用。"}, {"id": 61, "ch": "清热药", "sec": "清热解毒药", "n": "金荞麦", "f": "清热解毒，清肺化痰", "a": "1.肺痈咯痰浓稠腥臭，瘰疬疮疖；2.肺热咳嗽，咽喉肿痛", "d": "煎服15~45g", "sp": "亦可用水或黄酒隔水密闭炖服", "w": "", "ap": "", "m": "金荞麦：肺痈、肺热咳嗽", "k": "金荞解毒清肺痰，肺痈咳吐脓痰宽。"}, {"id": 62, "ch": "清热药", "sec": "清热解毒药", "n": "红藤", "f": "清热解毒，活血止痛", "a": "1.肠痈腹痛（治肠痈要药），热毒疮疡；2.跌打损伤，风湿痹痛，经闭痛经", "d": "煎服15~30g", "sp": "", "w": "孕妇不宜多服", "ap": "", "m": "红藤（大血藤）：肠痈要药", "k": "红藤解毒活血痛，肠痈要药量宜重。"}, {"id": 63, "ch": "清热药", "sec": "清热解毒药", "n": "败酱草", "f": "清热解毒，消痈排脓，祛瘀止痛", "a": "1.肠痈肺痈，痈肿疮毒；2.产后瘀阻腹痛", "d": "煎服6~15g；外用适量", "sp": "", "w": "脾胃虚弱、食少泄泻者忌服", "ap": "墓头回：性能功用与败酱草相似，多用于崩漏下血、赤白带下，用法用量同败酱草", "m": "败酱草：肠痈，祛瘀止痛", "k": "败酱解毒排脓痈，祛瘀止痛肠痈功。"}, {"id": 64, "ch": "清热药", "sec": "清热解毒药", "n": "射干", "f": "清热解毒，祛痰利咽", "a": "1.咽喉肿痛；2.痰盛咳喘", "d": "煎服6~10g", "sp": "", "w": "孕妇忌用或慎用", "ap": "", "m": "射干：咽喉肿痛、痰壅咳喘", "k": "射干解毒祛痰咽，利咽散结效亦先。"}, {"id": 65, "ch": "清热药", "sec": "清热解毒药", "n": "山豆根", "f": "清热解毒，利咽消肿", "a": "1.热毒蕴结，咽喉肿痛；2.牙龈肿痛；此外可用于湿热黄疸、肺热咳嗽、痈肿疮毒", "d": "煎服3~10g；外用适量", "sp": "", "w": "大苦大寒，过量服用易引起呕吐、腹泻、胸闷、心悸等副作用，用量不宜过大；脾胃虚寒者慎用", "ap": "北豆根：与广豆根功效相近，解毒利咽治咽喉肿痛，兼有降压、镇咳、祛痰及抗癌作用", "m": "山豆根：咽喉肿痛要药，苦寒伤胃", "k": "山豆根清咽喉肿，苦寒伤胃慎重用。"}, {"id": 66, "ch": "清热药", "sec": "清热解毒药", "n": "马勃", "f": "清热解毒，利咽，止血", "a": "1.风热及肺火咽喉肿痛，咳嗽失音；2.吐血衄血，外伤出血", "d": "煎服3~6g；外用适量", "sp": "", "w": "", "ap": "", "m": "马勃：利咽止血，外用止血", "k": "马勃解毒又利咽，止血外用效更良。"}, {"id": 67, "ch": "清热药", "sec": "清热解毒药", "n": "白头翁", "f": "清热解毒，凉血止痢", "a": "热毒血痢（治痢要药）；此外配秦皮煎汤外洗治阴痒，亦可用于疟疾", "d": "煎服6~15g；外用适量", "sp": "", "w": "虚寒泻痢忌服", "ap": "", "m": "白头翁：热毒血痢", "k": "白头翁清热毒痢，凉血止痢最相宜。"}, {"id": 68, "ch": "清热药", "sec": "清热解毒药", "n": "马齿苋", "f": "清热解毒，凉血止血，止痢", "a": "1.热毒血痢；2.热毒疮疡；3.崩漏便血", "d": "煎服30~60g，鲜品加倍；外用适量", "sp": "", "w": "脾胃虚寒、肠滑作泄者忌服", "ap": "", "m": "马齿苋：痢疾，凉血止血", "k": "马齿苋解毒止痢，凉血止血亦相宜。"}, {"id": 69, "ch": "清热药", "sec": "清热解毒药", "n": "鸦胆子", "f": "清热解毒，止痢截疟，腐蚀赘疣", "a": "1.热毒血痢，冷积久痢；2.各型疟疾；3.鸡眼赘疣（外用）", "d": "内服10~15粒（治疟疾）或10~30粒（治痢疾）；外用适量", "sp": "不宜入煎剂；以干龙眼肉或胶囊包裹吞服，亦可压去油制成丸剂、片剂服", "w": "对胃肠道及肝肾均有损害，不宜多用久服；胃肠出血及肝肾病患者忌用或慎用", "ap": "", "m": "鸦胆子：休息痢，疟疾，外用腐蚀赘疣", "k": "鸦胆止痢兼截疟，外蚀赘疣效亦著。"}, {"id": 70, "ch": "清热药", "sec": "清热解毒药", "n": "地锦草", "f": "清热解毒，凉血止血", "a": "1.热毒泻痢，热毒疮肿，毒蛇咬伤；2.便血尿血、崩漏及外伤出血等多种出血证；3.湿热黄疸", "d": "煎服15~30g；外用适量", "sp": "", "w": "", "ap": "", "m": "地锦草：解毒+凉血止血", "k": "地锦解毒凉血止，湿热泻痢亦可治。"}, {"id": 71, "ch": "清热药", "sec": "清热解毒药", "n": "蚤休", "f": "清热解毒，消肿止痛，凉肝定惊", "a": "1.痈肿疔疮，毒蛇咬伤；2.惊风抽搐；此外用于跌打损伤、外伤出血", "d": "煎服5~10g；外用适量", "sp": "", "w": "体虚、无实火热毒、阴证外疡及孕妇均忌服", "ap": "", "m": "蚤休（重楼）：毒蛇咬伤，定惊", "k": "蚤休解毒消肿痛，凉肝定惊蛇伤用。"}, {"id": 72, "ch": "清热药", "sec": "清热解毒药", "n": "拳参", "f": "清热解毒，镇肝息风，凉血止痢", "a": "1.痈肿瘰疬，毒蛇咬伤；2.热病惊痫；3.赤痢脓血，湿热泄泻；此外能利湿，可用于水肿、小便不利", "d": "煎服3~12g；外用适量", "sp": "", "w": "无实火热毒者不宜用", "ap": "", "m": "拳参：解毒、止痢、息风", "k": "拳参解毒镇肝风，凉血止痢也相从。"}, {"id": 73, "ch": "清热药", "sec": "清热解毒药", "n": "半边莲", "f": "清热解毒，利水消肿", "a": "1.疔疮肿毒，乳痈肿痛，蛇虫咬伤；2.腹胀水肿，黄疸尿少", "d": "煎服，干品10~15g，鲜品30~60g；外用适量", "sp": "", "w": "虚证水肿忌用", "ap": "", "m": "半边莲：毒蛇咬伤，水肿", "k": "半边莲解蛇毒伤，利水消肿腹水尝。"}, {"id": 74, "ch": "清热药", "sec": "清热解毒药", "n": "白花蛇舌草", "f": "清热解毒，利湿通淋", "a": "1.痈肿疮毒，咽喉肿痛，毒蛇咬伤；2.热淋涩痛；现代广泛用于各种癌症", "d": "煎服15~60g；外用适量", "sp": "", "w": "阴疽及脾胃虚寒者忌用", "ap": "", "m": "白花蛇舌草：解毒利湿，肠痈", "k": "蛇舌解毒又利湿，通淋肠痈蛇伤宜。"}, {"id": 75, "ch": "清热药", "sec": "清热解毒药", "n": "山慈菇", "f": "清热解毒，消痈散结", "a": "1.痈疽疔毒，瘰疬痰核；2.癥瘕痞块", "d": "煎服3~6g；外用适量", "sp": "", "w": "正虚体弱者慎用", "ap": "", "m": "山慈菇：痈肿疔毒，瘰疬", "k": "山慈菇解痈肿毒，消痈散结瘰疬除。"}, {"id": 76, "ch": "清热药", "sec": "清热解毒药", "n": "土茯苓", "f": "解毒，除湿，通利关节", "a": "1.梅毒，或因梅毒服汞剂中毒而致肢体拘挛者；2.淋浊带下，湿疹瘙痒；3.痈肿疮毒", "d": "煎服15~60g；外用适量", "sp": "", "w": "肝肾阴虚者慎服；服药时忌茶", "ap": "", "m": "土茯苓：梅毒，汞中毒解毒要药", "k": "土茯苓解毒除湿，梅毒汞毒首选之。"}, {"id": 77, "ch": "清热药", "sec": "清热解毒药", "n": "熊胆", "f": "清热解毒，息风止痉，清肝明目", "a": "1.热极生风，惊痫抽搐；2.疮痈肿痛及痔疮肿痛；3.肝热目赤肿痛，目生翳障；此外亦用于热毒壅滞之咽喉肿痛", "d": "内服1~2.5g；外用适量", "sp": "多作丸、散，不入汤剂", "w": "脾胃虚寒者忌服", "ap": "引流熊胆粉：活熊引流胆汁的干燥品，功用与熊胆相同，可代熊胆使用", "m": "熊胆：息风止痉，清肝明目", "k": "熊胆清热息风惊，清肝明目功效灵。"}, {"id": 78, "ch": "清热药", "sec": "清热解毒药", "n": "漏芦", "f": "清热解毒，消痈散结，通经下乳", "a": "1.乳痈肿痛，瘰疬疮毒；2.乳汁不下；此外可用于湿痹拘挛", "d": "煎服3~12g", "sp": "", "w": "气虚、疮疡平塌及孕妇忌服", "ap": "", "m": "漏芦：乳痈，通经下乳", "k": "漏芦解毒消痈肿，通经下乳乳痈用。"}, {"id": 79, "ch": "清热药", "sec": "清热解毒药", "n": "白蔹", "f": "清热解毒，消痈散结，敛疮生肌", "a": "1.疮痈肿毒，瘰疬痰核；2.水火烫伤，手足皲裂", "d": "煎服3~10g；外用适量", "sp": "", "w": "反乌头", "ap": "", "m": "白蔹：疮痈，生肌敛疮", "k": "白蔹解毒消痈散，敛疮生肌疮疡安。"}, {"id": 80, "ch": "清热药", "sec": "清热解毒药", "n": "四季青", "f": "清热解毒，凉血止血，敛疮", "a": "1.水火烫伤，湿疹，疮疡；2.肺热咳嗽，咽喉肿痛，热淋，泻痢；3.外伤出血", "d": "煎服15~30g；外用适量", "sp": "", "w": "脾胃虚寒、肠滑泄泻者慎用", "ap": "", "m": "四季青：烧烫伤", "k": "四季青解毒凉血，敛疮烧烫伤功捷。"}, {"id": 81, "ch": "清热药", "sec": "清热解毒药", "n": "绿豆", "f": "清热解毒，消暑，利水", "a": "1.痈肿疮毒；2.暑热烦渴；3.药食中毒；4.水肿，小便不利", "d": "煎服15~30g；外用适量", "sp": "", "w": "脾胃虚寒、肠滑泄泻者忌用", "ap": "绿豆衣：功同绿豆，解暑之力不及，但清热解毒之功胜之，并能退目翳，煎服6~12g", "m": "绿豆：解毒消暑，解多种药毒", "k": "绿豆解毒又消暑，利水解药毒也助。"}, {"id": 82, "ch": "清热药", "sec": "清热凉血药", "n": "生地黄", "f": "清热凉血，养阴生津", "a": "1.热入营血，口干舌绛；2.血热妄行，斑疹吐衄；3.津伤口渴，内热消渴；此外治肠燥便秘", "d": "煎服10~30g，鲜品用量加倍，或以鲜品捣汁入药", "sp": "鲜地黄味甘苦性大寒，作用与干地黄相似，滋阴之力稍逊，但清热生津、凉血止血之力较强", "w": "性寒而滞，脾虚湿滞、腹满便溏者不宜使用", "ap": "", "m": "生地：清热凉血+养阴生津，热入营血", "k": "生地凉血养阴津，热入营血阴伤明。"}, {"id": 83, "ch": "清热药", "sec": "清热凉血药", "n": "玄参", "f": "清热凉血，滋阴解毒", "a": "1.温邪入营，内陷心包，温毒发斑；2.热病伤阴，津伤便秘，骨蒸劳嗽；3.目赤咽痛，瘰疬，白喉，痈肿疮毒", "d": "煎服10~15g", "sp": "", "w": "性寒而滞，脾胃虚寒、食少便溏者不宜服用；反藜芦", "ap": "", "m": "玄参：清热凉血，滋阴解毒（咽喉）", "k": "玄参凉血滋阴毒，咽喉肿痛也相扶。"}, {"id": 84, "ch": "清热药", "sec": "清热凉血药", "n": "牡丹皮", "f": "清热凉血，活血散瘀", "a": "1.温毒发斑，血热吐衄；2.温邪伤阴，阴虚发热，无汗骨蒸；3.血滞经闭，痛经癥瘕，跌打损伤；4.痈疡肿毒，肠痈腹痛", "d": "煎服6~12g", "sp": "清热凉血宜生用，活血散瘀宜酒炒用，止血宜炒炭用", "w": "血虚有寒、月经过多及孕妇不宜用", "ap": "", "m": "丹皮：凉血+活血，无汗骨蒸", "k": "丹皮凉血活血瘀，无汗骨蒸亦相宜。"}, {"id": 85, "ch": "清热药", "sec": "清热凉血药", "n": "赤芍", "f": "清热凉血，散瘀止痛", "a": "1.温毒发斑，血热吐衄；2.经闭痛经，癥瘕腹痛，跌打损伤；3.痈肿疮毒，目赤肿痛", "d": "煎服6~15g", "sp": "", "w": "血寒经闭不宜用；反藜芦", "ap": "", "m": "赤芍：凉血散瘀止痛", "k": "赤芍凉血散瘀止，痛经血瘀皆可治。"}, {"id": 86, "ch": "清热药", "sec": "清热凉血药", "n": "紫草", "f": "凉血活血，解毒透疹", "a": "1.斑疹紫黑，麻疹不透；2.疮疡，湿疹，水火烫伤（外用）", "d": "煎服3~10g", "sp": "外用适量，熬膏或用油浸液涂擦", "w": "性寒而滑，有轻泻作用，脾虚便溏者忌服", "ap": "", "m": "紫草：凉血透疹，麻疹斑疹", "k": "紫草凉血透疹斑，活血解毒烫伤痊。"}, {"id": 87, "ch": "清热药", "sec": "清热凉血药", "n": "水牛角", "f": "清热凉血，解毒，定惊", "a": "1.温病高热，神昏谵语，惊风癫狂；2.血热妄行，斑疹吐衄；3.痈肿疮疡，咽喉肿痛", "d": "6~15g", "sp": "锉碎先煎；亦可锉末冲服", "w": "脾胃虚寒者不宜用", "ap": "水牛角浓缩粉：水牛角的半浓缩粉，功用同水牛角，冲服每次1.5~3g，每日2次", "m": "水牛角：代犀角，凉血解毒定惊", "k": "水牛角代犀角用，凉血解毒定惊风。"}, {"id": 88, "ch": "清热药", "sec": "清虚热药", "n": "青蒿", "f": "清虚热，除骨蒸，解暑，截疟", "a": "1.温邪伤阴，夜热早凉；2.阴虚发热，劳热骨蒸；3.感受暑邪，发热头痛口渴；4.疟疾寒热", "d": "煎服3~10g", "sp": "不宜久煎；或鲜用绞汁", "w": "脾胃虚弱、肠滑泄泻者忌服", "ap": "", "m": "青蒿：夜热早凉，骨蒸，截疟（不宜久煎）", "k": "青蒿清透虚热蒸，截疟解暑后下行。"}, {"id": 89, "ch": "清热药", "sec": "清虚热药", "n": "白薇", "f": "清热凉血，利尿通淋，解毒疗疮", "a": "1.阴虚发热，产后虚热；2.热淋血淋；3.血热毒盛的疮痈肿毒、咽喉肿痛及毒蛇咬伤；此外可用于阴虚外感", "d": "煎服3~12g", "sp": "", "w": "脾胃虚寒、食少便溏者不宜服用", "ap": "", "m": "白薇：阴虚发热，产后虚热", "k": "白薇凉血退虚热，通淋解毒疗疮疖。"}, {"id": 90, "ch": "清热药", "sec": "清虚热药", "n": "地骨皮", "f": "凉血退蒸，清肺降火", "a": "1.阴虚发热，盗汗骨蒸；2.肺热咳嗽；3.血热妄行的吐血、衄血、尿血等；此外兼能生津止渴，治内热消渴", "d": "煎服6~15g", "sp": "", "w": "外感风寒发热及脾虚便溏者不宜用", "ap": "", "m": "地骨皮：骨蒸、肺热", "k": "地骨凉血退骨蒸，清肺降火咳嗽平。"}, {"id": 91, "ch": "清热药", "sec": "清虚热药", "n": "银柴胡", "f": "清虚热，除疳热", "a": "1.阴虚发热，盗汗，骨蒸潮热；2.疳积发热", "d": "煎服3~10g", "sp": "", "w": "外感风寒、血虚无热者忌用", "ap": "", "m": "银柴胡：虚热+疳热", "k": "银柴清虚除疳热，骨蒸潮热可用它。"}, {"id": 92, "ch": "清热药", "sec": "清虚热药", "n": "胡黄连", "f": "退虚热，除疳热，清湿热", "a": "1.骨蒸潮热；2.小儿疳热；3.湿热泻痢，痔疮肿痛", "d": "煎服3~10g", "sp": "", "w": "脾胃虚寒者慎用", "ap": "", "m": "胡黄连：虚热、疳热、湿热", "k": "胡黄退虚疳热清，湿热泻痢亦可平。"}, {"id": 93, "ch": "泻下药", "sec": "攻下药", "n": "大黄", "f": "泻下攻积，清热泻火，止血，解毒，活血祛瘀", "a": "1.大便秘结，胃肠积滞；2.血热妄行之吐血、衄血、咯血，以及火邪上炎所致目赤、咽喉肿痛、牙龈肿痛；3.热毒疮疡，烧烫伤；4.瘀血证（经闭、产后瘀阻、跌打损伤）；此外配清泄湿热药用于黄疸、淋证", "d": "煎服5~10g；外用适量", "sp": "生大黄泻下力较强，欲攻下者宜生用；入汤剂应后下，或用开水泡服，久煎则泻下力减弱；酒制大黄泻下力较弱，活血作用较好，宜用于瘀血证；大黄炭多用于出血证", "w": "苦寒易伤胃气，脾胃虚弱者慎用；性沉降且善活血祛瘀，妇女怀孕、月经期、哺乳期应忌用", "ap": "", "m": "大黄：将军，攻积泻火止血解毒活血，后下", "k": "大黄攻积泻火强，止血解毒瘀血消。"}, {"id": 94, "ch": "泻下药", "sec": "攻下药", "n": "芒硝", "f": "泻下，软坚，清热", "a": "1.实热积滞，大便燥结；2.咽痛、口疮、目赤及疮疡肿痛（外用）", "d": "内服10~15g；外用适量", "sp": "不入煎，冲入药汁内或开水溶化后服", "w": "孕妇及哺乳期妇女忌用或慎用", "ap": "", "m": "芒硝：软坚泻下，外用消肿，冲服", "k": "芒硝软坚泻下强，清热消肿外敷良。"}, {"id": 95, "ch": "泻下药", "sec": "攻下药", "n": "番泻叶", "f": "泻下导滞", "a": "用于便秘（热结便秘、习惯性便秘）；此外能泻下行水消胀，可用于腹水肿胀", "d": "温开水泡服1.5~3g；煎服5~9g", "sp": "宜温开水泡服；入煎剂宜后下", "w": "妇女哺乳期、月经期及孕妇忌用；剂量过大有恶心、呕吐、腹痛等副作用", "ap": "", "m": "番泻叶：泻下导滞，后下", "k": "番泻泻下导滞好，后下热结便秘消。"}, {"id": 96, "ch": "泻下药", "sec": "攻下药", "n": "芦荟", "f": "泻下，清肝，杀虫", "a": "1.热结便秘；2.肝经实火证；3.小儿疳积；此外外用治癣疮", "d": "入丸散服，每次1~2g；外用适量", "sp": "只入丸散，不入汤剂", "w": "脾胃虚弱、食少便溏及孕妇忌用", "ap": "", "m": "芦荟：泻下清肝杀虫", "k": "芦荟泻下清肝火，杀虫疳积也用它。"}, {"id": 97, "ch": "泻下药", "sec": "润下药", "n": "火麻仁", "f": "润肠通便", "a": "肠燥便秘（老人、产妇及体弱津血不足者）", "d": "煎服10~15g", "sp": "打碎入煎", "w": "", "ap": "", "m": "火麻仁：润肠通便", "k": "火麻润肠通便好，老人产后血虚饶。"}, {"id": 98, "ch": "泻下药", "sec": "润下药", "n": "郁李仁", "f": "润肠通便，利水消肿", "a": "1.肠燥便秘；2.水肿腹满，脚气浮肿", "d": "煎服6~12g", "sp": "", "w": "孕妇慎用", "ap": "", "m": "郁李仁：润肠+利水", "k": "郁李润肠兼利水，便秘水肿皆相宜。"}, {"id": 99, "ch": "泻下药", "sec": "峻下逐水药", "n": "甘遂", "f": "泻水逐饮，消肿散结", "a": "1.水肿，鼓胀，胸胁停饮；2.风痰癫痫；3.疮痈肿毒（外用）", "d": "入丸散服，每次0.5~1g；外用适量，生用", "sp": "只入丸散，不入煎剂；内服醋制用，以减低毒性", "w": "虚弱者及孕妇忌用；反甘草", "ap": "", "m": "逐水三药：遂戟芫，十枣汤", "k": "甘遂泻水逐饮强，反草孕妇均不当。"}, {"id": 100, "ch": "泻下药", "sec": "峻下逐水药", "n": "京大戟", "f": "泻水逐饮，消肿散结", "a": "1.水肿，鼓胀，胸胁停饮；2.痈肿疮毒，瘰疬痰核", "d": "煎服1.5~3g；入丸散服，每次1g；外用适量，生用", "sp": "内服醋制用，以减低毒性", "w": "虚弱者及孕妇忌用；反甘草", "ap": "红大戟：茜草科红大戟的块根，功用与京大戟略同；京大戟泻下逐水力强，红大戟消肿散结力胜", "m": "京大戟：与甘遂同属，逐水，反甘草", "k": "大戟泻水逐饮强，反草孕妇均慎尝。"}, {"id": 101, "ch": "泻下药", "sec": "峻下逐水药", "n": "芫花", "f": "泻水逐饮，祛痰止咳，杀虫疗疮", "a": "1.胸胁停饮，水肿，鼓胀；2.咳嗽痰喘；3.头疮、白秃、顽癣（外用）", "d": "煎服1.5~3g；入丸散服，每次0.6g；外用适量", "sp": "内服醋制用，以降低毒性", "w": "虚弱者及孕妇忌用；反甘草", "ap": "", "m": "芫花：逐水+祛痰止咳，反甘草", "k": "芫花泻水祛痰咳，杀虫疗疮反甘草。"}, {"id": 102, "ch": "泻下药", "sec": "峻下逐水药", "n": "商陆", "f": "泻下利水，消肿散结", "a": "1.水肿，鼓胀；2.疮痈肿毒（外用）", "d": "煎服5~10g；外用适量", "sp": "", "w": "孕妇忌用", "ap": "", "m": "商陆：泻下利水，消肿", "k": "商陆泻下利水肿，消肿散结孕妇忌。"}, {"id": 103, "ch": "泻下药", "sec": "峻下逐水药", "n": "牵牛子", "f": "泻下，逐水，去积，杀虫", "a": "1.水肿，鼓胀；2.痰饮喘咳；3.肠胃实热积滞，大便秘结；4.虫积腹痛", "d": "煎服3~9g；入丸散服，每次1.5~3g", "sp": "炒用药性减缓", "w": "孕妇忌用；不宜与巴豆同用", "ap": "", "m": "牵牛子：逐水去积杀虫", "k": "牵牛泻下逐水强，去积杀虫要记详。"}, {"id": 104, "ch": "泻下药", "sec": "峻下逐水药", "n": "巴豆", "f": "泻下冷积，逐水退肿，祛痰利咽，蚀疮", "a": "1.寒积便秘急症；2.腹水鼓胀；3.寒实结胸及喉痹痰阻；4.痈肿成脓未溃及疥癣恶疮（外用）", "d": "入丸散服，每次0.1~0.3g；外用适量", "sp": "不入煎剂；大多制成巴豆霜用，以减低毒性", "w": "孕妇及体弱者忌用；畏牵牛", "ap": "", "m": "巴豆：冷积便秘，峻泻之最", "k": "巴豆泻下冷积猛，逐水祛痰蚀疮功。"}, {"id": 105, "ch": "泻下药", "sec": "峻下逐水药", "n": "千金子", "f": "泻下逐水，破血消癥", "a": "1.水肿，鼓胀；2.癥瘕，经闭；此外有攻毒杀虫作用，可治顽癣、恶疮肿毒及毒蛇咬伤", "d": "内服制霜入丸散，0.5~1g；外用适量", "sp": "制霜后入丸散", "w": "虚弱者及孕妇忌用", "ap": "", "m": "千金子：逐水，破血消癥", "k": "千金逐水泻下强，破血消癥孕慎尝。"}, {"id": 106, "ch": "祛风湿药", "sec": "祛风湿散寒药", "n": "独活", "f": "祛风湿，止痹痛，解表", "a": "1.风寒湿痹（腰以下痹痛尤宜）；2.外感风寒挟湿表证；此外治少阴头痛", "d": "煎服5~15g", "sp": "", "w": "", "ap": "", "m": "独活：下半身风湿痹痛，解表", "k": "独活祛风湿痹痛，下半身痛最相宜。"}, {"id": 107, "ch": "祛风湿药", "sec": "祛风湿散寒药", "n": "威灵仙", "f": "祛风湿，通经络，消骨鲠", "a": "1.风湿痹痛；2.诸骨鲠咽", "d": "煎服5~15g；治骨鲠可用30~50g", "sp": "治骨鲠须加大用量（30~50g）", "w": "", "ap": "", "m": "威灵仙：通十二经，骨鲠喉", "k": "威灵通络祛风湿，骨鲠喉中可化之。"}, {"id": 108, "ch": "祛风湿药", "sec": "祛风湿散寒药", "n": "川乌", "f": "祛风除湿，散寒止痛", "a": "1.风寒湿痹；2.诸寒疼痛、跌打损伤、麻醉止痛", "d": "煎服3~9g；作散剂或酒剂应减为1~2g；外用适量", "sp": "入汤剂应先煎0.5~1小时；一般制后用，生品内服宜慎", "w": "孕妇忌用；反半夏、瓜蒌、贝母、白及、白蔹；不宜久服，生品只供外用", "ap": "草乌：性能、功效、应用、用法用量、使用注意与川乌同，而毒性更强", "m": "川乌：祛风除湿散寒止痛，先煎", "k": "川乌祛风除寒湿，止痛先煎毒要知。"}, {"id": 109, "ch": "祛风湿药", "sec": "祛风湿散寒药", "n": "蕲蛇", "f": "祛风通络，定惊止痉", "a": "1.风湿顽痹，肢体麻木，筋脉拘挛及中风口眼㖞斜、半身不遂；2.麻风疠毒，手足麻木，皮肤瘙痒；3.小儿急慢惊风，破伤风", "d": "煎服5~15g；研末服，每次1~1.5g", "sp": "可研末吞服或浸酒服", "w": "", "ap": "金钱白花蛇：银环蛇的幼蛇，性味归经功效应用与蕲蛇相似而力较强，用量稍轻，多研末服每次0.5g，亦可浸酒服", "m": "蕲蛇：祛风通络，定惊止痉", "k": "蕲蛇祛风通络好，定惊止痉效亦巧。"}, {"id": 110, "ch": "祛风湿药", "sec": "祛风湿散寒药", "n": "乌梢蛇", "f": "祛风通络，定惊止痉", "a": "1.风湿痹痛；2.一切干湿癣证；3.破伤风，小儿急慢惊风，痉挛抽搐", "d": "煎服5~10g；散剂每次2~3g", "sp": "", "w": "", "ap": "蛇蜕：祛风、定惊、退翳、止痒；用于惊风癫痫、翳障、喉痹、皮肤瘙痒等，煎汤1.5~3g，研末0.3~0.6g", "m": "乌梢蛇：和蕲蛇同为祛风通络", "k": "乌梢祛风通络强，定惊止痉功同蕲。"}, {"id": 111, "ch": "祛风湿药", "sec": "祛风湿散寒药", "n": "雷公藤", "f": "祛风除湿，活血通络，消肿止痛，杀虫解毒", "a": "1.风湿顽痹；2.疔疮肿毒，腰带疮，皮肤瘙痒（外用）", "d": "本品大毒，内服宜慎；外用适量", "sp": "捣烂或研末外敷、调擦；外敷不可超过半小时，否则起泡", "w": "孕妇、体虚弱者忌用", "ap": "", "m": "雷公藤：毒大，先煎", "k": "雷公藤毒祛风湿，活血消肿杀虫疾。"}, {"id": 112, "ch": "祛风湿药", "sec": "祛风湿散寒药", "n": "木瓜", "f": "舒筋活络，除湿和胃", "a": "1.风湿痹痛，筋脉拘挛，脚气肿痛；2.吐泻转筋；此外尚能消食，可用于消化不良", "d": "煎服6~12g", "sp": "", "w": "胃酸过多者不宜用", "ap": "", "m": "木瓜：舒筋活络，吐泻转筋要药", "k": "木瓜舒筋活络强，转筋要药和胃良。"}, {"id": 113, "ch": "祛风湿药", "sec": "祛风湿散寒药", "n": "蚕沙", "f": "祛风湿，和中化浊", "a": "1.风湿痹痛；2.吐泻转筋；此外用于风疹、湿疹瘙痒", "d": "煎服5~15g；外用适量", "sp": "宜布包入煎", "w": "", "ap": "", "m": "蚕沙：祛风湿，和中化浊", "k": "蚕沙祛风除湿邪，和中化浊吐泻瘥。"}, {"id": 114, "ch": "祛风湿药", "sec": "祛风湿散寒药", "n": "伸筋草", "f": "祛风湿，舒筋活络", "a": "风湿痹痛，四肢关节酸痛，屈伸不利，皮肤不仁", "d": "煎服10~25g", "sp": "", "w": "", "ap": "", "m": "伸筋草：舒筋活络", "k": "伸筋祛风舒筋络，风湿拘挛屈伸好。"}, {"id": 115, "ch": "祛风湿药", "sec": "祛风湿散寒药", "n": "寻骨风", "f": "祛风湿，通络止痛", "a": "风湿痹痛，肢体麻木及跌打损伤疼痛", "d": "煎服10~15g", "sp": "", "w": "", "ap": "", "m": "寻骨风：祛风湿通络止痛", "k": "寻骨祛风通络痛，风湿痹痛可相从。"}, {"id": 116, "ch": "祛风湿药", "sec": "祛风湿散寒药", "n": "松节", "f": "祛风湿，活络止痛", "a": "风湿痹痛，跌打损伤", "d": "煎服10~15g", "sp": "", "w": "", "ap": "", "m": "松节：祛风湿，活络止痛", "k": "松节祛风除湿痛，活络止痛关节用。"}, {"id": 117, "ch": "祛风湿药", "sec": "祛风湿散寒药", "n": "海风藤", "f": "祛风除湿，通经活络", "a": "风湿痹痛，关节不利，筋脉拘挛及跌打损伤疼痛", "d": "煎服5~15g", "sp": "", "w": "", "ap": "", "m": "海风藤：祛风除湿通络", "k": "海风祛风除湿痹，通经活络筋骨利。"}, {"id": 118, "ch": "祛风湿药", "sec": "祛风湿散寒药", "n": "老鹳草", "f": "祛风湿，舒筋活络，止泻痢", "a": "1.风湿痹痛，肢体麻木，筋骨酸痛；2.湿热泻痢", "d": "煎服10~30g", "sp": "", "w": "", "ap": "", "m": "老鹳草：祛风湿，止泻痢", "k": "老鹳祛湿舒筋络，止泻止痢也相和。"}, {"id": 119, "ch": "祛风湿药", "sec": "祛风湿散寒药", "n": "路路通", "f": "祛风通络，利水，下乳", "a": "1.风湿痹痛，肢体麻木，四肢拘挛；2.水肿，小便不利；3.乳汁不通，乳房胀痛；此外祛风止痒，用于风疹瘙痒（内服或外洗）", "d": "煎服5~10g；外用适量", "sp": "", "w": "", "ap": "", "m": "路路通：祛风通络，下乳", "k": "路路祛风通络利，利水下乳也相宜。"}, {"id": 120, "ch": "祛风湿药", "sec": "祛风湿清热药", "n": "秦艽", "f": "祛风湿，舒筋络，退虚热，清湿热", "a": "1.风湿痹痛，筋脉拘挛，手足不遂（寒热新久均可）；2.骨蒸潮热；3.湿热黄疸", "d": "煎服5~15g；大剂量可用至30g", "sp": "", "w": "", "ap": "", "m": "秦艽：风湿痹痛，退虚热，退黄", "k": "秦艽祛风舒筋络，退虚热又清湿热。"}, {"id": 121, "ch": "祛风湿药", "sec": "祛风湿清热药", "n": "防己", "f": "祛风湿，止痛，利水消肿", "a": "1.痹证，尤宜于湿热偏胜者（骨节烦痛、屈伸不利）；2.水肿，痰饮证，脚气浮肿", "d": "煎服5~10g", "sp": "祛风止痛宜木防己，利水退肿宜汉防己", "w": "大苦大寒，易伤胃气，体弱阴虚、胃纳不佳者慎用", "ap": "", "m": "防己：祛风湿，利水消肿", "k": "防己祛风湿止痛，利水消肿功亦丰。"}, {"id": 122, "ch": "祛风湿药", "sec": "祛风湿清热药", "n": "桑枝", "f": "祛风通络，利关节", "a": "风湿痹痛，四肢拘挛（上肢痹痛尤宜）", "d": "煎服15~30g", "sp": "", "w": "", "ap": "", "m": "桑枝：上肢痹痛", "k": "桑枝祛风通络利，上肢痹痛最相宜。"}, {"id": 123, "ch": "祛风湿药", "sec": "祛风湿清热药", "n": "豨莶草", "f": "祛风湿，通经活络，清热解毒", "a": "1.风湿痹证，骨节疼痛，四肢麻木，脚弱无力；2.中风手足不遂；3.疮疡肿毒，湿疹瘙痒；此外能降压，可用于高血压病", "d": "煎服15~20g；外用适量", "sp": "治风湿痹证宜制用，湿疮、湿疹宜生用", "w": "", "ap": "", "m": "豨莶草：祛风湿，清热解毒", "k": "豨莶祛风湿通络，清热解毒功效多。"}, {"id": 124, "ch": "祛风湿药", "sec": "祛风湿清热药", "n": "臭梧桐", "f": "祛风湿，活络", "a": "1.风湿痹痛，肢体麻木，半身不遂；2.高血压病", "d": "煎服5~15g；外用适量", "sp": "用于降压不宜高温久煎", "w": "", "ap": "", "m": "臭梧桐：祛风湿，活络", "k": "臭梧祛风湿功佳，活络之效也不差。"}, {"id": 125, "ch": "祛风湿药", "sec": "祛风湿清热药", "n": "海桐皮", "f": "祛风湿，通络止痛，杀虫止痒", "a": "1.风湿痹痛，四肢拘挛，腰膝酸痛；2.疥癣，湿疹瘙痒", "d": "煎服5~15g；外用适量", "sp": "", "w": "", "ap": "", "m": "海桐皮：祛风湿，止痒", "k": "海桐祛风湿通络，杀虫止痒疮癣疗。"}, {"id": 126, "ch": "祛风湿药", "sec": "祛风湿清热药", "n": "络石藤", "f": "祛风通络，凉血消肿", "a": "1.风湿痹痛，筋脉拘挛，以热痹为宜；2.喉痹，痈疡", "d": "煎服5~15g", "sp": "", "w": "", "ap": "", "m": "络石藤：祛风通络，凉血", "k": "络石祛风通络强，凉血消肿功亦长。"}, {"id": 127, "ch": "祛风湿药", "sec": "祛风湿清热药", "n": "穿山龙", "f": "祛风湿，活血通络，清肺化痰", "a": "1.风湿关节痛及关节扭伤、腰腿痛（治热痹为宜）；2.肺热咳嗽痰多", "d": "煎服15~30g", "sp": "", "w": "", "ap": "", "m": "穿山龙：祛风湿，活血，清肺化痰", "k": "穿山龙祛风湿络，活血清肺痰咳除。"}, {"id": 128, "ch": "祛风湿药", "sec": "祛风湿清热药", "n": "丝瓜络", "f": "祛风通络，解毒化痰", "a": "1.风湿痹痛；2.胸痹；3.胸胁痛；4.乳痈", "d": "煎服6~10g；大剂量可用至60g", "sp": "", "w": "", "ap": "", "m": "丝瓜络：祛风通络，解毒化痰", "k": "丝瓜通络祛风湿，解毒化痰亦相宜。"}, {"id": 129, "ch": "祛风湿药", "sec": "祛风湿强筋骨药", "n": "五加皮", "f": "祛风湿，强筋骨，利尿", "a": "1.风湿痹痛，四肢拘挛；2.肝肾不足，腰膝软弱及小儿行迟；3.水肿，小便不利", "d": "煎服5~15g", "sp": "", "w": "", "ap": "", "m": "五加皮：祛风湿，强筋骨，利尿", "k": "五加祛风强筋骨，利尿消肿湿邪除。"}, {"id": 130, "ch": "祛风湿药", "sec": "祛风湿强筋骨药", "n": "桑寄生", "f": "祛风湿，益肝肾，强筋骨，安胎", "a": "1.风湿痹痛，腰膝酸痛（肝肾不足者尤宜）；2.胎漏下血，胎动不安", "d": "煎服10~15g", "sp": "", "w": "", "ap": "", "m": "桑寄生：补肝肾，安胎", "k": "寄生祛风益肝肾，强筋安胎功效深。"}, {"id": 131, "ch": "祛风湿药", "sec": "祛风湿强筋骨药", "n": "狗脊", "f": "祛风湿，补肝肾，强腰膝", "a": "1.风湿痹痛，腰痛脊强，不能俯仰，足膝软弱；2.肾气不固之遗尿、白带过多", "d": "煎服10~15g", "sp": "", "w": "", "ap": "", "m": "狗脊：补肝肾，强腰膝", "k": "狗脊祛风补肝肾，强腰膝兮筋骨劲。"}, {"id": 132, "ch": "祛风湿药", "sec": "祛风湿强筋骨药", "n": "千年健", "f": "祛风湿，强筋骨，止痹痛", "a": "风寒湿痹，腰膝冷痛，下肢拘挛麻木（老人尤宜）", "d": "煎服5~10g", "sp": "", "w": "", "ap": "", "m": "千年健：强筋骨，止痹痛", "k": "千年祛风强筋骨，止痹痛兮功效著。"}, {"id": 133, "ch": "化湿药", "sec": "化湿药", "n": "藿香", "f": "化湿，解暑，止呕", "a": "1.湿滞中焦证；2.暑湿证及湿温初起；3.呕吐（湿浊中阻者最宜）", "d": "煎服5~10g", "sp": "鲜品加倍", "w": "", "ap": "", "m": "藿香：夏天湿热，止呕，解暑", "k": "藿香化湿解暑热，止呕和中功效佳。"}, {"id": 134, "ch": "化湿药", "sec": "化湿药", "n": "佩兰", "f": "化湿，解暑", "a": "1.湿滞中焦证（脾经湿热、口中甜腻多涎）；2.外感暑湿或湿温初起", "d": "煎服5~10g", "sp": "鲜品加倍", "w": "", "ap": "", "m": "佩兰：化湿解暑，口中甜腻", "k": "佩兰化湿又解暑，口甜腻腻用它除。"}, {"id": 135, "ch": "化湿药", "sec": "化湿药", "n": "苍术", "f": "燥湿健脾，祛风湿", "a": "1.湿滞中焦证；2.风湿痹证；3.外感风寒挟湿之表证；此外能明目，用于夜盲症及眼目昏涩", "d": "煎服5~10g", "sp": "", "w": "", "ap": "", "m": "苍术：燥湿健脾，祛风湿，明目", "k": "苍术燥湿健脾强，祛风湿痹效亦良。"}, {"id": 136, "ch": "化湿药", "sec": "化湿药", "n": "厚朴", "f": "行气，燥湿，消积，平喘", "a": "1.湿阻中焦、气滞不利所致脘闷腹胀、腹痛或呕逆；2.肠胃积滞，腹胀便秘；3.痰饮喘咳", "d": "煎服3~10g", "sp": "", "w": "", "ap": "厚朴花：芳香化湿、行气宽胸；用于湿阻气滞之胸腹胀满疼痛、纳少，3~6g", "m": "厚朴：行气、燥湿、消积、平喘，下气除满要药", "k": "厚朴行气燥湿消，积滞平喘气得调。"}, {"id": 137, "ch": "化湿药", "sec": "化湿药", "n": "砂仁", "f": "化湿行气，温中止呕止泻，安胎", "a": "1.湿困脾土及脾胃气滞证；2.脾胃虚寒吐泻；3.气滞妊娠恶阻及胎动不安", "d": "煎服5~10g", "sp": "宜后下", "w": "", "ap": "砂仁壳：性味功效与砂仁相似而温性略减、药力薄弱，适用于脾胃气滞、脘腹胀痛、呕恶食少，用量同砂仁", "m": "砂仁：化湿行气，安胎，后下", "k": "砂仁化湿行气好，温中止呕安胎妙。"}, {"id": 138, "ch": "化湿药", "sec": "化湿药", "n": "白豆蔻", "f": "化湿行气，温中止呕", "a": "1.湿滞中焦及脾胃气滞的脘腹胀满、不思饮食；2.呕吐（胃寒湿阻气滞者最宜）", "d": "煎服3~6g", "sp": "入散剂为好；入汤剂宜后下", "w": "", "ap": "豆蔻壳：性味功效与白豆蔻相似，但温性不强、力亦较弱，适用于湿阻气滞所致脘腹痞闷、食欲不振、呕吐，煎服3~5g", "m": "白豆蔻：化湿行气，温中止呕，后下", "k": "白蔻化湿行气温，温中止呕胃脘安。"}, {"id": 139, "ch": "化湿药", "sec": "化湿药", "n": "草豆蔻", "f": "燥湿行气，温中止呕", "a": "1.寒湿中阻、脾胃气滞之脘腹胀满疼痛、呕吐；2.寒凝湿郁，脾虚久泻", "d": "煎服5~10g", "sp": "", "w": "", "ap": "", "m": "草豆蔻：燥湿行气温中", "k": "草蔻燥湿行气强，温中止呕寒湿尝。"}, {"id": 140, "ch": "化湿药", "sec": "化湿药", "n": "草果", "f": "燥湿散寒，除痰截疟", "a": "1.寒湿中阻之脘腹胀痛、呕吐泄泻、舌苔浊腻；2.疟疾", "d": "煎服3~6g", "sp": "去壳取仁捣碎用", "w": "", "ap": "", "m": "草果：燥湿散寒除痰截疟", "k": "草果燥湿散寒强，除痰截疟功效彰。"}, {"id": 141, "ch": "利水渗湿药", "sec": "利水消肿药", "n": "茯苓", "f": "利水渗湿，健脾安神", "a": "1.水肿，小便不利（寒热虚实各种水肿均可）；2.脾虚诸证（食少便溏、痰饮）；3.心悸，失眠", "d": "煎服10~15g", "sp": "", "w": "", "ap": "茯苓皮：功专行皮肤水湿，多用于皮肤水肿，15~30g。茯神：有宁心安神之功，专用于心神不安、惊悸、健忘，用量同茯苓", "m": "茯苓：利水渗湿+健脾+安神，水肿要药", "k": "茯苓利水渗湿强，健脾安神效最良。"}, {"id": 142, "ch": "利水渗湿药", "sec": "利水消肿药", "n": "薏苡仁", "f": "利水渗湿，健脾，除痹，清热排脓", "a": "1.小便不利，水肿，脚气及脾虚泄泻；2.湿痹拘挛；3.肺痈，肠痈", "d": "煎服10~30g", "sp": "清利湿热宜生用，健脾止泻宜炒用；本品力缓，用量宜大；除入汤剂、丸散外，亦可作粥食用，为食疗佳品", "w": "", "ap": "", "m": "薏苡仁：利水、健脾、除痹、排脓（肺痈肠痈）", "k": "薏苡利水健脾湿，除痹排脓清热宜。"}, {"id": 143, "ch": "利水渗湿药", "sec": "利水消肿药", "n": "猪苓", "f": "利水渗湿", "a": "小便不利，水肿，泄泻，淋浊等（利水作用较茯苓强）", "d": "煎服5~10g", "sp": "", "w": "无水湿者忌用", "ap": "", "m": "猪苓：只利水渗湿，利水作用强于茯苓", "k": "猪苓利水渗湿功，力强于苓专利水。"}, {"id": 144, "ch": "利水渗湿药", "sec": "利水消肿药", "n": "泽泻", "f": "利水渗湿，泄热", "a": "水肿，小便不利，泄泻，淋浊带下及痰饮等（下焦湿热者尤宜）", "d": "煎服5~10g", "sp": "", "w": "", "ap": "", "m": "泽泻：利水+泄热（下焦湿热）", "k": "泽泻利水渗湿强，泄热下焦湿热尝。"}, {"id": 145, "ch": "利水渗湿药", "sec": "利水消肿药", "n": "冬瓜皮", "f": "利水消肿", "a": "水肿，小便不利（水肿偏有热者为宜）", "d": "煎服15~30g", "sp": "", "w": "", "ap": "冬瓜仁：清肺化痰、利湿排脓；用于肺热咳嗽、肺痈、肠痈、带下、白浊，10~15g", "m": "冬瓜皮：利水消肿，皮肤水肿", "k": "冬瓜皮能利水肿，皮肤浮肿用之灵。"}, {"id": 146, "ch": "利水渗湿药", "sec": "利水消肿药", "n": "玉米须", "f": "利水消肿，利湿退黄", "a": "1.水肿，小便不利；2.黄疸", "d": "煎服30~60g", "sp": "", "w": "", "ap": "", "m": "玉米须：利水消肿+退黄", "k": "玉米须能利水肿，利湿退黄也有功。"}, {"id": 147, "ch": "利水渗湿药", "sec": "利水消肿药", "n": "葫芦", "f": "利水消肿", "a": "面目浮肿，大腹水肿，脚气肿胀等", "d": "煎服15~30g", "sp": "", "w": "", "ap": "", "m": "葫芦：利水消肿", "k": "葫芦利水消肿胀，单用也能见效良。"}, {"id": 148, "ch": "利水渗湿药", "sec": "利水消肿药", "n": "香加皮", "f": "利尿消肿，祛风湿，强筋骨", "a": "1.水肿，小便不利；2.风湿痹证", "d": "煎服3~6g", "sp": "浸酒或入丸散，酌量", "w": "有强心利尿作用，有毒，不宜多用；与南五加皮科属不同、功效不一，应区别使用", "ap": "", "m": "香加皮：有毒，利尿+强心，祛风湿", "k": "香加利尿消肿水，祛风强骨有毒记。"}, {"id": 149, "ch": "利水渗湿药", "sec": "利水消肿药", "n": "泽漆", "f": "利水消肿，化痰止咳，散结", "a": "1.大腹水肿，四肢面目浮肿；2.痰饮喘咳，肺热咳嗽；3.瘰疬，癣疮", "d": "煎服5~10g；外用适量", "sp": "", "w": "有毒，不宜过量或长期使用；脾胃虚寒者慎用", "ap": "", "m": "泽漆：利水化痰散结", "k": "泽漆利水消肿胀，化痰止咳散结强。"}, {"id": 150, "ch": "利水渗湿药", "sec": "利水消肿药", "n": "蝼蛄", "f": "利水消肿", "a": "水肿，小便不利，石淋", "d": "煎服5~9g；研末服，每次3~5g；外用适量", "sp": "", "w": "气虚体弱者及孕妇均忌服", "ap": "", "m": "蝼蛄：利水消肿", "k": "蝼蛄利水消肿胀，水肿便秘皆可尝。"}, {"id": 151, "ch": "利水渗湿药", "sec": "利水消肿药", "n": "荠菜", "f": "清热利水，凉血止血", "a": "1.水肿，泄泻，痢疾；2.血热出血（吐血、便血、崩漏、月经过多）；此外用于目赤肿痛", "d": "煎服15~30g，鲜品加倍；外用适量", "sp": "", "w": "", "ap": "", "m": "荠菜：凉血止血，利水", "k": "荠菜清热利水好，凉血止血功不少。"}, {"id": 152, "ch": "利水渗湿药", "sec": "利尿通淋药", "n": "车前子", "f": "利尿通淋，渗湿止泻，清肝明目，清肺化痰", "a": "1.小便不利，水肿，淋证；2.暑湿泄泻；3.目赤，目暗昏花；4.痰热咳嗽", "d": "煎服10~15g", "sp": "宜布包煎", "w": "", "ap": "车前草：性味功用同车前子，且能清热解毒；用治热毒痈肿，内服或鲜草捣烂外敷，10~20g，鲜品加倍", "m": "车前子：通淋、止泻（利小便实大便）、明目，包煎", "k": "车前通淋渗湿泻，清肝明目肺痰化。"}, {"id": 153, "ch": "利水渗湿药", "sec": "利尿通淋药", "n": "滑石", "f": "利水通淋，清解暑热，祛湿敛疮", "a": "1.小便不利，淋沥涩痛；2.暑湿，湿温；3.湿疮，湿疹，痱子（外用）", "d": "煎服10~15g；外用适量", "sp": "宜布包煎", "w": "脾虚、热病伤津及孕妇忌用", "ap": "", "m": "滑石：通淋+解暑+外用祛湿，包煎", "k": "滑石利水通淋好，清暑祛湿敛疮妙。"}, {"id": 154, "ch": "利水渗湿药", "sec": "利尿通淋药", "n": "关木通", "f": "利尿通淋，通经下乳", "a": "1.热淋涩痛，水肿，心烦尿赤，口舌生疮；2.经闭，乳少；3.湿热痹痛", "d": "煎服3~9g", "sp": "", "w": "据报道关木通60g水煎服有致急性肾功能衰竭者，故用量不宜大", "ap": "", "m": "木通：利尿通淋+通经下乳（关木通含马兜铃酸）", "k": "木通利尿通淋强，通经下乳功效彰。"}, {"id": 155, "ch": "利水渗湿药", "sec": "利尿通淋药", "n": "通草", "f": "清热利湿，通气下乳", "a": "1.湿热淋证，湿温尿赤；2.产后乳汁不通或乳少", "d": "煎服5~10g", "sp": "", "w": "", "ap": "", "m": "通草：清热利湿，下乳", "k": "通草清热利湿好，通气下乳效亦巧。"}, {"id": 156, "ch": "利水渗湿药", "sec": "利尿通淋药", "n": "瞿麦", "f": "利尿通淋，活血通经", "a": "1.小便不利，淋沥涩痛（热淋、血淋）；2.经闭，月经不调", "d": "煎服10~15g", "sp": "", "w": "孕妇忌服", "ap": "", "m": "瞿麦：通淋+活血通经", "k": "瞿麦利尿通淋强，活血通经亦相当。"}, {"id": 157, "ch": "利水渗湿药", "sec": "利尿通淋药", "n": "萹蓄", "f": "利尿通淋，杀虫止痒", "a": "1.小便不利，淋沥涩痛；2.湿疹，阴痒，虫积腹痛", "d": "煎服10~30g，鲜品加倍；外用适量", "sp": "", "w": "多服泄精气", "ap": "", "m": "萹蓄：通淋+杀虫止痒", "k": "萹蓄利尿通淋好，杀虫止痒功效巧。"}, {"id": 158, "ch": "利水渗湿药", "sec": "利尿通淋药", "n": "地肤子", "f": "清热利湿，止痒", "a": "1.小便不利，淋沥涩痛；2.皮肤风疹，湿疹瘙痒", "d": "煎服10~15g；外用适量", "sp": "", "w": "", "ap": "", "m": "地肤子：湿热止痒，皮肤病", "k": "地肤清热利湿痒，皮肤瘙痒用之良。"}, {"id": 159, "ch": "利水渗湿药", "sec": "利尿通淋药", "n": "海金沙", "f": "利尿通淋", "a": "各种淋证（热淋、砂淋、血淋、膏淋，尤善止尿道疼痛）；亦治水肿", "d": "煎服6~12g", "sp": "宜布包煎", "w": "", "ap": "海金沙藤：性味功效与海金沙同，而更长于清热解毒；多用治热淋、石淋，亦可用于痈肿疮毒、痄腮和黄疸；煎服15~30g，外用煎汤外洗或捣敷", "m": "海金沙：通淋，石淋，包煎", "k": "海金沙利尿通淋，砂石诸淋用之灵。"}, {"id": 160, "ch": "利水渗湿药", "sec": "利尿通淋药", "n": "石韦", "f": "利水通淋，清肺止咳，凉血止血", "a": "1.热淋，石淋，血淋；2.肺热咳喘；3.血热出血（崩漏、吐衄）", "d": "煎服5~10g；大剂30~60g", "sp": "", "w": "", "ap": "", "m": "石韦：通淋+止咳+止血", "k": "石韦利水通淋强，清肺止咳凉血良。"}, {"id": 161, "ch": "利水渗湿药", "sec": "利尿通淋药", "n": "冬葵子", "f": "利水通淋，下乳润肠", "a": "1.淋证，水肿；2.乳汁不行，乳房胀痛；3.肠燥便秘", "d": "煎服10~15g", "sp": "", "w": "孕妇慎用", "ap": "", "m": "冬葵子：通淋，下乳，润肠", "k": "冬葵利水通淋好，下乳润肠功亦妙。"}, {"id": 162, "ch": "利水渗湿药", "sec": "利尿通淋药", "n": "灯心草", "f": "利尿通淋，清心除烦", "a": "1.热淋；2.心烦失眠，小儿夜啼", "d": "煎服1.5~2.5g，或入丸散", "sp": "", "w": "", "ap": "", "m": "灯心草：通淋，清心除烦", "k": "灯心利尿通淋好，清心除烦效亦巧。"}, {"id": 163, "ch": "利水渗湿药", "sec": "利尿通淋药", "n": "萆薢", "f": "利湿浊，祛风湿", "a": "1.膏淋，白浊；2.风湿痹证", "d": "煎服10~15g", "sp": "", "w": "肾阴亏虚、遗精滑泄者慎用", "ap": "", "m": "萆薢：膏淋白浊要药", "k": "萆薢利湿浊为先，膏淋白浊祛风湿。"}, {"id": 164, "ch": "利水渗湿药", "sec": "利湿退黄药", "n": "茵陈蒿", "f": "清利湿热，利胆退黄", "a": "1.黄疸（阳黄、阴黄均可，为治黄疸要药）；2.湿温，湿疹，湿疮", "d": "煎服10~30g；外用适量", "sp": "", "w": "蓄血发黄及血虚萎黄者慎用", "ap": "", "m": "茵陈：黄疸要药，利胆退黄", "k": "茵陈蒿清利湿热，利胆退黄第一药。"}, {"id": 165, "ch": "利水渗湿药", "sec": "利湿退黄药", "n": "金钱草", "f": "除湿退黄，利尿通淋，解毒消肿", "a": "1.湿热黄疸；2.石淋，热淋（治石淋尤为多用）；3.恶疮肿毒，毒蛇咬伤", "d": "煎服30~60g，鲜品加倍；外用适量", "sp": "治石淋可单用大剂量煎汤代茶饮；解毒可用鲜品捣汁饮并以渣外敷", "w": "", "ap": "", "m": "金钱草：石淋、胆结石要药", "k": "金钱除湿退黄强，利尿通淋石淋良。"}, {"id": 166, "ch": "利水渗湿药", "sec": "利湿退黄药", "n": "虎杖", "f": "利胆退黄，清热解毒，活血祛瘀，祛痰止咳", "a": "1.湿热黄疸，淋浊带下；2.烧烫伤，痈肿疮毒，毒蛇咬伤；3.血瘀经闭，跌打损伤；4.肺热咳嗽；此外有泻下通便作用", "d": "煎服10~30g；外用适量", "sp": "", "w": "孕妇忌服", "ap": "", "m": "虎杖：退黄解毒活血祛痰，一药多用", "k": "虎杖退黄解毒强，活血祛痰功效长。"}, {"id": 167, "ch": "利水渗湿药", "sec": "利湿退黄药", "n": "地耳草", "f": "利湿退黄，清热解毒，活血消肿", "a": "1.黄疸；2.肺痈，肠痈，痈肿疮毒；3.跌打损伤", "d": "煎服15~30g，鲜品加倍；外用适量", "sp": "", "w": "", "ap": "", "m": "地耳草：利湿退黄，解毒", "k": "地耳利湿退黄强，解毒消肿活血良。"}, {"id": 168, "ch": "利水渗湿药", "sec": "利湿退黄药", "n": "垂盆草", "f": "利湿退黄，清热解毒", "a": "1.黄疸；2.痈肿疮疡，咽喉肿痛，毒蛇咬伤，烫伤", "d": "煎服15~30g，鲜品加倍；外用适量", "sp": "", "w": "", "ap": "", "m": "垂盆草：退黄，降转氨酶", "k": "垂盆利湿退黄疸，清热解毒功效全。"}, {"id": 169, "ch": "温里药", "sec": "温里药", "n": "附子", "f": "回阳救逆，助阳补火，散寒止痛", "a": "1.亡阳证（\"回阳救逆第一品药\"）；2.虚寒性的阳痿宫冷、脘腹冷痛、泄泻、水肿等证；3.寒痹证", "d": "煎服3~15g", "sp": "宜先煎0.5~1小时，至口尝无麻辣感为度", "w": "辛热燥烈，凡阴虚阳亢及孕妇忌用；反半夏、瓜蒌、贝母、白蔹、白及；因有毒，内服须经炮制，若内服过量或炮制、煎煮方法不当可引起中毒", "ap": "", "m": "附子：回阳救逆第一品药，先煎久煎", "k": "回阳救逆附子雄，补火散寒止痛功。"}, {"id": 170, "ch": "温里药", "sec": "温里药", "n": "干姜", "f": "温中散寒，回阳通脉，温肺化饮", "a": "1.脾胃寒证，脘腹冷痛，呕吐泄泻；2.亡阳证；3.寒饮咳喘", "d": "煎服3~10g", "sp": "", "w": "", "ap": "", "m": "干姜：温中、回阳、化饮，“脾胃中焦第一药”", "k": "干姜温中又回阳，化饮温肺通脉长。"}, {"id": 171, "ch": "温里药", "sec": "温里药", "n": "肉桂", "f": "补火助阳，散寒止痛，温经通脉", "a": "1.肾阳衰弱的阳痿宫冷、虚喘心悸等；2.心腹冷痛，寒疝作痛；3.寒痹腰痛，胸痹，阴疽；4.闭经，痛经；此外久病体虚气血不足者，在补气益血方中适加肉桂能鼓舞气血生长", "d": "煎服2~5g；研末冲服，每次1~2g", "sp": "宜后下或焗服；可研末冲服", "w": "畏赤石脂", "ap": "", "m": "肉桂：补火助阳+引火归元，后下，畏赤石脂", "k": "肉桂补火散寒痛，温通经脉引火从。"}, {"id": 172, "ch": "温里药", "sec": "温里药", "n": "吴茱萸", "f": "散寒止痛，温中止呕，助阳止泻", "a": "1.寒滞肝脉诸痛证（厥阴头痛、寒疝、痛经、脚气）；2.胃寒呕吐证；3.虚寒泄泻证；此外研末米醋调敷足心（涌泉穴）可治口疮，并用治高血压病", "d": "煎服1.5~6g；外用适量", "sp": "", "w": "辛热燥烈，易耗气动火，不宜多用、久服", "ap": "", "m": "吴茱萸：肝经寒痛要药，止呕止泻", "k": "吴萸散寒止痛妙，温中止呕止泻好。"}, {"id": 173, "ch": "温里药", "sec": "温里药", "n": "小茴香", "f": "散寒止痛，理气和中", "a": "1.寒疝腹痛，睾丸偏坠胀痛，少腹冷痛，痛经；2.中焦虚寒气滞证", "d": "煎服3~6g；外用适量", "sp": "", "w": "", "ap": "八角茴香：又名大茴香，性味功效与小茴香相似但功力较弱，主要用作食物调味品，用法用量与小茴香同", "m": "小茴香：散寒止痛，理气，疝气", "k": "小茴散寒止痛良，理气和中疝痛尝。"}, {"id": 174, "ch": "温里药", "sec": "温里药", "n": "高良姜", "f": "散寒止痛，温中止呕", "a": "1.胃寒冷痛；2.胃寒呕吐", "d": "煎服3~10g；研末服，每次3g", "sp": "", "w": "", "ap": "", "m": "高良姜：胃寒脘痛", "k": "良姜散寒止痛佳，温中止呕胃寒夸。"}, {"id": 175, "ch": "温里药", "sec": "温里药", "n": "花椒", "f": "温中止痛，杀虫，止痒", "a": "1.中寒腹痛，寒湿吐泻；2.虫积腹痛；3.湿疹瘙痒，妇人阴痒（外用）", "d": "煎服3~10g；外用适量", "sp": "", "w": "", "ap": "椒目：花椒的种子，利水消肿、降气平喘；用于水肿胀满、痰饮咳喘，煎服3~10g", "m": "花椒：温中、杀虫（蛔虫）、止痒", "k": "花椒温中止痛安，杀虫止痒蛔虫痊。"}, {"id": 176, "ch": "温里药", "sec": "温里药", "n": "丁香", "f": "温中降逆，散寒止痛，温肾助阳", "a": "1.胃寒呕吐，呃逆；2.脘腹冷痛；3.阳痿，宫冷", "d": "煎服1.5~6g", "sp": "", "w": "畏郁金", "ap": "母丁香：丁香的成熟果实，又名鸡舌香，性味功效与公丁香相似但气味较淡、功力较逊，用法用量与公丁香同", "m": "丁香：降逆止呃，畏郁金", "k": "丁香温中降逆呃，散寒止痛肾阳助。"}, {"id": 177, "ch": "温里药", "sec": "温里药", "n": "荜茇", "f": "温中散寒", "a": "1.胃寒腹痛，呕吐，呃逆，泄泻；2.龋齿疼痛（外用）", "d": "煎服3~6g；外用适量", "sp": "", "w": "", "ap": "", "m": "荜茇：温中散寒", "k": "荜茇温中散寒气，胃寒腹痛可相宜。"}, {"id": 178, "ch": "温里药", "sec": "温里药", "n": "荜澄茄", "f": "温中散寒，行气止痛", "a": "1.胃寒腹痛，呕吐，呃逆；2.寒疝腹痛；此外治下焦虚寒之小便不利或寒湿郁滞之小便浑浊", "d": "煎服2~5g", "sp": "", "w": "", "ap": "", "m": "荜澄茄：温中行气", "k": "澄茄温中又行气，寒凝胃痛可相依。"}, {"id": 179, "ch": "温里药", "sec": "温里药", "n": "胡椒", "f": "温中止痛，下气消痰", "a": "1.胃寒腹痛，呕吐泄泻；2.癫痫证", "d": "煎服2~4g；研末服，每次0.5~1g；外用适量", "sp": "", "w": "", "ap": "", "m": "胡椒：温中止痛，下气消痰", "k": "胡椒温中止痛好，下气消痰也用它。"}, {"id": 180, "ch": "理气药", "sec": "理气药", "n": "橘皮", "f": "理气健脾，燥湿化痰", "a": "1.脾胃气滞证（脘腹胀满、恶心呕吐、不思饮食）；2.湿痰、寒痰咳嗽", "d": "煎服3~10g", "sp": "", "w": "", "ap": "橘核：理气散结止痛，用于疝气痛、睾丸肿痛及乳房结块，3~10g。橘络：行气通络、化痰止咳，用于痰滞经络之胸痛咳嗽，3~5g。橘叶：疏肝行气、散结消肿，用于胁肋作痛、乳痈、乳房结块，6~10g。化橘红：理气宽中、燥湿化痰，用于湿痰或寒痰咳嗽及食积呕恶胸闷，3~10g", "m": "橘皮：理气健脾，燥湿化痰（陈皮）", "k": "橘皮理气健脾胃，燥湿化痰咳呕宜。"}, {"id": 181, "ch": "理气药", "sec": "理气药", "n": "青皮", "f": "疏肝理气，消积化滞", "a": "1.肝气郁滞诸证（胸胁胀痛、乳房胀痛、疝气痛）；2.食积腹痛；此外可用于癥瘕积聚、久疟痞块", "d": "煎服3~10g", "sp": "醋炙疏肝止痛力强", "w": "", "ap": "", "m": "青皮：疏肝破气，消积", "k": "青皮疏肝破气滞，消积化滞胁胀宜。"}, {"id": 182, "ch": "理气药", "sec": "理气药", "n": "枳实", "f": "破气除痞，化痰消积", "a": "1.食积证，胃肠热结气滞证；2.痰滞胸脘痞满，胸痹结胸；此外可用治胃扩张、胃下垂、子宫脱垂、脱肛等脏器下垂（配补气、升阳药）", "d": "煎服3~10g；大量可用至30g", "sp": "炒后性较平和", "w": "孕妇慎用", "ap": "枳壳：性味归经功用与枳实同，但作用较缓和，长于行气宽中除胀，用法用量同枳实", "m": "枳实：破气除痞，化痰，积滞", "k": "枳实破气除痞满，化痰消积便秘安。"}, {"id": 183, "ch": "理气药", "sec": "理气药", "n": "木香", "f": "行气止痛", "a": "1.脾胃气滞证（行气止痛要药）；2.泻痢里急后重；3.腹痛胁痛，黄疸", "d": "煎服3~10g", "sp": "生用行气力强；煨用行气力缓而多用于止泻", "w": "", "ap": "", "m": "木香：行气止痛，健脾，宜煨用止泻", "k": "木香行气止痛先，健脾消食泻痢痊。"}, {"id": 184, "ch": "理气药", "sec": "理气药", "n": "沉香", "f": "行气止痛，温中止呕，纳气平喘", "a": "1.胸腹胀痛（寒凝气滞）；2.胃寒呕吐；3.虚喘证（下元虚冷、肾不纳气）", "d": "煎服1~3g；入丸散剂每次0.5~1g", "sp": "宜后下；或磨汁冲服；或入丸散", "w": "", "ap": "", "m": "沉香：降气，温中，纳气，后下", "k": "沉香行气止痛强，温中降逆纳气长。"}, {"id": 185, "ch": "理气药", "sec": "理气药", "n": "檀香", "f": "行气止痛，散寒调中", "a": "胸腹冷痛，胃脘寒痛，呕吐食少", "d": "煎服1~3g", "sp": "宜后下", "w": "", "ap": "", "m": "檀香：行气止痛，散寒，后下", "k": "檀香行气止痛畅，散寒调中胸腹康。"}, {"id": 186, "ch": "理气药", "sec": "理气药", "n": "香附", "f": "疏肝理气，调经止痛", "a": "1.气滞胁痛，腹痛；2.肝郁月经不调，痛经，乳房胀痛（妇科调经要药）", "d": "煎服6~12g", "sp": "醋炙止痛力增强", "w": "", "ap": "", "m": "香附：气病之总司，女科主帅", "k": "香附疏肝理气畅，调经止痛妇科长。"}, {"id": 187, "ch": "理气药", "sec": "理气药", "n": "川楝子", "f": "行气止痛，杀虫疗癣", "a": "1.肝郁化火所致诸痛证；2.虫积腹痛；此外外用治头癣", "d": "煎服3~10g；外用适量", "sp": "炒用寒性减低", "w": "有毒，不宜过量或持续服用", "ap": "", "m": "川楝子：行气止痛，杀虫，有小毒", "k": "川楝行气疏肝痛，杀虫疗癣有毒用。"}, {"id": 188, "ch": "理气药", "sec": "理气药", "n": "乌药", "f": "行气止痛，温肾散寒", "a": "1.寒凝气滞所致胸腹诸痛证；2.尿频，遗尿（膀胱虚冷）", "d": "煎服3~10g", "sp": "", "w": "", "ap": "", "m": "乌药：行气止痛，温肾缩尿", "k": "乌药行气止痛安，温肾散寒缩尿痊。"}, {"id": 189, "ch": "理气药", "sec": "理气药", "n": "荔枝核", "f": "行气散结，散寒止痛", "a": "1.疝气痛，睾丸肿痛；2.胃脘久痛，痛经，产后腹痛", "d": "煎服10~15g，或入丸散剂", "sp": "", "w": "", "ap": "", "m": "荔枝核：疝气，睾丸肿痛", "k": "荔枝核治疝气痛，行气散结散寒用。"}, {"id": 190, "ch": "理气药", "sec": "理气药", "n": "佛手", "f": "疏肝解郁，理气和中，燥湿化痰", "a": "1.肝郁胸胁胀痛；2.气滞脘腹疼痛；3.久咳痰多，胸闷作痛", "d": "煎服3~10g", "sp": "", "w": "", "ap": "", "m": "佛手：疏肝理气和胃，化痰", "k": "佛手疏肝解郁气，和中化痰咳呕宜。"}, {"id": 191, "ch": "理气药", "sec": "理气药", "n": "香橼", "f": "疏肝解郁，理气宽中，化痰止咳", "a": "1.肝郁胸胁胀痛；2.气滞脘腹疼痛；3.痰饮咳嗽，胸膈不利", "d": "煎服3~10g", "sp": "", "w": "", "ap": "", "m": "香橼：理气宽中，化痰", "k": "香橼疏肝理气宽，化痰止咳胸胁安。"}, {"id": 192, "ch": "理气药", "sec": "理气药", "n": "玫瑰花", "f": "行气解郁，活血止痛", "a": "1.肝胃气痛；2.月经不调，经前乳房胀痛；3.跌打伤痛", "d": "煎服3~6g", "sp": "", "w": "", "ap": "", "m": "玫瑰花：行气解郁，活血", "k": "玫瑰行气解郁闷，活血止痛肝胃平。"}, {"id": 193, "ch": "理气药", "sec": "理气药", "n": "绿萼梅", "f": "疏肝和胃，理气化痰", "a": "1.肝胃气滞之胁肋胀痛、脘腹痞痛、嗳气纳呆；2.梅核气证", "d": "煎服3~6g", "sp": "", "w": "", "ap": "", "m": "绿萼梅：疏肝和胃，梅核气", "k": "绿萼疏肝和胃气，梅核气证最相宜。"}, {"id": 194, "ch": "理气药", "sec": "理气药", "n": "薤白", "f": "通阳散结，行气导滞", "a": "1.胸痹证（治胸痹要药）；2.脘腹痞满胀痛，泻痢里急后重", "d": "煎服5~10g", "sp": "", "w": "", "ap": "", "m": "薤白：胸痹要药，通阳散结", "k": "薤白通阳散结宜，胸痹要药行气滞。"}, {"id": 195, "ch": "理气药", "sec": "理气药", "n": "青木香", "f": "行气止痛，解毒，辟秽，消肿", "a": "1.肝胃气滞之胸胁胀痛、脘腹疼痛；2.泻痢腹痛；3.疔疮肿毒，皮肤湿疮，毒蛇咬伤", "d": "煎服3~10g；散剂每次1.5~2g；外用适量", "sp": "散剂用开水送服", "w": "不宜多服，过量可引起恶心、呕吐等胃肠道反应", "ap": "", "m": "青木香：行气止痛，解毒（含马兜铃酸）", "k": "青木行气止痛安，解毒消肿肾损防。"}, {"id": 196, "ch": "理气药", "sec": "理气药", "n": "大腹皮", "f": "行气导滞，利水消肿", "a": "1.胃肠气滞，脘腹胀闷，大便不爽；2.水肿，脚气肿痛", "d": "煎服5~10g", "sp": "", "w": "", "ap": "", "m": "大腹皮：行气+利水（水肿）", "k": "腹皮行气导滞好，利水消肿胀满消。"}, {"id": 197, "ch": "理气药", "sec": "理气药", "n": "柿蒂", "f": "降气止呃", "a": "呃逆证（止呃要药，寒热均可配伍应用）", "d": "煎服6~10g", "sp": "", "w": "", "ap": "", "m": "柿蒂：降气止呃要药", "k": "柿蒂降气止呃逆，专治呃逆无出其。"}, {"id": 198, "ch": "理气药", "sec": "理气药", "n": "刀豆", "f": "降气止呃，温肾助阳", "a": "1.呃逆，呕吐；2.肾虚腰痛", "d": "煎服10~15g", "sp": "", "w": "", "ap": "", "m": "刀豆：降气止呃，温肾", "k": "刀豆降气止呃好，温肾助阳也相交。"}, {"id": 199, "ch": "理气药", "sec": "理气药", "n": "甘松", "f": "行气止痛，开郁醒脾", "a": "1.寒凝气滞之脘腹胀痛、不思饮食；2.湿脚气（煎汤外洗）", "d": "煎服3~6g；外用适量", "sp": "", "w": "", "ap": "", "m": "甘松：行气止痛，开郁醒脾", "k": "甘松行气止痛安，开郁醒脾胃口宽。"}, {"id": 200, "ch": "理气药", "sec": "理气药", "n": "九香虫", "f": "理气止痛，温肾助阳", "a": "1.肝胃气痛，胸胁脘腹胀痛；2.肾阳不足之阳痿、腰膝冷痛", "d": "煎服3~10g", "sp": "", "w": "", "ap": "", "m": "九香虫：理气止痛，温肾助阳", "k": "九香理气止痛安，温肾助阳阳痿痊。"}, {"id": 201, "ch": "消食药", "sec": "消食药", "n": "山楂", "f": "消食化积，行气散瘀", "a": "1.饮食积滞证（消油腻肉食积滞要药）；2.泻痢腹痛，疝气痛；3.瘀阻胸腹痛，痛经；现代用于冠心病、高血压病、高脂血症", "d": "煎服10~15g；大剂量30g", "sp": "生山楂用于消食散瘀，焦山楂用于止泻止痢", "w": "", "ap": "", "m": "山楂：消肉食积，行气散瘀，高脂血症", "k": "山楂消食化肉积，行气散瘀血脂宜。"}, {"id": 202, "ch": "消食药", "sec": "消食药", "n": "神曲", "f": "消食和胃", "a": "饮食积滞证；此外丸剂中有金石、贝壳类药物者，可用本品糊丸以助消化", "d": "煎服6~15g", "sp": "", "w": "", "ap": "", "m": "神曲：消食和胃，米面食滞", "k": "神曲消食又和胃，米面积滞用之对。"}, {"id": 203, "ch": "消食药", "sec": "消食药", "n": "麦芽", "f": "消食健胃，回乳消胀", "a": "1.米面薯芋食滞证；2.断乳，乳房胀痛；此外兼能疏肝解郁", "d": "煎服10~15g；大剂量30~120g", "sp": "生麦芽功偏消食健胃，炒用多用于回乳消胀", "w": "授乳期妇女不宜使用", "ap": "", "m": "麦芽：消米面食积，回乳（生麦芽通乳）", "k": "麦芽消食米面积，回乳消胀妙无比。"}, {"id": 204, "ch": "消食药", "sec": "消食药", "n": "谷芽", "f": "消食健胃", "a": "米面薯芋食滞证及脾虚食少（功似麦芽而力较缓，每相须为用）", "d": "煎服10~15g；大剂量30g", "sp": "生用长于和中，炒用偏于消食", "w": "", "ap": "", "m": "谷芽：消米面食积，功似麦芽但力缓", "k": "谷芽消食功似麦，健胃之力更和缓。"}, {"id": 205, "ch": "消食药", "sec": "消食药", "n": "莱菔子", "f": "消食除胀，降气化痰", "a": "1.食积气滞证；2.咳喘痰多，胸闷食少", "d": "煎服6~10g", "sp": "生用吐风痰，炒用消食下气化痰", "w": "辛散耗气，气虚及无食积、痰滞者慎用；不宜与人参同用", "ap": "", "m": "莱菔子：消食除胀，降气化痰，不宜与人参同用", "k": "莱菔消食除胀满，降气化痰咳喘缓。"}, {"id": 206, "ch": "消食药", "sec": "消食药", "n": "鸡内金", "f": "消食健胃，涩精止遗", "a": "1.饮食积滞，小儿疳积；2.肾虚遗精，遗尿；3.砂石淋证，胆结石", "d": "煎服3~10g；研末服，每次1.5~3g", "sp": "研末用效果比煎剂好", "w": "", "ap": "", "m": "鸡内金：消食，涩精止遗，消结石", "k": "内金消食健脾胃，涩精止遗砂石退。"}, {"id": 207, "ch": "消食药", "sec": "消食药", "n": "鸡矢藤", "f": "消食健胃，化痰止咳，清热解毒，止痛", "a": "1.饮食积滞，小儿疳积；2.热痰咳嗽；3.热毒泻痢，咽喉肿痛，痈疮疖肿，烫火伤；4.多种痛证", "d": "煎服15~60g；外用适量", "sp": "外用捣敷或煎水洗", "w": "", "ap": "", "m": "鸡矢藤：消食，止痛", "k": "矢藤消食又健胃，化痰解毒止痛对。"}, {"id": 208, "ch": "驱虫药", "sec": "驱虫药", "n": "使君子", "f": "驱虫消积", "a": "1.蛔虫证，蛲虫证；2.小儿疳疾", "d": "煎服10~15g；炒香嚼服6~9g；小儿每岁每日1~1.5粒，总量不超过20粒", "sp": "空腹服用，每日1次，连用3天；可炒香嚼服", "w": "大量服用可致呃逆、眩晕、呕吐、腹泻等反应；与热茶同服亦能引起呃逆、腹泻，故服用时当忌饮茶", "ap": "", "m": "使君子：蛔虫，小儿疳积，忌热茶", "k": "君子杀虫亦消积，小儿疳积最相宜。"}, {"id": 209, "ch": "驱虫药", "sec": "驱虫药", "n": "苦楝皮", "f": "杀虫，疗癣", "a": "1.蛔虫、钩虫、蛲虫病；2.疥癣，湿疮（外用）", "d": "煎服6~9g，鲜品15~30g；外用适量", "sp": "有效成分难溶于水，需文火久煎", "w": "有毒，不宜过量或持续服用", "ap": "", "m": "苦楝皮：杀蛔虫，疗癣，有毒", "k": "苦楝杀虫疗癣奇，有毒肝病须避之。"}, {"id": 210, "ch": "驱虫药", "sec": "驱虫药", "n": "槟榔", "f": "驱虫消积，行气利水", "a": "1.多种肠道寄生虫病（绦虫、钩虫、蛔虫、蛲虫、姜片虫，以治绦虫最佳）；2.食积气滞，泻痢后重；3.水肿，脚气肿痛；此外有截疟作用，治疟疾寒热久发不止", "d": "煎服6~15g；单用驱杀绦虫、姜片虫时可用60~120g", "sp": "驱绦虫、姜片虫须用大量（60~120g）", "w": "脾虚便溏或气虚下陷者忌用", "ap": "", "m": "槟榔：驱虫+行气+利水，绦虫首选", "k": "槟榔杀虫消积滞，行气利水脚气宜。"}, {"id": 211, "ch": "驱虫药", "sec": "驱虫药", "n": "南瓜子", "f": "杀虫", "a": "绦虫病（常与槟榔同用）；此外亦可治血吸虫病，但须较大剂量、长期服用", "d": "研粉60~120g", "sp": "研粉，冷开水调服", "w": "", "ap": "", "m": "南瓜子：杀绦虫", "k": "南瓜子专杀绦虫，同用槟榔效更宏。"}, {"id": 212, "ch": "驱虫药", "sec": "驱虫药", "n": "鹤草芽", "f": "杀虫", "a": "绦虫病", "d": "研粉吞服，每次30~45g；小儿0.7~0.8g/kg", "sp": "每日一次，早起空腹服用", "w": "不宜入煎剂，有效成分几乎不溶于水", "ap": "", "m": "鹤草芽：杀绦虫，研粉吞服", "k": "鹤草芽驱绦虫佳，研粉吞服要记下。"}, {"id": 213, "ch": "驱虫药", "sec": "驱虫药", "n": "雷丸", "f": "杀虫", "a": "绦虫病、钩虫病、蛔虫病（驱绦虫为主）", "d": "入丸散，每次6~15g；驱绦虫每次12~18g", "sp": "日服3次，冷开水调服，连用3天", "w": "不宜入煎剂；因含蛋白酶，加热60℃左右即易于破坏而失效", "ap": "", "m": "雷丸：杀绦虫，不宜入煎剂", "k": "雷丸杀虫绦虫灭，入丸散剂不煎熬。"}, {"id": 214, "ch": "驱虫药", "sec": "驱虫药", "n": "鹤虱", "f": "杀虫消积", "a": "蛔虫、蛲虫、绦虫等虫积腹痛，小儿疳积", "d": "煎服5~15g", "sp": "", "w": "", "ap": "", "m": "鹤虱：杀虫，蛔虫蛲虫", "k": "鹤虱杀虫消积滞，虫积腹痛可相宜。"}, {"id": 215, "ch": "驱虫药", "sec": "驱虫药", "n": "榧子", "f": "杀虫消积，通便，润肺", "a": "1.虫积腹痛；2.肠燥便秘；3.肺燥咳嗽", "d": "煎服15~30g；炒熟嚼服，一次用15g", "sp": "入煎剂宜生用；可炒熟嚼服", "w": "大便溏薄者不宜用", "ap": "", "m": "榧子：杀虫+润肺通便", "k": "榧子杀虫消积好，润肺通便也有效。"}, {"id": 216, "ch": "驱虫药", "sec": "驱虫药", "n": "芜荑", "f": "杀虫消积", "a": "虫积腹痛，小儿疳积", "d": "煎服3~10g；入丸散，每次2~3g", "sp": "", "w": "脾胃虚弱者慎用", "ap": "", "m": "芜荑：杀虫消积", "k": "芜荑杀虫消积好，虫积腹痛疳积疗。"}, {"id": 217, "ch": "止血药", "sec": "凉血止血药", "n": "大蓟", "f": "凉血止血，散瘀解毒消痈", "a": "1.血热妄行所致的吐血、咯血、衄血、崩漏、尿血等；2.热毒痈肿", "d": "煎服10~15g，鲜品可用30~60g；外用适量", "sp": "外用捣敷患处", "w": "", "ap": "", "m": "大蓟：凉血止血，散瘀消痈，大蓟更善消痈", "k": "大蓟凉血止血强，散瘀解毒消痈疮。"}, {"id": 218, "ch": "止血药", "sec": "凉血止血药", "n": "小蓟", "f": "凉血止血，散瘀解毒消痈", "a": "与大蓟主治相同，常配伍同用；但小蓟兼有利尿作用，以治尿血、血淋尤宜", "d": "同大蓟", "sp": "", "w": "", "ap": "", "m": "小蓟：凉血止血，尿血要药", "k": "小蓟尿血最相宜，凉血散瘀痈毒祛。"}, {"id": 219, "ch": "止血药", "sec": "凉血止血药", "n": "地榆", "f": "凉血止血，解毒敛疮", "a": "1.各种热性出血证，如吐血、咯血、衄血、便血、崩漏及血痢等（下焦出血尤宜）；2.烫伤、湿疹及疮疡痈肿等（治烫伤要药）", "d": "煎服10~15g；外用适量", "sp": "治烫伤可研末麻油调敷", "w": "", "ap": "", "m": "地榆：下焦血热，烧烫伤要药", "k": "地榆凉血止下焦，解毒敛疮烫伤消。"}, {"id": 220, "ch": "止血药", "sec": "凉血止血药", "n": "槐花", "f": "凉血止血，清肝火", "a": "1.血热出血证（便血、痔血尤宜）；2.肝火上炎之目赤、头胀头痛", "d": "煎服10~15g", "sp": "止血炒炭用，清热泻火生用", "w": "", "ap": "槐角：槐的果实，性味功效与槐花相似，止血作用较槐花弱而有润肠之功，主要用于痔血、便血、便秘目赤，煎服10~15g，孕妇慎用", "m": "槐花：便血、痔血，清肝", "k": "槐花凉血止便血，清肝泻火目赤灭。"}, {"id": 221, "ch": "止血药", "sec": "凉血止血药", "n": "侧柏叶", "f": "凉血止血，化痰止咳", "a": "1.各种出血证（血热者尤宜）；2.肺热咳嗽，痰稠难咯；此外外用治脱发、烫伤", "d": "煎服10~15g；外用适量", "sp": "止血多炒炭用，化痰止咳生用", "w": "", "ap": "", "m": "侧柏叶：凉血止血，化痰", "k": "侧柏凉血止血良，化痰止咳也相帮。"}, {"id": 222, "ch": "止血药", "sec": "凉血止血药", "n": "白茅根", "f": "凉血止血，清热利尿", "a": "1.血热妄行的出血证（尿血尤宜）；2.热淋，水肿，黄疸；此外治胃热呕吐、肺热咳嗽", "d": "煎服15~30g，鲜品加倍", "sp": "以鲜品为佳，可捣汁服；多生用，止血亦可炒炭用", "w": "", "ap": "", "m": "白茅根：凉血、止血、利尿", "k": "茅根凉血止血好，清热利尿水肿消。"}, {"id": 223, "ch": "止血药", "sec": "凉血止血药", "n": "苎麻根", "f": "凉血止血，安胎，解毒", "a": "1.血热出血证；2.胎动不安，胎漏下血；3.热毒痈肿", "d": "煎服10~30g；外用适量", "sp": "外用捣敷", "w": "", "ap": "", "m": "苎麻根：止血+安胎", "k": "苎麻凉血止血安，安胎解毒胎动痊。"}, {"id": 224, "ch": "止血药", "sec": "凉血止血药", "n": "羊蹄", "f": "凉血止血，解毒杀虫，泻下", "a": "1.血热出血证；2.疥癣，疮疡，烫伤；3.大便秘结", "d": "煎服10~15g，鲜品30~45g；外用适量", "sp": "", "w": "", "ap": "", "m": "羊蹄：凉血止血，解毒杀虫", "k": "羊蹄凉血止血宜，解毒杀虫泻下奇。"}, {"id": 225, "ch": "止血药", "sec": "化瘀止血药", "n": "三七", "f": "化瘀止血，活血定痛", "a": "1.各种内外出血证，尤以有瘀者为宜（止血不留瘀）；2.跌打损伤，瘀滞疼痛（伤科要药）；此外近年用治冠心病心绞痛、缺血性脑血管病、脑出血后遗症及血瘀型慢性肝炎", "d": "多研末服，每次1~1.5g；亦可入煎剂3~10g；外用适量", "sp": "多研末吞服；外用研末外掺或调敷", "w": "", "ap": "", "m": "三七：止血神药，化瘀不留瘀，散瘀定痛", "k": "三七止血化瘀妙，散瘀定痛伤科宝。"}, {"id": 226, "ch": "止血药", "sec": "化瘀止血药", "n": "茜草", "f": "凉血化瘀止血，通经", "a": "1.血热夹瘀的出血证，如吐血、衄血、崩漏、尿血、便血等；2.血瘀经闭及跌打损伤、风湿痹痛等", "d": "煎服10~15g", "sp": "止血炒炭用，活血通经生用或酒炒用", "w": "", "ap": "", "m": "茜草：凉血化瘀止血，通经", "k": "茜草凉血化瘀血，止血通经相兼得。"}, {"id": 227, "ch": "止血药", "sec": "化瘀止血药", "n": "蒲黄", "f": "化瘀止血，利尿", "a": "1.各种内外出血证（寒热均可）；2.瘀滞心腹疼痛、痛经、产后瘀痛；3.血淋尿血", "d": "煎服3~10g；外用适量", "sp": "布包煎；止血多炒用，散瘀多生用", "w": "孕妇忌服", "ap": "", "m": "蒲黄：化瘀止血利尿，包煎", "k": "蒲黄化瘀止血好，利尿通淋包煎妙。"}, {"id": 228, "ch": "止血药", "sec": "化瘀止血药", "n": "花蕊石", "f": "化瘀止血", "a": "吐血、咯血等出血兼瘀滞者及外伤出血等", "d": "煎服10~15g；研末服，每次1~1.5g；外用适量", "sp": "打碎先煎", "w": "内无瘀滞者慎用；孕妇忌服", "ap": "", "m": "花蕊石：化瘀止血", "k": "花蕊化瘀止血功，吐衄崩漏可相从。"}, {"id": 229, "ch": "止血药", "sec": "化瘀止血药", "n": "降香", "f": "化瘀止血，理气止痛", "a": "1.瘀滞性出血证，跌打损伤及内外伤出血；2.血瘀气滞之胸胁心腹疼痛及跌损瘀痛；此外能辟秽化浊、和中止呕", "d": "煎服3~6g；研末服，每次1~2g；外用适量", "sp": "宜后下", "w": "", "ap": "", "m": "降香：化瘀止血+理气止痛", "k": "降香化瘀止血良，理气止痛胸胁畅。"}, {"id": 230, "ch": "止血药", "sec": "收敛止血药", "n": "白及", "f": "收敛止血，消肿生肌", "a": "1.内外诸出血证，如咯血、衄血、吐血、便血及外伤出血（肺胃出血尤宜）；2.痈肿，烫伤，手足皲裂，肛裂", "d": "煎服3~10g；散剂每次2~5g；外用适量", "sp": "", "w": "反乌头", "ap": "", "m": "白及：收敛止血，肺胃出血，消肿生肌，反乌头", "k": "白及收敛止血好，消肿生肌肺胃疗。"}, {"id": 231, "ch": "止血药", "sec": "收敛止血药", "n": "仙鹤草", "f": "收敛止血，补虚，消积，止痢，杀虫", "a": "1.多种出血证（寒热虚实均可）；2.脱力劳伤，神疲乏力；3.小儿疳积；4.泻痢；5.滴虫性阴道炎，疟疾", "d": "煎服10~15g；大剂可用30~60g；外用适量", "sp": "", "w": "", "ap": "", "m": "仙鹤草：止血+补虚+止痢+杀虫", "k": "仙鹤止血补虚强，消积止痢杀虫良。"}, {"id": 232, "ch": "止血药", "sec": "收敛止血药", "n": "紫珠", "f": "收敛止血，清热解毒", "a": "1.各种内外伤出血（肺胃出血尤宜）；2.烧烫伤，疮疡肿毒", "d": "煎服10~15g；研末服1.5~3g；外用适量", "sp": "", "w": "", "ap": "", "m": "紫珠：收敛止血，清热解毒", "k": "紫珠收敛止血安，清热解毒创伤痊。"}, {"id": 233, "ch": "止血药", "sec": "收敛止血药", "n": "棕榈炭", "f": "收敛止血", "a": "多种出血证，如吐血、衄血、崩漏、便血、尿血等，尤多用于崩漏，以无瘀滞者为宜", "d": "煎服3~10g；研末服1~1.5g", "sp": "", "w": "瘀滞之出血忌用", "ap": "", "m": "棕榈炭：收敛止血", "k": "棕榈收敛止血功，崩漏出血可相从。"}, {"id": 234, "ch": "止血药", "sec": "收敛止血药", "n": "血余炭", "f": "收敛止血，化瘀利尿", "a": "1.衄血、咯血、吐血、崩漏、便血、尿血、淋血等；2.小便不利", "d": "煎服6~10g；研末服1.5~3g", "sp": "", "w": "", "ap": "", "m": "血余炭：收敛止血，化瘀利尿", "k": "血余收敛止血强，化瘀利尿功效长。"}, {"id": 235, "ch": "止血药", "sec": "收敛止血药", "n": "藕节", "f": "收敛止血", "a": "各种出血，如吐血、咳血、衄血、便血、崩漏等（兼能化瘀，止血而不留瘀）", "d": "煎服10~15g", "sp": "", "w": "", "ap": "", "m": "藕节：收敛止血", "k": "藕节收敛止血宜，吐衄咯血可相依。"}, {"id": 236, "ch": "止血药", "sec": "收敛止血药", "n": "刺猬皮", "f": "收敛止血，固精缩尿，化瘀止痛", "a": "1.便血，痔血；2.遗精，遗尿；3.胃痛，呕吐", "d": "煎服3~10g；研末服1.5~3g", "sp": "", "w": "", "ap": "", "m": "刺猬皮：收敛止血，固精缩尿", "k": "刺猬收敛止血强，固精缩尿化瘀良。"}, {"id": 237, "ch": "止血药", "sec": "温经止血药", "n": "炮姜", "f": "温经止血，温中止痛", "a": "1.虚寒性出血证（吐血、便血、崩漏）；2.虚寒腹痛、腹泻", "d": "煎服3~6g", "sp": "炮姜未成炭者偏于温中散寒，主要用于虚寒腹痛腹泻；炮姜炭则专于温经止血，宜于血证", "w": "", "ap": "", "m": "炮姜：温经止血，虚寒出血", "k": "炮姜温经止血宜，虚寒出血腹痛医。"}, {"id": 238, "ch": "止血药", "sec": "温经止血药", "n": "艾叶", "f": "温经止血，散寒调经，安胎", "a": "1.虚寒性出血证（崩漏尤宜）；2.月经不调，痛经，宫冷不孕；3.胎动不安；此外煎汤外洗治湿疹瘙痒，制艾条、艾炷用于温灸，并可治寒性咳喘", "d": "煎服3~10g；外用适量", "sp": "温经止血宜炒炭用，余则生用；治咳喘入煎宜后下", "w": "", "ap": "", "m": "艾叶：温经止血，调经安胎，虚寒妇科要药", "k": "艾叶温经止血强，散寒调经安胎良。"}, {"id": 239, "ch": "止血药", "sec": "温经止血药", "n": "灶心土", "f": "温中止血，止呕，止泻", "a": "1.脾气虚寒不能统血之吐血、便血；2.胃寒呕吐，妊娠恶阻；3.脾虚久泻", "d": "煎服15~30g；或用60~120g", "sp": "布包先煎；或大量煎汤代水", "w": "", "ap": "", "m": "灶心土：温中止血，止呕止泻，先煎代水", "k": "灶心温中止血好，止呕止泻先煎妙。"}, {"id": 240, "ch": "活血化瘀药", "sec": "活血止痛药", "n": "川芎", "f": "活血行气，祛风止痛", "a": "1.血瘀气滞的痛证（\"血中气药\"，月经不调、经闭痛经、产后瘀痛、胸痹心痛、胁痛、跌打损伤）；2.头痛（治头痛要药），风湿痹痛", "d": "煎服3~10g", "sp": "", "w": "凡阴虚火旺、多汗及月经过多者应慎用", "ap": "", "m": "川芎：血中气药，头痛要药，行气活血", "k": "川芎活血又行气，祛风止痛头痛医。"}, {"id": 241, "ch": "活血化瘀药", "sec": "活血止痛药", "n": "延胡索", "f": "活血，行气，止痛", "a": "主要用于气血瘀滞诸痛证（\"专治一身上下诸痛\"）", "d": "煎服3~10g；研末服1.5~3g", "sp": "多醋制后用，醋制后可使有效成分溶解度大大提高而加强止痛药效", "w": "", "ap": "", "m": "延胡索：止痛，行气活血，诸痛皆宜", "k": "延胡活血行气强，诸痛皆宜止痛良。"}, {"id": 242, "ch": "活血化瘀药", "sec": "活血止痛药", "n": "郁金", "f": "活血行气止痛，解郁清心，利胆退黄，凉血", "a": "1.气滞血瘀的胸、胁、腹痛；2.热病神昏，癫痫痰闭；3.肝胆湿热黄疸、胆石症；4.吐血、衄血、倒经、尿血、血淋", "d": "煎服5~12g；研末服2~5g", "sp": "", "w": "畏丁香", "ap": "", "m": "郁金：活血行气，利胆，凉血，畏丁香", "k": "郁金活血行气痛，解郁清心退黄用。"}, {"id": 243, "ch": "活血化瘀药", "sec": "活血止痛药", "n": "姜黄", "f": "活血行气，通经止痛", "a": "1.血瘀气滞的心、腹、胸、胁痛，经闭，产后腹痛及跌打损伤；2.风湿痹痛（尤长于行肢臂）", "d": "煎服3~10g；外用适量", "sp": "", "w": "", "ap": "", "m": "姜黄：偏于上肢肩臂痛，破血行气", "k": "姜黄活血行气好，通经止痛臂痛疗。"}, {"id": 244, "ch": "活血化瘀药", "sec": "活血止痛药", "n": "乳香", "f": "活血行气止痛，消肿生肌", "a": "1.外伤科跌打损伤，疮疡痈肿；2.瘀血阻滞诸痛证，如心腹瘀痛、癥瘕积聚及风湿痹痛等", "d": "煎服3~10g；外用适量", "sp": "宜炒去油用；外用生用或炒用，研末外敷", "w": "孕妇及无瘀滞者忌用；气浊味苦，易致恶心呕吐，内服不宜多用，胃弱者慎用", "ap": "", "m": "乳香：消肿生肌，内服外用，没药常配", "k": "乳香活血行气痛，消肿生肌疮痈用。"}, {"id": 245, "ch": "活血化瘀药", "sec": "活血止痛药", "n": "没药", "f": "活血止痛，消肿生肌", "a": "功效主治与乳香相似：跌打损伤瘀滞肿痛，外科痈疽肿痛，疮疡溃后久不收口以及一切瘀滞痛证，常与乳香相须为用", "d": "用法用量同乳香", "sp": "", "w": "与乳香同；如与乳香同用，两药用量皆须相应减少", "ap": "", "m": "没药：活血止痛，消肿生肌，与乳香同用", "k": "没药活血止痛强，消肿生肌乳香帮。"}, {"id": 246, "ch": "活血化瘀药", "sec": "活血止痛药", "n": "五灵脂", "f": "活血止痛，化瘀止血", "a": "1.瘀血阻滞诸痛证（胸胁脘腹刺痛、痛经、经闭、产后瘀痛）；2.瘀滞出血证（崩漏、月经过多）", "d": "煎服3~10g；外用适量", "sp": "包煎，或入丸、散用", "w": "血虚无瘀及孕妇慎用；\"十九畏\"认为人参畏五灵脂，一般不宜同用", "ap": "", "m": "五灵脂：活血止痛，化瘀止血，包煎，人参畏五灵脂", "k": "灵脂活血止痛强，化瘀止血包煎良。"}, {"id": 247, "ch": "活血化瘀药", "sec": "活血调经药", "n": "丹参", "f": "活血调经，凉血消痈，安神", "a": "1.妇女月经不调，痛经，经闭，产后瘀滞腹痛；2.血瘀之心胸、脘腹疼痛及癥瘕积聚、风湿痹痛等；3.疮疡痈肿；4.热病烦躁昏迷及杂病心悸失眠等", "d": "煎服5~15g", "sp": "活血化瘀宜酒炙用", "w": "反藜芦", "ap": "", "m": "丹参：一味丹参，功同四物；活血，凉血消痈，安神，反藜芦", "k": "丹参活血调经好，凉血消痈安神巧。"}, {"id": 248, "ch": "活血化瘀药", "sec": "活血调经药", "n": "红花", "f": "活血通经，祛瘀止痛", "a": "1.血滞经闭、痛经、产后瘀滞腹痛等证；2.癥瘕积聚，心腹瘀痛及跌打损伤、血脉闭塞紫肿疼痛等；3.斑疹色暗、热郁血瘀者", "d": "煎服3~9g；外用适量", "sp": "", "w": "孕妇忌服；有出血倾向者不宜多用", "ap": "番红花：功效与红花相似而力较强，性凉兼能凉血解毒，尤宜于斑疹大热、温病热入营血，用量宜小（1.5~3g）", "m": "红花：活血通经，祛瘀止痛，孕妇忌", "k": "红花活血通经好，祛瘀止痛孕妇少。"}, {"id": 249, "ch": "活血化瘀药", "sec": "活血调经药", "n": "桃仁", "f": "活血祛瘀，润肠通便", "a": "1.多种瘀血证，如经闭、痛经、产后瘀滞腹痛、癥积及跌打损伤等；2.肺痈、肠痈；3.肠燥便秘；此外能止咳平喘", "d": "煎服5~10g", "sp": "宜捣碎入煎", "w": "孕妇忌服；便溏者慎用；有毒，不可过量，过量可出现头痛、目眩、心悸，甚至呼吸衰竭而死亡", "ap": "", "m": "桃仁：活血祛瘀，润肠通便，苦杏仁止咳平喘", "k": "桃仁活血祛瘀强，润肠通便妙非常。"}, {"id": 250, "ch": "活血化瘀药", "sec": "活血调经药", "n": "益母草", "f": "活血调经，利水消肿", "a": "1.血滞经闭、痛经、经行不畅、产后瘀滞腹痛、恶露不尽等（妇科经产要药）；2.水肿，小便不利；此外用于跌打损伤、疮痈肿毒、皮肤痒疹", "d": "煎服10~30g，或熬膏、入丸剂；外用适量", "sp": "外用捣敷或煎水外洗", "w": "孕妇忌服；血虚无瘀者慎用", "ap": "", "m": "益母草：妇科经产要药，活血+利水", "k": "益母活血调经强，利水消肿妇科良。"}, {"id": 251, "ch": "活血化瘀药", "sec": "活血调经药", "n": "泽兰", "f": "活血祛瘀，调经，利水消肿", "a": "1.妇科血瘀经闭、痛经、产后瘀滞腹痛等；2.跌打损伤瘀肿疼痛及痈肿等；3.产后水肿、浮肿、腹水等", "d": "煎服10~15g；外用适量", "sp": "", "w": "无瘀滞者慎服", "ap": "", "m": "泽兰：活血，调经，利水", "k": "泽兰活血祛瘀强，调经利水可相帮。"}, {"id": 252, "ch": "活血化瘀药", "sec": "活血调经药", "n": "牛膝", "f": "活血通经，补肝肾，强筋骨，利水通淋，引火（血）下行", "a": "1.瘀血阻滞的经闭、痛经、月经不调、产后腹痛及跌打伤痛；2.肾虚腰痛及久痹腰膝酸痛乏力；3.淋证、水肿、小便不利；4.头痛、眩晕、齿痛、口舌生疮及吐血、衄血（火热上炎、阴虚火旺）", "d": "煎服6~15g", "sp": "活血通经、利水通淋、引火下行宜生用；补肝肾强筋骨宜酒炙用", "w": "孕妇及月经过多者忌用；肾虚滑精、脾虚溏泄者亦不宜用", "ap": "", "m": "牛膝：活血通经，补肝肾，引血下行，川牛膝偏活血", "k": "牛膝活血通经强，补肝强骨引下良。"}, {"id": 253, "ch": "活血化瘀药", "sec": "活血调经药", "n": "鸡血藤", "f": "行血补血，调经，舒筋活络", "a": "1.月经不调、经行不畅、痛经、血虚经闭等证；2.风湿痹痛及手足麻木、肢体瘫痪、血虚萎黄等", "d": "煎服10~15g；大剂量可用30g", "sp": "或浸酒服，或熬成膏服", "w": "", "ap": "", "m": "鸡血藤：补血+活血", "k": "鸡血行血又补血，调经舒筋络通彻。"}, {"id": 254, "ch": "活血化瘀药", "sec": "活血调经药", "n": "王不留行", "f": "活血通经，下乳，消痈，利尿通淋", "a": "1.血瘀经闭、痛经等证；2.产后乳汁不下，乳痈；3.热淋、血淋、石淋等证", "d": "煎服5~10g", "sp": "", "w": "孕妇慎用", "ap": "", "m": "王不留行：下乳要药，通经", "k": "王不留行下乳通，活血通经消痈功。"}, {"id": 255, "ch": "活血化瘀药", "sec": "活血调经药", "n": "月季花", "f": "活血调经，疏肝解郁，消肿解毒", "a": "1.肝郁血滞之月经不调、痛经、闭经及胸胁胀痛；2.跌打损伤，痈疽肿毒，瘰疬", "d": "煎服2~5g；外用适量", "sp": "不宜久煎，亦可泡服，或研末服", "w": "用量不宜过大，过量可引起腹痛，多服久服可引起便溏腹泻；孕妇亦当慎用", "ap": "", "m": "月季花：活血调经", "k": "月季活血调经好，疏肝解郁肿毒消。"}, {"id": 256, "ch": "活血化瘀药", "sec": "活血调经药", "n": "凌霄花", "f": "破瘀通经，凉血祛风", "a": "1.血瘀经闭、癥瘕积聚及跌打损伤；2.风疹、皮癣、皮肤瘙痒、痤疮", "d": "煎服3~10g；外用适量", "sp": "", "w": "孕妇忌服", "ap": "", "m": "凌霄花：破瘀通经", "k": "凌霄破瘀通经强，凉血祛风功效长。"}, {"id": 257, "ch": "活血化瘀药", "sec": "活血疗伤药", "n": "䗪虫（土鳖虫）", "f": "破血逐瘀，续筋接骨", "a": "1.跌打损伤，筋伤骨折，瘀肿疼痛（伤科常用）；2.血瘀经闭，产后瘀滞腹痛，积聚痞块", "d": "煎服3~10g；研末服1~1.5g；外用适量", "sp": "研末服以黄酒送服为佳", "w": "孕妇忌服", "ap": "", "m": "土鳖虫：破血逐瘀，续筋接骨", "k": "土鳖破血逐瘀强，续筋接骨伤科良。"}, {"id": 258, "ch": "活血化瘀药", "sec": "活血疗伤药", "n": "自然铜", "f": "散瘀止痛，接骨疗伤", "a": "跌打损伤，骨折筋断，瘀肿疼痛（伤科接骨续筋要药）", "d": "煎服10~15g；醋淬研末服，每次0.3g", "sp": "多入丸散，醋淬研末服", "w": "不宜久服；凡阴虚火旺、血虚无瘀者应慎用", "ap": "", "m": "自然铜：接骨疗伤要药，先煎", "k": "自然铜散瘀止痛，接骨疗伤先煎用。"}, {"id": 259, "ch": "活血化瘀药", "sec": "活血疗伤药", "n": "苏木", "f": "活血疗伤，祛瘀通经", "a": "1.跌打损伤，骨折筋伤，瘀滞肿痛；2.血滞经闭，产后瘀阻腹痛，痛经，心腹疼痛，痈肿疮毒等", "d": "煎服3~10g；外用适量", "sp": "外用研末撒", "w": "", "ap": "", "m": "苏木：活血疗伤，祛瘀通经", "k": "苏木活血疗伤强，祛瘀通经痛能防。"}, {"id": 260, "ch": "活血化瘀药", "sec": "活血疗伤药", "n": "骨碎补", "f": "活血续伤，补肾强骨", "a": "1.跌打损伤或创伤，筋骨损伤，瘀滞肿痛；2.肾虚腰痛脚弱，耳鸣耳聋，牙痛，久泄；此外外用治斑秃、白癜风", "d": "煎服10~15g；外用适量", "sp": "", "w": "阴虚内热或无瘀血者慎服", "ap": "", "m": "骨碎补：活血续伤，补肾强骨", "k": "骨碎活血续伤强，补肾强骨功效良。"}, {"id": 261, "ch": "活血化瘀药", "sec": "活血疗伤药", "n": "马钱子", "f": "散结消肿，通络止痛", "a": "1.跌打损伤，骨折肿痛；2.痈疽疮毒，咽喉肿痛；3.风湿顽痹，麻木瘫痪", "d": "日服0.3~0.6g；外用适量", "sp": "内服宜制，多入丸散；外用研末调涂", "w": "内服不可多服久服，且需砂烫至鼓起并呈棕褐色或深棕色方可入药；孕妇禁用；过量中毒可引起肢体颤动、惊厥、呼吸困难，甚至昏迷", "ap": "", "m": "马钱子：通络止痛，有大毒，炮制后入丸散", "k": "马钱散结消肿痛，通络止痛毒要重。"}, {"id": 262, "ch": "活血化瘀药", "sec": "活血疗伤药", "n": "血竭", "f": "活血疗伤，止血生肌", "a": "1.跌打损伤，瘀滞心腹疼痛；2.外伤出血；3.疮疡不敛", "d": "内服研末，每次1~2g，或入丸剂；外用适量", "sp": "不入煎剂，研末服或入丸散；外用研末撒或入膏药", "w": "无瘀血者不宜用；孕妇及月经期忌用", "ap": "", "m": "血竭：伤科要药，止血生肌，研末", "k": "血竭活血疗伤强，止血生肌研末尝。"}, {"id": 263, "ch": "活血化瘀药", "sec": "活血疗伤药", "n": "儿茶", "f": "活血疗伤，止血生肌敛疮", "a": "主要用于外伤瘀肿、出血，以及疮痈、湿疮、牙疳等；此外治肺热咳嗽", "d": "内服入煎1~3g；外用适量", "sp": "外用研末撒或调敷；入煎宜布包；多入丸散服", "w": "", "ap": "", "m": "儿茶：活血疗伤，止血，敛疮，包煎", "k": "儿茶活血疗伤好，止血生肌敛疮妙。"}, {"id": 264, "ch": "活血化瘀药", "sec": "活血疗伤药", "n": "刘寄奴", "f": "破血疗伤，通经，止痛，止血", "a": "1.跌打损伤，瘀滞肿痛，外伤出血；2.血瘀经闭、产后瘀滞腹痛等；此外尚能消食化积止泻痢，治食积腹痛、赤白痢", "d": "煎服3~10g；外用适量", "sp": "外用研末撒或调敷", "w": "孕妇慎服", "ap": "", "m": "刘寄奴：破血疗伤", "k": "寄奴破血疗伤强，通经止痛止血良。"}, {"id": 265, "ch": "活血化瘀药", "sec": "破血消癥药", "n": "莪术", "f": "破血行气，消积止痛", "a": "1.气滞血瘀所致的癥瘕积聚、经闭以及心腹瘀痛等；2.食积脘腹胀痛；此外用于跌打损伤瘀肿疼痛", "d": "煎服3~15g；外用适量", "sp": "醋制后可加强祛瘀止痛作用", "w": "孕妇及月经过多者忌用", "ap": "", "m": "莪术：破血行气，消积（偏气）", "k": "莪术破血行气强，消积止痛癥瘕良。"}, {"id": 266, "ch": "活血化瘀药", "sec": "破血消癥药", "n": "三棱", "f": "破血行气，消积止痛", "a": "所治病证与莪术基本相同，常相须而用；然三棱偏于破血，莪术偏于破气", "d": "煎服3~10g", "sp": "醋炙可加强止痛作用", "w": "同莪术", "ap": "", "m": "三棱：破血行气，消积（偏血）", "k": "三棱破血行气好，消积止痛癥瘕消。"}, {"id": 267, "ch": "活血化瘀药", "sec": "破血消癥药", "n": "水蛭", "f": "破血逐瘀消癥", "a": "癥瘕积聚，血瘀经闭及跌打损伤等", "d": "入煎剂1.5~3g；研末服0.3~0.5g", "sp": "以入丸散或研末服为宜；或以鲜活者放置瘀肿局部吸血消瘀", "w": "孕妇忌服", "ap": "", "m": "水蛭：破血逐瘀，研末", "k": "水蛭破血逐瘀强，消癥研末功效长。"}, {"id": 268, "ch": "活血化瘀药", "sec": "破血消癥药", "n": "虻虫", "f": "破血逐瘀消癥", "a": "癥瘕积聚，血瘀经闭及跌打损伤", "d": "煎服1~1.5g；研末服0.3g", "sp": "", "w": "孕妇及体虚无瘀、腹泻者忌用", "ap": "", "m": "虻虫：破血逐瘀", "k": "虻虫破血逐瘀强，消癥功效亦相当。"}, {"id": 269, "ch": "活血化瘀药", "sec": "破血消癥药", "n": "斑蝥", "f": "破血逐瘀消癥，攻毒散结", "a": "1.癥瘕，经闭；2.痈疽恶疮，顽癣，瘰疬等；此外外敷发泡可治面瘫、风湿痹痛等", "d": "内服多入丸散，0.03~0.06g；外用适量", "sp": "内服需以糯米同炒，或配青黛、丹参以缓其毒；外用研末敷贴，或酒、醋浸涂，或作发泡用", "w": "有大毒，内服宜慎，应严格掌握剂量，体弱及孕妇忌服；外用可刺激皮肤发红发泡甚至腐烂，不宜大面积使用；内服过量可引起恶心、呕吐、腹泻、尿血及肾功能损害", "ap": "", "m": "斑蝥：破血逐瘀，外用发疱，大毒", "k": "斑蝥破血逐瘀强，攻毒散结有大毒。"}, {"id": 270, "ch": "活血化瘀药", "sec": "破血消癥药", "n": "穿山甲", "f": "活血消癥，通经，下乳，消肿排脓", "a": "1.癥瘕，经闭，以及风湿痹痛等；2.产后乳汁不下；3.痈肿疮毒，瘰疬等", "d": "煎服3~10g；研末服1~1.5g", "sp": "", "w": "孕妇及痈肿已溃者忌用", "ap": "", "m": "穿山甲：通经下乳，消肿排脓", "k": "山甲活血消癥强，通经下乳排脓良。"}, {"id": 271, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "半夏", "f": "燥湿化痰，降逆止呕，消痞散结；外用消肿止痛", "a": "1.湿痰，寒痰证（燥湿化痰、温化寒痰要药）；2.胃气上逆呕吐（止呕要药）；3.心下痞，结胸，梅核气等；4.瘿瘤痰核，痈疽肿毒及毒蛇咬伤等（外用）", "d": "煎服3~10g；外用适量", "sp": "一般宜制过用：姜半夏长于降逆止呕；法半夏长于燥湿且温性较弱；半夏曲有化痰消食之功；竹沥半夏药性由温变凉，能清化热痰，主治热痰、风痰之证", "w": "反乌头；性温燥，阴虚燥咳、血证、热痰、燥痰应慎用", "ap": "", "m": "半夏：燥湿化痰，止呕圣药，消痞，外用消肿，反乌头", "k": "半夏燥湿化痰先，降逆止呕痞结散。"}, {"id": 272, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "天南星", "f": "燥湿化痰，祛风解痉；外用消肿止痛", "a": "1.湿痰，寒痰证（顽痰）；2.风痰证，如眩晕、中风、癫痫、口眼㖞斜及破伤风等；3.痈疽肿痛，毒蛇咬伤等（外用）", "d": "煎服3~10g；外用适量", "sp": "多制用", "w": "阴虚燥痰及孕妇忌用", "ap": "胆南星：天南星用牛胆汁拌制而成，性凉，清热化痰、息风定惊；用于中风、癫痫、惊风、头风眩晕、痰火喘咳，煎服2~5g", "m": "南星：燥湿化痰+祛风解痉，风痰要药，外用消肿", "k": "南星燥湿化痰强，祛风解痉痰风尝。"}, {"id": 273, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "禹白附", "f": "祛风痰，燥湿痰，止痉，止痛，解毒散结", "a": "1.中风口眼㖞斜、惊风癫痫、破伤风、偏头痛等风痰、头面诸疾；2.瘰疬痰核及毒蛇咬伤", "d": "煎服3~5g；研末服0.5~1g；外用适量", "sp": "", "w": "辛温燥烈，阴虚血虚动风或热动肝风以及孕妇均不宜用；生品一般不内服", "ap": "", "m": "禹白附：祛风痰，止痉，头面部风痰", "k": "白附祛风痰止痉，头面风痰最相宜。"}, {"id": 274, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "白芥子", "f": "温肺化痰，利气散结", "a": "1.寒痰喘咳，悬饮等（善治\"皮里膜外\"之痰）；2.阴疽流注及痰阻经络关节之肢体麻木、关节肿痛等", "d": "煎服3~6g；外用适量", "sp": "外用研末调敷，或作发泡用", "w": "辛温走散，耗气伤阴，久咳肺虚及阴虚火旺者忌用；对皮肤粘膜有刺激，易发泡，有消化道溃疡、出血者及皮肤过敏者忌用；用量不宜过大，过量易致胃肠炎，产生腹痛、腹泻", "ap": "", "m": "白芥子：温肺化痰，皮里膜外之痰，利气散结", "k": "芥子温肺化痰好，皮里膜外痰能消。"}, {"id": 275, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "皂荚", "f": "祛顽痰，通窍开闭，祛风杀虫", "a": "1.顽痰阻肺，咳喘痰多；2.中风、痰厥、癫痫、喉痹痰盛（研末吹鼻取嚏）；3.疮肿未溃，皮癣（外用）；此外可通便", "d": "多研末服，1~1.5g；亦可入汤剂1.5~5g；外用适量", "sp": "多研末服或入丸散", "w": "内服剂量不宜过大，大则引起呕吐、腹泻；辛散走窜之性极强，非顽痰证实体壮者不宜轻投；孕妇、气虚阴亏及有出血倾向者忌用", "ap": "皂角刺：消肿排脓、祛风杀虫；用于痈疽疮毒初起或脓成不溃之证以及皮癣、麻风等；煎服3~10g，外用适量醋煎涂患处；痈疽已溃者忌用", "m": "皂荚：祛顽痰，开窍", "k": "皂荚祛痰通窍闭，顽痰壅塞用之宜。"}, {"id": 276, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "旋覆花", "f": "降气化痰，降逆止呕", "a": "1.咳喘痰多，痰饮蓄结，胸膈痞满；2.噫气，呕吐", "d": "煎服3~10g", "sp": "宜布包煎（有绒毛，易刺激咽喉作痒而致呛咳呕吐）", "w": "阴虚劳嗽、津伤燥咳者忌用", "ap": "金沸草：旋覆花的地上部分，性味功效与旋覆花相似，性善疏散，主要用于外感咳嗽痰多，煎服5~10g", "m": "旋覆花：降气化痰，止呕，包煎", "k": "旋覆降气化痰好，降逆止呕包煎妙。"}, {"id": 277, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "白前", "f": "降气化痰", "a": "咳嗽痰多，胸满喘急（寒热均可配伍）", "d": "煎服3~10g", "sp": "", "w": "", "ap": "", "m": "白前：降气化痰，肺气壅实咳嗽", "k": "白前降气化痰喘，肺气壅实咳可安。"}, {"id": 278, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "前胡", "f": "降气化痰，宣散风热", "a": "1.咳喘痰多色黄者；2.外感风热咳嗽有痰者", "d": "煎服6~10g", "sp": "", "w": "", "ap": "", "m": "前胡：降气化痰+宣散风热", "k": "前胡降气化痰强，兼散风热咳嗽尝。"}, {"id": 279, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "桔梗", "f": "宣肺化痰，利咽，排脓", "a": "1.肺气不宣的咳嗽痰多，胸闷不畅；2.咽喉肿痛，失音；3.肺痈咳吐脓痰；此外可宣开肺气而通二便，用治癃闭、便秘", "d": "煎服3~6g；用于排脓可用10g", "sp": "排脓时加大用量", "w": "性升散，凡气机上逆、呕吐、呛咳、眩晕，阴虚火旺咳血等不宜用；用量过大易致恶心呕吐；桔梗皂甙有溶血作用，不宜作注射给药", "ap": "", "m": "桔梗：宣肺、利咽、排脓，载药上行（舟楫）", "k": "桔梗宣肺利咽喉，化痰排脓载药游。"}, {"id": 280, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "川贝母", "f": "清热化痰，润肺止咳，散结消肿", "a": "1.虚劳咳嗽，肺热燥咳；2.瘰疬，乳痈，肺痈，疮痈", "d": "煎服3~10g；研末服1~2g", "sp": "可研末吞服", "w": "反乌头", "ap": "", "m": "川贝：清热化痰+润肺，虚劳燥咳；不宜与乌头同用", "k": "川贝润肺化痰燥，清热散结虚咳疗。"}, {"id": 281, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "浙贝母", "f": "清热化痰，开郁散结", "a": "1.风热、燥热、痰热咳嗽；2.瘰疬，瘿瘤，痈疡疮毒，肺痈", "d": "煎服3~10g", "sp": "", "w": "同川贝母（反乌头）", "ap": "", "m": "浙贝：清热化痰+开郁散结，外感风热咳嗽，反乌头", "k": "浙贝清热化痰强，开郁散结痈毒尝。"}, {"id": 282, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "瓜蒌", "f": "清热化痰，宽胸散结，润肠通便", "a": "1.痰热咳喘；2.胸痹，结胸；3.肺痈，肠痈，乳痈；4.肠燥便秘", "d": "煎服，全瓜蒌10~20g，瓜蒌皮6~12g，瓜蒌仁10~15g", "sp": "瓜蒌仁打碎入煎；瓜蒌皮重在清热化痰、宽胸理气，瓜蒌仁重在润燥化痰、润肠通便", "w": "甘寒而滑，脾虚便溏及湿痰、寒痰者忌用；反乌头", "ap": "", "m": "瓜蒌：清热化痰，宽胸散结，润肠，反乌头", "k": "瓜蒌清热化痰咳，宽胸散结润肠和。"}, {"id": 283, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "竹茹", "f": "清热化痰，除烦止呕", "a": "1.痰热所致的咳嗽或心烦不眠等；2.胃热呕吐；此外有凉血止血作用，可用于吐血、衄血、崩漏等", "d": "煎服6~10g", "sp": "生用清化痰热，姜汁炙用止呕", "w": "", "ap": "", "m": "竹茹：清热化痰，除烦止呕", "k": "竹茹清热化痰烦，除烦止呕胃热安。"}, {"id": 284, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "竹沥", "f": "清热豁痰，定惊利窍", "a": "1.痰热咳喘；2.中风痰迷，惊痫癫狂", "d": "内服30~50g", "sp": "冲服；本品不能久藏，但可熬膏瓶贮，称竹沥膏；安瓿瓶密封装置可以久藏", "w": "性寒滑，对寒痰及便溏者忌用", "ap": "", "m": "竹沥：清热豁痰，定惊，中风痰迷", "k": "竹沥清热豁痰强，定惊利窍中风尝。"}, {"id": 285, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "天竹黄", "f": "清热化痰，清心定惊", "a": "小儿惊风，中风癫痫，热病神昏等心肝经痰热证", "d": "煎服3~6g；研粉冲服，每次0.6~1g", "sp": "可研粉冲服", "w": "", "ap": "", "m": "天竺黄：清热化痰，清心定惊，小儿惊风", "k": "竹黄清热化痰惊，清心定惊小儿灵。"}, {"id": 286, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "海藻", "f": "消痰软坚，利水消肿", "a": "1.瘿瘤，瘰疬，睾丸肿痛等；2.脚气浮肿及水肿等", "d": "煎服10~15g", "sp": "", "w": "传统认为反甘草，但临床也每有配伍同用者", "ap": "", "m": "海藻：消痰软坚，瘿瘤瘰疬，反甘草", "k": "海藻消痰软坚强，利水消肿瘿瘤尝。"}, {"id": 287, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "昆布", "f": "消痰软坚，利水消肿", "a": "同海藻，常与海藻相须而用", "d": "煎服6~12g", "sp": "", "w": "", "ap": "", "m": "昆布：消痰软坚，利水，含碘", "k": "昆布消痰软坚强，利水消肿同海藻。"}, {"id": 288, "ch": "化痰止咳平喘药", "sec": "化痰药", "n": "黄药子", "f": "消痰软坚散结，清热解毒", "a":
